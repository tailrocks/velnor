    if: ${{ contains(format(',{0},', inputs.selected_units), ',rust-production-topology,') && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'velnor' || github.event.inputs.runner == 'both' || github.event.inputs.runner == '')))) }}
    needs: [velnor-prepare-cargo-sources]
    runs-on: [self-hosted, velnor-target-mvp]
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    timeout-minutes: 45
    steps:
      - name: Mark CI job start
        if: always()
        run: echo "VELNOR_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - name: Mark runner setup end
        if: always()
        run: echo "VELNOR_RUNNER_SETUP_ENDED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Download Velnor CI selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.selection-artifact }}
          path: .velnor-ci-selection
      - name: Mark selection transport end
        if: always()
        run: echo "VELNOR_SELECTION_ENDED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
      - name: Mark tool bootstrap end
        if: always()
        run: echo "VELNOR_TOOL_BOOTSTRAP_ENDED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Mark cache prep end
        if: always()
        run: echo "VELNOR_CACHE_PREP_ENDED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run "Rust production topology" checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: rust-production-topology
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          VELNOR_SELECTION_FILE: .velnor-ci-selection/velnor-ci-selection
          CARGO_NET_OFFLINE: "true"
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -o pipefail
          echo "VELNOR_CHECKS_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          rc=0
          velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit "$CI_UNIT_ID" 2>&1 | tee "$RUNNER_TEMP/velnor-unit-log.txt" || rc=$?
          echo "VELNOR_CHECKS_ENDED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          exit $rc
      - name: Mark cleanup end
        if: always()
        run: echo "VELNOR_CLEANUP_ENDED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Report phase timings and cache outcomes
        if: always()
        uses: ./.github/actions/report-velnor-ci-outcomes
        with:
          job_label: "Velnor / rust-production-topology"


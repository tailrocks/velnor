# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Rust
on:
  workflow_call:
    inputs:
      selected_units:
        required: true
        type: string
      scope:
        required: true
        type: string
      selection-artifact:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

jobs:
  velnor-prepare-cargo-sources:
    name: "Velnor / Prepare Cargo sources"
    if: ${{ contains(format(',{0},', inputs.selected_units), ',rust-unit-collector,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-bench,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-client,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-control,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-model,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-render,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-runner,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-tools,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-workflow,') || contains(format(',{0},', inputs.selected_units), ',rust-velnor-workflow-contract,') || contains(format(',{0},', inputs.selected_units), ',rust-velnorctl,') || contains(format(',{0},', inputs.selected_units), ',rust-production-topology,') }}
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - name: Download Velnor CI selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.selection-artifact }}
          path: .velnor-ci-selection
      - name: Restore Rust toolchain
        id: rustup-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Provision Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add 'aarch64-apple-darwin' 'aarch64-unknown-linux-gnu' 'x86_64-apple-darwin' 'x86_64-unknown-linux-gnu' 'x86_64-unknown-linux-musl'
      - name: Prepare Cargo sources
        env:
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          cargo fetch --locked
  velnor-rust-policy:
    name: "Velnor / rust-policy"
    if: ${{ contains(format(',{0},', inputs.selected_units), ',rust-policy,') && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'velnor' || github.event.inputs.runner == 'both' || github.event.inputs.runner == '')))) }}
    runs-on: [self-hosted, velnor-target-mvp]
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    timeout-minutes: 45
    steps:
      - name: Mark CI job start
        if: always()
        run: echo "VELNOR_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - name: Mark runner setup end

jobs:
  verify-github-hosted:
    name: "GitHub · hosted"
    if: ${{ inputs.provider == 'github-hosted' && contains(inputs.selected_units, format('"unit_id":"{0}"', inputs.unit)) && (true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: ${{ inputs.unit }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'push' && github.event.after || github.event_name == 'workflow_dispatch' && github.sha || github.event_name == 'schedule' && github.sha }}
          VELNOR_SELECTION_FILE: .velnor-ci-selection/velnor-ci-selection
    steps:
      - name: Mark CI job start
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/JOB_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - name: Set up Velnor workflow runtime
        id: runtime
        uses: ./.github/actions/setup-velnor-workflow
        with:
          rev: 45ba3841fe9fbbfa0cbdfcfd81d1667a9ab3e7b2
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=45ba3841fe9fbbfa0cbdfcfd81d1667a9ab3e7b2" >> "$GITHUB_ENV"
      - name: Mark runner setup end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/RUNNER_SETUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Materialize Velnor CI selection
        shell: bash
        env:
          SELECTION_BASE_SHA: ${{ inputs.base_sha }}
          SELECTION_HEAD_SHA: ${{ inputs.head_sha }}
          SELECTION_SCOPE: ${{ inputs.scope }}
          SELECTION_UNITS: ${{ inputs.selected_unit_ids }}
          SELECTION_FULL_UNITS: ${{ inputs.full_units }}
          SELECTION_PLAN_DIGEST: ${{ inputs.plan_digest }}
        run: |
          set -euo pipefail
          mkdir -p .velnor-ci-selection
          {
            printf 'version=2\n'
            printf 'base_sha=%s\n' "$SELECTION_BASE_SHA"
            printf 'head_sha=%s\n' "$SELECTION_HEAD_SHA"
            printf 'scope=%s\n' "$SELECTION_SCOPE"
            printf 'units=%s\n' "$SELECTION_UNITS"
            printf 'full_units=%s\n' "$SELECTION_FULL_UNITS"
            printf 'plan_digest=%s\n' "$SELECTION_PLAN_DIGEST"
          } > .velnor-ci-selection/velnor-ci-selection
      - name: Mark selection transport end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/SELECTION_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Mark tool bootstrap end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/TOOL_BOOTSTRAP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Restore unit cache
        if: ${{ inputs.cache_key_files != '' }}
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.cache_paths }}
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ inputs.provider }}-${{ inputs.unit_platform }}-${{ inputs.unit_trust }}-bun-${{ hashFiles(inputs.cache_key_files) }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-${{ inputs.provider }}-${{ inputs.unit_platform }}-${{ inputs.unit_trust }}-bun-
      - name: Mark cache prep end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CACHE_PREP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Mark cargo fetch end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CARGO_FETCH_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Run unit checks
        env:
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -o pipefail
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          rc=0
          velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit "$CI_UNIT_ID" 2>&1 | tee "$RUNNER_TEMP/velnor-unit-log.txt" || rc=$?
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          exit $rc
      - name: Save unit cache
        if: ${{ inputs.cache_key_files != '' && (always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.cache_paths }}
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ inputs.provider }}-${{ inputs.unit_platform }}-${{ inputs.unit_trust }}-bun-${{ hashFiles(inputs.cache_key_files) }}
      - name: Mark cleanup end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CLEANUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Report phase timings and cache outcomes
        if: always()
        uses: ./.github/actions/report-velnor-ci-outcomes
        with:
          job_label: ${{ inputs.unit }}
          ci_lane: github
          cache_declared_layers: cargo
          cache_cargo_outcome: ${{ steps.cache.outcome }}
          cache_cargo_primary: ${{ steps.cache.outputs.cache-primary-key }}
          cache_cargo_matched: ${{ steps.cache.outputs.cache-matched-key }}
      - name: Record unit result
        if: ${{ always() }}
        env:
          VELNOR_RESULT_UNIT: ${{ inputs.unit }}
          VELNOR_RESULT_LANE: github-hosted
          VELNOR_RESULT_SOURCE_SHA: ${{ inputs.source_sha }}
          VELNOR_RESULT_PLAN_DIGEST: ${{ inputs.plan_digest }}
          VELNOR_RESULT_PLATFORM: ${{ inputs.unit_platform }}
          VELNOR_RESULT_TRUST: ${{ inputs.unit_trust }}
          VELNOR_RESULT_COMMAND_DIGEST: ${{ inputs.command_digest }}
          VELNOR_RESULT_OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VELNOR_RESULT_OUTCOME" in
            success) outcome=success ;;
            cancelled) outcome=cancelled ;;
            *) outcome=failure ;;
          esac
          test "$VELNOR_RESULT_COMMAND_DIGEST" != "" || { echo "::error::missing command identity for $VELNOR_RESULT_UNIT" >&2; exit 1; }
          mkdir -p .velnor-ci-results
          jq -n \
            --arg repository_id "$GITHUB_REPOSITORY" \
            --arg source_sha "$VELNOR_RESULT_SOURCE_SHA" \
            --arg audited_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg plan_digest "$VELNOR_RESULT_PLAN_DIGEST" \
            --arg unit_id "$VELNOR_RESULT_UNIT" \
            --arg provider "$VELNOR_RESULT_LANE" \
            --arg platform "$VELNOR_RESULT_PLATFORM" \
            --arg trust "$VELNOR_RESULT_TRUST" \
            --arg command_digest "$VELNOR_RESULT_COMMAND_DIGEST" \
            --arg outcome "$outcome" \
            '{results: [{identity: {repository_id: $repository_id, source_sha: $source_sha, audited_sha: $audited_sha, base_sha: $base_sha, run_id: $run_id, run_attempt: $run_attempt, plan_digest: $plan_digest, unit_id: $unit_id, provider: $provider, platform: $platform, trust: $trust, command_digest: $command_digest}, outcome: $outcome}]}' \
            > ".velnor-ci-results/result-$VELNOR_RESULT_UNIT-$VELNOR_RESULT_LANE.json"
      - name: Upload unit result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-result-${{ inputs.unit }}-github-hosted
          path: .velnor-ci-results/result-${{ inputs.unit }}-github-hosted.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7


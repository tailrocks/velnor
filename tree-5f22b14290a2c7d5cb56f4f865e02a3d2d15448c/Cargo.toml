[workspace]
members = [
  "crates/velnor-model",
  "crates/velnor-action-model",
  "crates/velnor-cas",
  "crates/velnor-action-journal",
  "crates/velnor-cache-service",
  "crates/velnor-control",
  "crates/velnor-client",
  "crates/velnor-render",
  "crates/velnorctl",
  "crates/velnor-runner",
  "crates/velnor-tools",
  "tools/unit-collector",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
repository = "https://github.com/tailrocks/velnor"
readme = "README.md"
keywords = ["github-actions", "runner", "ci"]
categories = ["development-tools"]

[workspace.lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unsafe_attr_outside_unsafe = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unit_bindings = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
unfulfilled_lint_expectations = "deny"
async_fn_in_trait = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
mod_module_files = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
manual_assert = "deny"
manual_let_else = "warn"
match_bool = "warn"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "warn"
large_enum_variant = "warn"
large_futures = "allow"
result_large_err = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
str_to_string = "warn"
return_self_not_must_use = "warn"
redundant_feature_names = "allow"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
implicit_hasher = "allow"
similar_names = "allow"
assigning_clones = "allow"
match_same_arms = "allow"
drop_non_drop = "allow"
format_push_string = "allow"
no_effect_underscore_binding = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
unused_self = "warn"
option_option = "allow"
verbose_bit_mask = "allow"
unreadable_literal = "allow"
unnecessary_debug_formatting = "allow"
unused_async = "warn"
float_cmp = "deny"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
future_not_send = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "deny"
cast_precision_loss = "allow"
float_cmp_const = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"
expl_impl_clone_on_copy = "deny"
iter_not_returning_iterator = "deny"

# Strip at link time: cross-built .debs cannot run the host `strip` on a
# foreign-arch ELF (cargo deb is invoked with --no-strip).
[profile.release]
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0.98"
aho-corasick = "1.1.3"
blake3 = "1.8.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["fs"] }
base64 = "0.23.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
# rust_crypto: jsonwebtoken >=10.4 requires exactly one crypto-provider feature
# or OAuth assertion signing panics at runtime.
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
# native-tls-vendored: build OpenSSL from source so zigbuild cross/deb builds are
# hermetic (no host multiarch openssl headers; also unblocks the aarch64 deb leg).
reqwest = { version = "0.13.0", default-features = false, features = ["json", "native-tls", "native-tls-vendored", "blocking"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
rsa = { version = "0.9.8", features = ["pem"] }
# bundled: compile SQLite from source so cross/deb release legs stay hermetic.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = { package = "noyalib", version = "0.0.28", features = ["compat-serde-yaml"] }
globset = "0.4.16"
rayon = "1.12.0"
sha2 = "0.11"
tar = "0.4.46"
sigstore-sign = { version = "0.11.0", default-features = false, features = ["native-tls"] }
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
# Strict, non-regex parsing of mise config/lock TOML for the fail-closed mise
# policy (crates/velnor-runner/src/mise.rs). Never hand-parse lock TOML.
toml = "1.0"
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.4"
uuid = { version = "1.18.1", features = ["v4"] }
unicode-normalization = "0.1.24"
regex = "1.11.1"
tokio-tungstenite = { version = "0.30", features = ["native-tls", "native-tls-vendored"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Structured spans/events for performance analysis (master-plan P1.9): JSON
# span-close events with busy/idle timings land in <config>/logs/trace.jsonl;
# the `otel` feature adds an OTLP exporter gated on VELNOR_OTLP_ENDPOINT.
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }

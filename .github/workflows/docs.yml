name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

env:
  DOCS_SITE_URL: https://velnor.tailrocks.com

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'push' || github.event_name == 'pull_request') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:static
      - name: Verify static docs migration
        run: |
          set -euo pipefail
          public=.output/public

          test -s "$public/index.html"
          test -s "$public/operations/security-and-data/index.html"
          test -s "$public/index.md"
          test -s "$public/operations/security-and-data.md"
          test -s "$public/llms.txt"
          test -s "$public/llms-full.txt"
          grep -q '<title>Velnor Documentation</title>' "$public/index.html"
          grep -q 'Security and data contract' "$public/operations/security-and-data/index.html"
          jq -e '.type == "advanced" and (.index | type == "object")' "$public/api/search"

          test ! -e "$public/docs"
          if find "$public" -type f ! -path "$public/assets/*" -print0 | xargs -0 grep -nE '(^|["( ])(/docs([/?#" )]|$)|%2[Ff]docs)' >/tmp/velnor-docs-links; then
            cat /tmp/velnor-docs-links
            exit 1
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .output/public

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ${{ 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    name: Verify deployed documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ${{ 'ubuntu-26.04' }}
    timeout-minutes: 10
    steps:
      - run: /usr/bin/curl --fail --silent --show-error --location "$DOCS_SITE_URL/" | /usr/bin/grep -q 'Velnor'

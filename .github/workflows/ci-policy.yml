# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Velnor workflow policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: velnor-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-policy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy_acquire:
    name: policy_acquire
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      handoff_id: ${{ steps.handoff_upload.outputs.artifact-id }}
      handoff_digest: ${{ steps.handoff_upload.outputs.artifact-digest }}
    steps:
      - name: Checkout base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy-checkout
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire candidate generator product
        working-directory: policy-checkout
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          TARGET_REPOSITORY_ID: ${{ github.repository_id }}
          BASE_REVISION: fdeed261bd2247a38db6922a7726cd45d3d6f31e
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" || { echo "::error::fork producer artifacts are not eligible" >&2; exit 1; }
          test "$HEAD_REPOSITORY_ID" = "$TARGET_REPOSITORY_ID" || { echo "::error::head repository id is not the target repository id" >&2; exit 1; }
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          repository_api="$(gh api "repos/$GITHUB_REPOSITORY")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson id "$TARGET_REPOSITORY_ID" '.id == $id and .full_name == $repo' <<<"$repository_api" >/dev/null
          head_commit_api="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA")"
          jq -e --arg head "$HEAD_SHA" '.sha == $head and (.commit.tree.sha | strings | test("^[0-9a-f]{40}$"))' <<<"$head_commit_api" >/dev/null
          head_tree_sha="$(jq -er '.commit.tree.sha' <<<"$head_commit_api")"
          base_commit_api="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA")"
          jq -e --arg base "$BASE_SHA" '.sha == $base and (.commit.tree.sha | strings | test("^[0-9a-f]{40}$"))' <<<"$base_commit_api" >/dev/null
          base_tree_sha="$(jq -er '.commit.tree.sha' <<<"$base_commit_api")"
          source_repo="$RUNNER_TEMP/target-source.git"
          source_home="$RUNNER_TEMP/target-source-home"
          rm -rf "$source_repo" "$source_home"
          mkdir -m 0700 "$source_home"
          GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -c init.templateDir=/dev/null init --bare "$source_repo" >/dev/null
          for source_sha in "$HEAD_SHA" "$BASE_SHA"; do
            GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -C "$source_repo" -c core.hooksPath=/dev/null fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$HEAD_REPOSITORY" "$source_sha"
          done
          test "$(GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -C "$source_repo" show -s --format=%T "$HEAD_SHA")" = "$head_tree_sha"
          test "$(GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -C "$source_repo" show -s --format=%T "$BASE_SHA")" = "$base_tree_sha"

          contract="$RUNNER_TEMP/ci-pr-contract.yml"
          GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -C "$source_repo" show "$BASE_SHA:.github/workflows/ci-pr.yml" > "$contract"
          candidate_block="$(awk '/^  candidate_producer:/{seen=1} seen && /^  [A-Za-z0-9_-]+:/ && $0 !~ /^  candidate_producer:/{exit} seen{print}' "$contract")"
          test "$candidate_block" != ""
          grep -Fqx "  candidate_producer:" <<<"$candidate_block"
          grep -Fqx "    name: candidate_producer" <<<"$candidate_block"
          grep -Fqx "    permissions: {}" <<<"$candidate_block"
          test "$(grep -Fxc "        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1" <<<"$candidate_block")" = 1
          grep -Fq "github.event.pull_request.head.repo.id == github.repository_id" <<<"$candidate_block"
          grep -Fq "github.event.pull_request.base.repo.id == github.repository_id" <<<"$candidate_block"
          grep -Fq "test -z \"\${GITHUB_TOKEN:-}\"" <<<"$candidate_block"
          grep -Fq "test -z \"\${ACTIONS_RUNTIME_TOKEN:-}\"" <<<"$candidate_block"
          grep -Fq "test -z \"\${ACTIONS_RUNTIME_URL:-}\"" <<<"$candidate_block"
          grep -Fq 'env -i' <<<"$candidate_block"
          head_contract="$RUNNER_TEMP/ci-pr-head.yml"
          GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -C "$source_repo" show "$HEAD_SHA:.github/workflows/ci-pr.yml" > "$head_contract"
          head_candidate_block="$(awk '/^  candidate_producer:/{seen=1} seen && /^  [A-Za-z0-9_-]+:/ && $0 !~ /^  candidate_producer:/{exit} seen{print}' "$head_contract")"
          test "$head_candidate_block" = "$candidate_block" || { echo "::error::PR workflow changed the trusted candidate producer contract" >&2; exit 1; }
          test "$(grep -Fxc "          name: velnor-workflow-candidate-linux-x64" <<<"$candidate_block")" = 1
          test "$(grep -Fxc "        id: candidate_upload" <<<"$candidate_block")" = 1
          test "$(grep -Fxc "        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1" <<<"$candidate_block")" = 1
          test "$(grep -Ec '^[[:space:]]+uses: .*upload-artifact@' <<<"$candidate_block")" = 1
          test "$(grep -Fxc "          path: ${{ runner.temp }}/velnor-workflow-candidate" <<<"$candidate_block")" = 1
          test "$(grep -Fxc "          name: velnor-workflow-candidate-linux-x64" "$contract")" = 1
          contract_sha256="$(sha256sum "$contract" | awk '{print $1}')"

          workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-pr.yml")"
          workflow_id="$(jq -er 'select(.path == ".github/workflows/ci-pr.yml") | .id | numbers' <<<"$workflow")"
          test "$workflow_id" -gt 0
          runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
            | jq -c --arg path ".github/workflows/ci-pr.yml" --argjson workflow_id "$workflow_id" \
                --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --argjson pr "$PR_NUMBER" --arg repo "$GITHUB_REPOSITORY" \
                --argjson target_id "$TARGET_REPOSITORY_ID" --argjson head_id "$HEAD_REPOSITORY_ID" \
                '[.[][] | select(.path == $path and (.workflow_id | tonumber) == $workflow_id and .event == "pull_request" and .head_sha == $head and (.pull_requests | any((.number | tonumber) == $pr and .base.sha == $base)) and .status == "completed" and .conclusion == "success" and (.repository.id | tonumber) == $target_id and (.head_repository.id | tonumber) == $head_id and .repository.full_name == $repo and .head_repository.full_name == $repo and (.run_attempt | tonumber) >= 1)]')"
          test "$(jq -r 'length' <<<"$runs")" = 1
          run="$(jq -c '.[0]' <<<"$runs")"
          run_id="$(jq -er '.id | numbers' <<<"$run")"
          run_attempt="$(jq -er '.run_attempt | numbers' <<<"$run")"

          jobs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            | jq -c --argjson run_id "$run_id" --argjson run_attempt "$run_attempt" --arg head "$HEAD_SHA" \
                '[.[][] | select(.name == "candidate_producer" and (.run_id | tonumber) == $run_id and (.run_attempt | tonumber) == $run_attempt and .head_sha == $head and .status == "completed" and .conclusion == "success")]')"
          test "$(jq -r 'length' <<<"$jobs")" = 1
          job="$(jq -c '.[0]' <<<"$jobs")"
          job_id="$(jq -er '.id | numbers' <<<"$job")"
          job_name="$(jq -er '.name | strings' <<<"$job")"

          artifacts="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            | jq -c --arg name "velnor-workflow-candidate-linux-x64" --argjson run_id "$run_id" \
                '[.[][] | select(.name == $name and .expired == false and (.workflow_run.id | tonumber) == $run_id and (.size_in_bytes | numbers) <= 268435456)]')"
          test "$(jq -r 'length' <<<"$artifacts")" = 1
          artifact="$(jq -c '.[0]' <<<"$artifacts")"
          artifact_id="$(jq -er '.id | numbers' <<<"$artifact")"
          artifact_name="$(jq -er '.name | strings' <<<"$artifact")"
          artifact_size="$(jq -er '.size_in_bytes | numbers' <<<"$artifact")"
          artifact_digest="$(jq -er '.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$artifact")"
          expires_at="$(jq -er '.expires_at | strings' <<<"$artifact")"
          jq -e '.expired == false and (.expires_at | strings | fromdateiso8601 > now)' <<<"$artifact" >/dev/null

          archive="$RUNNER_TEMP/candidate.zip"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          test "$available_kib" -ge 1048576
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output "$archive"
          raw_zip_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          service_digest="$(printf '%s' "$artifact_digest" | sed 's/^sha256://')"
          test "$raw_zip_sha256" != ''
          test "$service_digest" != ''
          test "$raw_zip_sha256" = "$service_digest"
          candidate="$RUNNER_TEMP/candidate"
          rm -rf "$candidate"
          mkdir -p "$candidate"
          python3 - "$archive" "$candidate" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          seen = set()
          with zipfile.ZipFile(archive) as payload:
              for info in payload.infolist():
                  name = info.filename
                  parts = name.split("/")
                  if name.startswith("/") or "\\" in name or any(part in ("", ".", "..") for part in parts):
                      raise SystemExit("unsafe archive member")
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode not in (0, 0o100000) and not info.is_dir():
                      raise SystemExit("archive member is not a regular file")
                  if name in seen:
                      raise SystemExit("duplicate archive member")
                  seen.add(name)
              if sorted(seen) != ["candidate-manifest.json", "velnor-workflow"]:
                  raise SystemExit("candidate artifact surface is not exact")
              for info in payload.infolist():
                  payload.extract(info, destination)
          PY
          manifest="$candidate/candidate-manifest.json"
          binary="$candidate/velnor-workflow"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$HEAD_SHA" --arg name "$artifact_name" --arg build_repo "ghcr.io/tailrocks/velnor-bootstrap-builder" --arg build_digest "" \
            '.role == "producer" and .workflow_path == ".github/workflows/ci-pr.yml" and .job_name == "candidate_producer" and .event == "pull_request" and .repository == $repo and .head_sha == $head and .artifact_name == $name and .profile == "debug" and .platform == "linux/amd64" and .features == "tui" and .build_image_repository == $build_repo and .build_image_digest == $build_digest and (.build_image_platform_digest | strings | test("^sha256:[0-9a-f]{64}$")) and (.binary_sha256 | strings | test("^[0-9a-f]{64}$"))' "$manifest" >/dev/null
          binary_sha256="$(sha256sum "$binary" | awk '{print $1}')"
          test "$binary_sha256" = "$(jq -er '.binary_sha256' "$manifest")"
          chmod 0555 "$binary"

          handoff="$RUNNER_TEMP/candidate-handoff"
          rm -rf "$handoff"
          mkdir -p "$handoff"
          install -m 0555 "$binary" "$handoff/velnor-workflow"
          install -m 0444 "$manifest" "$handoff/candidate-manifest.json"
          GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -C "$source_repo" archive --format=tar "$HEAD_SHA" > "$handoff/source.tar"
          source_archive_sha256="$(sha256sum "$handoff/source.tar" | awk '{print $1}')"
          source_size="$(stat -c '%s' "$handoff/source.tar")"
          test "$source_size" -le 536870912
          closure_input="$RUNNER_TEMP/candidate-closure"
          GIT_CONFIG_NOSYSTEM=1 HOME="$source_home" git -C "$source_repo" ls-tree -r "$HEAD_SHA" -- crates/velnor-workflow Cargo.toml Cargo.lock rust-toolchain.toml rust-toolchain .cargo \
            | LC_ALL=C sort > "$closure_input"
          printf 'closure-version:1\\nfeatures:tui\\nprofile:debug\\n' >> "$closure_input"
          candidate_closure="$(sha256sum "$closure_input" | awk '{print $1}')"
          test "$candidate_closure" != ''
          jq -n \
            --arg role handoff \
            --arg workflow_path ".github/workflows/ci-pr.yml" \
            --argjson workflow_id "$workflow_id" \
            --argjson run_id "$run_id" \
            --argjson run_attempt "$run_attempt" \
            --argjson job_id "$job_id" \
            --arg job_name "$job_name" \
            --arg event pull_request \
            --argjson pr_number "$PR_NUMBER" \
            --arg target_repository "$GITHUB_REPOSITORY" \
            --argjson target_repository_id "$TARGET_REPOSITORY_ID" \
            --arg head_repository "$HEAD_REPOSITORY" \
            --argjson head_repository_id "$HEAD_REPOSITORY_ID" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg base_revision "$BASE_REVISION" \
            --arg head_tree_sha "$head_tree_sha" \
            --arg base_tree_sha "$base_tree_sha" \
            --arg artifact_name "$artifact_name" \
            --argjson artifact_id "$artifact_id" \
            --argjson artifact_size "$artifact_size" \
            --arg artifact_service_digest "$artifact_digest" \
            --arg artifact_raw_zip_sha256 "$raw_zip_sha256" \
            --arg artifact_expires_at "$expires_at" \
            --arg profile "$(jq -er .profile "$manifest")" \
            --arg platform "$(jq -er .platform "$manifest")" \
            --arg features "$(jq -er .features "$manifest")" \
            --arg build_image_repository "$(jq -er .build_image_repository "$manifest")" \
            --arg build_image_digest "$(jq -er .build_image_digest "$manifest")" \
            --arg build_image_platform_digest "$(jq -er .build_image_platform_digest "$manifest")" \
            --arg source_archive_sha256 "$source_archive_sha256" \
            --arg candidate_closure "$candidate_closure" \
            --arg contract_sha256 "$contract_sha256" \
            '{role: $role, workflow_path: $workflow_path, workflow_id: $workflow_id, run_id: $run_id, run_attempt: $run_attempt, job_id: $job_id, job_name: $job_name, event: $event, pr_number: $pr_number, target_repository: $target_repository, target_repository_id: $target_repository_id, head_repository: $head_repository, head_repository_id: $head_repository_id, head_sha: $head_sha, base_sha: $base_sha, base_revision: $base_revision, head_tree_sha: $head_tree_sha, base_tree_sha: $base_tree_sha, profile: $profile, platform: $platform, features: $features, build_image_repository: $build_image_repository, build_image_digest: $build_image_digest, build_image_platform_digest: $build_image_platform_digest, artifact_name: $artifact_name, artifact_id: $artifact_id, artifact_size: $artifact_size, artifact_service_digest: $artifact_service_digest, artifact_raw_zip_sha256: $artifact_raw_zip_sha256, artifact_expires_at: $artifact_expires_at, source_archive_sha256: $source_archive_sha256, candidate_closure: $candidate_closure, contract_sha256: $contract_sha256}' > "$handoff/handoff.json"
      - name: Upload candidate handoff
        id: handoff_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-candidate-handoff
          path: ${{ runner.temp }}/candidate-handoff
          if-no-files-found: error
          retention-days: 1

  candidate_execute:
    name: candidate_execute
    needs: [policy_acquire]
    if: ${{ needs.policy_acquire.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    outputs:
      result_id: ${{ steps.result_upload.outputs.artifact-id }}
      result_digest: ${{ steps.result_upload.outputs.artifact-digest }}
    steps:
      - name: Download trusted candidate handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.policy_acquire.outputs.handoff_id }}
          path: ${{ runner.temp }}/candidate-handoff
      - name: Execute candidate in pinned sandbox
        id: candidate_execute
        env:
          HANDOFF: ${{ runner.temp }}/candidate-handoff/velnor-workflow-candidate-handoff
          SANDBOX_IMAGE_REPOSITORY: ghcr.io/tailrocks/velnor-bootstrap-sandbox
          SANDBOX_IMAGE_DIGEST: ""
          DEFAULT_BRANCH: main
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "${RUNNER_OS:-}" = Linux
          test "${RUNNER_ARCH:-}" = X64
          test "$(uname -m)" = x86_64
          command -v docker >/dev/null
          command -v timeout >/dev/null
          command -v sha256sum >/dev/null
          command -v jq >/dev/null
          docker_cmd() {
            env -i PATH="$PATH" HOME=/tmp/policy-execute-home DOCKER_CONFIG="$RUNNER_TEMP/docker-config" docker "$@"
          }
          docker_cmd info >/dev/null
          test "$(docker_cmd info --format '{{.OSType}}')" = linux
          test -f "$HANDOFF/handoff.json"
          test -f "$HANDOFF/candidate-manifest.json"
          test -f "$HANDOFF/velnor-workflow"
          test -f "$HANDOFF/source.tar"
          test "$(find -P "$HANDOFF" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          case "$PR_NUMBER" in ''|*[!0-9]*) exit 1 ;; esac
          jq -e --argjson expected_pr "$PR_NUMBER" '
            .role == "handoff" and
            (.workflow_path == ".github/workflows/ci-pr.yml") and
            (.workflow_id | numbers) and (.run_id | numbers) and
            (.run_attempt | numbers and . >= 1) and
            (.job_id | numbers) and (.job_name == "candidate_producer") and
            (.event == "pull_request") and
            (.pr_number == $expected_pr) and
            (.target_repository | strings) and (.target_repository_id | numbers) and
            (.head_repository | strings) and (.head_repository_id | numbers) and
            (.target_repository_id == .head_repository_id) and
            (.head_sha | strings | test("^[0-9a-f]{40}$")) and
            (.base_sha | strings | test("^[0-9a-f]{40}$")) and
            (.base_revision | strings | test("^[0-9a-f]{40}$")) and
            (.head_tree_sha | strings | test("^[0-9a-f]{40}$")) and
            (.base_tree_sha | strings | test("^[0-9a-f]{40}$")) and
            (.profile == "debug") and (.platform == "linux/amd64") and (.features == "tui") and
            (.build_image_repository == "ghcr.io/tailrocks/velnor-bootstrap-builder") and (.build_image_digest == "") and
            (.build_image_platform_digest | strings | test("^sha256:[0-9a-f]{64}$")) and
            (.artifact_name == "velnor-workflow-candidate-linux-x64") and (.artifact_id | numbers) and (.artifact_size | numbers | . <= 268435456) and
            (.artifact_service_digest | strings | test("^sha256:[0-9a-f]{64}$")) and
            (.artifact_raw_zip_sha256 | strings | test("^[0-9a-f]{64}$")) and
            (.artifact_expires_at | strings) and
            (.source_archive_sha256 | strings | test("^[0-9a-f]{64}$")) and
            (.candidate_closure | strings | test("^[0-9a-f]{64}$")) and
            (.contract_sha256 | strings | test("^[0-9a-f]{64}$"))
          ' "$HANDOFF/handoff.json" >/dev/null
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$(jq -er .head_sha "$HANDOFF/handoff.json")" \
            --arg name "$(jq -er .artifact_name "$HANDOFF/handoff.json")" \
            '.role == "producer" and .workflow_path == ".github/workflows/ci-pr.yml" and .job_name == "candidate_producer" and .event == "pull_request" and .repository == $repo and .head_sha == $head and .artifact_name == $name and .profile == "debug" and .platform == "linux/amd64" and .features == "tui" and (.build_image_repository == "ghcr.io/tailrocks/velnor-bootstrap-builder") and (.build_image_digest == "") and (.build_image_platform_digest | strings | test("^sha256:[0-9a-f]{64}$")) and (.binary_sha256 | strings | test("^[0-9a-f]{64}$"))' \
            "$HANDOFF/candidate-manifest.json" >/dev/null
          test ! -L "$HANDOFF/velnor-workflow"
          binary_sha256="$(sha256sum "$HANDOFF/velnor-workflow" | awk '{print $1}')"
          test "$binary_sha256" = "$(jq -er .binary_sha256 "$HANDOFF/candidate-manifest.json")"
          source_archive_sha256="$(sha256sum "$HANDOFF/source.tar" | awk '{print $1}')"
          test "$source_archive_sha256" = "$(jq -er .source_archive_sha256 "$HANDOFF/handoff.json")"
          test -n "$SANDBOX_IMAGE_DIGEST"
          if [[ ! "$SANDBOX_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then exit 1; fi
          image="$SANDBOX_IMAGE_REPOSITORY@$SANDBOX_IMAGE_DIGEST"
          docker_cmd buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/sandbox-index.json"
          jq -e '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")] | length == 1' "$RUNNER_TEMP/sandbox-index.json" >/dev/null
          platform_digest="$(jq -er '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest") | .digest] | if length == 1 then .[0] else error("platform digest is not unique") end' "$RUNNER_TEMP/sandbox-index.json")"
          if [[ ! "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then exit 1; fi
          platform_image="$SANDBOX_IMAGE_REPOSITORY@$platform_digest"
          docker_cmd buildx imagetools inspect --raw "$platform_image" > "$RUNNER_TEMP/sandbox-platform.json"
          config_digest="$(jq -er '.config.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/sandbox-platform.json")"
          docker_cmd buildx imagetools inspect "$platform_image" --format '{{json .Image}}' > "$RUNNER_TEMP/sandbox-config.json"
          jq -e '(.architecture == "amd64" and .os == "linux") and ((.config.Env // []) | sort == ["PATH=/usr/bin:/bin"]) and ((.config.User // "") == "") and ((.config.Entrypoint // []) == []) and ((.config.Cmd // []) == []) and ((.config.WorkingDir // "/") == "/") and (.config.Volumes == null) and (.config.ExposedPorts == null) and (.config.Healthcheck == null) and (.config.Labels["org.velnor.sandbox"] // "") == "true"' "$RUNNER_TEMP/sandbox-config.json" >/dev/null
          docker_cmd pull --quiet --platform linux/amd64 "$platform_image"
          docker_cmd image inspect "$platform_image" --format '{{json .}}' > "$RUNNER_TEMP/sandbox-local.json"

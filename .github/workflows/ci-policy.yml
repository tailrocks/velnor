          from pathlib import Path
          archive, destination = Path(sys.argv[1]), Path(sys.argv[2])
          with zipfile.ZipFile(archive) as payload:
              names = set()
              for info in payload.infolist():
                  parts = info.filename.split("/")
                  mode = (info.external_attr >> 16) & 0o170000
                  if info.filename.startswith("/") or "\\" in info.filename or any(part in ("", ".", "..") for part in parts):
                      raise SystemExit("unsafe handoff member")
                  if info.filename in names or (mode not in (0, 0o100000) and not info.is_dir()):
                      raise SystemExit("duplicate or non-regular handoff member")
                  names.add(info.filename)
              if sorted(names) != ["candidate-manifest.json", "handoff.json", "source.tar", "velnor-workflow"]:
                  raise SystemExit("handoff artifact surface is not exact")
              for info in payload.infolist():
                  payload.extract(info, destination)
          PY
          handoff_json="$handoff_dir/handoff.json"
          jq -e --slurpfile result "$result_json" --argjson handoff_id "$handoff_id" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" \
            --arg repo "$GITHUB_REPOSITORY" --arg head_repo "$HEAD_REPOSITORY" --argjson head_repo_id "$HEAD_REPOSITORY_ID" --argjson target_repo_id "$TARGET_REPOSITORY_ID" '
            . as $h | $result[0] as $r |
            $h.role == "handoff" and $r.handoff_id == ($handoff_id|tostring) and
            $h.workflow_path == $r.workflow_path and $h.workflow_id == $r.workflow_id and $h.run_id == $r.run_id and $h.run_attempt == $r.run_attempt and
            $h.job_id == $r.job_id and $h.job_name == $r.job_name and $h.event == $r.event and
            $h.pr_number == $r.pr_number and
            $h.target_repository == $repo and $h.target_repository_id == $target_repo_id and
            $h.head_repository == $head_repo and $h.head_repository_id == $head_repo_id and
            $h.head_sha == $head and $h.base_sha == $base and $h.base_revision == $r.base_revision and
            $h.head_tree_sha == $r.head_tree_sha and $h.base_tree_sha == $r.base_tree_sha and
            $h.profile == $r.profile and $h.platform == $r.platform and $h.features == $r.features and
            $h.build_image_repository == $r.build_image_repository and $h.build_image_digest == $r.build_image_digest and
            ($h.build_image_platform_digest == $r.build_image_platform_digest) and
            $h.source_archive_sha256 == $r.source_archive_sha256 and $h.candidate_closure == $r.candidate_closure and
            $h.artifact_name == $r.artifact_name and $h.artifact_id == $r.artifact_id and $h.artifact_size == $r.artifact_size and
            $h.artifact_service_digest == $r.artifact_service_digest and $h.artifact_raw_zip_sha256 == $r.artifact_raw_zip_sha256 and
            ($h.contract_sha256 | strings | test("^[0-9a-f]{64}$"))
          ' "$handoff_json" >/dev/null
          test "$(sha256sum "$handoff_dir/source.tar" | awk '{print $1}')" = "$(jq -er .source_archive_sha256 "$handoff_json")"
          producer_id="$(jq -er '.artifact_id | tonumber' "$handoff_json")"
          producer_digest="$(jq -er '.artifact_service_digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' "$handoff_json")"
          producer_api="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$producer_id")"
          jq -e --argjson id "$producer_id" --arg digest "$producer_digest" --arg name "velnor-workflow-candidate-linux-x64" --argjson run_id "$(jq -er .run_id "$handoff_json")" '
            .id == $id and .name == $name and .expired == false and (.expires_at | strings | fromdateiso8601 > now) and .digest == $digest and
            ((.workflow_run.id | tonumber) == $run_id)
          ' <<<"$producer_api" >/dev/null
          producer_archive="$RUNNER_TEMP/candidate-producer-verified.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$producer_id/zip" \
            --output "$producer_archive"
          test "$(sha256sum "$producer_archive" | awk '{print $1}')" = "$(jq -er .artifact_raw_zip_sha256 "$handoff_json")"
          producer_service_digest="${producer_digest#sha256:}"
          test "$(sha256sum "$producer_archive" | awk '{print $1}')" = "$producer_service_digest"
          producer_dir="$RUNNER_TEMP/candidate-producer-verified"
          rm -rf "$producer_dir"; mkdir -m 0700 "$producer_dir"
          python3 - "$producer_archive" "$producer_dir" <<'PY'
          import sys, zipfile
          from pathlib import Path
          archive, destination = Path(sys.argv[1]), Path(sys.argv[2])
          with zipfile.ZipFile(archive) as payload:
              names = set()
              for info in payload.infolist():
                  parts = info.filename.split("/")
                  mode = (info.external_attr >> 16) & 0o170000
                  if info.filename.startswith("/") or "\\" in info.filename or any(part in ("", ".", "..") for part in parts):
                      raise SystemExit("unsafe producer member")
                  if info.filename in names or (mode not in (0, 0o100000) and not info.is_dir()):
                      raise SystemExit("duplicate or non-regular producer member")
                  names.add(info.filename)
              if sorted(names) != ["candidate-manifest.json", "velnor-workflow"]:
                  raise SystemExit("producer artifact surface is not exact")
              for info in payload.infolist():
                  payload.extract(info, destination)
          PY
          producer_manifest="$producer_dir/candidate-manifest.json"
          producer_binary="$producer_dir/velnor-workflow"
          jq -e --slurpfile handoff "$handoff_json" '
            .role == "producer" and .workflow_path == ".github/workflows/ci-pr.yml" and .job_name == "candidate_producer" and
            .event == "pull_request" and .repository == $handoff[0].head_repository and .head_sha == $handoff[0].head_sha and
            .artifact_name == $handoff[0].artifact_name and .profile == $handoff[0].profile and .platform == $handoff[0].platform and
            .features == $handoff[0].features and .build_image_repository == $handoff[0].build_image_repository and
            .build_image_digest == $handoff[0].build_image_digest and .build_image_platform_digest == $handoff[0].build_image_platform_digest and
            (.binary_sha256 | strings | test("^[0-9a-f]{64}$"))
          ' "$producer_manifest" >/dev/null
          test "$(sha256sum "$producer_binary" | awk '{print $1}')" = "$(jq -er .binary_sha256 "$producer_manifest")"
          repository_api="$(gh api "repos/$GITHUB_REPOSITORY")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson id "$TARGET_REPOSITORY_ID" '.id == $id and .full_name == $repo' <<<"$repository_api" >/dev/null
          head_commit_api="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA")"
          jq -e --arg head "$HEAD_SHA" '.sha == $head and (.commit.tree.sha | strings | test("^[0-9a-f]{40}$"))' <<<"$head_commit_api" >/dev/null
          head_tree_sha="$(jq -er '.commit.tree.sha' <<<"$head_commit_api")"
          base_commit_api="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA")"
          jq -e --arg base "$BASE_SHA" '.sha == $base and (.commit.tree.sha | strings | test("^[0-9a-f]{40}$"))' <<<"$base_commit_api" >/dev/null
          base_tree_sha="$(jq -er '.commit.tree.sha' <<<"$base_commit_api")"
          verifier_source_repo="$RUNNER_TEMP/verifier-source.git"
          verifier_source_home="$RUNNER_TEMP/verifier-source-home"
          rm -rf "$verifier_source_repo" "$verifier_source_home"
          mkdir -m 0700 "$verifier_source_home"
          GIT_CONFIG_NOSYSTEM=1 HOME="$verifier_source_home" git -c init.templateDir=/dev/null init --bare "$verifier_source_repo" >/dev/null
          for source_sha in "$HEAD_SHA" "$BASE_SHA"; do
            GIT_CONFIG_NOSYSTEM=1 HOME="$verifier_source_home" git -C "$verifier_source_repo" -c core.hooksPath=/dev/null fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$HEAD_REPOSITORY" "$source_sha"
          done
          test "$(GIT_CONFIG_NOSYSTEM=1 HOME="$verifier_source_home" git -C "$verifier_source_repo" show -s --format=%T "$HEAD_SHA")" = "$head_tree_sha"
          test "$(GIT_CONFIG_NOSYSTEM=1 HOME="$verifier_source_home" git -C "$verifier_source_repo" show -s --format=%T "$BASE_SHA")" = "$base_tree_sha"
          workflow_api="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-pr.yml")"
          jq -e --argjson id "$(jq -er .workflow_id "$handoff_json")" '.path == ".github/workflows/ci-pr.yml" and .id == $id' <<<"$workflow_api" >/dev/null
          run_id="$(jq -er .run_id "$handoff_json")"
          workflow_id="$(jq -er .workflow_id "$handoff_json")"
          run_attempt="$(jq -er .run_attempt "$handoff_json")"
          run_api="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jq -e --argjson id "$run_id" --argjson workflow_id "$workflow_id" --argjson target_repo_id "$TARGET_REPOSITORY_ID" --argjson head_repo_id "$HEAD_REPOSITORY_ID" --arg head_repo "$HEAD_REPOSITORY" --argjson pr "$PR_NUMBER" --argjson run_attempt "$run_attempt" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .id == $id and .workflow_id == $workflow_id and .path == ".github/workflows/ci-pr.yml" and .event == "pull_request" and
            .status == "completed" and .conclusion == "success" and .head_sha == $head and
            ((.repository.id | tonumber) == $target_repo_id) and .repository.full_name == $repo and
            ((.head_repository.id | tonumber) == $head_repo_id) and .head_repository.full_name == $head_repo and
            (.pull_requests | any((.number | tonumber) == $pr and .base.sha == $base)) and
            .run_attempt == $run_attempt
          ' <<<"$run_api" >/dev/null
          job_id="$(jq -er .job_id "$handoff_json")"
          job_api="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id")"
          jq -e --argjson id "$job_id" --argjson run_id "$run_id" --argjson run_attempt "$run_attempt" --arg head "$HEAD_SHA" '
            .id == $id and .run_id == $run_id and (.run_attempt | tonumber) == $run_attempt and .name == "candidate_producer" and .head_sha == $head and
            .status == "completed" and .conclusion == "success"
          ' <<<"$job_api" >/dev/null
          test "$head_tree_sha" = "$(jq -er .head_tree_sha "$handoff_json")"
          test "$base_tree_sha" = "$(jq -er .base_tree_sha "$handoff_json")"
          test "$(GIT_CONFIG_NOSYSTEM=1 HOME="$verifier_source_home" git -C "$verifier_source_repo" show "$BASE_SHA:.github/workflows/ci-pr.yml" | sha256sum | awk '{print $1}')" = "$(jq -er .contract_sha256 "$handoff_json")"
          closure_file="$RUNNER_TEMP/verifier-closure"
          GIT_CONFIG_NOSYSTEM=1 HOME="$verifier_source_home" git -C "$verifier_source_repo" ls-tree -r "$HEAD_SHA" -- crates/velnor-workflow Cargo.toml Cargo.lock rust-toolchain.toml rust-toolchain .cargo | LC_ALL=C sort > "$closure_file"
          printf 'closure-version:1\\nfeatures:tui\\nprofile:debug\\n' >> "$closure_file"
          test "$(sha256sum "$closure_file" | awk '{print $1}')" = "$(jq -er .candidate_closure "$handoff_json")"
          render_sha256="$(cd "$result_dir/render" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$render_sha256" = "$(jq -er .render_sha256 "$result_json")"
          echo "result_raw_zip_sha256=$result_raw_zip_sha256" >> "$GITHUB_OUTPUT"
          echo "handoff_raw_zip_sha256=$handoff_raw_zip_sha256" >> "$GITHUB_OUTPUT"
      - name: Resolve required status checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
          DECLARED_RULESET_CONTEXTS: DCO,Policy,ci-required
        run: |
          set -euo pipefail
          stderr="$(mktemp)"
          trap 'rm -f "$stderr"' EXIT
          if contexts="$(gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true" 2>"$stderr" \
            | jq -r '.[] | select(.target == "branch" and .enforcement == "active") | .id' \
            | while read -r id; do gh api "repos/$GITHUB_REPOSITORY/rulesets/$id"; done \
            | jq -r --arg branch "refs/heads/$DEFAULT_BRANCH" 'select(.conditions.ref_name.include | any(. == "~DEFAULT_BRANCH" or . == "~ALL" or . == $branch)) | .rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' \
            | sort -u | paste -sd, -)"; then
            :
          elif grep -qE '(HTTP 403|Upgrade to GitHub Team)' "$stderr"; then
            echo "::warning::rulesets API returned 403; falling back to declared contexts [$DECLARED_RULESET_CONTEXTS]"
            contexts="$DECLARED_RULESET_CONTEXTS"
          else
            cat "$stderr" >&2
            exit 1
          fi
          echo "RULESET_CONTEXTS=$contexts" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          VELNOR_WORKFLOW_POLICY_REVISION: fdeed261bd2247a38db6922a7726cd45d3d6f31e
        run: |
          set -euo pipefail
          candidate_args=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            candidate_args+=(--candidate-render "$RUNNER_TEMP/candidate-result-verified/render")
          fi
          velnor-workflow policy \
            --workflow-root "$WORKFLOW_ROOT" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            "${candidate_args[@]}" \
            --ruleset-contexts "$RULESET_CONTEXTS"

      - name: Set up actionlint
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint@1.7.12
          cache: false
      - name: Lint caller workflows
        working-directory: policy-checkout
        env:
          MISE_NO_CONFIG: "1"
        run: mise exec actionlint@1.7.12 -- actionlint

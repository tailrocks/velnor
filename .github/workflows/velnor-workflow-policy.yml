name: Velnor workflow policy

on:
  workflow_call:
    inputs:
      policy-revision:
        description: Full SHA of this reusable policy workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: Enforce workflow policy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          # Static policy validation only; fork head checkout is intentional.
          allow-unsafe-pr-checkout: true

      - name: Install pinned Velnor workflow runtime
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-workflow-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/velnor-workflow-cargo-target
          VELNOR_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/velnor-workflow-install
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          install -d -m 700 \
            "$CARGO_HOME" \
            "$CARGO_TARGET_DIR" \
            "$VELNOR_WORKFLOW_INSTALL_DIR"
          cd "$VELNOR_WORKFLOW_INSTALL_DIR"
          cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev 8859e3c537cfc2d6e44a92d0c4c0f7ca071e92e0 \
            --root "$VELNOR_WORKFLOW_ROOT" \
            velnor-workflow \
            --bin velnor-workflow
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"

      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          VELNOR_WORKFLOW_POLICY_REVISION: ${{ inputs.policy-revision }}
        run: velnor-workflow policy --workflow-root "$WORKFLOW_ROOT"

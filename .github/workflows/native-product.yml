          jq -e 'all(.[]; (keys | sort) == ["binary","crate","feature","identity","name","targets","version"] and (.version | type == "string") and (.targets | type == "array"))' <<<"$COMPONENTS_JSON" >/dev/null
          printf 'COMPONENTS_JSON=%s\n' "$COMPONENTS_JSON" >> "$GITHUB_ENV"
          printf '%s\n' "$COMPONENTS_JSON" > components.json

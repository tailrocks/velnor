          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact source identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          case "$actual" in ''|*[!0-9a-f]*) echo '::error::checkout is not a lowercase 40-hex commit' >&2; exit 1 ;; esac
          [ "${#actual}" -eq 40 ] && [ "$actual" = "$GITHUB_SHA" ] || { echo '::error::checkout source differs from event source' >&2; exit 1; }
          test -z "$(git status --porcelain)" || { echo '::error::native product checkout is dirty' >&2; exit 1; }
          [ "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY" ] || { echo '::error::configured source repository differs from event repository' >&2; exit 1; }

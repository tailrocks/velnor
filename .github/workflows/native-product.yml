    name: Build product / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: xcode-27
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      PRODUCT_ID: 'velnor'
      CHANNEL: 'stable'
      SOURCE_REPOSITORY: 'tailrocks/velnor'
      MANIFEST_SCHEMA: 'velnor.product-manifest/v1'
      ARCHIVE_COMPONENT: 'velnorctl'
      ARCHIVE_IDENTITY_SCHEMA: 'velnor.homebrew-install-identity/v1'
      ARCHIVE_MANIFEST_SCHEMA: 'velnor.homebrew-install/v1'
      DEFAULT_BRANCH: 'main'
      TARGETS_JSON: '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","aarch64-apple-darwin","x86_64-apple-darwin"]'
      BLOCKED_TARGETS_JSON: '["x86_64-apple-darwin"]'
      COMPONENTS_JSON: '[{"name":"velnor-runner","crate":"velnor-runner","binary":"velnor-runner","identity":"version","feature":"release-build"},{"name":"velnor-workflow","crate":"velnor-workflow","binary":"velnor-workflow","identity":"revision","feature":null},{"name":"velnorctl","crate":"velnorctl","binary":"velnorctl","identity":"version","feature":"release-build"}]'

name: Native product build
run-name: Native product build · ${{ github.ref_name }}

on:
  workflow_call:

concurrency:
  group: native-product-build-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blocked-x86_64_apple_darwin:
    name: Blocked native product target / x86_64-apple-darwin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse unsupported target
        run: |
          echo "::error::native product target x86_64-apple-darwin is blocked: macOS 27 Intel is unavailable; no fallback runner is permitted" >&2
          exit 1


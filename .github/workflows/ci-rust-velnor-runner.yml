# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: "Rust · velnor-runner"
on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string

jobs:
  github:
    name: GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Velnor workflow runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-workflow-runtime
          path: .velnor-workflow-runtime
      - name: Add Velnor workflow runtime to PATH
        shell: bash
        run: |
          set -euo pipefail
          install -Dm0755 .velnor-workflow-runtime/velnor-workflow "$HOME/.cargo/bin/velnor-workflow"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Set up Mise Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust
          cache: true
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-rust-velnor-runner-${{ hashFiles('.cargo/**', 'Cargo.toml', 'crates/velnor-runner/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain') }}
          restore-keys: |
            velnor-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-rust-velnor-runner-
          save-on-workflow-dispatch: true
      - name: Set up cargo-nextest
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: nextest
          fallback: none
      - name: Set up mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          make-default: true
      - name: Run "Rust crate (velnor-runner)" checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: rust-velnor-runner
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-velnor-runner

  velnor:
    name: Velnor
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Mise Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust
          cache: true
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
      - name: Set up cargo-nextest
        uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: nextest
          fallback: none
      - name: Set up mold
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        with:
          make-default: true
      - name: Run "Rust crate (velnor-runner)" checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: rust-velnor-runner
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-velnor-runner


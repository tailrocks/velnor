  group-unit-rust-velnor-client:
    name: "Rust · velnor-client"
    needs: [plan, group-unit-rust-velnor-model]
    uses: ./.github/workflows/ci-rust-velnor-client.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
  group-unit-rust-velnor-control:
    name: "Rust · velnor-control"
    needs: [plan, group-unit-rust-velnor-model]
    uses: ./.github/workflows/ci-rust-velnor-control.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
  group-unit-rust-velnor-model:
    name: "Rust · velnor-model"
    needs: [plan]
    uses: ./.github/workflows/ci-rust-velnor-model.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
  group-unit-rust-velnor-render:
    name: "Rust · velnor-render"
    needs: [plan, group-unit-rust-velnor-model]
    uses: ./.github/workflows/ci-rust-velnor-render.yml

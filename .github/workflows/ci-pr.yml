            esac
          fi
          if [[ "$selected" == *",rust-velnor-workflow,"* ]]; then
            result="$(result_for_job group-rust)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit rust-velnor-workflow did not pass: $result" >&2; exit 1 ;;
            esac
          else

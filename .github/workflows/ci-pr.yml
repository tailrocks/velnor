# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / PR
run-name: CI / PR · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: both
        type: choice
        options:
          - github
          - velnor
          - both
      scope:
        description: Verification scope
        required: true
        default: affected
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Planning
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@0fa68740830638a3e16437400ff3fc1729f31fcd
        with:
          rev: ${{ github.sha }}
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=0fa68740830638a3e16437400ff3fc1729f31fcd" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_SELECTION_FILE: ${{ runner.temp }}/velnor-ci-selection
          VELNOR_LANES: ${{ github.event.inputs.runner || 'both' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 0fa68740830638a3e16437400ff3fc1729f31fcd
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" '{repository: $repository, revision: $revision, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-0fa68740830638a3e16437400ff3fc1729f31fcd-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
      - name: Publish Velnor CI selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-ci-selection
          path: ${{ runner.temp }}/velnor-ci-selection
          if-no-files-found: error
          retention-days: 1
  group-bun:
    name: "Bun / Packages"
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.bun_matrix != '[]' }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base_sha: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
      head_sha: ${{ github.sha }}
  group-docker:
    name: "Docker / Images"
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.docker_matrix != '[]' }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base_sha: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
      head_sha: ${{ github.sha }}
  group-docs:
    name: Documentation
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.docs_matrix != '[]' }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-docs.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base_sha: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
      head_sha: ${{ github.sha }}
  group-opentofu:
    name: OpenTofu
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.opentofu_matrix != '[]' }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-opentofu.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base_sha: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
      head_sha: ${{ github.sha }}
  group-rust:
    name: Rust
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.rust_matrix != '[]' }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base_sha: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
      head_sha: ${{ github.sha }}
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [plan, group-bun, group-docker, group-docs, group-opentofu, group-rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          selected=",$SELECTED_UNITS,"
          if [[ "$selected" == *",bun-velnor,"* ]]; then
            result="$(result_for_job group-bun)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit bun-velnor did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job group-bun)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-bun failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",docker,"* ]]; then
            result="$(result_for_job group-docker)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit docker did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job group-docker)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-docker failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",docs,"* ]]; then
            result="$(result_for_job group-docs)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit docs did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job group-docs)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-docs failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",opentofu,"* ]]; then
            result="$(result_for_job group-opentofu)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit opentofu did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job group-opentofu)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-opentofu failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-policy,"* ]]; then
            result="$(result_for_job group-rust)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit rust-policy did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job group-rust)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI unit rust-policy failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-unit-collector,"* ]]; then
            result="$(result_for_job group-rust)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit rust-unit-collector did not pass: $result" >&2; exit 1 ;;
            esac
          else

# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / PR
run-name: CI / PR · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated provider subset of [github-hosted, velnor]
        required: false
        default: github-hosted,velnor
        type: string
      scope:
        description: Verification scope
        required: true
        default: affected
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: velnor-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  runtime:
    name: Prepare renderer (${{ matrix.runner }})
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact renderer source and published product
        id: runtime-source
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RENDERER_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
          AUDITED_HEAD: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          git cat-file -e "$RENDERER_REVISION^{commit}"
          git merge-base --is-ancestor "$RENDERER_REVISION" HEAD || { echo "::error::renderer pin must be reachable from the checked-out integration candidate" >&2; exit 1; }
          listing="$(git ls-tree -r "$RENDERER_REVISION" -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
          test -n "$listing"
          closure() { printf '%s\nclosure-version:1\nfeatures:%s\nprofile:%s\n' "$(LC_ALL=C sort <<<"$1")" "$2" "$3" | sha256 | awk '{print $1}'; }
          release="$(closure "$listing" '' release)"
          candidate="$(closure "$listing" 'tui' debug)"
          head_listing="$(git ls-tree -r "$AUDITED_HEAD" -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
          [[ "$(closure "$head_listing" 'tui' debug)" == "$candidate" ]] || { echo "::error::generator source differs from its declared pin; commit the source, pin it, and regenerate before merge" >&2; exit 1; }
          if [[ 'true' == true ]]; then
            integration_listing="$(git ls-tree -r HEAD -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
            [[ "$(closure "$integration_listing" 'tui' debug)" == "$candidate" ]] || { echo "::error::integration source closure differs from the pinned renderer" >&2; exit 1; }
          fi
          response="$RUNNER_TEMP/runtime-product-response"
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/velnor-workflow-runtime-v1-${release:0:16}" > "$response"; then
            published=true
          else
            status="$(awk '/^HTTP\// {print $2; exit}' "$response")"
            [[ "$status" == 404 ]] || { echo "::error::runtime lookup failed with status $status; source fallback is allowed only for a missing product" >&2; exit 1; }
            published=false
          fi
          { echo "published=$published"; echo "candidate=$candidate"; echo "release=$release"; echo "candidate_name=velnor-workflow-candidate-${candidate:0:16}-$RUNNER_OS-$RUNNER_ARCH"; } >> "$GITHUB_OUTPUT"
      - name: Set up Velnor workflow runtime
        id: runtime
        if: steps.runtime-source.outputs.published == 'true'
        uses: ./.github/actions/setup-velnor-workflow
        with:
          rev: e1c589eb5012a705aa735cb553a5230ff9fec490
      - name: Set trusted workflow policy revision
        run: |
          echo "VELNOR_WORKFLOW_POLICY_REVISION=e1c589eb5012a705aa735cb553a5230ff9fec490" >> "$GITHUB_ENV"
          echo "VELNOR_WORKFLOW_RUNTIME_CLOSURE=${{ steps.runtime.outputs.closure }}" >> "$GITHUB_ENV"
      - name: Prepare clean pinned renderer checkout
        if: steps.runtime-source.outputs.published != 'true'
        shell: bash
        working-directory: .
        env:
          RENDERER_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          source="$RUNNER_TEMP/renderer-source"
          git worktree add --detach "$source" "$RENDERER_REVISION"
          test -z "$(git -C "$source" status --porcelain --untracked-files=all)"
          cd "$source"
      - name: Check renderer formatting
        if: steps.runtime-source.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/renderer-source
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: env -i PATH="$PATH" HOME="$HOME" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="$RUNNER_TEMP/renderer-cargo-home" CARGO_TARGET_DIR="$RUNNER_TEMP/renderer-target" cargo fmt --all -- --check
      - name: Check renderer Clippy
        if: steps.runtime-source.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/renderer-source
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: env -i PATH="$PATH" HOME="$HOME" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="$RUNNER_TEMP/renderer-cargo-home" CARGO_TARGET_DIR="$RUNNER_TEMP/renderer-target" cargo clippy --locked --package velnor-workflow --all-targets --no-default-features --features tui -- -D warnings
      - name: Build exact renderer source
        if: steps.runtime-source.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/renderer-source
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: env -i PATH="$PATH" HOME="$HOME" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="$RUNNER_TEMP/renderer-cargo-home" CARGO_TARGET_DIR="$RUNNER_TEMP/renderer-target" cargo build --locked --package velnor-workflow --bin velnor-workflow --no-default-features --features tui
      - name: Verify source runtime identity
        if: steps.runtime-source.outputs.published != 'true'
        shell: bash
        working-directory: .
        env:
          RENDERER_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
          EXPECTED_CLOSURE: ${{ steps.runtime-source.outputs.candidate }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          source="$RUNNER_TEMP/renderer-source"
          test -z "$(git -C "$source" status --porcelain --untracked-files=all)"
          binary="$RUNNER_TEMP/renderer-target/debug/velnor-workflow"
          [[ "$("$binary" --revision)" == "$RENDERER_REVISION" ]]
          [[ "$("$binary" --closure)" == "$EXPECTED_CLOSURE" ]]
          echo "$RUNNER_TEMP/renderer-target/debug" >> "$GITHUB_PATH"
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Bind runtime closure
        shell: bash
        working-directory: .
        env:
          EXPECTED_CLOSURE: ${{ steps.runtime.outputs.closure || steps.runtime-source.outputs.candidate }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          [[ "$(velnor-workflow --closure)" == "$EXPECTED_CLOSURE" ]]
          echo "VELNOR_WORKFLOW_RUNTIME_CLOSURE=$EXPECTED_CLOSURE" >> "$GITHUB_ENV"
          if [[ "${{ steps.runtime-source.outputs.published }}" == true ]]; then
            echo "VELNOR_WORKFLOW_RUNTIME_PROFILE=release" >> "$GITHUB_ENV"
            echo "VELNOR_WORKFLOW_RUNTIME_FEATURES=" >> "$GITHUB_ENV"
          else
            echo "VELNOR_WORKFLOW_RUNTIME_PROFILE=debug" >> "$GITHUB_ENV"
            echo "VELNOR_WORKFLOW_RUNTIME_FEATURES=tui" >> "$GITHUB_ENV"
          fi
          echo "VELNOR_WORKFLOW_POLICY_REVISION=e1c589eb5012a705aa735cb553a5230ff9fec490" >> "$GITHUB_ENV"
      - name: Prepare source candidate for trusted policy
        if: true && steps.runtime-source.outputs.published != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        working-directory: .
        env:
          CANDIDATE_CLOSURE: ${{ steps.runtime-source.outputs.candidate }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          stage="$RUNNER_TEMP/renderer-candidate"
          mkdir -p "$stage"
          install -m 0755 "$(command -v velnor-workflow)" "$stage/velnor-workflow"
          digest="$(sha256 "$stage/velnor-workflow" | awk '{print $1}')"
          jq -n --arg profile debug --arg platform "$RUNNER_OS-$RUNNER_ARCH" --arg repository "$GITHUB_REPOSITORY" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg revision "$CANDIDATE_HEAD" --arg closure "$CANDIDATE_CLOSURE" --arg build_revision 'e1c589eb5012a705aa735cb553a5230ff9fec490' --arg binary_sha256 "$digest" '{profile: $profile, platform: $platform, repository: $repository, run_id: $run_id, run_attempt: $run_attempt, revision: $revision, closure: $closure, build_revision: $build_revision, binary_sha256: $binary_sha256}' > "$stage/candidate-manifest.json"
      - name: Publish source candidate for trusted policy
        if: true && steps.runtime-source.outputs.published != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.runtime-source.outputs.candidate_name }}
          path: ${{ runner.temp }}/renderer-candidate
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256 "$stage/velnor-workflow" | awk '{print $1}')"
          policy_src="${VELNOR_WORKFLOW_PINNED_BINARY:-$src}"
          install -m 0755 "$policy_src" "$stage/velnor-workflow-policy"
          policy_revision="$("$stage/velnor-workflow-policy" --revision)"
          policy_closure="$("$stage/velnor-workflow-policy" --closure)"
          [[ "$policy_closure" == "$VELNOR_WORKFLOW_RUNTIME_CLOSURE" ]] || { echo "::error::policy runtime closure mismatch" >&2; exit 1; }
          [[ "$("$stage/velnor-workflow" --closure)" == "$VELNOR_WORKFLOW_RUNTIME_CLOSURE" ]] || { echo "::error::runtime closure mismatch" >&2; exit 1; }
          policy_digest="$(sha256 "$stage/velnor-workflow-policy" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg closure "$VELNOR_WORKFLOW_RUNTIME_CLOSURE" --arg profile "${VELNOR_WORKFLOW_RUNTIME_PROFILE:-release}" --arg features "${VELNOR_WORKFLOW_RUNTIME_FEATURES:-}" --arg platform "$RUNNER_OS-$RUNNER_ARCH" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" --arg policy_revision "$policy_revision" --arg policy_closure "$policy_closure" --arg policy_binary_sha256 "$policy_digest" '{repository: $repository, revision: $revision, closure: $closure, profile: $profile, features: $features, platform: $platform, run_id: $run_id, run_attempt: $run_attempt, job_id: $job_id, binary_sha256: $binary_sha256, policy_revision: $policy_revision, policy_closure: $policy_closure, policy_binary_sha256: $policy_binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-e1c589eb5012a705aa735cb553a5230ff9fec490-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  plan:
    needs: [runtime]
    name: "Control / Planning"
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      unit_ids: ${{ steps.plan.outputs.unit_ids }}
      full_units: ${{ steps.plan.outputs.full_units }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      excluded: ${{ steps.plan.outputs.excluded }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Velnor workflow runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-workflow-runtime-e1c589eb5012a705aa735cb553a5230ff9fec490-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor-workflow-runtime-download
      - name: Verify Velnor workflow runtime
        shell: bash
        working-directory: .
        env:
          EXPECTED_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          stage="$RUNNER_TEMP/velnor-workflow-runtime-download"
          manifest="$stage/manifest.json"
          jq -e --arg revision "$EXPECTED_REVISION" --arg repository "$GITHUB_REPOSITORY" --arg platform "$RUNNER_OS-$RUNNER_ARCH" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg job "runtime" '.revision == $revision and .repository == $repository and .platform == $platform and .run_id == $run_id and .run_attempt == $run_attempt and .job_id == $job and (.policy_revision | test("^[0-9a-f]{40}$")) and (.profile != "debug" or .policy_revision == $revision) and ((.profile == "release" and .features == "") or (.profile == "debug" and .features == "tui")) and (.binary_sha256 | test("^[0-9a-f]{64}$")) and (.policy_binary_sha256 | test("^[0-9a-f]{64}$")) and (.closure | test("^[0-9a-f]{64}$")) and .closure == .policy_closure' "$manifest" >/dev/null
          if [[ 'true' == true ]]; then
            if ! git cat-file -e "$EXPECTED_REVISION^{commit}" 2>/dev/null; then
              auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$EXPECTED_REVISION"
            fi
          listing="$(git ls-tree -r "$EXPECTED_REVISION" -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
          test -n "$listing"
          features="$(jq -er '.features | strings' "$manifest")"
          profile="$(jq -er .profile "$manifest")"
          closure="$(printf '%s\nclosure-version:1\nfeatures:%s\nprofile:%s\n' "$(LC_ALL=C sort <<<"$listing")" "$features" "$profile" | sha256 | awk '{print $1}')"
          [[ "$(jq -er .closure "$manifest")" == "$closure" ]] || { echo "::error::runtime source closure mismatch" >&2; exit 1; }
          fi
          for pair in 'velnor-workflow binary_sha256' 'velnor-workflow-policy policy_binary_sha256'; do
            read -r binary field <<< "$pair"
            expected="$(jq -er --arg field "$field" '.[$field]' "$manifest")"
            actual="$(sha256 "$stage/$binary" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "::error::runtime digest mismatch: $binary" >&2; exit 1; }
          done
      - name: Add Velnor workflow runtime to PATH
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          stage="$RUNNER_TEMP/velnor-workflow-runtime-download"
          home="$RUNNER_TEMP/velnor-workflow-runtime-artifact"
          mkdir -p "$home/bin"
          install -m 0755 "$stage/velnor-workflow" "$home/bin/velnor-workflow"
          install -m 0755 "$stage/velnor-workflow-policy" "$home/bin/velnor-workflow-policy"
          expected_closure="$(jq -er '.policy_closure' "$stage/manifest.json")"
          for binary in velnor-workflow velnor-workflow-policy; do
            reported="$("$home/bin/$binary" --closure)"
            [[ "$reported" == "$expected_closure" ]] || { echo "::error::runtime reports closure $reported, expected $expected_closure" >&2; exit 1; }
          done
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$home/bin/velnor-workflow-policy" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_PROVIDERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.providers || 'github-hosted' }}
          VELNOR_EVENT_TRUSTED: ${{ (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

  github-hosted-bun-velnor:
    name: "Bun · Bun package (velnor) · github-hosted — bun-velnor"
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"bun-velnor"') && ((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-hosted,')) || (github.event_name != 'workflow_dispatch')) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      unit: bun-velnor
      provider: github-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      cache_paths: "~/.bun/install/cache"
      cache_key_files: |
        package.json
        bun.lock
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: github-hosted
  velnor-bun-velnor:
    name: "Bun · Bun package (velnor) · velnor — bun-velnor"
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"bun-velnor"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',velnor,')) || (false)) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      unit: bun-velnor
      provider: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      host_warm_layers: cargo
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: velnor-trust-gated
  github-hosted-docker:
    name: "Docker · Docker · github-hosted — docker"
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docker"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-hosted,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      unit: docker
      provider: github-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      cache_paths: ".velnor-docker-cache"
      seed_compat: "7e67216c9e23"

# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / PR
run-name: CI / PR · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated provider subset of [github-hosted, velnor]
        required: false
        default: github-hosted,velnor
        type: string
      scope:
        description: Verification scope
        required: true
        default: affected
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: velnor-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: "Control / Planning"
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      unit_ids: ${{ steps.plan.outputs.unit_ids }}
      full_units: ${{ steps.plan.outputs.full_units }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      excluded: ${{ steps.plan.outputs.excluded }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        uses: ./.github/actions/setup-velnor-workflow
        with:
          rev: fdeed261bd2247a38db6922a7726cd45d3d6f31e
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=fdeed261bd2247a38db6922a7726cd45d3d6f31e" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_PROVIDERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.providers || 'github-hosted' }}
          VELNOR_EVENT_TRUSTED: ${{ (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: fdeed261bd2247a38db6922a7726cd45d3d6f31e
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          policy_src="${VELNOR_WORKFLOW_PINNED_BINARY:-$src}"
          install -m 0755 "$policy_src" "$stage/velnor-workflow-policy"
          policy_revision="$("$stage/velnor-workflow-policy" --revision)"
          policy_closure="$("$stage/velnor-workflow-policy" --closure)"
          [[ "$policy_closure" == "${{ steps.runtime.outputs.closure }}" ]] || { echo "::error::policy runtime reports closure $policy_closure, expected ${{ steps.runtime.outputs.closure }}" >&2; exit 1; }
          policy_digest="$(sha256sum "$stage/velnor-workflow-policy" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg closure "${{ steps.runtime.outputs.closure }}" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" --arg policy_revision "$policy_revision" --arg policy_closure "$policy_closure" --arg policy_binary_sha256 "$policy_digest" '{repository: $repository, revision: $revision, closure: $closure, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256, policy_revision: $policy_revision, policy_closure: $policy_closure, policy_binary_sha256: $policy_binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-fdeed261bd2247a38db6922a7726cd45d3d6f31e-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  candidate_producer:
    name: candidate_producer
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id && github.event.pull_request.base.repo.id == github.repository_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build candidate generator
        id: candidate_build
        env:
          CANDIDATE_ARTIFACT_NAME: velnor-workflow-candidate-linux-x64
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BUILD_IMAGE_REPOSITORY: ghcr.io/tailrocks/velnor-bootstrap-builder
          CANDIDATE_BUILD_IMAGE_DIGEST: ""
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          test "$CANDIDATE_ARTIFACT_NAME" = "velnor-workflow-candidate-linux-x64"
          test "$CANDIDATE_BUILD_IMAGE_REPOSITORY" = "ghcr.io/tailrocks/velnor-bootstrap-builder"
          if [[ ! "$CANDIDATE_BUILD_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::candidate builder image is not pinned" >&2; exit 1; fi
          test -z "${GITHUB_TOKEN:-}"
          test -z "${ACTIONS_RUNTIME_TOKEN:-}"
          test -z "${ACTIONS_RUNTIME_URL:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          case "$GITHUB_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
          command -v docker >/dev/null
          command -v jq >/dev/null
          command -v git >/dev/null
          command -v sha256sum >/dev/null
          command -v timeout >/dev/null
          docker_cmd() {
            env -i PATH="$PATH" HOME=/tmp/candidate-home DOCKER_CONFIG="$RUNNER_TEMP/docker-config" docker "$@"
          }
          docker_cmd info >/dev/null
          test "$(docker_cmd info --format '{{.OSType}}')" = linux
          builder_image="$CANDIDATE_BUILD_IMAGE_REPOSITORY@$CANDIDATE_BUILD_IMAGE_DIGEST"
          docker_cmd buildx imagetools inspect --raw "$builder_image" > "$RUNNER_TEMP/candidate-builder-index.json"
          jq -e '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")] | length == 1' "$RUNNER_TEMP/candidate-builder-index.json" >/dev/null
          builder_platform_digest="$(jq -er '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest") | .digest] | if length == 1 then .[0] else error("builder platform digest is not unique") end' "$RUNNER_TEMP/candidate-builder-index.json")"
          if [[ ! "$builder_platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then exit 1; fi
          builder_platform_image="$CANDIDATE_BUILD_IMAGE_REPOSITORY@$builder_platform_digest"
          docker_cmd pull --quiet --platform linux/amd64 "$builder_platform_image"
          docker_cmd image inspect "$builder_platform_image" --format '{{json .}}' > "$RUNNER_TEMP/candidate-builder-local.json"
          jq -e --arg ref "$builder_platform_image" '.[0].RepoDigests | index($ref) != null' "$RUNNER_TEMP/candidate-builder-local.json" >/dev/null
          jq -e '.[0].Os == "linux" and .[0].Architecture == "amd64" and ((.[0].Config.Env // []) | all(test("^(GITHUB_|ACTIONS_|RUNNER_|GH_TOKEN|AWS_|AZURE_|GOOGLE_|CARGO_REGISTRIES_).*" ) | not)) and .[0].Config.Volumes == null' "$RUNNER_TEMP/candidate-builder-local.json" >/dev/null
          stage="$RUNNER_TEMP/velnor-workflow-candidate"
          rm -rf "$stage"
          mkdir -m 0700 "$stage"
          source="$GITHUB_WORKSPACE"
          test -d "$source"
          test -z "$(find -P "$source" -type l -print -quit)"
          test -z "$(find -P "$source" ! -type f ! -type d ! -type l -print -quit)"
          uid=65532; gid=65532
          cid="$(docker_cmd create --name "velnor-candidate-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --platform linux/amd64 --pull=never --network=none --read-only --pid=private --cap-drop=ALL --security-opt no-new-privileges=true --pids-limit=256 --memory=4096m --memory-swap=4096m --cpus=2 --ulimit fsize=268435456:268435456 --ulimit nofile=2048:2048 --ulimit core=0 --shm-size=64m --stop-timeout=10 --log-driver=none --user "$uid:$gid" --workdir /src --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,nr_inodes=8192,mode=700,uid=$uid,gid=$gid --tmpfs /target:rw,nosuid,nodev,size=2048m,nr_inodes=200000,mode=700,uid=$uid,gid=$gid --tmpfs /output:rw,noexec,nosuid,nodev,size=64m,nr_inodes=4096,mode=700,uid=$uid,gid=$gid --mount "type=bind,src=$source,dst=/src,readonly,bind-propagation=rprivate" --env CANDIDATE_HEAD_SHA="$CANDIDATE_HEAD_SHA" --env CARGO_HOME=/tmp/cargo --env CARGO_NET_OFFLINE=true --env CARGO_TARGET_DIR=/target --env CARGO_TERM_COLOR=never --env HOME=/tmp/home --env PATH=/usr/local/cargo/bin:/usr/local/rustup/toolchain/stable-x86_64-unknown-linux-gnu/bin:/usr/bin:/bin --entrypoint /bin/sh "$builder_platform_image" -ceu 'cargo build --locked --offline -p velnor-workflow && install -m 0555 target/debug/velnor-workflow /output/velnor-workflow')"
          cleanup() {
            status=$?
            if [[ -n "${cid:-}" ]]; then docker_cmd rm -f "$cid" >/dev/null 2>&1 || status=1; fi
            trap - EXIT
            exit "$status"
          }
          trap cleanup EXIT
          docker_cmd inspect "$cid" > "$stage/container.json"
          jq -e --arg user "$uid:$gid" --arg source "$source" '
            .[0].HostConfig.NetworkMode == "none" and .[0].HostConfig.ReadonlyRootfs == true and
            .[0].HostConfig.Privileged == false and ((.[0].HostConfig.CapDrop // []) | index("ALL") != null) and
            ((.[0].HostConfig.CapAdd // []) | length == 0) and ((.[0].HostConfig.PidMode // "") == "private") and
            ((.[0].HostConfig.IpcMode // "") == "private") and ((.[0].HostConfig.SecurityOpt // []) | index("no-new-privileges=true") != null) and
            ((.[0].HostConfig.SecurityOpt // []) | all(. != "seccomp=unconfined")) and .[0].HostConfig.PidsLimit == 256 and
            .[0].HostConfig.Memory == 4294967296 and .[0].HostConfig.MemorySwap == 4294967296 and .[0].HostConfig.NanoCpus == 2000000000 and
            .[0].HostConfig.LogConfig.Type == "none" and .[0].Config.User == $user and .[0].Config.WorkingDir == "/src" and
            .[0].Config.Entrypoint == ["/bin/sh"] and ((.[0].Config.Env | map(split("=")[0]) | sort) == ["CANDIDATE_HEAD_SHA","CARGO_HOME","CARGO_NET_OFFLINE","CARGO_TARGET_DIR","CARGO_TERM_COLOR","HOME","PATH"]) and
            ((.[0].HostConfig.Binds // []) | length == 0) and ((.[0].HostConfig.Devices // []) | length == 0) and
            ([.[0].Mounts[] | select(.Type == "bind" and .Destination == "/src" and .Source == $source and .RW == false and .Propagation == "rprivate")] | length == 1) and
            ([.[0].Mounts[] | select(.Type == "bind")] | length == 1) and
            ([.[0].Mounts[] | select(.Type == "tmpfs" and (.Destination == "/tmp" or .Destination == "/target" or .Destination == "/output"))] | length == 3)
          ' "$stage/container.json" >/dev/null
          docker_cmd start "$cid" >/dev/null
          if ! timeout --foreground --kill-after=10s 900s env -i PATH="$PATH" HOME=/tmp/candidate-home DOCKER_CONFIG="$RUNNER_TEMP/docker-config" docker wait "$cid" > "$stage/exit"; then
            docker_cmd kill "$cid" >/dev/null 2>&1 || true
            exit 1
          fi
          docker_cmd inspect "$cid" > "$stage/after.json"
          jq -e '.[0].State.Status == "exited" and .[0].State.ExitCode == 0 and .[0].State.OOMKilled == false and .[0].State.Error == ""' "$stage/after.json" >/dev/null
          output="$stage/output"
          mkdir -m 0700 "$output"
          docker_cmd cp "$cid:/output/." "$output/"
          test "$(find -P "$output" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 1
          test -f "$output/velnor-workflow"
          test ! -L "$output/velnor-workflow"
          test -z "$(find -P "$output" -type l -print -quit)"
          test -z "$(find -P "$output" ! -type f ! -type d ! -type l -print -quit)"
          install -m 0555 "$output/velnor-workflow" "$stage/velnor-workflow"
          chmod 0555 "$stage/velnor-workflow"
          binary_sha256="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          closure_input="$stage/closure-input"
          git -C "$source" ls-tree -r "$CANDIDATE_HEAD_SHA" -- crates/velnor-workflow Cargo.toml Cargo.lock rust-toolchain.toml rust-toolchain .cargo \
            | LC_ALL=C sort > "$closure_input"
          printf 'closure-version:1\\nfeatures:\\nprofile:debug\\n' >> "$closure_input"
          candidate_closure="$(sha256sum "$closure_input" | awk '{print $1}')"
          if [[ ! "$candidate_closure" =~ ^[0-9a-f]{64}$ ]]; then exit 1; fi
          jq -n \
            --arg schema "velnor.bootstrap-producer-manifest.v1" \
            --arg profile debug \
            --argjson features '[]' \
            --arg platform linux-amd64 \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg revision "$CANDIDATE_HEAD_SHA" \
            --arg closure "$candidate_closure" \
            --arg binary_sha256 "$binary_sha256" \
            '{schema: $schema, profile: $profile, features: $features, platform: $platform, repository: $repository, run_id: $run_id, revision: $revision, closure: $closure, binary_sha256: $binary_sha256}' > "$stage/candidate-manifest.json"
      - name: Upload candidate generator product
        id: candidate_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-candidate-linux-x64
          path: ${{ runner.temp }}/velnor-workflow-candidate
          if-no-files-found: error
          retention-days: 1
      - name: Remove candidate build workspace
        if: always()
        run: rm -rf -- "${{ runner.temp }}/velnor-workflow-candidate"

  github-hosted-bun-velnor:
    name: "Bun · Bun package (velnor) · github-hosted — bun-velnor"
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"bun-velnor"') && ((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-hosted,')) || (github.event_name != 'workflow_dispatch')) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      unit: bun-velnor
      provider: github-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      cache_paths: "~/.bun/install/cache"
      cache_key_files: |
        package.json
        bun.lock
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: github-hosted
  velnor-bun-velnor:
    name: "Bun · Bun package (velnor) · velnor — bun-velnor"
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"bun-velnor"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',velnor,')) || (false)) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      unit: bun-velnor
      provider: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      host_warm_layers: cargo
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: velnor-trust-gated
  github-hosted-docker:
    name: "Docker · Docker · github-hosted — docker"
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docker"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-hosted,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      unit: docker
      provider: github-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      cache_paths: ".velnor-docker-cache"
      seed_compat: "743cc362f16c"
      seed_dependency_files: |
        Cargo.lock
        Dockerfile
        docker/build-mise.lock
        docker/build-mise.toml
        rust-toolchain.toml
      seed_freshness_files: |
        Cargo.lock
        deny.toml
      unit_platform: linux-x64
      unit_trust: trusted-only
      unit_admission: github-hosted-trust-gated
  velnor-docker:
    name: "Docker · Docker · velnor — docker"
    if: ${{ always() && needs.plan.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docker"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',velnor,')) || (false)) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      unit: docker
      provider: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}

# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI
run-name: CI / PR · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Planning
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        run: cargo install --locked --git https://github.com/tailrocks/velnor.git --rev 8859e3c537cfc2d6e44a92d0c4c0f7ca071e92e0 velnor-workflow --bin velnor-workflow
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: velnor-workflow plan --config .github/ci/project.toml

  group-unit-bun-velnor:
    name: "Bun · Bun package (velnor)"
    needs: [plan]
    uses: ./.github/workflows/ci-bun-velnor.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
  group-unit-docker:
    name: "Docker · Docker"
    needs: [plan]
    uses: ./.github/workflows/ci-docker-docker.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
  group-unit-docker-crates-velnor-workflow-tests-fixtures-polyglot:

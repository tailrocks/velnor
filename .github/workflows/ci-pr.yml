    needs: [plan, velnor-lane-admission, group-bun-github, group-bun-velnor, group-docker-github, group-docker-velnor, group-docs-github, group-docs-velnor, group-opentofu-github, group-opentofu-velnor, group-rust-control, group-rust-github, group-rust-velnor]

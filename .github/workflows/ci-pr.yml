            esac
          fi
          if [[ "$selected" == *",rust-velnor-client,"* ]]; then
            result="$(result_for_job group-rust)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit rust-velnor-client did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job group-rust)"
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI unit rust-velnor-client failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-velnor-control,"* ]]; then
            result="$(result_for_job group-rust)"
            case "$result" in

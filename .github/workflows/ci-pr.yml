            esac
          fi
          if [[ "$selected" == *",rust-velnor-bench,"* ]]; then
            result="$(result_for_job group-rust)"
            case "$result" in
              success) ;;
              *) echo "selected CI unit rust-velnor-bench did not pass: $result" >&2; exit 1 ;;
            esac
          else
            result="$(result_for_job group-rust)"
            case "$result" in
              success|skipped) ;;

      scope: ${{ needs.plan.outputs.scope }}
  group-unit-docs:
    name: "Documentation · Documentation"
    needs: [plan]
    uses: ./.github/workflows/ci-docs-docs.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
  group-unit-gradle-crates-velnor-workflow-tests-fixtures-polyglot:
    name: "Gradle · Gradle (crates/velnor-workflow/tests/fixtures/polyglot)"
    needs: [plan]
    uses: ./.github/workflows/ci-gradle-crates-velnor-workflow-tests-fixtures-polyglot.yml
    with:
      scope: ${{ needs.plan.outputs.scope }}
  group-unit-node-fixture:
    name: "Node.js · Node.js package (fixture)"
    needs: [plan]
    uses: ./.github/workflows/ci-node-fixture.yml
    with:

        with:
          name: proof-post-github-${{ github.run_id }}-${{ matrix.slot }}
          path: |
            .velnor-proof/post/github
            .velnor-proof/metrics
          if-no-files-found: error
          compression-level: 0
      - name: Emit execute contract
        id: aggregate
        uses: tailrocks/velnor-actions/actions/aggregate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92

  velnor_execute:
    name: velnor execute proof (${{ matrix.slot }})
    needs:
      - validate-request
      - restore_barrier
      - reservation_barrier
      - github_restore
      - velnor_restore
    if: ${{ always() && needs.restore_barrier.result == 'success' && (inputs.cache_proof_id != '' || (inputs.benchmark_campaign != '' && needs.reservation_barrier.result == 'success' && needs.reservation_barrier.outputs.contract == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.benchmark_fanout == '8' && '[0,1,2,3,4,5,6,7]' || '[0]') }}
    runs-on: ${{ 'velnor-trusted' }}
    timeout-minutes: 45
    steps:
      - name: Validate distinct Velnor slot grant
        if: ${{ inputs.benchmark_campaign != '' }}
        shell: bash
        env:
          EXPECTED_RECORD_DIGEST: ${{ needs.reservation_barrier.outputs.record_digest }}
          EXPECTED_COORDINATOR_RECORD_B64: ${{ needs.reservation_barrier.outputs.record_base64 }}
          EXPECTED_CAMPAIGN: ${{ inputs.benchmark_campaign }}
          EXPECTED_WAVE: ${{ inputs.benchmark_wave }}
          EXPECTED_RESERVATION: ${{ inputs.benchmark_reservation }}
          EXPECTED_SLOT: ${{ matrix.slot }}
          REQUIRED_PEAK_BYTES: 16106127360
        run: |
          set -euo pipefail
          fail() { echo "reservation grant: $*" >&2; exit 1; }
          grant="${VELNOR_BENCHMARK_GRANT_V1-}"
          [[ -n "${grant}" ]] || fail "missing slot grant"
          record="$(printf '%s' "${EXPECTED_COORDINATOR_RECORD_B64}" | openssl base64 -d -A 2>/dev/null)" || fail "invalid coordinator record encoding"
          canonical="$(jq -cS . <<<"${record}")" || fail "invalid coordinator record"
          actual_digest="$(printf '%s' "${canonical}" | sha256sum | cut -d' ' -f1)"
          [[ "${actual_digest}" == "${EXPECTED_RECORD_DIGEST}" ]] || fail "coordinator record digest mismatch"
          expected_materialization="$(jq -er --argjson slot "${EXPECTED_SLOT}" '.slots[] | select(.slot == $slot) | .materialization_id' <<<"${canonical}")" || fail "slot absent from coordinator record"
          jq -e 'keys == ["campaign","coordinator_digest","materialization_id","reservation_id","reserved_bytes","schema","slot","state","wave"]' <<<"${grant}" >/dev/null || fail "unknown or missing grant field"
          jq -e --arg digest "${EXPECTED_RECORD_DIGEST}" --arg materialization "${expected_materialization}" --arg campaign "${EXPECTED_CAMPAIGN}" --arg wave "${EXPECTED_WAVE}" --arg reservation "${EXPECTED_RESERVATION}" --argjson slot "${EXPECTED_SLOT}" --argjson peak "${REQUIRED_PEAK_BYTES}" '
            .schema == 1 and .coordinator_digest == $digest and .campaign == $campaign and
            .wave == $wave and .reservation_id == $reservation and .slot == $slot and
            .state == "released" and
            .materialization_id == $materialization and
            (.reserved_bytes | type == "number" and floor == . and . >= $peak and . <= 9007199254740991)
          ' <<<"${grant}" >/dev/null || fail "grant correlation, slot, or peak mismatch"

            local temperature="$1" github_hit="$2" velnor_hit="$3"
            case "${temperature}" in
              cold) [[ "${github_hit}" != true && "${velnor_hit}" != true ]] ;;
              warm) [[ "${github_hit}" == true && "${velnor_hit}" == true ]] ;;
              *) return 1 ;;
            esac
          }
          benchmark_cache_state() {
            local mode="$1" role="$2" github_hit="$3" velnor_hit="$4"
            [[ "${mode}" =~ ^(normal|enabled|disabled)$ && "${role}" =~ ^(target|non-target)$ ]]
            [[ "${github_hit}" == "${velnor_hit}" ]]
            if [[ "${mode}" == normal || ( "${mode}" == enabled && "${role}" == target ) ]]; then
              if [[ "${github_hit}" == true ]]; then printf 'hit\n'; else printf 'miss\n'; fi
            elif [[ "${mode}" == disabled && "${role}" == target ]]; then
              [[ "${github_hit}" != true ]]; printf 'ignored\n'
            else
              [[ "${github_hit}" == true ]]; printf 'ignored\n'
            fi
          }
          selected=0
          publish_needed=false
          TOOLS_publish=false
          DEPENDENCIES_publish=false
          BUILD_OUTPUT_publish=false
          if [[ -n "${CACHE_PROOF_ID}" || -n "${BENCHMARK_MODE}" ]]; then
            selected=$((selected + 1))
            for identity in "${TOOLS_github_ARTIFACT_ID}" "${TOOLS_velnor_ARTIFACT_ID}"; do [[ "${identity}" =~ ^[1-9][0-9]*$ ]]; done
            for digest in "${TOOLS_github_ARTIFACT_DIGEST}" "${TOOLS_velnor_ARTIFACT_DIGEST}"; do [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; done
            [[ "${TOOLS_github_ARTIFACT_ID}" != "${TOOLS_velnor_ARTIFACT_ID}" ]]
            github='.velnor-proof/barrier/github/tools'
            velnor='.velnor-proof/barrier/velnor/tools'
            verify_evidence "${github}" github 'tools'
            verify_evidence "${velnor}" velnor 'tools'
            test "$(cat "${github}/archive.sha256")" = "$(cat "${velnor}/archive.sha256")"
            test "$(cat "${github}/manifest.sha256")" = "$(cat "${velnor}/manifest.sha256")"
            github_hit="$(cat "${github}/hit")"
            velnor_hit="$(cat "${velnor}/hit")"
            if [[ -n "${CACHE_PROOF_ID}" ]]; then
              verify_cache_temperature "${CACHE_TEMPERATURE}" "${github_hit}" "${velnor_hit}"
              [[ "${CACHE_TEMPERATURE}" == cold ]] && TOOLS_publish=true
            else
              role=non-target; [[ "${BENCHMARK_MODE}" == normal || "${BENCHMARK_CACHE_ID}" == 'tools' ]] && role=target
              state="$(benchmark_cache_state "${BENCHMARK_MODE}" "${role}" "${github_hit}" "${velnor_hit}")"
              [[ "${state}" == miss ]] && TOOLS_publish=true
            fi
          fi
          if [[ -n "${CACHE_PROOF_ID}" || -n "${BENCHMARK_MODE}" ]]; then
            selected=$((selected + 1))
            for identity in "${DEPENDENCIES_github_ARTIFACT_ID}" "${DEPENDENCIES_velnor_ARTIFACT_ID}"; do [[ "${identity}" =~ ^[1-9][0-9]*$ ]]; done
            for digest in "${DEPENDENCIES_github_ARTIFACT_DIGEST}" "${DEPENDENCIES_velnor_ARTIFACT_DIGEST}"; do [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; done
            [[ "${DEPENDENCIES_github_ARTIFACT_ID}" != "${DEPENDENCIES_velnor_ARTIFACT_ID}" ]]
            github='.velnor-proof/barrier/github/dependencies'
            velnor='.velnor-proof/barrier/velnor/dependencies'
            verify_evidence "${github}" github 'dependencies'
            verify_evidence "${velnor}" velnor 'dependencies'
            test "$(cat "${github}/archive.sha256")" = "$(cat "${velnor}/archive.sha256")"
            test "$(cat "${github}/manifest.sha256")" = "$(cat "${velnor}/manifest.sha256")"
            github_hit="$(cat "${github}/hit")"
            velnor_hit="$(cat "${velnor}/hit")"
            if [[ -n "${CACHE_PROOF_ID}" ]]; then
              verify_cache_temperature "${CACHE_TEMPERATURE}" "${github_hit}" "${velnor_hit}"
              [[ "${CACHE_TEMPERATURE}" == cold ]] && DEPENDENCIES_publish=true
            else
              role=non-target; [[ "${BENCHMARK_MODE}" == normal || "${BENCHMARK_CACHE_ID}" == 'dependencies' ]] && role=target
              state="$(benchmark_cache_state "${BENCHMARK_MODE}" "${role}" "${github_hit}" "${velnor_hit}")"
              [[ "${state}" == miss ]] && DEPENDENCIES_publish=true
            fi
          fi
          if [[ -n "${CACHE_PROOF_ID}" || -n "${BENCHMARK_MODE}" ]]; then
            selected=$((selected + 1))
            for identity in "${BUILD_OUTPUT_github_ARTIFACT_ID}" "${BUILD_OUTPUT_velnor_ARTIFACT_ID}"; do [[ "${identity}" =~ ^[1-9][0-9]*$ ]]; done
            for digest in "${BUILD_OUTPUT_github_ARTIFACT_DIGEST}" "${BUILD_OUTPUT_velnor_ARTIFACT_DIGEST}"; do [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; done
            [[ "${BUILD_OUTPUT_github_ARTIFACT_ID}" != "${BUILD_OUTPUT_velnor_ARTIFACT_ID}" ]]
            github='.velnor-proof/barrier/github/build-output'
            velnor='.velnor-proof/barrier/velnor/build-output'
            verify_evidence "${github}" github 'build-output'
            verify_evidence "${velnor}" velnor 'build-output'
            test "$(cat "${github}/archive.sha256")" = "$(cat "${velnor}/archive.sha256")"
            test "$(cat "${github}/manifest.sha256")" = "$(cat "${velnor}/manifest.sha256")"
            github_hit="$(cat "${github}/hit")"

          for root in 'target' '**/target'; do rm -rf -- "${root}"; done
      - name: Restore published build-output identity
        id: verify-publish-build-output
        if: ${{ needs.restore_barrier.outputs.publish_build_output == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            **/target
          key: ${{ inputs.benchmark_campaign != '' && inputs.benchmark_cache_mode != 'normal' && inputs.benchmark_cache_id != 'build-output' && 'ci-v1' || needs.validate-request.outputs.cache_namespace }}/code/build-output/${{ runner.os }}-${{ runner.arch }}/${{ hashFiles('mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/${{ hashFiles('**/.cargo/config.toml', '**/Cargo.lock', '**/Cargo.toml', 'mise.lock', 'mise.toml', 'rust-toolchain.toml') }}/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
      - name: Verify published build-output bytes
        if: ${{ needs.restore_barrier.outputs.publish_build_output == 'true' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.verify-publish-build-output.outputs.cache-hit }}
          RESTORE_STARTED_MS: 0
          RESTORE_FINISHED_MS: 0
          CACHE_LOCK_WAIT_MS: 0
        run: |
          set -euo pipefail
          safe_link_target() {
            local base="$1" target="$2" component; local -a stack=(workspace) parts
            IFS=/ read -ra parts <<<"${base}/${target}"
            for component in "${parts[@]}"; do
              case "${component}" in ''|.) ;; ..) (( ${#stack[@]} > 1 )) || return 1; unset 'stack[-1]' ;; *) stack+=("${component}") ;; esac
            done
          }
          shopt -s globstar nullglob
          destination='.velnor-proof/publish-verify/github/build-output'
          rm -rf -- "${destination}"
          mkdir -p -- "${destination}"
          : > "${destination}/files.nul"
          for root in 'target' '**/target'; do
            if [[ -e "${root}" || -L "${root}" ]]; then
              find "${root}" \( -type f -o -type l -o \( -type d -empty \) \) -print0
            fi
          done | LC_ALL=C sort -zu > "${destination}/files.nul"
          : > "${destination}/manifest.txt"
          while IFS= read -r -d '' file; do
            [[ "${file}" != *$'\n'* && "${file}" != /* && "/${file}/" != */../* ]] || { echo 'unsafe cache path' >&2; exit 1; }
            mode="$(stat -c '%a' -- "${file}" 2>/dev/null || stat -f '%Lp' -- "${file}")"
            encoded="$(printf '%s' "${file}" | openssl base64 -A)"
            if [[ -L "${file}" ]]; then
              kind=l; target="$(readlink -- "${file}")"
              [[ -n "${target}" && "${target}" != /* && "${target}" != *$'\n'* ]] || { echo 'unsafe cache symlink target' >&2; exit 1; }
              safe_link_target "$(dirname -- "${file}")" "${target}" || { echo 'escaping cache symlink target' >&2; exit 1; }
              digest="$(printf '%s' "${target}" | sha256sum | cut -d' ' -f1)"
              target_encoded="$(printf '%s' "${target}" | openssl base64 -A)"
            elif [[ -f "${file}" ]]; then
              kind=f; digest="$(sha256sum -- "${file}" | cut -d' ' -f1)"; target_encoded=-
            elif [[ -d "${file}" ]]; then
              kind=d; digest="$(printf '' | sha256sum | cut -d' ' -f1)"; target_encoded=-
            else
              echo 'unsupported cache entry type' >&2; exit 1
            fi
            printf '%s %s %s %s %s\n' "${kind}" "${mode}" "${digest}" "${encoded}" "${target_encoded}"
          done < "${destination}/files.nul" | LC_ALL=C sort > "${destination}/manifest.txt"
          tar --null --no-recursion --files-from="${destination}/files.nul" --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf "${destination}/cache.tar"
          sha256sum "${destination}/manifest.txt" | cut -d' ' -f1 > "${destination}/manifest.sha256"
          sha256sum "${destination}/cache.tar" | cut -d' ' -f1 > "${destination}/archive.sha256"
          restore_started="${RESTORE_STARTED_MS-0}"; restore_finished="${RESTORE_FINISHED_MS-0}"
          for value in "${restore_started}" "${restore_finished}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          (( restore_finished >= restore_started ))
          printf '%s\n' "$((restore_finished - restore_started))" > "${destination}/restore-ms"
          [[ "${CACHE_LOCK_WAIT_MS}" =~ ^[0-9]+$ ]]
          printf '%s\n' "${CACHE_LOCK_WAIT_MS}" > "${destination}/lock-wait-ms"
          stat -c '%s' -- "${destination}/cache.tar" > "${destination}/cache-bytes"
          wc -l < "${destination}/manifest.txt" | tr -d ' ' > "${destination}/cache-files"
          if [[ "${CACHE_HIT}" == true ]]; then printf 'exact\n'; else printf 'miss\n'; fi > "${destination}/hit-source"
          printf '%s\n' '-1' > "${destination}/age-seconds"
          printf '%s\n' 'unknown' > "${destination}/eviction-risk"
          printf '%s\n' "${CACHE_HIT}" > "${destination}/hit"
          printf '%s\n' 'build-output' > "${destination}/cache-id"
          printf '%s\n' 'github' > "${destination}/lane"
          [[ "${CACHE_HIT}" == true ]]
          source_root='.velnor-proof/publish/proof-post-github-${{ github.run_id }}-0/post/github/build-output'
          verified_root='.velnor-proof/publish-verify/github/build-output'
          [[ "$(cat "${source_root}/archive.sha256")" == "$(cat "${verified_root}/archive.sha256")" ]]
          [[ "$(cat "${source_root}/manifest.sha256")" == "$(cat "${verified_root}/manifest.sha256")" ]]
      - name: Upload measured publisher metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-publisher-metrics-${{ github.run_id }}
          path: .velnor-proof/publisher-metrics
          if-no-files-found: error
          compression-level: 0

  cache-proof-contract:
    name: cache proof contract
    needs:
      - github_restore
      - velnor_restore
      - restore_barrier
      - github_execute
      - velnor_execute
      - proof_reconcile
      - cache_publish
    if: ${{ always() && (inputs.benchmark_campaign != '' || inputs.cache_proof_id != '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      contract: ${{ steps.contract.outputs.contract }}
    steps:
      - name: Enforce proof DAG contract
        id: contract
        shell: bash
        env:
          GITHUB_RESTORE: ${{ needs.github_restore.result }}
          VELNOR_RESTORE: ${{ needs.velnor_restore.result }}
          RESTORE_BARRIER: ${{ needs.restore_barrier.result }}
          GITHUB_EXECUTE: ${{ needs.github_execute.result }}
          VELNOR_EXECUTE: ${{ needs.velnor_execute.result }}
          PROOF_RECONCILE: ${{ needs.proof_reconcile.result }}
          CACHE_PUBLISH: ${{ needs.cache_publish.result }}
          TEMPERATURE: ${{ inputs.cache_temperature }}
          BENCHMARK_MODE: ${{ inputs.benchmark_cache_mode }}
          CACHE_PROOF_ID: ${{ inputs.cache_proof_id }}
          BENCHMARK_CAMPAIGN: ${{ inputs.benchmark_campaign }}
          PUBLISH_NEEDED: ${{ needs.restore_barrier.outputs.publish_needed }}
        run: |
          set -euo pipefail
          for result in "${GITHUB_RESTORE}" "${VELNOR_RESTORE}" "${RESTORE_BARRIER}" "${GITHUB_EXECUTE}" "${VELNOR_EXECUTE}" "${PROOF_RECONCILE}"; do
            [[ "${result}" == success ]] || { echo "proof DAG result ${result}, expected success" >&2; exit 1; }
          done
          [[ -n "${CACHE_PROOF_ID}" || -n "${BENCHMARK_CAMPAIGN}" ]] || { echo "missing proof operation identity" >&2; exit 1; }
          [[ "${PUBLISH_NEEDED}" == true || "${PUBLISH_NEEDED}" == false ]] || { echo "invalid publisher decision" >&2; exit 1; }
          if [[ -n "${CACHE_PROOF_ID}" ]]; then
            [[ ( "${TEMPERATURE}" == cold && "${PUBLISH_NEEDED}" == true ) || ( "${TEMPERATURE}" == warm && "${PUBLISH_NEEDED}" == false ) ]] || { echo "cache-proof temperature/publisher mismatch" >&2; exit 1; }
          elif [[ "${BENCHMARK_MODE}" == disabled && "${PUBLISH_NEEDED}" != false ]]; then
            echo "disabled benchmark requested publication" >&2; exit 1
          fi
          publish_expected="${PUBLISH_NEEDED}"
          if ${publish_expected}; then
            [[ "${CACHE_PUBLISH}" == success ]] || { echo "cold/enabled proof publisher did not succeed" >&2; exit 1; }
          else
            [[ "${CACHE_PUBLISH}" == skipped ]] || { echo "warm/disabled proof publisher must skip" >&2; exit 1; }
          fi
          echo 'contract=success' >> "${GITHUB_OUTPUT}"

  contract:
    name: contract
    needs:
      - velnor-lane
      - github-lane
      - cache-proof-contract
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      contract: ${{ steps.verdict.outputs.contract }}
    steps:
      - name: Aggregate lane verdict
        id: verdict
        env:
          LANE: ${{ inputs.lane != '' && inputs.lane || (github.repository_owner == 'jackin-project' && 'github') || ((github.repository_owner == 'tailrocks' || github.repository_owner == 'ChainArgos') && 'velnor') || 'invalid' }}
          VELNOR_RESULT: ${{ needs.velnor-lane.result }}
          VELNOR_CONTRACT: ${{ needs.velnor-lane.outputs.contract }}
          GITHUB_RESULT: ${{ needs.github-lane.result }}
          GITHUB_CONTRACT: ${{ needs.github-lane.outputs.contract }}
          PLATFORM_REQUIRED: false
          PLATFORM_RESULT: skipped
          PLATFORM_CONTRACT: ""
          OPERATION: ${{ inputs.benchmark_campaign != '' && 'benchmark' || inputs.cache_proof_id != '' && 'cache-proof' || 'ordinary' }}
          CACHE_PROOF_RESULT: ${{ needs.cache-proof-contract.result }}
          CACHE_PROOF_CONTRACT: ${{ needs.cache-proof-contract.outputs.contract }}
        shell: bash
        run: |
          set -euo pipefail
          # Positive per-lane truth table: emit contract=success ONLY when every selected
          # lane succeeded with contract=success and every non-selected lane is skipped with
          # an empty output. A failed, unavailable, or skipped selected lane is never
          # credited, and one lane never substitutes for the other.
          if [ "${OPERATION}" != ordinary ]; then
            if [ "${CACHE_PROOF_RESULT}" != success ] || [ "${CACHE_PROOF_CONTRACT}" != success ]; then
              echo "contract: ${OPERATION} proof DAG did not pass" >&2
              exit 1
            fi
            if [ "${VELNOR_RESULT}" != skipped ] || [ "${GITHUB_RESULT}" != skipped ] || [ -n "${VELNOR_CONTRACT}${GITHUB_CONTRACT}" ]; then
              echo "contract: ordinary lane jobs ran during ${OPERATION}" >&2
              exit 1
            fi
          else
          case "${LANE}" in
            velnor)
              if [ "${VELNOR_RESULT}" != "success" ] || [ "${VELNOR_CONTRACT}" != "success" ]; then
                echo "contract: velnor lane did not pass (result '${VELNOR_RESULT}', contract '${VELNOR_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${GITHUB_RESULT}" != "skipped" ] || [ -n "${GITHUB_CONTRACT}" ]; then
                echo "contract: github lane must be skipped for lane=velnor (result '${GITHUB_RESULT}')" >&2
                exit 1
              fi
              ;;
            github)
              if [ "${GITHUB_RESULT}" != "success" ] || [ "${GITHUB_CONTRACT}" != "success" ]; then
                echo "contract: github lane did not pass (result '${GITHUB_RESULT}', contract '${GITHUB_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${VELNOR_RESULT}" != "skipped" ] || [ -n "${VELNOR_CONTRACT}" ]; then
                echo "contract: velnor lane must be skipped for lane=github (result '${VELNOR_RESULT}')" >&2
                exit 1
              fi
              ;;
            both)
              if [ "${VELNOR_RESULT}" != "success" ] || [ "${VELNOR_CONTRACT}" != "success" ]; then
                echo "contract: velnor lane did not pass (result '${VELNOR_RESULT}', contract '${VELNOR_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${GITHUB_RESULT}" != "success" ] || [ "${GITHUB_CONTRACT}" != "success" ]; then
                echo "contract: github lane did not pass (result '${GITHUB_RESULT}', contract '${GITHUB_CONTRACT}')" >&2
                exit 1
              fi
              ;;
            *)
              echo "contract: unrecognized lane '${LANE}'" >&2
              exit 1
              ;;
          esac
            if [ "${CACHE_PROOF_RESULT}" != skipped ] || [ -n "${CACHE_PROOF_CONTRACT}" ]; then
              echo "contract: proof DAG ran during ordinary execution" >&2
              exit 1
            fi
          fi
          if [ "${PLATFORM_REQUIRED}" = "true" ]; then
            if [ "${PLATFORM_RESULT}" != "success" ] || [ "${PLATFORM_CONTRACT}" != "success" ]; then
              echo "contract: required GitHub platform lane did not pass" >&2
              exit 1
            fi
          elif [ "${PLATFORM_RESULT}" != "skipped" ] || [ -n "${PLATFORM_CONTRACT}" ]; then
            echo "contract: unexpected GitHub platform lane execution" >&2
            exit 1
          fi
          echo "contract=success" >> "${GITHUB_OUTPUT}"
          echo "contract: lane '${LANE}' passed"

      - name: Upload execute post-state and metrics
        id: upload-post
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-post-velnor-${{ github.run_id }}-${{ matrix.slot }}
          path: |
            .velnor-proof/post/velnor
            .velnor-proof/metrics
          if-no-files-found: error
          compression-level: 0
      - name: Emit execute contract
        id: aggregate
        uses: tailrocks/velnor-actions/actions/aggregate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92

  proof_reconcile:
    name: reconcile every proof artifact
    needs:
      - validate-request
      - github_execute
      - velnor_execute
    if: ${{ always() && (inputs.cache_proof_id != '' || inputs.benchmark_campaign != '') && needs.github_execute.result == 'success' && needs.velnor_execute.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      contract: ${{ steps.reconcile.outputs.contract }}
    steps:
      - name: Resolve exact immutable post-state artifacts
        id: post-identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FANOUT: ${{ inputs.benchmark_fanout != '' && inputs.benchmark_fanout || '1' }}
        run: |
          set -euo pipefail
          fail() { echo "post artifact identity: $*" >&2; exit 1; }
          [[ "${RUN_ID}" =~ ^[1-9][0-9]*$ && "${FANOUT}" =~ ^(1|8)$ ]] || fail "invalid run or fanout"
          pages="$(gh api --paginate --slurp "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
          artifacts="$(jq -c '[.[].artifacts[] | select(.name | startswith("proof-post-"))] | sort_by(.name)' <<<"${pages}")"
          expected=$((FANOUT * 2))
          [[ "$(jq 'length' <<<"${artifacts}")" == "${expected}" ]] || fail "missing or extra post artifact"
          for ((slot=0; slot<FANOUT; slot++)); do
            for lane in github velnor; do
              name="proof-post-${lane}-${RUN_ID}-${slot}"
              jq -e --arg name "${name}" '[.[] | select(.name == $name)] | length == 1' <<<"${artifacts}" >/dev/null || fail "missing or duplicate expected artifact"
            done
          done
          jq -e 'all(.[]; (.id | type == "number" and . > 0 and floor == .) and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))) and ([.[].id] | length == (unique | length))' <<<"${artifacts}" >/dev/null || fail "invalid or duplicate immutable identity"
          artifact_ids="$(jq -r '[.[].id | tostring] | join(",")' <<<"${artifacts}")"
          [[ -n "${artifact_ids}" ]] || fail "empty artifact identity set"
          printf 'artifact_ids=%s\ncontract=success\n' "${artifact_ids}" >> "${GITHUB_OUTPUT}"
      - name: Download every lane and slot post-state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.post-identities.outputs.artifact_ids }}
          path: .velnor-proof/publish
          merge-multiple: false
      - name: Verify exact post-state set and lane equality
        id: reconcile
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          FANOUT: ${{ inputs.benchmark_fanout != '' && inputs.benchmark_fanout || '1' }}
          EXPECTED_CORRELATION: ${{ needs.validate-request.outputs.correlation }}
        run: |
          set -euo pipefail
          safe_link_target() {
            local base="$1" target="$2" component; local -a stack=(workspace) parts
            IFS=/ read -ra parts <<<"${base}/${target}"
            for component in "${parts[@]}"; do
              case "${component}" in ''|.) ;; ..) (( ${#stack[@]} > 1 )) || return 1; unset 'stack[-1]' ;; *) stack+=("${component}") ;; esac
            done
          }
          verify_evidence() {
            local root="$1" expected_lane="$2" expected_id="$3" required
            for required in cache.tar archive.sha256 manifest.txt manifest.sha256 hit cache-id lane restore-ms lock-wait-ms cache-bytes cache-files hit-source age-seconds eviction-risk; do
              [[ -f "${root}/${required}" && ! -L "${root}/${required}" ]] || return 1
            done
            [[ "$(cat "${root}/cache-id")" == "${expected_id}" ]]
            [[ "$(cat "${root}/lane")" == "${expected_lane}" ]]
            [[ "$(cat "${root}/restore-ms")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/lock-wait-ms")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/cache-bytes")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/cache-files")" =~ ^[0-9]+$ ]]
            [[ "$(cat "${root}/hit-source")" =~ ^(exact|miss)$ ]]
            [[ "$(cat "${root}/age-seconds")" =~ ^-?[0-9]+$ ]]
            [[ "$(cat "${root}/eviction-risk")" =~ ^(low|medium|high|unknown)$ ]]
            [[ "$(sha256sum "${root}/cache.tar" | cut -d' ' -f1)" == "$(cat "${root}/archive.sha256")" ]]
            [[ "$(sha256sum "${root}/manifest.txt" | cut -d' ' -f1)" == "$(cat "${root}/manifest.sha256")" ]]
            local scratch="${root}.verified" kind mode digest encoded target_encoded extra path target actual_mode
            rm -rf -- "${scratch}"
            mkdir -p -- "${scratch}/tree"
            : > "${scratch}/expected"
            while read -r kind mode digest encoded target_encoded extra; do
              [[ -z "${extra}" && "${kind}" =~ ^(f|l|d)$ && "${mode}" =~ ^[0-7]{3,4}$ && "${digest}" =~ ^[0-9a-f]{64}$ && -n "${encoded}" ]]
              path="$(printf '%s' "${encoded}" | openssl base64 -d -A)"
              [[ "$(printf '%s' "${path}" | openssl base64 -A)" == "${encoded}" ]]
              [[ -n "${path}" && "${path}" != /* && "${path}" != *$'\n'* && "/${path}/" != */../* ]]
              if [[ "${kind}" == l ]]; then
                target="$(printf '%s' "${target_encoded}" | openssl base64 -d -A)"
                [[ -n "${target}" && "${target}" != /* && "${target}" != *$'\n'* && "$(printf '%s' "${target}" | openssl base64 -A)" == "${target_encoded}" ]]
                safe_link_target "$(dirname -- "${path}")" "${target}"
                [[ "$(printf '%s' "${target}" | sha256sum | cut -d' ' -f1)" == "${digest}" ]]
              else
                [[ "${target_encoded}" == - ]]
              fi
              printf '%s\n' "${path}" >> "${scratch}/expected"
            done < "${root}/manifest.txt"
            LC_ALL=C sort -u -o "${scratch}/expected" "${scratch}/expected"
            [[ "$(wc -l < "${root}/manifest.txt" | tr -d ' ')" == "$(wc -l < "${scratch}/expected" | tr -d ' ')" ]]
            tar -tf "${root}/cache.tar" | sed 's:/$::' | LC_ALL=C sort -u > "${scratch}/actual"
            diff -u "${scratch}/expected" "${scratch}/actual"
            tar -xf "${root}/cache.tar" -C "${scratch}/tree"
            while read -r kind mode digest encoded target_encoded extra; do

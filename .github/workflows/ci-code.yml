            [[ "$(wc -l < "${root}/manifest.txt" | tr -d ' ')" == "$(wc -l < "${scratch}/expected" | tr -d ' ')" ]]
            tar -tf "${root}/cache.tar" | sed 's:/$::' | LC_ALL=C sort -u > "${scratch}/actual"
            diff -u "${scratch}/expected" "${scratch}/actual"
            tar -xf "${root}/cache.tar" -C "${scratch}/tree"
            while read -r kind mode digest encoded target_encoded extra; do
              path="$(printf '%s' "${encoded}" | openssl base64 -d -A)"
              actual_mode="$(stat -c '%a' -- "${scratch}/tree/${path}" 2>/dev/null || stat -f '%Lp' -- "${scratch}/tree/${path}")"
              [[ "${actual_mode}" == "${mode}" ]]
              if [[ "${kind}" == f ]]; then
                [[ -f "${scratch}/tree/${path}" && ! -L "${scratch}/tree/${path}" && "$(sha256sum -- "${scratch}/tree/${path}" | cut -d' ' -f1)" == "${digest}" ]]
              elif [[ "${kind}" == l ]]; then
                target="$(printf '%s' "${target_encoded}" | openssl base64 -d -A)"
                [[ -L "${scratch}/tree/${path}" && "$(readlink -- "${scratch}/tree/${path}")" == "${target}" ]]
              else
                [[ -d "${scratch}/tree/${path}" && -z "$(find "${scratch}/tree/${path}" -mindepth 1 -maxdepth 1 -print -quit)" ]]
              fi
            done < "${root}/manifest.txt"
            rm -rf -- "${scratch}"
          }
          root='.velnor-proof/execute/github/build-output'
          verify_evidence "${root}" 'github' 'build-output'
          copy_started=$(awk '{printf "%d", $1 * 1000}' /proc/uptime)
          tar -xf "${root}/cache.tar" -C .
          copy_finished=$(awk '{printf "%d", $1 * 1000}' /proc/uptime)
          printf '%s\n' "$((copy_finished - copy_started))" > "${root}/copy-ms"
          printf '%s\n' 'github:build-output:${{ matrix.slot }}' > "${root}/materialization-id"
      - name: Record portable required-step start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .velnor-proof/runtime
          [[ -r /proc/uptime && -r /sys/fs/cgroup/cpu.stat && -r /sys/fs/cgroup/memory.peak && -r /sys/fs/cgroup/io.pressure ]]
          monotonic_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          cpu_usec="$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)"
          io_total_usec="$(awk '$1 == "some" {for (i=1;i<=NF;i++) if ($i ~ /^total=/) {split($i,a,"="); print a[2]}}' /sys/fs/cgroup/io.pressure)"
          for value in "${monotonic_ms}" "${cpu_usec}" "${io_total_usec}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          printf 'START_MONOTONIC_MS=%s\nSTART_CPU_USEC=%s\nSTART_IO_TOTAL_USEC=%s\n' \
            "${monotonic_ms}" "${cpu_usec}" "${io_total_usec}" > .velnor-proof/runtime/start.env
      - name: Set up mise toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: install gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: install
          command: mise install --locked
      - name: build gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: build
          command: mise run ci
      - name: test gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: test
          command: mise run test
      - name: lint gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: lint
          command: mise run lint
      - name: format gate
        uses: tailrocks/velnor-actions/actions/run-gate@3057391f93f3bfc0fe570ee08cfcea9533ea3f92
        with:
          name: format
          command: mise run fmt
      - name: Collect portable proof metrics
        shell: bash
        env:
          PROOF_LANE: github
          PROOF_SLOT: ${{ matrix.slot }}
          PROOF_CORRELATION: ${{ needs.validate-request.outputs.correlation }}
        run: |
          set -euo pipefail
          source .velnor-proof/runtime/start.env
          for value in "${START_MONOTONIC_MS}" "${START_CPU_USEC}" "${START_IO_TOTAL_USEC}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          end_monotonic_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          end_cpu_usec="$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)"
          end_io_total_usec="$(awk '$1 == "some" {for (i=1;i<=NF;i++) if ($i ~ /^total=/) {split($i,a,"="); print a[2]}}' /sys/fs/cgroup/io.pressure)"
          peak_memory_bytes="$(cat /sys/fs/cgroup/memory.peak)"
          disk_bytes="$(du -sb . | awk '{print $1}')"
          for value in "${end_monotonic_ms}" "${end_cpu_usec}" "${end_io_total_usec}" "${peak_memory_bytes}" "${disk_bytes}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          (( end_monotonic_ms >= START_MONOTONIC_MS && end_cpu_usec >= START_CPU_USEC && end_io_total_usec >= START_IO_TOTAL_USEC ))
          required_steps_ms=$((end_monotonic_ms - START_MONOTONIC_MS))
          cpu_ms=$(((end_cpu_usec - START_CPU_USEC) / 1000))
          io_pressure_stall_ms=$(((end_io_total_usec - START_IO_TOTAL_USEC) / 1000))
          cache_restore_ms=0; cache_copy_ms=0; cache_lock_wait_ms=0; cache_bytes=0; cache_files=0
          : > .velnor-proof/runtime/hit-sources
          mapfile -d '' -t evidence < <(find ".velnor-proof/execute/${PROOF_LANE}" -mindepth 1 -maxdepth 1 -type d -print0)
          (( ${#evidence[@]} > 0 ))
          for root in "${evidence[@]}"; do
            for field in restore-ms copy-ms lock-wait-ms cache-bytes cache-files hit-source; do [[ -f "${root}/${field}" ]]; done
            restore="$(cat "${root}/restore-ms")"; copy="$(cat "${root}/copy-ms")"
            lock_wait="$(cat "${root}/lock-wait-ms")"
            bytes="$(cat "${root}/cache-bytes")"; files="$(cat "${root}/cache-files")"
            for value in "${restore}" "${copy}" "${lock_wait}" "${bytes}" "${files}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
            cache_restore_ms=$((cache_restore_ms + restore)); cache_copy_ms=$((cache_copy_ms + copy))
            cache_lock_wait_ms=$((cache_lock_wait_ms + lock_wait))
            cache_bytes=$((cache_bytes + bytes)); cache_files=$((cache_files + files))
            cat "${root}/hit-source" >> .velnor-proof/runtime/hit-sources
          done
          cache_result="$(LC_ALL=C sort -u .velnor-proof/runtime/hit-sources | paste -sd, -)"
          [[ "${cache_result}" =~ ^(exact|miss|exact,miss)$ ]]
          : > .velnor-proof/runtime/output-manifest
          while IFS= read -r -d '' file; do
            [[ "${file}" != *$'\n'* ]]
            digest="$(sha256sum -- "${file}" | cut -d' ' -f1)"
            encoded="$(printf '%s' "${file#./}" | openssl base64 -A)"
            printf '%s %s\n' "${digest}" "${encoded}"
          done < <(find . -path './.git' -prune -o -path './.velnor-proof' -prune -o -type f -print0) | LC_ALL=C sort > .velnor-proof/runtime/output-manifest
          output_digest="$(sha256sum .velnor-proof/runtime/output-manifest | cut -d' ' -f1)"
          disk_probe_started_ms="$(date +%s%3N)"
          sync .velnor-proof/runtime/output-manifest
          disk_probe_finished_ms="$(date +%s%3N)"
          for value in "${disk_probe_started_ms}" "${disk_probe_finished_ms}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          (( disk_probe_finished_ms >= disk_probe_started_ms ))
          disk_latency_ms=$((disk_probe_finished_ms - disk_probe_started_ms))
          correlation="$(printf '%s' "${PROOF_CORRELATION}" | tr -cd 'a-zA-Z0-9._:-')"
          [[ -n "${correlation}" && "${correlation}" == "${PROOF_CORRELATION}" && "${output_digest}" =~ ^[0-9a-f]{64}$ ]]
          if [[ "${PROOF_LANE}" == github ]]; then cache_lock_wait_source=not-applicable-github; [[ "${cache_lock_wait_ms}" == 0 ]]; else cache_lock_wait_source=velnor-runtime-authority; fi
          psi_cpu="$(tr '\n' ';' < /proc/pressure/cpu)"; psi_io="$(tr '\n' ';' < /proc/pressure/io)"; psi_memory="$(tr '\n' ';' < /proc/pressure/memory)"
          mkdir -p .velnor-proof/metrics
          jq -n --arg lane "${PROOF_LANE}" --argjson slot "${PROOF_SLOT}" \
            --argjson required_steps_ms "${required_steps_ms}" --argjson cpu_ms "${cpu_ms}" \
            --argjson required_step_start_ms "${START_MONOTONIC_MS}" --argjson required_step_end_ms "${end_monotonic_ms}" \
            --argjson peak_memory_bytes "${peak_memory_bytes}" --argjson disk_bytes "${disk_bytes}" \
            --argjson restore_ms "${cache_restore_ms}" --argjson save_ms 0 --argjson copy_ms "${cache_copy_ms}" \
            --argjson lock_wait_ms "${cache_lock_wait_ms}" --argjson disk_latency_ms "${disk_latency_ms}" \
            --arg lock_wait_source "${cache_lock_wait_source}" \
            --argjson io_pressure_stall_ms "${io_pressure_stall_ms}" \
            --arg psi_cpu "${psi_cpu}" --arg psi_io "${psi_io}" --arg psi_memory "${psi_memory}" \
            --arg cache_result "${cache_result}" --argjson cache_bytes "${cache_bytes}" --argjson cache_files "${cache_files}" \
            --arg output_digest "${output_digest}" --arg correlation "${correlation}" \
            '{schema:1,lane:$lane,slot:$slot,required_step_start_ms:$required_step_start_ms,required_step_end_ms:$required_step_end_ms,required_steps_ms:$required_steps_ms,cpu_ms:$cpu_ms,peak_memory_bytes:$peak_memory_bytes,disk_bytes:$disk_bytes,cache_restore_ms:$restore_ms,cache_save_ms:$save_ms,cache_copy_ms:$copy_ms,cache_lock_wait_ms:$lock_wait_ms,cache_lock_wait_source:$lock_wait_source,disk_latency_ms:$disk_latency_ms,io_pressure_stall_ms:$io_pressure_stall_ms,psi:{cpu:$psi_cpu,io:$psi_io,memory:$psi_memory},cache_result:$cache_result,cache_bytes:$cache_bytes,cache_files:$cache_files,output_digest:$output_digest,correlation:$correlation}' \
            > ".velnor-proof/metrics/${PROOF_LANE}-${PROOF_SLOT}.json"
          export METRICS_FILE=".velnor-proof/metrics/${PROOF_LANE}-${PROOF_SLOT}.json"
          export EXPECTED_METRICS_LANE="${PROOF_LANE}" EXPECTED_METRICS_SLOT="${PROOF_SLOT}" EXPECTED_METRICS_CORRELATION="${correlation}"

          set -euo pipefail
          [[ -f "${METRICS_FILE}" && ! -L "${METRICS_FILE}" ]]
          jq -e --arg lane "${EXPECTED_METRICS_LANE}" --argjson slot "${EXPECTED_METRICS_SLOT}" --arg correlation "${EXPECTED_METRICS_CORRELATION}" '
            keys == ["cache_bytes","cache_copy_ms","cache_files","cache_lock_wait_ms","cache_lock_wait_source","cache_restore_ms","cache_result","cache_save_ms","correlation","cpu_ms","disk_bytes","disk_latency_ms","io_pressure_stall_ms","lane","output_digest","peak_memory_bytes","psi","required_step_end_ms","required_step_start_ms","required_steps_ms","schema","slot"] and
            .schema == 1 and .lane == $lane and .slot == $slot and .correlation == $correlation and
            ((.lane == "github" and .cache_lock_wait_source == "not-applicable-github" and .cache_lock_wait_ms == 0) or (.lane == "velnor" and .cache_lock_wait_source == "velnor-runtime-authority")) and
            (.output_digest | type == "string" and test("^[0-9a-f]{64}$")) and
            (.cache_result | type == "string" and test("^(exact|miss|exact,miss)$")) and
            (.psi | keys == ["cpu","io","memory"] and all(.[]; type == "string")) and
            ([.required_step_start_ms,.required_step_end_ms,.required_steps_ms,.cpu_ms,.peak_memory_bytes,.disk_bytes,.cache_restore_ms,.cache_save_ms,.cache_copy_ms,.cache_lock_wait_ms,.disk_latency_ms,.io_pressure_stall_ms,.cache_bytes,.cache_files] | all(.[]; type == "number" and . >= 0 and floor == .)) and
            .required_step_end_ms >= .required_step_start_ms and
            .required_steps_ms == (.required_step_end_ms - .required_step_start_ms) and
            ([paths(strings) as $p | getpath($p)] | all(.[]; (test("(?i)(token|secret|password|credential|authorization|/users/|/home/|github_workspace)") | not)))
          ' "${METRICS_FILE}" >/dev/null
      - name: Package github tools post-state
        if: ${{ inputs.cache_proof_id != '' || inputs.benchmark_campaign != '' }}
        shell: bash
        env:
          CACHE_HIT: post
        run: |
          set -euo pipefail
          safe_link_target() {
            local base="$1" target="$2" component; local -a stack=(workspace) parts
            IFS=/ read -ra parts <<<"${base}/${target}"
            for component in "${parts[@]}"; do
              case "${component}" in ''|.) ;; ..) (( ${#stack[@]} > 1 )) || return 1; unset 'stack[-1]' ;; *) stack+=("${component}") ;; esac
            done
          }
          shopt -s globstar nullglob
          destination='.velnor-proof/post/github/tools'
          rm -rf -- "${destination}"
          mkdir -p -- "${destination}"
          : > "${destination}/files.nul"
          for root in '.cache/mise' '.local/share/mise/installs'; do
            if [[ -e "${root}" || -L "${root}" ]]; then
              find "${root}" \( -type f -o -type l -o \( -type d -empty \) \) -print0
            fi
          done | LC_ALL=C sort -zu > "${destination}/files.nul"
          : > "${destination}/manifest.txt"
          while IFS= read -r -d '' file; do
            [[ "${file}" != *$'\n'* && "${file}" != /* && "/${file}/" != */../* ]] || { echo 'unsafe cache path' >&2; exit 1; }
            mode="$(stat -c '%a' -- "${file}" 2>/dev/null || stat -f '%Lp' -- "${file}")"
            encoded="$(printf '%s' "${file}" | openssl base64 -A)"
            if [[ -L "${file}" ]]; then
              kind=l; target="$(readlink -- "${file}")"
              [[ -n "${target}" && "${target}" != /* && "${target}" != *$'\n'* ]] || { echo 'unsafe cache symlink target' >&2; exit 1; }
              safe_link_target "$(dirname -- "${file}")" "${target}" || { echo 'escaping cache symlink target' >&2; exit 1; }
              digest="$(printf '%s' "${target}" | sha256sum | cut -d' ' -f1)"
              target_encoded="$(printf '%s' "${target}" | openssl base64 -A)"
            elif [[ -f "${file}" ]]; then
              kind=f; digest="$(sha256sum -- "${file}" | cut -d' ' -f1)"; target_encoded=-
            elif [[ -d "${file}" ]]; then
              kind=d; digest="$(printf '' | sha256sum | cut -d' ' -f1)"; target_encoded=-
            else
              echo 'unsupported cache entry type' >&2; exit 1
            fi
            printf '%s %s %s %s %s\n' "${kind}" "${mode}" "${digest}" "${encoded}" "${target_encoded}"
          done < "${destination}/files.nul" | LC_ALL=C sort > "${destination}/manifest.txt"
          tar --null --no-recursion --files-from="${destination}/files.nul" --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf "${destination}/cache.tar"
          sha256sum "${destination}/manifest.txt" | cut -d' ' -f1 > "${destination}/manifest.sha256"
          sha256sum "${destination}/cache.tar" | cut -d' ' -f1 > "${destination}/archive.sha256"
          restore_started="${RESTORE_STARTED_MS-0}"; restore_finished="${RESTORE_FINISHED_MS-0}"
          for value in "${restore_started}" "${restore_finished}"; do [[ "${value}" =~ ^[0-9]+$ ]]; done
          (( restore_finished >= restore_started ))
          printf '%s\n' "$((restore_finished - restore_started))" > "${destination}/restore-ms"
          [[ "${CACHE_LOCK_WAIT_MS}" =~ ^[0-9]+$ ]]
          printf '%s\n' "${CACHE_LOCK_WAIT_MS}" > "${destination}/lock-wait-ms"
          stat -c '%s' -- "${destination}/cache.tar" > "${destination}/cache-bytes"
          wc -l < "${destination}/manifest.txt" | tr -d ' ' > "${destination}/cache-files"
          if [[ "${CACHE_HIT}" == true ]]; then printf 'exact\n'; else printf 'miss\n'; fi > "${destination}/hit-source"
          printf '%s\n' '-1' > "${destination}/age-seconds"
          printf '%s\n' 'unknown' > "${destination}/eviction-risk"
          printf '%s\n' "${CACHE_HIT}" > "${destination}/hit"
          printf '%s\n' 'tools' > "${destination}/cache-id"
          printf '%s\n' 'github' > "${destination}/lane"

      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.12/velnor-actions-0.1.12-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: f1b044a606b6bc469f9718644f5c0ed88bf965b6

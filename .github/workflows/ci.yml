          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: 8c09d17163064f5865e6a0cf17c91516dfa013b64dfc51c2335f94f34ce0d21a

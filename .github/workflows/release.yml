        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          while IFS= read -r sibling; do
            [ -n "$sibling" ] || continue
            if jq -e --arg p "$sibling" '.packages[] | select(.name == $p) | .features | has("release-build")' <<<"$metadata" >/dev/null; then
              features="--features release-build"
            else
              features=""
            fi
            # shellcheck disable=SC2086
            mbx build --locked --release --package "$sibling" $features --target "$TARGET"
          done < <(jq -r --arg release 'velnor-runner' '.packages[] | select(.name != $release) | select(.targets | map(.kind[]) | flatten | any(. == "bin")) | .name' <<<"$metadata" | sort -u)
      - name: Stage acyclic identity files packaged into the deb
        run: |
          set -euo pipefail
          test -s metadata/build-identity.json || { echo "::error::release metadata missing build-identity.json" >&2; exit 1; }
          test -s metadata/manifest.json || { echo "::error::release metadata missing manifest.json" >&2; exit 1; }
          jq -e '.source_sha and .crate_version' metadata/build-identity.json >/dev/null
          jq -e 'type == "object"' metadata/manifest.json >/dev/null
          mkdir -p 'crates/velnor-runner/release'
          cp metadata/build-identity.json metadata/manifest.json 'crates/velnor-runner/release'/
      - name: Stage the deb's own package record
        run: |
          set -euo pipefail
          chmod +x metadata/velnor-runner-release-tool
          binary="target/$TARGET/release/velnor-runner"
          test -s "$binary" || { echo "::error::missing cross-built runner binary" >&2; exit 1; }
          binary_sha256="$(sha256sum "$binary" | awk '{print $1}')"
          manifest_sha256="$(sha256sum metadata/manifest.json | awk '{print $1}')"
          manifest_version="$(jq -er '.version | numbers' metadata/manifest.json)"
          source_sha=$(jq -er '.source_sha' metadata/build-identity.json)
          jq -n \
            --arg schema "velnor.package-record/v1" \
            --arg repo 'tailrocks/velnor' \
            --arg kind "stable" \
            --arg commit "$source_sha" \
            --arg crate "$VERSION" \
            --arg debian "$VERSION" \
            --argjson mv "$manifest_version" \
            --arg mhash "$manifest_sha256" \
            --arg arch "${{ matrix.arch }}" \
            --arg target "$TARGET" \
            --arg binary "$binary_sha256" \
            '{
              schema: $schema,
              build: { repository: $repo, kind: $kind, commit: $commit,
                       crate_version: $crate, debian_version: $debian,
                       manifest_version: $mv, manifest_sha256: $mhash },
              architecture: { arch: $arch, target: $target, binary_sha256: $binary }
            }' > package-record.candidate.json
          metadata/velnor-runner-release-tool release emit \
            --record package-record.candidate.json \
            --binary "$binary" \
            --out 'crates/velnor-runner/release'/package-record.json
      - name: Download guest payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-payload-${{ matrix.guest_arch }}
          path: guest-payload
      - name: Stage pinned Firecracker, jailer, and guest agent
        run: |
          set -euo pipefail
          arch="${{ matrix.guest_arch }}"
          root='crates/velnor-runner/release/microvm'
          mkdir -p "$root" extracted
          url="$(jq -er --arg a "$arch" '.tarballs[$a].url' microvm/pins.json)"
          sha="$(jq -er --arg a "$arch" '.tarballs[$a].sha256' microvm/pins.json)"
          fc_member="$(jq -er --arg a "$arch" '.tarballs[$a].firecracker_member' microvm/pins.json)"
          jailer_member="$(jq -er --arg a "$arch" '.tarballs[$a].jailer_member' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 --connect-timeout 30 --max-time 900 \
            -o firecracker.tgz "$url"
          echo "$sha  firecracker.tgz" | sha256sum -c -
          tar -xzf firecracker.tgz -C extracted
          cp "extracted/${fc_member}" "$root/firecracker"
          cp "extracted/${jailer_member}" "$root/jailer"
          test -s guest-payload/velnor-guest-agent || { echo "::error::guest payload missing guest-agent" >&2; exit 1; }
          test -s guest-payload/guest-agent.sha256 || { echo "::error::guest payload missing guest-agent checksum" >&2; exit 1; }
          guest_agent_sha256="$(awk '{print $1}' guest-payload/guest-agent.sha256)"
          [ "${#guest_agent_sha256}" -eq 64 ] || { echo "::error::guest-agent digest has invalid length" >&2; exit 1; }
          actual_guest_agent_sha256="$(sha256sum guest-payload/velnor-guest-agent | awk '{print $1}')"
          [ "$actual_guest_agent_sha256" = "$guest_agent_sha256" ] || { echo "::error::downloaded guest-agent digest mismatch" >&2; exit 1; }
          install -Dm0755 guest-payload/velnor-guest-agent "target/$TARGET/release/velnor-guest-agent"
          cmp -- "target/$TARGET/release/velnor-guest-agent" guest-payload/velnor-guest-agent
          test -s guest-payload/vmlinux || { echo "::error::guest payload missing vmlinux" >&2; exit 1; }
          test -s guest-payload/rootfs.ext4 || { echo "::error::guest payload missing rootfs.ext4" >&2; exit 1; }
          test -s guest-payload/rootfs.sha256 || { echo "::error::guest payload missing rootfs.sha256" >&2; exit 1; }
          rootfs_sha256="$(awk '{print $1}' guest-payload/rootfs.sha256)"
          [ "${#rootfs_sha256}" -eq 64 ] || { echo "::error::guest rootfs digest has invalid length" >&2; exit 1; }
          actual_rootfs_sha256="$(sha256sum guest-payload/rootfs.ext4 | awk '{print $1}')"
          [ "$actual_rootfs_sha256" = "$rootfs_sha256" ] || { echo "::error::downloaded guest rootfs digest mismatch" >&2; exit 1; }
          cp guest-payload/velnor-guest-agent "$root/velnor-guest-agent"
          cp guest-payload/vmlinux "$root/vmlinux"
          cp guest-payload/rootfs.ext4 "$root/rootfs.ext4"
          chmod 0755 "$root/firecracker" "$root/jailer" "$root/velnor-guest-agent"
          fc_sha="$(sha256sum "$root/firecracker" | awk '{print $1}')"
          jailer_sha="$(sha256sum "$root/jailer" | awk '{print $1}')"
          expected_fc="$(jq -er --arg a "$arch" '.tarballs[$a].firecracker_sha256' microvm/pins.json)"
          expected_jailer="$(jq -er --arg a "$arch" '.tarballs[$a].jailer_sha256' microvm/pins.json)"
          [ "$fc_sha" = "$expected_fc" ] || { echo "::error::firecracker sha $fc_sha != pin $expected_fc" >&2; exit 1; }
          [ "$jailer_sha" = "$expected_jailer" ] || { echo "::error::jailer sha $jailer_sha != pin $expected_jailer" >&2; exit 1; }
          mbx run --locked --release --package velnor-runner --bin velnor-guest-image -- \
            stage --root "$root" --arch "$arch" \
            --rootfs-sha256 "$rootfs_sha256" \
            --guest-agent-sha256 "$guest_agent_sha256"
          kernel="$(jq -er '.kernel' "$root/manifest.json")"
          rootfs="$(jq -er '.rootfs' "$root/manifest.json")"
          case "$kernel$rootfs" in
            *UNSET*) echo "::error::staged kernel/rootfs checksum is still UNSET" >&2; exit 1 ;;
          esac
          [ "${#kernel}" -eq 64 ] || { echo "::error::kernel sha256 length ${#kernel}" >&2; exit 1; }
          [ "${#rootfs}" -eq 64 ] || { echo "::error::rootfs sha256 length ${#rootfs}" >&2; exit 1; }
      - name: Build Debian packages
        run: |
          set -euo pipefail
          velnor-workflow release package-deb --package velnor-runner --version "$VERSION" --no-build true --asset-name "velnor-runner-${{ needs.verify.outputs.version }}-${{ matrix.arch }}.deb" --target "$TARGET"
      - name: Guard the deb with the empty-deb-incident checks
        run: |
          set -euo pipefail
          deb="dist/velnor-runner-${{ needs.verify.outputs.version }}-${{ matrix.arch }}.deb"
          test -f "$deb" || { echo "::error::missing expected deb $deb" >&2; exit 1; }
          [ "$(dpkg-deb -f "$deb" Version)" = "$VERSION" ] || { echo "::error::deb version != lane version" >&2; exit 1; }
          [ "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.arch }}" ] || { echo "::error::deb arch != ${{ matrix.arch }}" >&2; exit 1; }
          manifest="$(mktemp)"
          dpkg-deb -c "$deb" > "$manifest"
          awk '$NF == "./usr/bin/velnor-runner" { count++; if (substr($1, 1, 1) != "-") type_ok=0; else if (count == 1) type_ok=1 } END { exit !(count == 1 && type_ok == 1) }' "$manifest" \
            || { echo "::error::deb must contain exactly one regular usr/bin/velnor-runner" >&2; exit 1; }
          [ "$(stat -c%s "$deb")" -gt 1000000 ] || { echo "::error::deb suspiciously small: $(stat -c%s "$deb") bytes" >&2; exit 1; }
          record_path="$(awk '$NF ~ /(^|\/)package-record\.json$/ { print $NF }' "$manifest")"
          [ -n "$record_path" ] || { echo "::error::deb missing its package record" >&2; exit 1; }
          [ "$(printf '%s\n' "$record_path" | wc -l | tr -d ' ')" -eq 1 ] || { echo "::error::deb carries more than one package record" >&2; exit 1; }
          dpkg-deb --fsys-tarfile "$deb" | tar -xOf - "$record_path" \
            | cmp - 'crates/velnor-runner/release'/package-record.json \
            || { echo "::error::packaged package-record.json differs from the emitted record" >&2; exit 1; }
          record_sha256="$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - "$record_path" | sha256sum | awk '{print $1}')"
          [ "$record_sha256" = "$(awk 'NF {print $1; exit}' 'crates/velnor-runner/release'/package-record.json.sha256)" ] \
            || { echo "::error::packaged package-record.json digest != emitted sidecar" >&2; exit 1; }
          packaged_binary_sha256="$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - ./usr/bin/velnor-runner | sha256sum | awk '{print $1}')"
          [ "$packaged_binary_sha256" = "$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - "$record_path" | jq -r '.architecture.binary_sha256')" ] \
            || { echo "::error::deb runner binary does not match the package record" >&2; exit 1; }
      - name: Upload Debian packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-packages
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 2
  sign-deb:
    name: Sign ${{ matrix.arch }} Debian package
    needs: [verify, debian]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: debian-packages
      subject-path: velnor-runner-${{ needs.verify.outputs.version }}-${{ matrix.arch }}.deb
      source-ref: refs/tags/${{ github.ref_name }}


  publish:
    name: Control / Publish
    needs: [admit-runner, verify, build, image, metadata, guest-payload, debian, sign-deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_COMMIT: ${{ github.sha }}
      COMMIT: ${{ github.sha }}
      INDEX_DIGEST: ${{ needs.image.outputs.index_digest }}
      MANIFEST_SHA256: ${{ needs.image.outputs.manifest_sha256 }}
      GHCR_IMAGE: "ghcr.io/tailrocks/velnor-job-ubuntu"
      SOURCE_URL: https://github.com/tailrocks/velnor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: github-*
          merge-multiple: true
      - name: Download Debian packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debian-packages
          path: artifacts
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: artifacts
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digests
          path: artifacts
      - name: Verify tarball provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in artifacts/*.tar.gz; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Verify deb provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in artifacts/*.deb; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci-release-package-signer.yml"; done
      - name: Assemble the release record from downloaded artifacts
        run: |
          set -euo pipefail
          read_sha() {
            local path="artifacts/$1" size token
            [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
            size="$(stat -c%s "$path")"
            [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
            token="$(awk '
              {
                for (field = 1; field <= NF; field++) {
                  token_count++
                  if (token_count == 1) token = $field
                }
              }
              END {
                if (token_count != 1) exit 1
                print token
              }
            ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
            [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
            case "$token" in
              *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
            esac
            printf '%s\n' "$token"
          }
          bin_amd64="$(read_sha "velnor-runner-amd64.bin.sha256")"
          bin_arm64="$(read_sha "velnor-runner-arm64.bin.sha256")"
          deb_amd64="$(read_sha "velnor-runner-${VERSION}-amd64.deb.sha256")"
          deb_arm64="$(read_sha "velnor-runner-${VERSION}-arm64.deb.sha256")"
          # Per-platform OCI digests from the image job.
          plat_amd64="$(jq -r '.manifest.manifests[] | select(.platform.architecture=="amd64") | .digest' artifacts/image-digests.json)"
          plat_arm64="$(jq -r '.manifest.manifests[] | select(.platform.architecture=="arm64") | .digest' artifacts/image-digests.json)"
          manifest_version="$(jq -er '.version | select(type == "number" and floor == . and . > 0)' artifacts/manifest.json)"

          jq -n \
            --arg schema "velnor.release-record/v1" \
            --arg repo 'tailrocks/velnor' \
            --arg tag "v${VERSION}" \
            --arg commit "$COMMIT" \
            --arg version "$VERSION" \
            --argjson mv "$manifest_version" \
            --arg mhash "$MANIFEST_SHA256" \
            --arg bin_amd64 "$bin_amd64" --arg deb_amd64 "$deb_amd64" --arg plat_amd64 "$plat_amd64" \
            --arg bin_arm64 "$bin_arm64" --arg deb_arm64 "$deb_arm64" --arg plat_arm64 "$plat_arm64" \
            --arg index "$INDEX_DIGEST" \
            --arg ref "${GHCR_IMAGE}@${INDEX_DIGEST}" \
            --arg source "$SOURCE_URL" \
            '{
              schema: $schema,
              build: { repository: $repo, tag: $tag, commit: $commit, crate_version: $version,
                       debian_version: $version, manifest_version: $mv, manifest_sha256: $mhash },
              architectures: [
                { arch: "amd64", target: "x86_64-unknown-linux-gnu", binary_sha256: $bin_amd64, deb_sha256: $deb_amd64, oci_platform_digest: $plat_amd64 },
                { arch: "arm64", target: "aarch64-unknown-linux-gnu", binary_sha256: $bin_arm64, deb_sha256: $deb_arm64, oci_platform_digest: $plat_arm64 }
              ],
              oci_index_digest: $index,
              oci_image_ref: $ref,
              oci_labels: { version: $version, revision: $commit, source: $source, manifest_sha256: $mhash },
              apt: { origin: "Velnor", suite: "stable", component: "main" }
            }' > record.candidate.json
      - name: Re-verify the record + emit canonical bytes + checksum
        run: |
          set -euo pipefail
          # Independent re-assembly + coherence check; writes canonical
          # release-record.json + release-record.json.sha256 (the digest lives in
          # the sidecar, never inside the record — acyclic).
          chmod +x artifacts/velnor-runner-release-tool
          artifacts/velnor-runner-release-tool release assemble \
            --record record.candidate.json \
            --artifacts artifacts \
            --out release-record.json
          cp release-record.json.sha256 SHA256SUMS.record
          # Publish the compiled manifest + its checksum too, so tailrocks/velnor-apt can
          # verify sha256(manifest.json) == record.build.manifest_sha256 and that
          # the manifest's embedded source_sha matches the record commit.
          cp artifacts/manifest.json manifest.json
          sha256sum manifest.json | awk '{print $1}' > manifest.json.sha256
      - name: Assemble independent checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          subjects=(artifacts/*.tar.gz artifacts/*.deb)
          test "${#subjects[@]}" -eq 4
          : > SHA256SUMS
          : > assets.jsonl
          for subject in "${subjects[@]}"; do
            name=$(basename "$subject")
            digest=$(sha256sum "$subject" | awk '{print $1}')
            sidecar="$(awk 'NF {print $1; exit}' "${subject}.sha256")"
            [[ "$digest" =~ ^[0-9a-f]{64}$ && "$sidecar" = "$digest" ]] \
              || { echo "::error::$name sidecar does not match its payload" >&2; exit 1; }
            printf '%s  %s\n' "$digest" "$name" >> SHA256SUMS
            jq -cn --arg name "$name" --arg sha256 "$digest" '{name:$name,sha256:$sha256}' >> assets.jsonl
          done
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq 4
          (cd artifacts && sha256sum --check --strict ../SHA256SUMS)
      - name: Assemble consumer release manifest
        run: |
          set -euo pipefail
          jq -S -n \
            --arg schema 'velnor.package-release.v1' \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg version "$VERSION" \
            --slurpfile assets assets.jsonl \
            '{schema:$schema,source_repository:$source_repository,source_ref:$source_ref,source_commit:$source_commit,version:$version,assets:$assets}' \
            > release-manifest.json
      - name: Stage package subjects for hosted signer
        run: |
          set -euo pipefail
          mkdir signer-input
          cp artifacts/velnor-runner-*.tar.gz artifacts/velnor-runner-*.deb signer-input/
      - name: Verify packaged runner identity before release creation
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            deb="artifacts/velnor-runner-${VERSION}-${arch}.deb"
            record_bin="$(jq -er --arg arch "$arch" '
              [.architectures[] | select(.arch == $arch)]
              | if length == 1 then .[0].binary_sha256 else error("record must contain exactly one architecture") end
            ' release-record.json)"
            case "$record_bin" in
              *[!0-9a-f]*|'') echo "::error::record has invalid runner binary sha256 ($arch)" >&2; exit 1 ;;
            esac
            [ "${#record_bin}" -eq 64 ] || { echo "::error::record has invalid runner binary sha256 ($arch)" >&2; exit 1; }
            packaged_binary_sha="$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - ./usr/bin/velnor-runner | sha256sum | awk '{print $1}')"
            [ "$packaged_binary_sha" = "$record_bin" ] || {
              echo "::error::packaged /usr/bin/velnor-runner digest != release record ($arch)" >&2
              exit 1
            }
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cleanup: false
      - name: Log in to GHCR for immutable image verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify OCI index stayed immutable before publication
        env:
          EXPECTED_INDEX_DIGEST: ${{ needs.image.outputs.index_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > published-image.json
          published_index="$(jq -er '.manifest.digest' published-image.json)"
          [ "$published_index" = "$EXPECTED_INDEX_DIGEST" ] || {
            echo "::error::OCI version tag moved from $EXPECTED_INDEX_DIGEST to $published_index before release publication" >&2
            exit 1
          }
      - name: Verify release tag stayed immutable before publication
        env:
          EXPECTED_TAG_REF: ${{ github.ref }}
          EXPECTED_TAG_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_tag_refs="$(git ls-remote --exit-code origin "$EXPECTED_TAG_REF" "$EXPECTED_TAG_REF^{}")"
          remote_tag_commit="$(printf '%s\n' "$remote_tag_refs" | awk -v expected="$EXPECTED_TAG_REF" '
            $2 == expected "^{}" { peeled=$1; found_peeled=1; next }
            $2 == expected && !found_peeled { raw=$1 }
            END {
              if (found_peeled) print peeled
              else if (raw != "") print raw
            }
          ')"
          case "$remote_tag_commit" in
            *[!0-9a-f]*|'') echo "::error::release tag $EXPECTED_TAG_REF did not resolve to lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#remote_tag_commit}" -eq 40 ] || { echo "::error::release tag $EXPECTED_TAG_REF did not resolve to one commit" >&2; exit 1; }
          [ "$remote_tag_commit" = "$EXPECTED_TAG_COMMIT" ] || {
            echo "::error::release tag $EXPECTED_TAG_REF moved from $EXPECTED_TAG_COMMIT to $remote_tag_commit" >&2
            exit 1
          }
      - name: Create release once — no clobber, record-verified idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Fail (never mint at main HEAD) if there is nothing to publish.
          [ -f release-record.json ] || { echo "::error::no assembled record" >&2; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            # Existing release: rebuilds are NOT bit-reproducible (tar/deb/OCI
            # payloads embed build metadata), so byte-equality against a fresh
            # build can never hold and re-runs would fail forever. Instead
            # verify the PUBLISHED release is coherent: its record names this
            # exact tag/commit/version/manifest and every published asset
            # matches the digests inside that record. Never clobber (N-immutable).
            tmp="$(mktemp -d)"
            for name in release-record.json \
                        release-record.json.sha256 \
                        release-manifest.json \
                        manifest.json \
                        manifest.json.sha256 \
                        SHA256SUMS \
                        "velnor-runner-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
                        "velnor-runner-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256" \
                        "velnor-runner-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" \
                        "velnor-runner-${VERSION}-aarch64-unknown-linux-gnu.tar.gz.sha256" \
                        "velnor-runner-${VERSION}-amd64.deb" \
                        "velnor-runner-${VERSION}-amd64.deb.sha256" \
                        "velnor-runner-${VERSION}-arm64.deb" \
                        "velnor-runner-${VERSION}-arm64.deb.sha256"; do
              gh release download "$tag" --pattern "$name" --dir "$tmp" --clobber >/dev/null 2>&1 \
                || { echo "::error::release $tag exists but is missing $name — refusing partial overwrite" >&2; exit 1; }
            done
            # Sidecar checksums must match their payloads.
            read_sha() {
              local path="$1" size token
              [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
              size="$(stat -c%s "$path")"
              [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
              token="$(awk '
                {
                  for (field = 1; field <= NF; field++) {
                    token_count++
                    if (token_count == 1) token = $field
                  }
                }
                END {
                  if (token_count != 1) exit 1
                  print token
                }
              ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
              [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
              case "$token" in
                *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
              esac
              printf '%s\n' "$token"
            }
            [ "$(read_sha "$tmp/release-record.json.sha256")" = "$(sha256sum "$tmp/release-record.json" | awk '{print $1}')" ] \
              || { echo "::error::published release-record.json fails its sidecar checksum" >&2; exit 1; }
            [ "$(read_sha "$tmp/manifest.json.sha256")" = "$(sha256sum "$tmp/manifest.json" | awk '{print $1}')" ] \
              || { echo "::error::published manifest.json fails its sidecar checksum" >&2; exit 1; }
            # The record must name this exact tag, source commit, crate version
            # and the manifest this source tree compiles to (the compiled
            # manifest is byte-reproducible; binaries are not).
            [ "$(jq -r '.build.tag' "$tmp/release-record.json")" = "$tag" ] \
              || { echo "::error::published record tag mismatch — refusing to touch $tag" >&2; exit 1; }
            [ "$(jq -r '.build.commit' "$tmp/release-record.json")" = "$COMMIT" ] \
              || { echo "::error::published record commit mismatch — tag may have moved" >&2; exit 1; }
            [ "$(jq -r '.build.crate_version' "$tmp/release-record.json")" = "$VERSION" ] \
              || { echo "::error::published record version mismatch" >&2; exit 1; }
            [ "$(jq -r '.build.manifest_sha256' "$tmp/release-record.json")" = "$(sha256sum "$tmp/manifest.json" | awk '{print $1}')" ] \
              || { echo "::error::published record/manifest incoherent" >&2; exit 1; }
            [ "$(jq -r '.build.manifest_sha256' "$tmp/release-record.json")" = "$MANIFEST_SHA256" ] \
              || { echo "::error::published record manifest != manifest compiled from $COMMIT" >&2; exit 1; }
            expected_oci_index="$(jq -er '.oci_index_digest' "$tmp/release-record.json")"
            [ "$expected_oci_index" = "$INDEX_DIGEST" ] \
              || { echo "::error::published record OCI index != current release image" >&2; exit 1; }
            [ "$(jq -r '.oci_image_ref' "$tmp/release-record.json")" = "${GHCR_IMAGE}@${expected_oci_index}" ] \
              || { echo "::error::published record OCI reference is not digest-pinned" >&2; exit 1; }
            # Every published package asset must match the record's digests.
            (cd "$tmp" && sha256sum --check --strict SHA256SUMS)
            for tuple in 'amd64 x86_64-unknown-linux-gnu' 'arm64 aarch64-unknown-linux-gnu'; do
              read -r arch target <<<"$tuple"
              tarball="velnor-runner-${VERSION}-${target}.tar.gz"
              deb="velnor-runner-${VERSION}-${arch}.deb"
              record_deb="$(jq -r --arg arch "$arch" '.architectures[] | select(.arch == $arch) | .deb_sha256' "$tmp/release-record.json")"
              record_bin="$(jq -r --arg arch "$arch" '.architectures[] | select(.arch == $arch) | .binary_sha256' "$tmp/release-record.json")"
              [ "$(read_sha "$tmp/${tarball}.sha256")" = "$(sha256sum "$tmp/$tarball" | awk '{print $1}')" ] \
                || { echo "::error::published tarball fails its sidecar checksum ($arch)" >&2; exit 1; }
              [ "$(read_sha "$tmp/${deb}.sha256")" = "$(sha256sum "$tmp/$deb" | awk '{print $1}')" ] \
                || { echo "::error::published deb fails its sidecar checksum ($arch)" >&2; exit 1; }
              [ "$(sha256sum "$tmp/$deb" | awk '{print $1}')" = "$record_deb" ] \
                || { echo "::error::published deb digest != record ($arch)" >&2; exit 1; }
              mkdir -p "$tmp/extract-$arch"
              tar -xzf "$tmp/$tarball" -C "$tmp/extract-$arch"
              [ "$(sha256sum "$tmp/extract-$arch/velnor-runner" | awk '{print $1}')" = "$record_bin" ] \
                || { echo "::error::published binary digest != record ($arch)" >&2; exit 1; }
            done
            # Already-published path verifies only and uploads nothing:
            # attestation stays in the build/sign jobs over the fresh-build
            # subjects staged above, never post-publish here.
            echo "Release $tag already published; record + assets verified coherent. Nothing to upload."
          else
            gh release create "$tag" --verify-tag --target "$COMMIT" --title "$tag" --generate-notes \
              release-record.json \
              release-record.json.sha256 \
              manifest.json \
              manifest.json.sha256 \
              release-manifest.json \
              SHA256SUMS \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz.sha256 \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz.sha256 \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-amd64.deb \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-amd64.deb.sha256 \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-arm64.deb \
              artifacts/velnor-runner-${{ needs.verify.outputs.version }}-arm64.deb.sha256
          fi
          # NOTE (N6): this workflow deliberately does NOT push to tailrocks/velnor-apt or
          # dispatch its publish. tailrocks/velnor-apt pulls this record itself
          # and verifies it before reprepro. No APT credential exists here.
      - name: Upload package subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-subjects
          path: signer-input
          if-no-files-found: error
          retention-days: 2

# Release tags are cut from the protected main branch.

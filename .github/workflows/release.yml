        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@0fa68740830638a3e16437400ff3fc1729f31fcd
        with:
          rev: 0fa68740830638a3e16437400ff3fc1729f31fcd
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=0fa68740830638a3e16437400ff3fc1729f31fcd" >> "$GITHUB_ENV"
      - name: Enforce workflow policy

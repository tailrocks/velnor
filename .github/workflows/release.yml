            ~/.cargo/git
          key: ci-release-${{ runner.os }}-rust-policy-${{ hashFiles('.cargo/**', 'Cargo.lock', 'deny.toml') }}
      - name: Run "Rust dependency policy" checks
        env:
          CI_SCOPE: full
          CI_UNIT_ID: rust-policy
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"

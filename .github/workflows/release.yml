  image:
    if: ${{ always() && needs.admit-runner.result == 'success' && needs.verify.result == 'success' && needs.metadata.result == 'success' && needs.image-admission.result == 'success' && (needs.image-platform.result == 'success' || needs.image-platform.result == 'skipped') && github.event_name != 'workflow_dispatch' }}
    needs: [admit-runner, verify, metadata, image-platform, image-admission]
    name: Assemble one multi-platform GHCR image
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.push.outputs.index_digest }}
      manifest_sha256: ${{ needs.metadata.outputs.manifest_sha256 }}
    env:
      GHCR_IMAGE: "ghcr.io/tailrocks/velnor-job-ubuntu"
      SOURCE_URL: https://github.com/tailrocks/velnor
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Download platform digests
        if: ${{ needs.image-admission.outputs.existing != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-platform-*
          path: image-artifacts
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cleanup: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and inspect immutable image index
        id: push
        env:
          AMD64_DIGEST_FILE: image-artifacts/image-amd64.digest
          ARM64_DIGEST_FILE: image-artifacts/image-arm64.digest
          IMAGE_ALREADY_EXISTS: ${{ needs.image-admission.outputs.existing }}
          EXPECTED_EXISTING_INDEX_DIGEST: ${{ needs.image-admission.outputs.index_digest }}
        run: |
          set -euo pipefail
          if [ "$IMAGE_ALREADY_EXISTS" = true ]; then
            docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
            index_digest="$(jq -er '.manifest.digest' image-digests.json)"
            [ "$index_digest" = "$EXPECTED_EXISTING_INDEX_DIGEST" ] || {
              echo "::error::version tag moved from $EXPECTED_EXISTING_INDEX_DIGEST to $index_digest during admission" >&2
              exit 1
            }
          else
            for path in "$AMD64_DIGEST_FILE" "$ARM64_DIGEST_FILE"; do
              test -s "$path"
              digest="$(tr -d '[:space:]' < "$path")"
              case "$digest" in
                sha256:[0-9a-fA-F]*) ;;
                *) echo "::error::invalid platform digest in $path" >&2; exit 1 ;;
              esac
            done
            amd64_digest="$(tr -d '[:space:]' < "$AMD64_DIGEST_FILE")"
            arm64_digest="$(tr -d '[:space:]' < "$ARM64_DIGEST_FILE")"
            docker buildx imagetools create \
              --tag "${GHCR_IMAGE}:${VERSION}" \
              "${GHCR_IMAGE}:release-${COMMIT}-amd64" \
              "${GHCR_IMAGE}:release-${COMMIT}-arm64"
            docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
            jq -e --arg amd "$amd64_digest" --arg arm "$arm64_digest" '
              any(.manifest.manifests[]; .digest == $amd and .platform.architecture == "amd64") and
              any(.manifest.manifests[]; .digest == $arm and .platform.architecture == "arm64")
            ' image-digests.json >/dev/null || {
              echo "::error::version tag does not reference both newly built platform digests" >&2
              exit 1
            }
            [ "$(jq -r '[.manifest.manifests[] | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")] | length' image-digests.json)" = "2" ] || {
              echo "::error::version tag carries an unexpected platform set" >&2
              exit 1
            }
          fi
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
          index_digest="$(jq -er '.manifest.digest' image-digests.json)"
          case "$index_digest" in
            sha256:[0-9a-fA-F]*) ;;
            *) echo "::error::manifest inspection did not return an index digest" >&2; exit 1 ;;
          esac
          printf 'index_digest=%s\n' "$index_digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$index_digest" > image-index.digest
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests
          path: |
            image-digests.json
            image-index.digest
          if-no-files-found: error
          retention-days: 2


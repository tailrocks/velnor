name: Release

# Plan 010 — the SOLE release coordinator for tailrocks/velnor.
#
# release-deb.yml is deleted; its deb sanity guards (binary present, canonical
# Dockerfile present, size > 1MB, arch/version match — the "empty-deb incident"
# guard) are folded in below. One tagged commit produces one coherent, acyclic
# release record binding: source SHA -> crate version -> per-arch binary/deb
# GitHub is the only admitted release lane until Velnor proves the isolated
# user-namespace capability required by the guest-image build. Explicit Velnor
# requests fail closed; they never silently substitute GitHub.
# digests -> OCI image digest -> compiled-manifest hash -> APT coordinate.
#
# This workflow holds NO APT credential and performs NO consumer write/dispatch
# (N6): tailrocks/velnor-apt pulls the published record itself and verifies it
# before reprepro. Assets are never clobbered — an existing tag/asset is a
# success only on an exact digest match, otherwise the run fails.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      lanes:
        description: github (the only admitted release lane)
        type: choice
        default: github
        options: [github]
      tag:
        description: Existing release tag to (re)build coherently (e.g. v0.1.121).
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/tailrocks/velnor-job-ubuntu
  SOURCE_URL: https://github.com/tailrocks/velnor

jobs:
  lane-admission:
    name: Resolve release lanes
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VELNOR_IMPLEMENTATION_REQUIREMENT: "guest-image-build.user-namespace"
      VELNOR_MISSING_CAPABILITY: "unprivileged user namespaces or CAP_SYS_ADMIN"
    outputs:
      lanes: ${{ steps.route.outputs.lanes }}
    steps:
      - name: Validate requested lanes and required capabilities
        id: route
        env:
          REQUESTED_LANES: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || vars.VELNOR_AUTOMATIC_LANES || 'github' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_LANES" in
            github)
              echo "lanes=github" >> "$GITHUB_OUTPUT"
              ;;
            velnor|both)
              echo "::error::release lane '$REQUESTED_LANES' fails capability check '$VELNOR_MISSING_CAPABILITY'; Velnor implementation requirement '$VELNOR_IMPLEMENTATION_REQUIREMENT' remains open; refusing GitHub substitution" >&2
              exit 1
              ;;
            *)
              echo "::error::invalid release lane '$REQUESTED_LANES'; expected github" >&2
              exit 1
              ;;
          esac

  identity:
    needs: lane-admission
    name: Resolve + gate release identity
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    outputs:
      lane: ${{ needs.lane-admission.outputs.lanes }}
      version: ${{ steps.gate.outputs.version }}
      tag_ref: ${{ steps.gate.outputs.tag_ref }}
      # Downstream provenance is bound to the exact default-branch snapshot
      # accepted below, not to an independently re-resolved tag ref.
      commit: ${{ steps.gate.outputs.default_branch_commit }}
      default_branch_commit: ${{ steps.gate.outputs.default_branch_commit }}
      tag_commit: ${{ steps.gate.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Fetch the requested ref first plus tags. This remains compatible with
          # runners predating the full-history FETCH_HEAD ordering fix.
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Peel the tag to one commit and reject drift
        id: gate
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag $TAG must match v[0-9]*" >&2; exit 1 ;;
          esac
          tag_ref="refs/tags/$TAG"
          git show-ref --verify --quiet "$tag_ref" || {
            echo "::error::tag ref $tag_ref does not exist" >&2
            exit 1
          }
          version="${TAG#v}"
          case "$version" in
            ''|.|..|*\\*|*[![:print:]])
              echo "::error::release version is not a safe artifact path component" >&2
              exit 1
              ;;
          esac

          # Peel annotated OR lightweight tags to exactly one commit object.
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          case "$tag_commit" in
            *[!0-9a-f]*|'') echo "::error::tag $TAG did not peel to lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#tag_commit}" -eq 40 ] || { echo "::error::tag $TAG did not peel to a 40-hex commit" >&2; exit 1; }

          # Older native checkout adapters fetch the requested tag but may leave
          # workflow_dispatch on the caller SHA. Move to the already-resolved
          # immutable commit before validating the checkout identity.
          git checkout --detach "$tag_commit"

          # The checkout must sit exactly on that commit (non-HEAD checkout is a
          # coherence failure).
          head="$(git rev-parse HEAD)"
          [ "$head" = "$tag_commit" ] || { echo "::error::HEAD $head != tag commit $tag_commit" >&2; exit 1; }

          # A release tag is valid only when it names the current default-branch
          # tip. This closes the human tag/version race before any build,
          # artifact upload, image push, or publication job can start.
          remote_default_branch="$(git ls-remote --exit-code --heads origin "refs/heads/$DEFAULT_BRANCH")"
          default_branch_commit="$(printf '%s\n' "$remote_default_branch" | awk 'NF == 2 { print $1 }')"
          case "$default_branch_commit" in
            *[!0-9a-f]*|'') echo "::error::could not resolve current default branch $DEFAULT_BRANCH to one lowercase-hex commit" >&2; exit 1 ;;
          esac
          [ "${#default_branch_commit}" -eq 40 ] || { echo "::error::default branch $DEFAULT_BRANCH did not resolve to a 40-hex commit" >&2; exit 1; }
          [ "$default_branch_commit" = "$tag_commit" ] || {
            echo "::error::tag $TAG resolves to $tag_commit, but default branch $DEFAULT_BRANCH is $default_branch_commit; release tags must point at the current default-branch tip" >&2
            exit 1
          }

          # Exactly one v* tag may point at this commit (reused/ambiguous lineage
          # fails closed).
          tags_here="$(git tag --points-at "$tag_commit" | grep -c '^v' || true)"
          [ "$tags_here" = "1" ] || { echo "::error::expected exactly one v* tag at $tag_commit, found $tags_here" >&2; exit 1; }

          # Clean tree.
          [ -z "$(git status --porcelain)" ] || { echo "::error::dirty tree" >&2; exit 1; }

          # tag == crate version == Cargo.lock (the build.rs gate re-checks this,
          # but fail fast here with a readable message).
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/velnor-runner/Cargo.toml | head -n1)"
          [ "$crate" = "$version" ] || { echo "::error::crate version $crate != tag version $version — bump crate + Cargo.lock before tagging" >&2; exit 1; }

          {
            echo "version=$version"
            echo "tag_ref=$tag_ref"
            echo "tag_commit=$tag_commit"
            echo "default_branch_commit=$default_branch_commit"
          } >> "$GITHUB_OUTPUT"

  # This is the final pre-publication default-branch read. All downstream jobs
  # consume its immutable output; later default-branch movement cannot change
  # the already-bound source snapshot or provenance.
  release_gate:
    needs: identity
    name: Final pre-publication default-branch gate
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      default_branch_commit: ${{ steps.gate.outputs.default_branch_commit }}
      tag_ref: ${{ steps.gate.outputs.tag_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-read default branch and fail closed on movement
        id: gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_DEFAULT_BRANCH_COMMIT: ${{ needs.identity.outputs.default_branch_commit }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.identity.outputs.tag_commit }}
          EXPECTED_TAG_REF: ${{ needs.identity.outputs.tag_ref }}
        run: |
          set -euo pipefail
          if ! remote_tag_refs="$(git ls-remote --exit-code origin 'refs/tags/v*')"; then
            echo "::error::could not resolve remote v* tags" >&2
            exit 1
          fi
          remote_tag_commit="$(printf '%s\n' "$remote_tag_refs" | awk -v expected="$EXPECTED_TAG_REF" '
            $2 == expected "^{}" { peeled=$1; found_peeled=1; next }
            $2 == expected && !found_peeled { raw=$1 }
            END {
              if (found_peeled) print peeled
              else if (raw != "") print raw
            }
          ')"
          case "$remote_tag_commit" in
            *[!0-9a-f]*|'') echo "::error::remote tag $EXPECTED_TAG_REF did not resolve to lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#remote_tag_commit}" -eq 40 ] || { echo "::error::remote tag $EXPECTED_TAG_REF did not resolve to a 40-hex commit" >&2; exit 1; }
          [ "$remote_tag_commit" = "$EXPECTED_TAG_COMMIT" ] || {
            echo "::error::remote tag $EXPECTED_TAG_REF moved to $remote_tag_commit; expected $EXPECTED_TAG_COMMIT" >&2
            exit 1
          }
          tags_here="$(printf '%s\n' "$remote_tag_refs" | awk -v target="$remote_tag_commit" '
            {
              ref=$2
              if (ref ~ /\^\{\}$/) {
                sub(/\^\{\}$/, "", ref)
                peeled[ref]=$1
              } else {
                raw[ref]=$1
              }
              seen[ref]=1
            }
            END {
              count=0
              for (ref in seen) {
                if (ref ~ /^refs\/tags\/v[0-9]/) {
                  commit=(ref in peeled) ? peeled[ref] : raw[ref]
                  if (commit == target) count++
                }
              }
              print count
            }
          ')"
          [ "$tags_here" = "1" ] || { echo "::error::expected exactly one v[0-9]* tag at $remote_tag_commit, found $tags_here" >&2; exit 1; }

          remote_default_branch="$(git ls-remote --exit-code --heads origin "refs/heads/$DEFAULT_BRANCH")"
          default_branch_commit="$(printf '%s\n' "$remote_default_branch" | awk 'NF == 2 { print $1 }')"
          case "$default_branch_commit" in
            *[!0-9a-f]*|'') echo "::error::could not resolve current default branch $DEFAULT_BRANCH to one lowercase-hex commit" >&2; exit 1 ;;
          esac
          [ "${#default_branch_commit}" -eq 40 ] || { echo "::error::default branch $DEFAULT_BRANCH did not resolve to a 40-hex commit" >&2; exit 1; }
          [ "$default_branch_commit" = "$EXPECTED_DEFAULT_BRANCH_COMMIT" ] || {
            echo "::error::default branch $DEFAULT_BRANCH moved from $EXPECTED_DEFAULT_BRANCH_COMMIT to $default_branch_commit after identity; refusing release work" >&2
            exit 1
          }
          [ "$default_branch_commit" = "$EXPECTED_RELEASE_COMMIT" ] || {
            echo "::error::release provenance commit $EXPECTED_RELEASE_COMMIT is not the default-branch snapshot $default_branch_commit" >&2
            exit 1
          }
          [ "$default_branch_commit" = "$EXPECTED_TAG_COMMIT" ] || {
            echo "::error::tag commit $EXPECTED_TAG_COMMIT is not the default-branch snapshot $default_branch_commit" >&2
            exit 1
          }
          echo "default_branch_commit=$default_branch_commit" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$EXPECTED_TAG_REF" >> "$GITHUB_OUTPUT"

  metadata:
    needs: [identity, release_gate]
    name: Compile release metadata once
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      CACHE_LANE: ${{ needs.identity.outputs.lane == 'github' && 'GitHub' || 'Velnor' }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      VELNOR_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Export metadata from one release-build binary
        id: export
        run: |
          set -euo pipefail
          cargo build -q -p velnor-runner --release --locked --features release-build
          runner=target/release/velnor-runner
          "$runner" release export > build-identity.json
          "$runner" capabilities export > manifest.json
          sha256="$(sha256sum manifest.json | awk '{print $1}')"
          echo "manifest_sha256=$sha256" >> "$GITHUB_OUTPUT"
          cp "$runner" velnor-release-tool

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: |
            build-identity.json
            manifest.json
            velnor-release-tool

  image:
    needs: [identity, release_gate, metadata]
    name: Build + push one multi-platform GHCR image
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.push.outputs.digest }}
      manifest_sha256: ${{ needs.metadata.outputs.manifest_sha256 }}
    env:
      CACHE_LANE: ${{ needs.identity.outputs.lane == 'github' && 'GitHub' || 'Velnor' }}
      VERSION: ${{ needs.identity.outputs.version }}
      COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cleanup: false
          keep-state: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (immutable digest captured)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/job-ubuntu.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # GHCR is the durable cross-release cache. Keep the GitHub cache as
          # a best-effort compatibility secondary until Velnor owns CacheService.
          cache-from: |
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
            type=gha,scope=velnor-job-ubuntu
          cache-to: |
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
            type=gha,scope=velnor-job-ubuntu,mode=max,ignore-error=true
          secrets: |
            mise_github_token=${{ github.token }}
          build-args: |
            VELNOR_IMAGE_VERSION=${{ needs.identity.outputs.version }}
          tags: ${{ env.GHCR_IMAGE }}:${{ needs.identity.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.identity.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release_gate.outputs.default_branch_commit }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.velnor.manifest-sha256=${{ needs.metadata.outputs.manifest_sha256 }}

      - name: Capture per-platform digests
        env:
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Record the index digest and each platform digest as an artifact the
          # record-assembly job consumes.
          docker buildx imagetools inspect "${GHCR_IMAGE}@${INDEX_DIGEST}" --format '{{json .}}' > image-digests.json
          echo "$INDEX_DIGEST" > image-index.digest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digests
          path: |
            image-digests.json
            image-index.digest
            manifest.json

  guest-image:
    needs: [identity, release_gate]
    name: Guest kernel/rootfs ${{ matrix.arch }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb: amd64
          - arch: aarch64
            deb: arm64
    # lane-admission permits this GitHub-hosted implementation only for the
    # explicit github lane. Velnor/both fail before release side effects until
    # Velnor provides the required isolated user-namespace capability.
    runs-on: ubuntu-24.04
    env:
      CACHE_LANE: GitHub
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Install kernel and rootfs build packages
        run: |
          set -euo pipefail
          # velnor-sudo-exception: GitHub-hosted release build installs required OS packages.
          sudo apt-get update
          # velnor-sudo-exception: GitHub-hosted release build installs required OS packages.
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libelf-dev xz-utils e2fsprogs \
            mmdebstrap debootstrap qemu-user-binfmt binfmt-support \
            gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu

      - name: Download pinned kernel tarball
        run: |
          set -euo pipefail
          url="$(jq -er '.kernel_tarball' microvm/pins.json)"
          sha="$(jq -er '.kernel_tarball_sha256' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 \
            --connect-timeout 30 --max-time 900 \
            -o linux.tar.xz "$url"
          echo "$sha  linux.tar.xz" | sha256sum -c -

      - name: Build guest agent for rootfs
        run: |
          set -euo pipefail
          cargo build -p velnor-runner --bin velnor-guest-agent --locked --release
          test -x target/release/velnor-guest-agent

      - name: Build guest vmlinux and rootfs.ext4
        run: |
          set -euo pipefail
          mkdir -p dist/microvm
          cargo run -p velnor-runner --bin velnor-guest-image --locked -- \
            build --arch "${{ matrix.arch }}" --out dist/microvm --tarball linux.tar.xz \
            --guest-agent target/release/velnor-guest-agent
          test -s dist/microvm/vmlinux
          test -s dist/microvm/rootfs.ext4
          test -s target/release/velnor-guest-agent
          test -x target/release/velnor-guest-agent
          # shellcheck disable=SC2209
          stat_output="$(DEBUGFS_PAGER=cat debugfs -R 'stat /usr/bin/velnor-guest-agent' dist/microvm/rootfs.ext4 2>&1)"
          printf '%s\n' "$stat_output" | grep -Eq 'Type: regular[[:space:]]+Mode:[[:space:]]+0755([[:space:]]|$)' \
            || { echo "::error::rootfs guest agent must be a regular file with mode 0755" >&2; exit 1; }
          agent_dump="$(mktemp)"
          trap 'rm -f -- "$agent_dump"' EXIT
          # shellcheck disable=SC2209
          DEBUGFS_PAGER=cat debugfs -R "dump /usr/bin/velnor-guest-agent $agent_dump" dist/microvm/rootfs.ext4 >/dev/null
          cmp -- "$agent_dump" target/release/velnor-guest-agent
          sha256sum dist/microvm/rootfs.ext4 | awk '{print $1}' > dist/microvm/rootfs.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guest-image-${{ matrix.arch }}
          path: |
            dist/microvm/vmlinux
            dist/microvm/rootfs.ext4
            dist/microvm/rootfs.sha256

  build:
    needs: [identity, release_gate, metadata, guest-image]
    name: Build ${{ matrix.arch }} binary + deb (release-build)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      VELNOR_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust zig cargo-binstall cargo:cargo-zigbuild"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-deb (verified prebuilt only)
        env:
          # cargo-binstall performs GitHub API discovery independently of mise.
          # Authenticate parallel release jobs so they do not share the tiny
          # anonymous rate limit and fail nondeterministically with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mise exec cargo-binstall -- cargo binstall cargo-deb@3.7.0 \
            --disable-strategies compile --no-confirm --force
          cargo-deb --version

      - name: Build release binaries (identity + every deb asset)
        run: |
          set -euo pipefail
          # release-build is a feature of velnor-runner and velnorctl only.
          # The deb also ships velnor-tools and velnor-workflow, so build those
          # packages explicitly without inventing a feature they do not own.
          cargo zigbuild -p velnor-runner \
            --bin velnor-runner --bin velnor-guest-agent \
            --release --locked --features release-build --target "${{ matrix.target }}"
          cargo zigbuild -p velnorctl \
            --release --locked --features release-build --target "${{ matrix.target }}"
          cargo zigbuild -p velnor-tools \
            --release --locked --target "${{ matrix.target }}"
          cargo zigbuild -p velnor-workflow \
            --release --locked --target "${{ matrix.target }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: release-metadata

      - name: Package tar + independent hash
        run: |
          set -euo pipefail
          # Artifact NAMES keep the velnor-runner prefix until the Plan 079
          # package rename (downstream apt verify + evidence reference them);
          # the bound BINARY is the shipped product: /usr/bin/velnorctl.
          archive="velnor-runner-${VERSION}-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" velnor-runner
          sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
          # Independent digest of the raw binary (the record's per-arch binary id).
          sha256sum "target/${{ matrix.target }}/release/velnor-runner" | awk '{print $1}' > "velnor-runner-${{ matrix.arch }}.bin.sha256"

      - name: Stage acyclic identity files packaged into the deb
        run: |
          set -euo pipefail
          # These depend only on the source (not on the deb digest), so shipping
          # them inside the deb is acyclic. postinst validates the installed
          # binary against them offline.
          mkdir -p crates/velnor-runner/release
          cp release-metadata/build-identity.json crates/velnor-runner/release/build-identity.json
          cp release-metadata/manifest.json crates/velnor-runner/release/manifest.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: guest-image-${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
          path: guest-image

      - name: Stage pinned Firecracker, jailer, and guest agent
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$DEB_ARCH" in
            amd64) pin_arch=x86_64 ;;
            arm64) pin_arch=aarch64 ;;
            *) echo "::error::unsupported arch $DEB_ARCH" >&2; exit 1 ;;
          esac
          url="$(jq -er --arg a "$pin_arch" '.tarballs[$a].url' microvm/pins.json)"
          sha="$(jq -er --arg a "$pin_arch" '.tarballs[$a].sha256' microvm/pins.json)"
          fc_member="$(jq -er --arg a "$pin_arch" '.tarballs[$a].firecracker_member' microvm/pins.json)"
          jailer_member="$(jq -er --arg a "$pin_arch" '.tarballs[$a].jailer_member' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 \
            --connect-timeout 30 --max-time 900 \
            -o firecracker.tgz "$url"
          echo "$sha  firecracker.tgz" | sha256sum -c -
          mkdir -p extracted crates/velnor-runner/release/microvm
          tar -xzf firecracker.tgz -C extracted
          cp "extracted/${fc_member}" crates/velnor-runner/release/microvm/firecracker
          cp "extracted/${jailer_member}" crates/velnor-runner/release/microvm/jailer
          cp "target/${TARGET}/release/velnor-guest-agent" crates/velnor-runner/release/microvm/velnor-guest-agent
          test -s guest-image/vmlinux || { echo "::error::guest-image missing vmlinux" >&2; exit 1; }
          test -s guest-image/rootfs.ext4 || { echo "::error::guest-image missing rootfs.ext4" >&2; exit 1; }
          test -s guest-image/rootfs.sha256 || { echo "::error::guest-image missing rootfs.sha256" >&2; exit 1; }
          rootfs_sha256="$(awk '{print $1}' guest-image/rootfs.sha256)"
          [ "${#rootfs_sha256}" -eq 64 ] || { echo "::error::guest rootfs digest has invalid length" >&2; exit 1; }
          actual_rootfs_sha256="$(sha256sum guest-image/rootfs.ext4 | awk '{print $1}')"
          [ "$actual_rootfs_sha256" = "$rootfs_sha256" ] || { echo "::error::downloaded guest rootfs digest mismatch" >&2; exit 1; }
          guest_agent_sha256="$(sha256sum crates/velnor-runner/release/microvm/velnor-guest-agent | awk '{print $1}')"
          cp guest-image/vmlinux crates/velnor-runner/release/microvm/vmlinux
          cp guest-image/rootfs.ext4 crates/velnor-runner/release/microvm/rootfs.ext4
          chmod 0755 \
            crates/velnor-runner/release/microvm/firecracker \
            crates/velnor-runner/release/microvm/jailer \
            crates/velnor-runner/release/microvm/velnor-guest-agent
          fc_sha="$(sha256sum crates/velnor-runner/release/microvm/firecracker | awk '{print $1}')"
          jailer_sha="$(sha256sum crates/velnor-runner/release/microvm/jailer | awk '{print $1}')"
          expected_fc="$(jq -er --arg a "$pin_arch" '.tarballs[$a].firecracker_sha256' microvm/pins.json)"
          expected_jailer="$(jq -er --arg a "$pin_arch" '.tarballs[$a].jailer_sha256' microvm/pins.json)"
          [ "$fc_sha" = "$expected_fc" ] || { echo "::error::firecracker sha $fc_sha != pin $expected_fc" >&2; exit 1; }
          [ "$jailer_sha" = "$expected_jailer" ] || { echo "::error::jailer sha $jailer_sha != pin $expected_jailer" >&2; exit 1; }
          cargo run -p velnor-runner --bin velnor-guest-image --locked -- \
            stage --root crates/velnor-runner/release/microvm --arch "$pin_arch" \
            --rootfs-sha256 "$rootfs_sha256" \
            --guest-agent-sha256 "$guest_agent_sha256"
          kernel="$(jq -er '.kernel' crates/velnor-runner/release/microvm/manifest.json)"
          rootfs="$(jq -er '.rootfs' crates/velnor-runner/release/microvm/manifest.json)"
          case "$kernel$rootfs" in
            *UNSET*) echo "::error::staged kernel/rootfs checksum is still UNSET" >&2; exit 1 ;;
          esac
          [ "${#kernel}" -eq 64 ] || { echo "::error::kernel sha256 length ${#kernel}" >&2; exit 1; }
          [ "${#rootfs}" -eq 64 ] || { echo "::error::rootfs sha256 length ${#rootfs}" >&2; exit 1; }

      - name: Build .deb (version pinned to the tag)
        run: |
          set -euo pipefail
          cargo deb -p velnor-runner --target ${{ matrix.target }} --no-build --no-strip --deb-version "$VERSION"

      - name: Stage .deb with the empty-deb-incident guards
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=("target/${{ matrix.target }}/debian/velnor-runner_${VERSION}_"*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected exactly one ${VERSION} deb, found ${#debs[@]}" >&2; exit 1; }
          src="${debs[0]}"
          case "${{ matrix.arch }}" in
            amd64) expected_arch=amd64 ;;
            arm64) expected_arch=arm64 ;;
            *) echo "::error::unsupported arch" >&2; exit 1 ;;
          esac
          [ "$(dpkg-deb -f "$src" Version)" = "$VERSION" ] || { echo "::error::deb version != tag" >&2; exit 1; }
          [ "$(dpkg-deb -f "$src" Architecture)" = "$expected_arch" ] || { echo "::error::deb arch != $expected_arch" >&2; exit 1; }
          manifest="$(mktemp)"
          dpkg-deb -c "$src" > "$manifest"
          awk '$NF == "./usr/bin/velnor-runner" { count++; if (substr($1, 1, 1) != "-") type_ok=0; else if (count == 1) type_ok=1 } END { exit !(count == 1 && type_ok == 1) }' "$manifest" \
            || { echo "::error::deb must contain exactly one regular usr/bin/velnor-runner" >&2; exit 1; }
          grep -q "usr/bin/velnor-runner" "$manifest" || { echo "::error::deb missing usr/bin/velnor-runner" >&2; exit 1; }
          grep -q "usr/bin/velnorctl" "$manifest" || { echo "::error::deb missing usr/bin/velnorctl" >&2; exit 1; }
          grep -q "usr/bin/velnor-tools" "$manifest" || { echo "::error::deb missing usr/bin/velnor-tools" >&2; exit 1; }
          grep -q "usr/bin/velnor-guest-agent" "$manifest" || { echo "::error::deb missing usr/bin/velnor-guest-agent" >&2; exit 1; }
          grep -q "lib/systemd/system/velnor-fleet-policy-audit.service" "$manifest" || { echo "::error::deb missing fleet-policy audit service" >&2; exit 1; }
          grep -q "lib/systemd/system/velnor-fleet-policy-audit.timer" "$manifest" || { echo "::error::deb missing fleet-policy audit timer" >&2; exit 1; }
          grep -q "usr/share/velnor/fleet/release-refs.toml" "$manifest" || { echo "::error::deb missing authoritative fleet release-ref ledger" >&2; exit 1; }
          grep -q "usr/lib/tmpfiles.d/velnor-runner.conf" "$manifest" || { echo "::error::deb missing tmpfiles.d transaction-lock path entry" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/firecracker" "$manifest" || { echo "::error::deb missing firecracker" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/jailer" "$manifest" || { echo "::error::deb missing jailer" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/velnor-guest-agent" "$manifest" || { echo "::error::deb missing packaged guest-agent" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/vmlinux" "$manifest" || { echo "::error::deb missing guest kernel" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/rootfs.ext4" "$manifest" || { echo "::error::deb missing guest rootfs" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/manifest.json" "$manifest" || { echo "::error::deb missing microvm manifest" >&2; exit 1; }
          grep -q "usr/share/velnor/job-ubuntu.Dockerfile" "$manifest" || { echo "::error::deb missing canonical Dockerfile" >&2; exit 1; }
          [ "$(stat -c%s "$src")" -gt 1000000 ] || { echo "::error::deb suspiciously small: $(stat -c%s "$src") bytes" >&2; exit 1; }
          build_binary="target/${{ matrix.target }}/release/velnor-runner"
          read_sha() {
            local path="$1" size token
            [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
            size="$(stat -c%s "$path")"
            [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
            token="$(awk '
              {
                for (field = 1; field <= NF; field++) {
                  token_count++
                  if (token_count == 1) token = $field
                }
              }
              END {
                if (token_count != 1) exit 1
                print token
              }
            ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
            [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
            case "$token" in
              *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
            esac
            printf '%s\n' "$token"
          }
          recorded_binary_sha="$(read_sha "velnor-runner-${{ matrix.arch }}.bin.sha256")"
          build_binary_sha="$(sha256sum "$build_binary" | awk '{print $1}')"
          [ "$build_binary_sha" = "$recorded_binary_sha" ] || { echo "::error::runner binary sidecar does not match target build" >&2; exit 1; }
          packaged_binary_sha="$(dpkg-deb --fsys-tarfile "$src" | tar -xOf - ./usr/bin/velnor-runner | sha256sum | awk '{print $1}')"
          [ "$packaged_binary_sha" = "$build_binary_sha" ] || { echo "::error::deb runner binary does not match target build" >&2; exit 1; }
          [ "$packaged_binary_sha" = "$recorded_binary_sha" ] || { echo "::error::deb runner binary does not match recorded binary sha256" >&2; exit 1; }
          dst="velnor-runner-${VERSION}-${{ matrix.arch }}.deb"
          cp "$src" "$dst"
          sha256sum "$dst" | awk '{print $1}' > "$dst.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            velnor-runner-*.tar.gz
            velnor-runner-*.tar.gz.sha256
            velnor-runner-*.deb
            velnor-runner-*.deb.sha256
            velnor-runner-*.bin.sha256

  release:
    needs: [identity, release_gate, metadata, image, build]
    name: Assemble, verify + publish one coherent release
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
      INDEX_DIGEST: ${{ needs.image.outputs.index_digest }}
      MANIFEST_SHA256: ${{ needs.image.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble the release record from downloaded artifacts
        run: |
          set -euo pipefail
          read_sha() {
            local path="artifacts/$1" size token
            [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
            size="$(stat -c%s "$path")"
            [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
            token="$(awk '
              {
                for (field = 1; field <= NF; field++) {
                  token_count++
                  if (token_count == 1) token = $field
                }
              }
              END {
                if (token_count != 1) exit 1
                print token
              }
            ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
            [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
            case "$token" in
              *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
            esac
            printf '%s\n' "$token"
          }
          bin_amd64="$(read_sha "velnor-runner-amd64.bin.sha256")"
          bin_arm64="$(read_sha "velnor-runner-arm64.bin.sha256")"
          deb_amd64="$(read_sha "velnor-runner-${VERSION}-amd64.deb.sha256")"
          deb_arm64="$(read_sha "velnor-runner-${VERSION}-arm64.deb.sha256")"
          # Per-platform OCI digests from the image job.
          plat_amd64="$(jq -r '.manifest.manifests[] | select(.platform.architecture=="amd64") | .digest' artifacts/image-digests.json)"
          plat_arm64="$(jq -r '.manifest.manifests[] | select(.platform.architecture=="arm64") | .digest' artifacts/image-digests.json)"
          manifest_version="$(jq -er '.version | select(type == "number" and floor == . and . > 0)' artifacts/manifest.json)"

          jq -n \
            --arg schema "velnor.release-record/v1" \
            --arg repo "tailrocks/velnor" \
            --arg tag "v${VERSION}" \
            --arg commit "$COMMIT" \
            --arg version "$VERSION" \
            --argjson mv "$manifest_version" \
            --arg mhash "$MANIFEST_SHA256" \
            --arg bin_amd64 "$bin_amd64" --arg deb_amd64 "$deb_amd64" --arg plat_amd64 "$plat_amd64" \
            --arg bin_arm64 "$bin_arm64" --arg deb_arm64 "$deb_arm64" --arg plat_arm64 "$plat_arm64" \
            --arg index "$INDEX_DIGEST" \
            --arg ref "${GHCR_IMAGE}@${INDEX_DIGEST}" \
            --arg source "$SOURCE_URL" \
            '{
              schema: $schema,
              build: { repository: $repo, tag: $tag, commit: $commit, crate_version: $version,
                       debian_version: $version, manifest_version: $mv, manifest_sha256: $mhash },
              architectures: [
                { arch: "amd64", target: "x86_64-unknown-linux-gnu", binary_sha256: $bin_amd64, deb_sha256: $deb_amd64, oci_platform_digest: $plat_amd64 },
                { arch: "arm64", target: "aarch64-unknown-linux-gnu", binary_sha256: $bin_arm64, deb_sha256: $deb_arm64, oci_platform_digest: $plat_arm64 }
              ],
              oci_index_digest: $index,
              oci_image_ref: $ref,
              oci_labels: { version: $version, revision: $commit, source: $source, manifest_sha256: $mhash },
              apt: { origin: "Velnor", suite: "stable", component: "main" }
            }' > record.candidate.json

      - name: Re-verify the record + emit canonical bytes + checksum
        run: |
          set -euo pipefail
          # Independent re-assembly + coherence check; writes canonical
          # release-record.json + release-record.json.sha256 (the digest lives in
          # the sidecar, never inside the record — acyclic).
          chmod +x artifacts/velnor-release-tool
          artifacts/velnor-release-tool release assemble \
            --record record.candidate.json \
            --artifacts artifacts \
            --out release-record.json
          cp release-record.json.sha256 SHA256SUMS.record
          # Publish the compiled manifest + its checksum too, so velnor-apt can
          # verify sha256(manifest.json) == record.build.manifest_sha256 and that
          # the manifest's embedded source_sha matches the record commit.
          cp artifacts/manifest.json manifest.json
          sha256sum manifest.json | awk '{print $1}' > manifest.json.sha256

      - name: Assemble consumer release manifest and independent checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          subjects=(artifacts/velnor-runner-*.tar.gz artifacts/velnor-runner-*.deb)
          test "${#subjects[@]}" -eq 4
          : > SHA256SUMS
          : > assets.jsonl
          for subject in "${subjects[@]}"; do
            name=$(basename "$subject")
            digest=$(sha256sum "$subject" | awk '{print $1}')
            printf '%s  %s\n' "$digest" "$name" >> SHA256SUMS
            jq -cn --arg name "$name" --arg sha256 "$digest" '{name:$name,sha256:$sha256}' >> assets.jsonl
          done
          jq -S -n \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_ref "refs/tags/v$VERSION" \
            --arg source_commit "$COMMIT" \
            --arg version "$VERSION" \
            --slurpfile assets assets.jsonl \
            '{schema:"velnor.package-release.v1",source_repository:$source_repository,source_ref:$source_ref,source_commit:$source_commit,version:$version,assets:$assets}' \
            > release-manifest.json
          # SHA256SUMS binds artifact basenames. Verify from the downloaded
          # artifact corpus before copying those exact bytes to signer-input.
          (cd artifacts && sha256sum --check --strict ../SHA256SUMS)

      - name: Stage package subjects for hosted signer
        run: |
          set -euo pipefail
          mkdir signer-input
          cp artifacts/velnor-runner-*.tar.gz artifacts/velnor-runner-*.deb signer-input/

      - name: Verify packaged runner identity before release creation
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            deb="artifacts/velnor-runner-${VERSION}-${arch}.deb"
            record_bin="$(jq -er --arg arch "$arch" '
              [.architectures[] | select(.arch == $arch)]
              | if length == 1 then .[0].binary_sha256 else error("record must contain exactly one architecture") end
            ' release-record.json)"
            case "$record_bin" in
              *[!0-9a-f]*|'') echo "::error::record has invalid runner binary sha256 ($arch)" >&2; exit 1 ;;
            esac
            [ "${#record_bin}" -eq 64 ] || { echo "::error::record has invalid runner binary sha256 ($arch)" >&2; exit 1; }
            packaged_binary_sha="$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - ./usr/bin/velnor-runner | sha256sum | awk '{print $1}')"
            [ "$packaged_binary_sha" = "$record_bin" ] || {
              echo "::error::packaged /usr/bin/velnor-runner digest != release record ($arch)" >&2
              exit 1
            }
          done

      - name: Create release once — no clobber, record-verified idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Fail (never mint at main HEAD) if there is nothing to publish.
          [ -f release-record.json ] || { echo "::error::no assembled record" >&2; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            # Existing release: rebuilds are NOT bit-reproducible (tar/deb/OCI
            # payloads embed build metadata), so byte-equality against a fresh
            # build can never hold and re-runs would fail forever. Instead
            # verify the PUBLISHED release is coherent: its record names this
            # exact tag/commit/version/manifest and every published asset
            # matches the digests inside that record. Never clobber (N-immutable).
            tmp="$(mktemp -d)"
            for name in release-record.json release-record.json.sha256 \
                        manifest.json manifest.json.sha256 SHA256SUMS \
                        "velnor-runner-${VERSION}-amd64.tar.gz" "velnor-runner-${VERSION}-amd64.tar.gz.sha256" \
                        "velnor-runner-${VERSION}-arm64.tar.gz" "velnor-runner-${VERSION}-arm64.tar.gz.sha256" \
                        "velnor-runner-${VERSION}-amd64.deb" "velnor-runner-${VERSION}-amd64.deb.sha256" \
                        "velnor-runner-${VERSION}-arm64.deb" "velnor-runner-${VERSION}-arm64.deb.sha256"; do
              gh release download "$tag" --pattern "$name" --dir "$tmp" --clobber >/dev/null 2>&1 \
                || { echo "::error::release $tag exists but is missing $name — refusing partial overwrite" >&2; exit 1; }
            done
            # Sidecar checksums must match their payloads.
            read_sha() {
              local path="$1" size token
              [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
              size="$(stat -c%s "$path")"
              [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
              token="$(awk '
                {
                  for (field = 1; field <= NF; field++) {
                    token_count++
                    if (token_count == 1) token = $field
                  }
                }
                END {
                  if (token_count != 1) exit 1
                  print token
                }
              ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
              [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
              case "$token" in
                *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
              esac
              printf '%s\n' "$token"
            }
            [ "$(read_sha "$tmp/release-record.json.sha256")" = "$(sha256sum "$tmp/release-record.json" | awk '{print $1}')" ] \
              || { echo "::error::published release-record.json fails its sidecar checksum" >&2; exit 1; }
            [ "$(read_sha "$tmp/manifest.json.sha256")" = "$(sha256sum "$tmp/manifest.json" | awk '{print $1}')" ] \
              || { echo "::error::published manifest.json fails its sidecar checksum" >&2; exit 1; }
            # The record must name this exact tag, source commit, crate version
            # and the manifest this source tree compiles to (the compiled
            # manifest is byte-reproducible; binaries are not).
            [ "$(jq -r '.build.tag' "$tmp/release-record.json")" = "$tag" ] \
              || { echo "::error::published record tag mismatch — refusing to touch $tag" >&2; exit 1; }
            [ "$(jq -r '.build.commit' "$tmp/release-record.json")" = "$COMMIT" ] \
              || { echo "::error::published record commit mismatch — tag may have moved" >&2; exit 1; }
            [ "$(jq -r '.build.crate_version' "$tmp/release-record.json")" = "$VERSION" ] \
              || { echo "::error::published record version mismatch" >&2; exit 1; }
            [ "$(jq -r '.build.manifest_sha256' "$tmp/release-record.json")" = "$(sha256sum "$tmp/manifest.json" | awk '{print $1}')" ] \
              || { echo "::error::published record/manifest incoherent" >&2; exit 1; }
            [ "$(jq -r '.build.manifest_sha256' "$tmp/release-record.json")" = "$MANIFEST_SHA256" ] \
              || { echo "::error::published record manifest != manifest compiled from $COMMIT" >&2; exit 1; }
            # Every published package asset must match the record's digests.
            (cd "$tmp" && sha256sum --check --strict SHA256SUMS)
            for arch in amd64 arm64; do
              tarball="velnor-runner-${VERSION}-${arch}.tar.gz"
              deb="velnor-runner-${VERSION}-${arch}.deb"
              record_deb="$(jq -r --arg arch "$arch" '.architectures[] | select(.arch == $arch) | .deb_sha256' "$tmp/release-record.json")"
              record_bin="$(jq -r --arg arch "$arch" '.architectures[] | select(.arch == $arch) | .binary_sha256' "$tmp/release-record.json")"
              [ "$(read_sha "$tmp/${tarball}.sha256")" = "$(sha256sum "$tmp/$tarball" | awk '{print $1}')" ] \
                || { echo "::error::published tarball fails its sidecar checksum ($arch)" >&2; exit 1; }
              [ "$(read_sha "$tmp/${deb}.sha256")" = "$(sha256sum "$tmp/$deb" | awk '{print $1}')" ] \
                || { echo "::error::published deb fails its sidecar checksum ($arch)" >&2; exit 1; }
              [ "$(sha256sum "$tmp/$deb" | awk '{print $1}')" = "$record_deb" ] \
                || { echo "::error::published deb digest != record ($arch)" >&2; exit 1; }
              mkdir -p "$tmp/extract-$arch"
              tar -xzf "$tmp/$tarball" -C "$tmp/extract-$arch"
              [ "$(sha256sum "$tmp/extract-$arch/velnor-runner" | awk '{print $1}')" = "$record_bin" ] \
                || { echo "::error::published binary digest != record ($arch)" >&2; exit 1; }
            done
            # Sign the published bytes, not the non-reproducible rebuild.
            rm -rf signer-input
            mkdir signer-input
            cp "$tmp"/velnor-runner-*.tar.gz "$tmp"/velnor-runner-*.deb signer-input/
            echo "Release $tag already published; record + assets verified coherent. Nothing to upload."
          else
            gh release create "$tag" --title "$tag" --generate-notes \
              release-record.json release-record.json.sha256 \
              manifest.json manifest.json.sha256 \
              release-manifest.json SHA256SUMS \
              artifacts/velnor-runner-*.tar.gz artifacts/velnor-runner-*.tar.gz.sha256 \
              artifacts/velnor-runner-*.deb artifacts/velnor-runner-*.deb.sha256
          fi
          # NOTE (N6): this workflow deliberately does NOT push to velnor-apt or
          # dispatch its publish. tailrocks/velnor-apt pulls this record itself
          # and verifies it before reprepro. No APT credential exists here.

      # Uploaded AFTER the create/verify step: on an already-published tag the
      # signer must attest the published bytes (staged above from the release),
      # not this run's non-bit-reproducible rebuild.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-subjects
          path: signer-input
          if-no-files-found: error

  sign-amd64-tar:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-amd64.tar.gz
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  sign-arm64-tar:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-arm64.tar.gz
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  sign-amd64-deb:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-amd64.deb
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  sign-arm64-deb:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-arm64.deb
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  # Homebrew: to be added modeled on holla's release.yml `homebrew` job once the
  # tailrocks/homebrew-velnor tap + push token exist.

  build:
    name: Build / ${{ matrix.target }}
    needs: [verify, release-github-bun-velnor, release-github-docker, release-github-docs, release-github-opentofu, release-github-rust-policy, release-github-rust-unit-collector, release-github-rust-velnor-bench, release-github-rust-velnor-client, release-github-rust-velnor-control, release-github-rust-velnor-model, release-github-rust-velnor-render, release-github-rust-velnor-runner, release-github-rust-velnor-tools, release-github-rust-velnor-workflow, release-github-rust-velnor-workflow-contract, release-github-rust-velnorctl, release-github-rust-production-topology, release-velnor-bun-velnor, release-velnor-docker, release-velnor-docs, release-velnor-opentofu, release-velnor-rust-policy, release-velnor-rust-unit-collector, release-velnor-rust-velnor-bench, release-velnor-rust-velnor-client, release-velnor-rust-velnor-control, release-velnor-rust-velnor-model, release-velnor-rust-velnor-render, release-velnor-rust-velnor-runner, release-velnor-rust-velnor-tools, release-velnor-rust-velnor-workflow, release-velnor-rust-velnor-workflow-contract, release-velnor-rust-velnorctl, release-velnor-rust-production-topology]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: ./.github/actions/setup-velnor-workflow
        with:
          rev: 08ea1b07c19f525effcb762cd4614724afcd33ee
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=08ea1b07c19f525effcb762cd4614724afcd33ee" >> "$GITHUB_ENV"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release binary
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
          VELNOR_RELEASE_BUILD: "1"
        run: mbx build --locked --release --package velnor-runner --bin velnor-runner --features release-build --target "${{ matrix.target }}"
      - name: Package release binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          velnor-workflow release package-binary --target "${{ matrix.target }}" --version "${VERSION#v}" --package velnor-runner --binary velnor-runner
      - name: Record release binary digest
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) arch=amd64 ;;
            aarch64-unknown-linux-gnu) arch=arm64 ;;
            *) echo "::error::native release record needs a Debian architecture for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          binary="target/${{ matrix.target }}/release/velnor-runner"
          test -f "$binary" || { echo "::error::missing release binary $binary" >&2; exit 1; }
          digest="$(sha256sum "$binary" | awk '{print $1}')"
          case "$digest" in
            ''|*[!0-9a-f]*) echo "::error::binary digest is not lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#digest}" -eq 64 ] || { echo "::error::binary digest has invalid length" >&2; exit 1; }
          printf '%s\n' "$digest" > "dist/velnor-runner-$arch.bin.sha256"
      - name: Attest release artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  image-admission:
    needs: [admit-runner, verify]
    name: Admit immutable image tag
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      existing: ${{ steps.inspect.outputs.existing }}
      index_digest: ${{ steps.inspect.outputs.index_digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cleanup: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect version tag without mutation
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_IMAGE: "ghcr.io/tailrocks/velnor-job-ubuntu"
          VERSION: ${{ needs.verify.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_INDEX_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.existing-image-digest || '' }}
        run: |
          set -euo pipefail
          ref="${GHCR_IMAGE}:${VERSION}"
          error_file="$(mktemp)"
          if docker buildx imagetools inspect "$ref" --format '{{json .}}' > image.json 2>"$error_file"; then
            index_digest="$(jq -er '.manifest.digest' image.json)"
            case "$index_digest" in
              sha256:[0-9a-fA-F]*) ;;
              *) echo "::error::existing image tag $ref returned an invalid index digest" >&2; exit 1 ;;
            esac
            if ! gh release view "v${VERSION}" --repo "$REPOSITORY" >/dev/null 2>&1; then
              if [ -z "$RECOVERY_INDEX_DIGEST" ] || [ "$index_digest" != "$RECOVERY_INDEX_DIGEST" ]; then
                echo "::error::OCI tag $ref already exists without a matching GitHub release; refusing to adopt unknown bytes" >&2
                exit 1
              fi
              echo "adopting explicitly supplied recovery index $index_digest"
            fi
            {
              echo "existing=true"
              echo "index_digest=$index_digest"
            } >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|no such manifest|not found|name unknown' "$error_file"; then
            {
              echo "existing=false"
              echo "index_digest="
            } >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            echo "::error::could not determine whether OCI tag $ref exists; refusing a fail-open publish" >&2
            exit 1
          fi

  image-platform:
    name: Build ${{ matrix.arch }} GHCR image
    needs: [admit-runner, verify, metadata, image-admission]
    if: ${{ needs.image-admission.outputs.existing != 'true' && github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GHCR_IMAGE: "ghcr.io/tailrocks/velnor-job-ubuntu"
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Rust toolchain
        id: rustup-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Provision Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add 'aarch64-apple-darwin' 'aarch64-unknown-linux-gnu' 'x86_64-apple-darwin' 'x86_64-unknown-linux-gnu' 'x86_64-unknown-linux-musl'
      - name: Set up Mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: aqua:nextest-rs/nextest/cargo-nextest
          cache: true
          cache_save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
      - name: Bound the Mr. Boxington store
        shell: bash
        run: echo "MBX_GC_MAX_SIZE=12GiB" >> "$GITHUB_ENV"
      - name: Set up Mr. Boxington
        id: mbx-cache
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          github-cache-mode: objects
          version: 1.11.1

name: Release
run-name: Release · ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: github
        type: choice
        options:
          - github
          - velnor
          - both

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read


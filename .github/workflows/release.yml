      - name: Provision pinned Velnor workflow policy runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_PATH: ${{ github.workspace }}
          PRODUCT_REPOSITORY: tailrocks/velnor
        run: |
          set -euo pipefail
          PINNED_REVISION="$(sed -n -E 's/^[[:space:]]*revision[[:space:]]*=[[:space:]]*"([0-9a-f]{40})".*/\1/p' "$CHECKOUT_PATH/.github-gen/velnor-workflow.toml" | head -n 1)"
          test "$PINNED_REVISION" != '' || { echo "::error::D19 pin missing from .github-gen/velnor-workflow.toml" >&2; exit 1; }
          listing=""
          if git -C "$CHECKOUT_PATH" cat-file -e "$PINNED_REVISION^{commit}" 2>/dev/null; then
            listing="$(git -C "$CHECKOUT_PATH" ls-tree -r "$PINNED_REVISION" -- crates/velnor-workflow Cargo.toml Cargo.lock rust-toolchain.toml rust-toolchain .cargo)"
          else
            tree="$(gh api "repos/$PRODUCT_REPOSITORY/git/trees/$PINNED_REVISION?recursive=1")" || { echo "::error::unknown generator revision $PINNED_REVISION" >&2; exit 1; }
            [[ "$(jq -r '.truncated // false' <<<"$tree")" != "true" ]] || { echo "::error::tree API response is truncated; the closure cannot be proven" >&2; exit 1; }
            listing="$(jq -r '[.tree[] | select(.type != "tree") | select(.path == "Cargo.toml" or .path == "Cargo.lock" or .path == "rust-toolchain.toml" or .path == "rust-toolchain" or (.path | startswith("crates/velnor-workflow/")) or (.path | startswith(".cargo/"))) | "\(.mode) \(.type) \(.sha)\t\(.path)"] | sort | join("\n")' <<<"$tree")"
          fi
          test "$listing" != '' || { echo "::error::revision $PINNED_REVISION has no closure inputs" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            closure="$(printf '%s\nclosure-version:1\nfeatures:\nprofile:release\n' "$(LC_ALL=C sort <<<"$listing")" | sha256sum | awk '{print $1}')"
          else
            closure="$(printf '%s\nclosure-version:1\nfeatures:\nprofile:release\n' "$(LC_ALL=C sort <<<"$listing")" | shasum -a 256 | awk '{print $1}')"
          fi
          binary="${CARGO_HOME:-$HOME/.cargo}/bin/velnor-workflow-policy"
          tag="velnor-workflow-runtime-v1-${closure:0:16}"
          asset="velnor-workflow-${RUNNER_OS}-${RUNNER_ARCH}"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          if ! gh release download "$tag" --repo tailrocks/velnor --pattern manifest.json --dir "$temporary"; then
            echo "::error::no policy runtime product for revision $PINNED_REVISION (closure ${closure:0:16}); the mainline runtime-product publisher builds it after merge" >&2
            exit 1
          fi
          gh attestation verify "$temporary/manifest.json" --owner tailrocks --signer-workflow tailrocks/velnor/.github/workflows/ci-runtime-products.yml --source-ref refs/heads/main
          jq -e --arg closure "$closure" --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" --arg asset "$asset" '.closure == $closure and (.revision | test("^[0-9a-f]{40}$")) and .profile == "release" and .features == "" and (.products[$platform].binary | test("^[0-9a-f]{64}$")) and .products[$platform].asset == $asset' "$temporary/manifest.json" >/dev/null
          expected="$(jq -er --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" '.products[$platform].binary' "$temporary/manifest.json")"
          existing=""
          if [[ -x "$binary" ]]; then
            if command -v sha256sum >/dev/null 2>&1; then
              existing="$(sha256sum "$binary" | awk '{print $1}')"
            else
              existing="$(shasum -a 256 "$binary" | awk '{print $1}')"
            fi
          fi
          if [[ "$existing" != "$expected" ]]; then
            gh release download "$tag" --repo tailrocks/velnor --pattern "$asset" --dir "$temporary"
            gh attestation verify "$temporary/$asset" --owner tailrocks --signer-workflow tailrocks/velnor/.github/workflows/ci-runtime-products.yml --source-ref refs/heads/main
            if command -v sha256sum >/dev/null 2>&1; then
              actual="$(sha256sum "$temporary/$asset" | awk '{print $1}')"
            else
              actual="$(shasum -a 256 "$temporary/$asset" | awk '{print $1}')"
            fi
            [[ "$actual" == "$expected" ]] || { echo "::error::policy runtime digest mismatch" >&2; exit 1; }
            install -Dm0755 "$temporary/$asset" "$binary"
          fi
          check_slot() {
            if command -v sha256sum >/dev/null 2>&1; then
              installed="$(sha256sum "$binary" | awk '{print $1}')"
            else
              installed="$(shasum -a 256 "$binary" | awk '{print $1}')"
            fi
            [[ "$installed" == "$expected" ]] || { echo "::error::policy runtime slot changed after verification" >&2; exit 1; }
          }
          check_slot
          reported="$("$binary" --closure)"
          [[ "$reported" == "$closure" ]] || { echo "::error::pinned workflow policy runtime reports closure $reported, expected $closure" >&2; exit 1; }
          manifest_revision="$(jq -er '.revision' "$temporary/manifest.json")"
          check_slot
          reported_revision="$("$binary" --revision)"
          [[ "$reported_revision" == "$manifest_revision" ]] || { echo "::error::pinned workflow policy runtime reports revision $reported_revision, expected $manifest_revision" >&2; exit 1; }
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Install declared Mise tools
        run: |
          set -euo pipefail
          mise --yes install aqua:nextest-rs/nextest/cargo-nextest
      - name: Set up Mr. Boxington
        id: mbx-cache
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
      - name: Prepare Cargo sources
        env:
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          root='crates/velnor-workflow'
          if [[ "$root" != "." ]]; then
            cd -- "$root"
          fi
          if cargo metadata --locked --offline --all-features --format-version 1 >/dev/null 2>&1; then
            echo "Cargo sources warm; skipping fetch"
          else
            cargo fetch --locked
          fi
      - name: Run "Rust crate (velnor-workflow)" checks
        env:
          CI_SCOPE: full
          CI_UNIT_ID: rust-velnor-workflow
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          CARGO_NET_OFFLINE: "true"
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-velnor-workflow


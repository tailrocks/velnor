          save-on-workflow-dispatch: true
      - name: Restore mold 2.42.0 cache
        id: mold-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/velnor/mold/2.42.0
          key: velnor-mold-2.42.0-${{ runner.os }}-${{ runner.arch }}
      - name: Set up mold 2.42.0
        shell: bash
        env:
          MOLD_VERSION: 2.42.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) mold_arch=x86_64; expected='f5ed2f6e31d1ada4f07fe766fe0de7a73104d1c5cdc59086fcecc16a43720b6d' ;;
            aarch64) mold_arch=aarch64; expected='3c9a0a3624aac8a2007569ae50c33b3129a0f0ae8bcc974aeee2f8939d295190' ;;
            *) echo "unsupported mold architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          cache_dir="$HOME/.cache/velnor/mold/$MOLD_VERSION"
          archive="$cache_dir/mold-$MOLD_VERSION-$mold_arch-linux.tar.gz"
          mkdir -p "$cache_dir"
          if [[ ! -s "$archive" ]]; then
            temporary="$archive.download"
            trap 'rm -f "$temporary"' EXIT
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              --output "$temporary" \
              "https://github.com/rui314/mold/releases/download/v$MOLD_VERSION/mold-$MOLD_VERSION-$mold_arch-linux.tar.gz"
            printf '%s  %s\n' "$expected" "$temporary" | sha256sum --check --strict
            mv "$temporary" "$archive"
            trap - EXIT
          fi
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          if [[ "$(id -u)" -eq 0 ]]; then
            tar --directory /usr/local --strip-components=1 --no-overwrite-dir -xzf "$archive"
            ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld 2>/dev/null || printf /usr/bin/ld)"
          else
            sudo tar --directory /usr/local --strip-components=1 --no-overwrite-dir -xzf "$archive"
            sudo ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld 2>/dev/null || printf /usr/bin/ld)"
          fi
          mold --version | grep -F "$MOLD_VERSION"
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: github-*
          merge-multiple: true
      - name: Download guest payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guest-payload-${{ matrix.arch }}
          path: dist/microvm
      - name: Stage guest payload
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          root='crates/velnor-runner/release/microvm'
          mkdir -p "$root" extracted
          url="$(jq -er --arg a "$arch" '.tarballs[$a].url' microvm/pins.json)"
          sha="$(jq -er --arg a "$arch" '.tarballs[$a].sha256' microvm/pins.json)"
          fc_member="$(jq -er --arg a "$arch" '.tarballs[$a].firecracker_member' microvm/pins.json)"
          jailer_member="$(jq -er --arg a "$arch" '.tarballs[$a].jailer_member' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 --connect-timeout 30 --max-time 900 \
            -o firecracker.tgz "$url"
          echo "$sha  firecracker.tgz" | sha256sum -c -
          tar -xzf firecracker.tgz -C extracted
          cp "extracted/${fc_member}" "$root/firecracker"
          cp "extracted/${jailer_member}" "$root/jailer"
          test -s dist/microvm/velnor-guest-agent
          test -s dist/microvm/guest-agent.sha256
          test -s dist/microvm/vmlinux
          test -s dist/microvm/rootfs.ext4
          test -s dist/microvm/rootfs.sha256
          guest_agent_sha256="$(awk '{print $1}' dist/microvm/guest-agent.sha256)"
          rootfs_sha256="$(awk '{print $1}' dist/microvm/rootfs.sha256)"
          cp dist/microvm/velnor-guest-agent "$root/velnor-guest-agent"
          cp dist/microvm/vmlinux "$root/vmlinux"
          cp dist/microvm/rootfs.ext4 "$root/rootfs.ext4"
          chmod 0755 "$root/firecracker" "$root/jailer" "$root/velnor-guest-agent"
          mbx run --locked --release --package velnor-runner --bin velnor-guest-image -- \
            stage --root "$root" --arch "$arch" \
            --rootfs-sha256 "$rootfs_sha256" \
            --guest-agent-sha256 "$guest_agent_sha256"
      - name: Build Debian packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          velnor-workflow release package-deb --package velnor-runner --version "${VERSION#v}" --guest dist/microvm --target "${{ matrix.target }}"
      - name: Attest Debian packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: Upload Debian packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish GitHub release
    needs: [admit-runner, verify, build, image, guest-payload, debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: github-*
          merge-multiple: true
      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Verify archive checksums
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes

# Release tags are cut from the protected main branch.

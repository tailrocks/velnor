# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Release
run-name: Release · ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: github
        type: choice
        options:
          - github
          - velnor
          - both
      existing-image-digest:
        description: Exact OCI index digest for an explicitly verified failed-run recovery.
        type: string
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit-runner:
    name: Control / Admit release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject Velnor-only native release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'velnor' }}
        run: |
          echo 'native release publishes from GitHub only; Velnor-only dispatch is unsupported' >&2
          exit 1

  verify:
    name: Control / Verify release
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: ./.github/actions/setup-velnor-workflow
        with:
          rev: 08ea1b07c19f525effcb762cd4614724afcd33ee
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=08ea1b07c19f525effcb762cd4614724afcd33ee" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: velnor-workflow policy --workflow-root "$GITHUB_WORKSPACE"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Verify tag
        run: velnor-workflow release verify-tag --branch 'main' --package 'velnor-runner'
      - name: Resolve release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::release tag $TAG must match v[0-9]*" >&2; exit 1 ;;
          esac
          version="${TAG#v}"
          case "$version" in
            ''|*['/ ']*) echo "::error::release version is not portable: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"


  release-github-bun-velnor:
    name: "GitHub / Bun / bun-velnor"
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install cargo-deb
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          cargo install cargo-deb --version 3.7.0 --locked
          cargo-deb --version
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: metadata
      - name: Download release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-${{ matrix.target }}
          path: build-artifacts
      - name: Reuse the build job's release binary
        run: |
          set -euo pipefail
          tarball="build-artifacts/velnor-runner-$VERSION-${{ matrix.target }}.tar.gz"
          bin_sidecar="build-artifacts/velnor-runner-${{ matrix.arch }}.bin.sha256"
          test -f "$tarball" || { echo "::error::missing build tarball $tarball" >&2; exit 1; }
          test -f "$tarball.sha256" || { echo "::error::missing tarball checksum $tarball.sha256" >&2; exit 1; }

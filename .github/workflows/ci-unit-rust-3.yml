              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          exit $rc
      - name: Mark cleanup end
        if: ${{ inputs.unit == 'rust-production-topology' && (always()) }}
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CLEANUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Report phase timings and cache outcomes
        if: ${{ inputs.unit == 'rust-production-topology' && (always()) }}
        env:
          VELNOR_CI_LANE: velnor
          VELNOR_HOST_WARM_LAYERS: rustup,mold,mbx,cargo
        uses: ./.github/actions/report-velnor-ci-outcomes
        with:
          job_label: rust-production-topology

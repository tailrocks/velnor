# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / Main
run-name: CI / main · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: both
        type: choice
        options:
          - velnor
          - github
          - both
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: velnor-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: "Control / Planning"
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      rust-2_matrix: ${{ steps.plan.outputs.rust-2_matrix }}
      rust-3_matrix: ${{ steps.plan.outputs.rust-3_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@8e1ae640d525125316d7ce8064e739728988b8fe
        with:
          rev: ${{ (((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && github.sha) || '8e1ae640d525125316d7ce8064e739728988b8fe' }}
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=8e1ae640d525125316d7ce8064e739728988b8fe" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_LANES: ${{ github.event.inputs.runner || 'both' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 8e1ae640d525125316d7ce8064e739728988b8fe
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" '{repository: $repository, revision: $revision, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-8e1ae640d525125316d7ce8064e739728988b8fe-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  velnor-lane-admission:
    name: "Control / Velnor admission"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Velnor lane omitted for fork
        run: |
          echo '::notice::Velnor lane omitted for fork pull request; validating GitHub lane only.'
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          sparse-checkout: |
            .github/workflows
            .github-gen
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          # Static policy validation only; fork head checkout is intentional.
          allow-unsafe-pr-checkout: true
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.11.1
          cache-key: velnor-policy-mbx-1.11.1-${{ runner.os }}-${{ runner.arch }}-8e1ae640d525125316d7ce8064e739728988b8fe
          restore-keys: |
            velnor-policy-mbx-1.11.1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Velnor workflow runtime
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-workflow-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/velnor-workflow-cargo-target
          VELNOR_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/velnor-workflow-install
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          install -d -m 700 \
            "$CARGO_HOME" \
            "$CARGO_TARGET_DIR" \
            "$VELNOR_WORKFLOW_INSTALL_DIR"
          cd "$VELNOR_WORKFLOW_INSTALL_DIR"
          env -u RUSTC_WRAPPER -u SCCACHE_GHA_ENABLED -u CARGO_INCREMENTAL -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS \
            cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev 8e1ae640d525125316d7ce8064e739728988b8fe \
            --root "$VELNOR_WORKFLOW_ROOT" \
            velnor-workflow \
            --bin velnor-workflow
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          VELNOR_WORKFLOW_POLICY_REVISION: 8e1ae640d525125316d7ce8064e739728988b8fe
        run: velnor-workflow policy --workflow-root "$WORKFLOW_ROOT"
  github-bun-velnor:
    name: "Bun · Bun package (velnor)"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',bun-velnor,') }}

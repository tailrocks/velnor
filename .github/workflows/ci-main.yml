# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / Main
run-name: CI / main · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: true
        default: velnor
        type: choice
        options:
          - velnor
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: velnor-${{ github.repository }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Planning
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'velnor' || github.event.inputs.runner == 'both'))) }}
    runs-on: [self-hosted, velnor-target-mvp]
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

  policy:
    name: Advisory policy
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'velnor' || github.event.inputs.runner == 'both'))) }}
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          fetch-depth: 1
          persist-credentials: false
          # Velnor's native checkout uses its supported full-repository fetch.
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3
          cache-key: velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-d3e441fb36dc0fee7502cc08fdc7bebf8c8bf754
          restore-keys: |
            velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Velnor workflow runtime
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-workflow-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/velnor-workflow-cargo-target
          VELNOR_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/velnor-workflow-install
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          CACHED_POLICY_RUNTIME="$HOME/.cargo/bin/velnor-workflow-policy-d3e441fb36dc0fee7502cc08fdc7bebf8c8bf754"
          if [ -x "$CACHED_POLICY_RUNTIME" ]; then
            ln -sf "velnor-workflow-policy-d3e441fb36dc0fee7502cc08fdc7bebf8c8bf754" "$HOME/.cargo/bin/velnor-workflow"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          install -d -m 700 \
            "$CARGO_HOME" \
            "$CARGO_TARGET_DIR" \
            "$VELNOR_WORKFLOW_INSTALL_DIR"
          cd "$VELNOR_WORKFLOW_INSTALL_DIR"
          cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev d3e441fb36dc0fee7502cc08fdc7bebf8c8bf754 \
            --root "$VELNOR_WORKFLOW_ROOT" \
            velnor-workflow \
            --bin velnor-workflow
          STAGED_POLICY_RUNTIME="$CACHED_POLICY_RUNTIME.$$"
          install -Dm0755 "$VELNOR_WORKFLOW_ROOT/bin/velnor-workflow" "$STAGED_POLICY_RUNTIME"
          mv -f "$STAGED_POLICY_RUNTIME" "$CACHED_POLICY_RUNTIME"
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          VELNOR_WORKFLOW_POLICY_REVISION: d3e441fb36dc0fee7502cc08fdc7bebf8c8bf754
        run: velnor-workflow policy --workflow-root "$WORKFLOW_ROOT"
  group-bun:
    name: "Bun / Packages"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.bun_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-docker:
    name: "Docker / Images"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.docker_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-docs:
    name: Documentation
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.docs_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docs.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-opentofu:
    name: OpenTofu
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.opentofu_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-opentofu.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-rust:
    name: Rust
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.rust_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  ci-required:
    name: ci-required
    if: ${{ always() && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'velnor' || github.event.inputs.runner == 'both')))) }}
    needs: [plan, policy, group-bun, group-docker, group-docs, group-opentofu, group-rust]
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job policy)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite policy did not pass: $result" >&2
            exit 1
          fi
          matrix="$(jq -r --arg key 'bun_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-bun)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-bun did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-bun failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'docker_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-docker)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-docker did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-docker failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'docs_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-docs)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-docs did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-docs failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'opentofu_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-opentofu)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-opentofu did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in

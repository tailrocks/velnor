# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI
run-name: CI / main · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: true
        default: velnor
        type: choice
        options:
          - velnor
          - github
          - both
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Planning
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@2a61afb8653fac83f443a35f6e13d5d1875327cd
        with:
          rev: 2a61afb8653fac83f443a35f6e13d5d1875327cd
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=984396e67ef674189cf15f4e5bff3c8785aa3180" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_SELECTION_FILE: ${{ runner.temp }}/velnor-ci-selection
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" ]]; then
            BASE_SHA="$(git merge-base "origin/main" HEAD 2>/dev/null || git rev-parse "origin/main")"
            export BASE_SHA
          fi
          velnor-workflow plan --config .github/ci/project.toml
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 2a61afb8653fac83f443a35f6e13d5d1875327cd
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" '{repository: $repository, revision: $revision, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-2a61afb8653fac83f443a35f6e13d5d1875327cd-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
      - name: Publish Velnor CI selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-ci-selection
          path: ${{ runner.temp }}/velnor-ci-selection
          if-no-files-found: error
          retention-days: 1
  policy:
    name: Advisory policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          # Static policy validation only; fork head checkout is intentional.
          allow-unsafe-pr-checkout: true
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-984396e67ef674189cf15f4e5bff3c8785aa3180
          restore-keys: |
            velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Velnor workflow runtime
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-workflow-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/velnor-workflow-cargo-target
          VELNOR_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/velnor-workflow-install
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          install -d -m 700 \
            "$CARGO_HOME" \
            "$CARGO_TARGET_DIR" \
            "$VELNOR_WORKFLOW_INSTALL_DIR"
          cd "$VELNOR_WORKFLOW_INSTALL_DIR"
          cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev 984396e67ef674189cf15f4e5bff3c8785aa3180 \
            --root "$VELNOR_WORKFLOW_ROOT" \
            velnor-workflow \
            --bin velnor-workflow
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          VELNOR_WORKFLOW_POLICY_REVISION: 984396e67ef674189cf15f4e5bff3c8785aa3180
        run: velnor-workflow policy --workflow-root "$WORKFLOW_ROOT"
  group-bun:
    name: ${{ matrix.label }}
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.bun_matrix != '[]' }}
    needs: [plan, policy]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.bun_matrix) }}
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      unit: ${{ matrix.unit }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base-sha: ${{ needs.plan.outputs.base_sha }}
      head-sha: ${{ needs.plan.outputs.head_sha }}
  group-docker:
    name: ${{ matrix.label }}
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.docker_matrix != '[]' }}
    needs: [plan, policy]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker_matrix) }}
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      unit: ${{ matrix.unit }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base-sha: ${{ needs.plan.outputs.base_sha }}
      head-sha: ${{ needs.plan.outputs.head_sha }}
  group-docs:
    name: ${{ matrix.label }}
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.docs_matrix != '[]' }}
    needs: [plan, policy]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docs_matrix) }}
    uses: ./.github/workflows/ci-unit-docs.yml
    with:
      unit: ${{ matrix.unit }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base-sha: ${{ needs.plan.outputs.base_sha }}
      head-sha: ${{ needs.plan.outputs.head_sha }}
  group-opentofu:
    name: ${{ matrix.label }}
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.opentofu_matrix != '[]' }}
    needs: [plan, policy]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.opentofu_matrix) }}
    uses: ./.github/workflows/ci-unit-opentofu.yml
    with:
      unit: ${{ matrix.unit }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base-sha: ${{ needs.plan.outputs.base_sha }}
      head-sha: ${{ needs.plan.outputs.head_sha }}
  group-rust:
    name: ${{ matrix.label }}
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.rust_matrix != '[]' }}
    needs: [plan, policy]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rust_matrix) }}
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: ${{ matrix.unit }}
      scope: ${{ needs.plan.outputs.scope }}
      selection-artifact: velnor-ci-selection
      base-sha: ${{ needs.plan.outputs.base_sha }}
      head-sha: ${{ needs.plan.outputs.head_sha }}
  ci-required:
    name: ci-required
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule'))) }}
    needs: [plan, policy, group-bun, group-docker, group-docs, group-opentofu, group-rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job policy)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite policy did not pass: $result" >&2
            exit 1
          fi
          matrix="$(jq -r --arg key 'bun_matrix' '.plan.outputs[$key] // "[]"' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-bun)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-bun did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-bun failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'docker_matrix' '.plan.outputs[$key] // "[]"' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-docker)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-docker did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-docker failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'docs_matrix' '.plan.outputs[$key] // "[]"' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-docs)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-docs did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-docs failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'opentofu_matrix' '.plan.outputs[$key] // "[]"' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-opentofu)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-opentofu did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-opentofu failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'rust_matrix' '.plan.outputs[$key] // "[]"' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-rust)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-rust did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-rust failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi

# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / Main
run-name: CI / main · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: both
        type: choice
        options:
          - velnor
          - github
          - both
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: velnor-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-main-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: "Control / Planning"
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
      opentofu_matrix: ${{ steps.plan.outputs.opentofu_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: ./.github/actions/setup-velnor-workflow
        with:
          rev: 294cea830a4b7911a127a9075cc6e3322641a094
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=294cea830a4b7911a127a9075cc6e3322641a094" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_LANES: ${{ github.event.inputs.runner || 'both' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 294cea830a4b7911a127a9075cc6e3322641a094
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          policy_src="${VELNOR_WORKFLOW_PINNED_BINARY:-$src}"
          install -m 0755 "$policy_src" "$stage/velnor-workflow-policy"
          policy_revision="$("$stage/velnor-workflow-policy" --revision)"
          policy_closure="$("$stage/velnor-workflow-policy" --closure)"
          [[ "$policy_closure" == "${{ steps.runtime.outputs.closure }}" ]] || { echo "::error::policy runtime reports closure $policy_closure, expected ${{ steps.runtime.outputs.closure }}" >&2; exit 1; }
          policy_digest="$(sha256sum "$stage/velnor-workflow-policy" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg closure "${{ steps.runtime.outputs.closure }}" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" --arg policy_revision "$policy_revision" --arg policy_closure "$policy_closure" --arg policy_binary_sha256 "$policy_digest" '{repository: $repository, revision: $revision, closure: $closure, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256, policy_revision: $policy_revision, policy_closure: $policy_closure, policy_binary_sha256: $policy_binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-294cea830a4b7911a127a9075cc6e3322641a094-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  velnor-lane-admission:
    name: "Control / Velnor admission"
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Velnor lane omitted for fork
        run: |
          echo '::notice::Velnor lane omitted for fork pull request; validating GitHub lane only.'
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Trust invariant: this job runs the base branch's Stage-0 validator
    # product against the audited tree under pull_request_target. It holds
    # `contents: read` only, references no secrets, persists no credentials,
    # and never compiles. When the audited pin's closure differs from the
    # base validator's, it additionally EXECUTES the PR run's prebuilt
    # candidate generator — PR-built code, same-repository runs only, bound
    # to the audited tree by manifest closure plus binary digest before
    # execution — with no secret references, no persisted credentials, the
    # read-only github.token confined to the Acquire/Ruleset API steps,
    # and both candidate exec points tokenless.
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy-checkout
          fetch-depth: 0
          persist-credentials: false
      - name: Check out audited head
        working-directory: policy-checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags "$GITHUB_SERVER_URL/$HEAD_REPOSITORY" "$HEAD_SHA"
          fi
          git checkout --quiet --detach "$HEAD_SHA"
      - name: Check out base setup action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy-setup-action
          sparse-checkout: .github/actions/setup-velnor-workflow
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        uses: ./policy-setup-action/.github/actions/setup-velnor-workflow
        with:
          rev: 294cea830a4b7911a127a9075cc6e3322641a094
          checkout-path: ${{ github.workspace }}/policy-checkout
      - name: Acquire candidate generator product
        working-directory: policy-checkout
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          BASE_PIN: 294cea830a4b7911a127a9075cc6e3322641a094
        run: |
          set -euo pipefail
          pin="$(sed -n -E 's/^[[:space:]]*revision[[:space:]]*=[[:space:]]*"([0-9a-f]{40})".*/\1/p' .github-gen/velnor-workflow.toml | head -n 1)"
          test "$pin" != '' || pin="$(sed -n -E 's/^.*VELNOR_WORKFLOW_POLICY_REVISION:[[:space:]]*([0-9a-f]{40}).*/\1/p' .github/workflows/ci-policy.yml | head -n 1)"
          test "$pin" != '' || { echo "::error::audited tree declares no generator pin" >&2; exit 1; }
          base_closure="$(velnor-workflow closure --rev="$BASE_PIN")"
          pin_closure="$(velnor-workflow closure --rev="$pin")"
          if [[ "$pin_closure" == "$base_closure" ]]; then
            echo "pin $pin shares the base closure; the Stage-0 validator renders"
            echo "VELNOR_WORKFLOW_CANDIDATE_MANIFEST=" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || { echo "::error::generator changes from forks cannot be verified here; open the generator change from a branch of $GITHUB_REPOSITORY" >&2; exit 1; }
          pin_candidate="$(velnor-workflow closure --rev="$pin" --candidate)"
          name="velnor-workflow-candidate-${pin_candidate:0:16}-${RUNNER_OS}-${RUNNER_ARCH}"
          deadline=$((SECONDS + 900))
          run_id=""
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-pr.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=5" --jq '[.workflow_runs[] | select(.head_repository.id == .repository.id)]')"
            waiting=false
            seen=false
            while read -r candidate_run; do
              test "$candidate_run" != '' || continue
              seen=true
              status="$(jq -r .status <<<"$candidate_run")"
              id="$(jq -r .id <<<"$candidate_run")"
              # $name in the filter is a jq variable, not a shell expansion.
              # shellcheck disable=SC2016
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" | jq -e --arg name "$name" '[.artifacts[] | select(.name == $name and .expired == false)] | length > 0' >/dev/null; then
                run_id="$id"
                break 2
              fi
              [[ "$status" == "completed" ]] || waiting=true
            done <<<"$(jq -c '.[]' <<<"$runs")"
            # No runs yet means the API has not indexed the sibling run, not
            # that it will never come: keep polling until the deadline.
            [[ "$seen" == "true" ]] || waiting=true
            [[ "$waiting" == "true" ]] || { echo "::error::no same-repository PR run published candidate $name" >&2; exit 1; }
            sleep 15
          done
          [[ -n "$run_id" ]] || { echo "::error::no candidate product $name was published within 15 minutes" >&2; exit 1; }
          candidate="$RUNNER_TEMP/velnor-workflow-candidate"
          rm -rf "$candidate"
          mkdir -p "$candidate"
          gh run download "$run_id" --name "$name" --dir "$candidate" --repo "$GITHUB_REPOSITORY"
          jq -e --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" --arg repo "$GITHUB_REPOSITORY" --arg run "$run_id" '.profile == "debug" and .platform == $platform and .repository == $repo and .run_id == $run and (.revision | test("^[0-9a-f]{40}$")) and (.closure | test("^[0-9a-f]{64}$")) and (.binary_sha256 | test("^[0-9a-f]{64}$"))' "$candidate/candidate-manifest.json" >/dev/null
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$candidate/velnor-workflow" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$candidate/velnor-workflow" | awk '{print $1}')"
          fi
          expected="$(jq -er .binary_sha256 "$candidate/candidate-manifest.json")"
          [[ "$actual" == "$expected" ]] || { echo "::error::candidate digest mismatch" >&2; exit 1; }
          chmod 0755 "$candidate/velnor-workflow"
          manifest_closure="$(jq -er .closure "$candidate/candidate-manifest.json")"
          [[ "$manifest_closure" == "$pin_candidate" ]] || { echo "::error::candidate manifest closure $manifest_closure is not the pin's candidate $pin_candidate" >&2; exit 1; }
          reported="$(GH_TOKEN="" GITHUB_TOKEN="" "$candidate/velnor-workflow" --closure)"
          [[ "$reported" == "$manifest_closure" ]] || { echo "::error::candidate reports closure $reported, manifest claims $manifest_closure" >&2; exit 1; }
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$candidate/velnor-workflow" >> "$GITHUB_ENV"
          echo "VELNOR_WORKFLOW_CANDIDATE_MANIFEST=$candidate/candidate-manifest.json" >> "$GITHUB_ENV"
      - name: Resolve required status checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          contexts="$(gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true" \
            | jq -r '.[] | select(.target == "branch" and .enforcement == "active") | .id' \
            | while read -r id; do gh api "repos/$GITHUB_REPOSITORY/rulesets/$id"; done \
            | jq -r --arg branch "refs/heads/$DEFAULT_BRANCH" 'select(.conditions.ref_name.include | any(. == "~DEFAULT_BRANCH" or . == "~ALL" or . == $branch)) | .rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' \
            | sort -u | paste -sd, -)"
          echo "RULESET_CONTEXTS=$contexts" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          VELNOR_WORKFLOW_POLICY_REVISION: 294cea830a4b7911a127a9075cc6e3322641a094
        run: |
          set -euo pipefail
          velnor-workflow policy \
            --workflow-root "$WORKFLOW_ROOT" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --candidate-manifest "${VELNOR_WORKFLOW_CANDIDATE_MANIFEST:-}" \
            --ruleset-contexts "$RULESET_CONTEXTS"

      - name: Set up actionlint
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint@1.7.12
          cache: false
      - name: Lint caller workflows
        working-directory: policy-checkout
        env:
          MISE_NO_CONFIG: "1"
        run: mise exec actionlint@1.7.12 -- actionlint
  github-bun-velnor:
    name: "Bun · Bun package (velnor)"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',bun-velnor,') }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      unit: bun-velnor
      lane: github
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      cache_paths: "~/.bun/install/cache"
      cache_key_files: |
        package.json
        bun.lock
  velnor-bun-velnor:
    name: "Bun · Bun package (velnor)"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',bun-velnor,') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

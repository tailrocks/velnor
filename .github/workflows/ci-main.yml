      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      cache_paths: ".velnor-docker-cache"
      seed_compat: "9c97194a807b"
      seed_dependency_files: |
        Cargo.lock
        Dockerfile
        docker/build-mise.lock
        docker/build-mise.toml
        rust-toolchain.toml
      seed_freshness_files: |
        Cargo.lock
        deny.toml
  velnor-docker:
    name: "Docker · Docker"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',docker,') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [plan, policy]

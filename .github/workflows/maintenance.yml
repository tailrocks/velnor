# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Maintenance
run-name: Maintenance · ${{ github.event_name }}

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Optional closed PR number whose merge cache should be removed
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: maintenance-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pull_request_number || github.run_id }}
  cancel-in-progress: false

jobs:
  prune-pr-cache:
    name: Prune closed-PR cache
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pull_request_number != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete merge-ref cache namespace
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: |
          set -euo pipefail
          delete_cache_id() {
            local id="$1" error attempt
            for attempt in 1 2 3; do
              error="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" 2>&1 >/dev/null)" && return 0
              if grep -qi 'not found' <<<"$error"; then
                return 0
              fi
              if grep -Eq 'HTTP 40[13]' <<<"$error"; then
                echo "::error::cache delete refused for id $id ($error); refusing to retry an authorization failure" >&2
                return 2
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 2))
              fi
            done
            echo "::error::failed to delete cache id $id after bounded retries" >&2
            return 1
          }
          ref="refs/pull/$PR_NUMBER/merge"
          encoded="$(printf '%s' "$ref" | jq -sRr @uri)"
          listing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$encoded" --jq '.actions_caches[].id')" || {
            echo "::error::failed to list cache entries for $ref" >&2
            exit 1
          }
          if [[ -z "$listing" ]]; then
            echo "No merge-ref cache entries found for $ref"
            exit 0
          fi
          mapfile -t cache_ids <<<"$listing"
          deleted=0
          failed=0
          for id in "${cache_ids[@]}"; do
            [[ -z "$id" ]] && continue
            if (( deleted + failed >= 500 )); then
              echo "::error::maintenance delete bound reached (500 cache deletes); rerun maintenance to continue" >&2
              exit 1
            fi
            if delete_cache_id "$id"; then
              deleted=$((deleted + 1))
            else
              status=$?
              if (( status == 2 )); then
                exit 1
              fi
              failed=$((failed + 1))
            fi
          done
          if (( failed > 0 )); then
            echo "::error::$failed closed-PR cache entries could not be deleted; rerun maintenance" >&2
            exit 1
          fi
  cache-budget:
    needs: [runtime]
    name: Cache retention
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Skip while CI producers are running
        id: retention-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci-main.yml nightly.yml; do
            if [[ "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --status in_progress --limit 1 --json databaseId --jq 'length')" != "0" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "$workflow is in_progress; skipping cache retention" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Checkout trusted maintenance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download Velnor workflow runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-workflow-runtime-e1c589eb5012a705aa735cb553a5230ff9fec490-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor-workflow-runtime-download
      - name: Verify Velnor workflow runtime
        shell: bash
        working-directory: .
        env:
          EXPECTED_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          stage="$RUNNER_TEMP/velnor-workflow-runtime-download"
          manifest="$stage/manifest.json"
          jq -e --arg revision "$EXPECTED_REVISION" --arg repository "$GITHUB_REPOSITORY" --arg platform "$RUNNER_OS-$RUNNER_ARCH" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg job "runtime" '.revision == $revision and .repository == $repository and .platform == $platform and .run_id == $run_id and .run_attempt == $run_attempt and .job_id == $job and (.policy_revision | test("^[0-9a-f]{40}$")) and (.profile != "debug" or .policy_revision == $revision) and ((.profile == "release" and .features == "") or (.profile == "debug" and .features == "tui")) and (.binary_sha256 | test("^[0-9a-f]{64}$")) and (.policy_binary_sha256 | test("^[0-9a-f]{64}$")) and (.closure | test("^[0-9a-f]{64}$")) and .closure == .policy_closure' "$manifest" >/dev/null
          if [[ 'true' == true ]]; then
            if ! git cat-file -e "$EXPECTED_REVISION^{commit}" 2>/dev/null; then
              auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$EXPECTED_REVISION"
            fi
          listing="$(git ls-tree -r "$EXPECTED_REVISION" -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
          test -n "$listing"
          features="$(jq -er '.features | strings' "$manifest")"
          profile="$(jq -er .profile "$manifest")"
          closure="$(printf '%s\nclosure-version:1\nfeatures:%s\nprofile:%s\n' "$(LC_ALL=C sort <<<"$listing")" "$features" "$profile" | sha256 | awk '{print $1}')"
          [[ "$(jq -er .closure "$manifest")" == "$closure" ]] || { echo "::error::runtime source closure mismatch" >&2; exit 1; }
          fi
          for pair in 'velnor-workflow binary_sha256' 'velnor-workflow-policy policy_binary_sha256'; do
            read -r binary field <<< "$pair"
            expected="$(jq -er --arg field "$field" '.[$field]' "$manifest")"
            actual="$(sha256 "$stage/$binary" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "::error::runtime digest mismatch: $binary" >&2; exit 1; }
          done
      - name: Add Velnor workflow runtime to PATH
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          stage="$RUNNER_TEMP/velnor-workflow-runtime-download"
          home="$RUNNER_TEMP/velnor-workflow-runtime-artifact"
          mkdir -p "$home/bin"
          install -m 0755 "$stage/velnor-workflow" "$home/bin/velnor-workflow"
          install -m 0755 "$stage/velnor-workflow-policy" "$home/bin/velnor-workflow-policy"
          expected_closure="$(jq -er '.policy_closure' "$stage/manifest.json")"
          for binary in velnor-workflow velnor-workflow-policy; do
            reported="$("$home/bin/$binary" --closure)"
            [[ "$reported" == "$expected_closure" ]] || { echo "::error::runtime reports closure $reported, expected $expected_closure" >&2; exit 1; }
          done
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$home/bin/velnor-workflow-policy" >> "$GITHUB_ENV"
      - name: Sweep closed-PR merge-ref caches
        if: steps.retention-gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delete_cache_id() {
            local id="$1" error attempt
            for attempt in 1 2 3; do
              error="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" 2>&1 >/dev/null)" && return 0
              if grep -qi 'not found' <<<"$error"; then
                return 0
              fi
              if grep -Eq 'HTTP 40[13]' <<<"$error"; then
                echo "::error::cache delete refused for id $id ($error); refusing to retry an authorization failure" >&2
                return 2
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 2))
              fi
            done
            echo "::error::failed to delete cache id $id after bounded retries" >&2
            return 1
          }
          failed=0
          processed=0
          all_refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[].ref')" || {
            echo "::error::failed to list cache scopes" >&2
            exit 1
          }
          mapfile -t refs < <(printf '%s\n' "$all_refs" | grep -E '^refs/pull/[0-9]+/merge$' | sort -u)
          if ((${#refs[@]} == 0)); then
            echo "No merge-ref cache scopes found"
            exit 0
          fi
          for ref in "${refs[@]}"; do
            [[ -z "$ref" ]] && continue
            pr="${ref#refs/pull/}"
            pr="${pr%/merge}"
            state="$(gh pr view "$pr" --json state --jq .state 2>/dev/null || echo unknown)"
            if [[ "$state" != "CLOSED" ]]; then
              continue
            fi
            encoded="$(printf '%s' "$ref" | jq -sRr @uri)"
            listing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$encoded" \
              --jq '.actions_caches[].id')" || {
              echo "::error::failed to list cache entries for $ref" >&2
              exit 1
            }
            if [[ -z "$listing" ]]; then
              continue
            fi
            mapfile -t cache_ids <<<"$listing"
            echo "Sweeping $ref ($pr): ${#cache_ids[@]} entries"
            for id in "${cache_ids[@]}"; do
              [[ -z "$id" ]] && continue
              if (( processed >= 500 )); then
                echo "::error::maintenance delete bound reached (500 cache deletes); rerun maintenance to continue" >&2
                exit 1
              fi
              if delete_cache_id "$id"; then
                :
              else
                status=$?
                if (( status == 2 )); then
                  exit 1
                fi
                failed=$((failed + 1))
              fi
              processed=$((processed + 1))
            done
          done
          if (( failed > 0 )); then
            echo "::error::$failed closed-PR merge-ref cache entries could not be deleted; rerun maintenance" >&2
            exit 1
          fi
      - name: Collect Actions cache account
        if: steps.retention-gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-retention"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | {id, key, size_in_bytes, created_at, last_accessed_at}' \
            > "$RUNNER_TEMP/cache-retention/entries.jsonl"
          jq -s '.' "$RUNNER_TEMP/cache-retention/entries.jsonl" \
            > "$RUNNER_TEMP/cache-retention/entries.json"
          velnor-workflow cache-plan --mode=budget --entries "$RUNNER_TEMP/cache-retention/entries.json" \
            > "$RUNNER_TEMP/cache-retention/budget.json"
          # `gh api --paginate --jq` runs the filter once per page and
          # concatenates the outputs: summing inside the filter prints one
          # number per page, and the total silently understates the account.
          # Slurp the page stream first, then take one total over every entry.
          total="$(jq '.total_held_bytes' "$RUNNER_TEMP/cache-retention/budget.json")"
          count="$(jq 'length' "$RUNNER_TEMP/cache-retention/entries.json")"
          headroom="$(jq '.headroom_bytes' "$RUNNER_TEMP/cache-retention/budget.json")"
          if (( headroom >= 0 && headroom < 536870912 )); then
            echo "::warning::Actions cache headroom below 512 MiB ($headroom bytes remaining)" >&2
          fi
          jq -n --argjson total "$total" --argjson count "$count" --argjson headroom "$headroom" \
            --slurpfile budget "$RUNNER_TEMP/cache-retention/budget.json" \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{captured_at: $captured_at, cache_count: $count, total_bytes: $total, headroom_bytes: $headroom, classes: $budget[0].classes}' \
            > "$RUNNER_TEMP/cache-retention/summary.json"
          {
            cat "$RUNNER_TEMP/cache-retention/summary.json"
            echo "Per-class totals:"
            jq -r '.classes[] | "  \(.id): \(.entry_count) entries, \(.held_bytes) bytes (budget \(.budget_bytes))"' \
              "$RUNNER_TEMP/cache-retention/budget.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Plan retention evictions
        if: steps.retention-gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # The plan is the generator's own retention policy, executed - never
          # a shell copy of it: per-class budgets, bounded generations per
          # variant class, and the protected classes (toolchain seeds, Cargo
          # source bundles, the Docker seed baseline) reserved before rolling
          # compiler snapshots are touched. An access timestamp is not a
          # lease. The newest generation of a variant stays out of reach
          # inside the producer window; a superseded generation of the same
          # variant is eligible, because the newer save is the producer
          # signal that the older entry is no longer being written.
          velnor-workflow cache-plan \
            --now "$(date -u +%s)" \
            --entries "$RUNNER_TEMP/cache-retention/entries.json" \
            > "$RUNNER_TEMP/cache-retention/plan.json"
          if jq -e 'length > 0' "$RUNNER_TEMP/cache-retention/plan.json" > /dev/null; then
            {
              echo "Retention plan (evict oldest first: bound, class budget, global budget):"
              jq -r 'sort_by(.class, .reason) | group_by(.class, .reason)[] | "  \(.[0].class) / \(.[0].reason): \(length) entries, \(map(.size_in_bytes) | add) bytes"' \
                "$RUNNER_TEMP/cache-retention/plan.json"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Retention plan: nothing to evict" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply retention evictions
        if: steps.retention-gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delete_cache_id() {
            local id="$1" error attempt
            for attempt in 1 2 3; do
              error="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" 2>&1 >/dev/null)" && return 0
              if grep -qi 'not found' <<<"$error"; then
                return 0
              fi
              if grep -Eq 'HTTP 40[13]' <<<"$error"; then
                echo "::error::cache delete refused for id $id ($error); refusing to retry an authorization failure" >&2
                return 2
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 2))
              fi
            done
            echo "::error::failed to delete cache id $id after bounded retries" >&2
            return 1
          }
          evicted=0
          freed=0
          failed=0
          # The plan is applied verbatim, in its own order: generations beyond
          # their class bound first, then classes over budget, then the global
          # sweep - which never touches a protected class. The per-run delete
          # bound stops the sweep instead of letting one run empty the
          # account; the next run continues where this one stopped.
          while IFS=$'\t' read -r class reason id size key; do
            if (( evicted + failed >= 500 )); then
              echo "::error::maintenance delete bound reached (500 cache deletes); rerun maintenance to continue" >&2
              exit 1
            fi
            if delete_cache_id "$id"; then
              evicted=$((evicted + 1))
              freed=$((freed + size))
              echo "evicted id=$id class=$class reason=$reason size=$size key=$key"
            else
              status=$?
              if (( status == 2 )); then
                exit 1
              fi
              failed=$((failed + 1))
              echo "::warning::failed to evict cache id $id (class $class, key $key)" >&2
            fi
          done < <(jq -r '.[] | [.class, .reason, .id, .size_in_bytes, .key] | @tsv' \
            "$RUNNER_TEMP/cache-retention/plan.json")
          # Every eviction is recorded under its cache class and its reason,
          # so a later cold run can be correlated with the eviction that
          # caused it.
          {
            echo "Evictions by cache class:"
            jq -r 'group_by(.class)[] | "  \(.[0].class): \(length) evictions, \(map(.size_in_bytes) | add) bytes"' \
              "$RUNNER_TEMP/cache-retention/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n --argjson evicted "$evicted" --argjson freed "$freed" --argjson failed "$failed" \
            '{evicted_caches: $evicted, failed_evictions: $failed, freed_bytes: $freed}' \
            >> "$GITHUB_STEP_SUMMARY"
          # A failed eviction is a loud failure, never a swallowed warning:
          # silent DELETE failures leave the account over budget while the
          # run reports success.
          if (( failed > 0 )); then
            echo "::error::$failed retention evictions failed; rerun maintenance" >&2
            exit 1
          fi
      - name: Publish retention evidence
        if: steps.retention-gate.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cache-retention-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-retention
          if-no-files-found: error
          retention-days: 14
      - name: Enforce cache budget
        if: steps.retention-gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-query live state: the enforcement decision must reflect what the
          # account actually holds after eviction, not the pre-eviction
          # snapshot. The same page-streaming rule as collection applies: the
          # sum is taken after slurping every page.
          total="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[].size_in_bytes' | jq -s 'add // 0')"
          budget="$(velnor-workflow cache-plan --mode=budget)"
          if (( total > budget )); then
            echo "::error::Actions cache account exceeds budget: $total > $budget bytes" >&2
            exit 1
          fi
  runtime:
    name: Prepare renderer (${{ matrix.runner }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout exact integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "refs/heads/${{ github.event.repository.default_branch }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact renderer source and published product
        id: runtime-source
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RENDERER_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
          AUDITED_HEAD: e1c589eb5012a705aa735cb553a5230ff9fec490
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          git cat-file -e "$RENDERER_REVISION^{commit}"
          git merge-base --is-ancestor "$RENDERER_REVISION" HEAD || { echo "::error::renderer pin must be reachable from the checked-out integration candidate" >&2; exit 1; }
          listing="$(git ls-tree -r "$RENDERER_REVISION" -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
          test -n "$listing"
          closure() { printf '%s\nclosure-version:1\nfeatures:%s\nprofile:%s\n' "$(LC_ALL=C sort <<<"$1")" "$2" "$3" | sha256 | awk '{print $1}'; }
          release="$(closure "$listing" '' release)"
          candidate="$(closure "$listing" 'tui' debug)"
          head_listing="$(git ls-tree -r "$AUDITED_HEAD" -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
          [[ "$(closure "$head_listing" 'tui' debug)" == "$candidate" ]] || { echo "::error::generator source differs from its declared pin; commit the source, pin it, and regenerate before merge" >&2; exit 1; }
          if [[ 'false' == true ]]; then
            integration_listing="$(git ls-tree -r HEAD -- 'crates/velnor-workflow' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' 'rust-toolchain' '.cargo')"
            [[ "$(closure "$integration_listing" 'tui' debug)" == "$candidate" ]] || { echo "::error::integration source closure differs from the pinned renderer" >&2; exit 1; }
          fi
          response="$RUNNER_TEMP/runtime-product-response"
          if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/velnor-workflow-runtime-v1-${release:0:16}" > "$response"; then
            published=true
          else
            status="$(awk '/^HTTP\// {print $2; exit}' "$response")"
            [[ "$status" == 404 ]] || { echo "::error::runtime lookup failed with status $status; source fallback is allowed only for a missing product" >&2; exit 1; }
            published=false
          fi
          { echo "published=$published"; echo "candidate=$candidate"; echo "release=$release"; echo "candidate_name=velnor-workflow-candidate-${candidate:0:16}-$RUNNER_OS-$RUNNER_ARCH"; } >> "$GITHUB_OUTPUT"
      - name: Set up Velnor workflow runtime
        id: runtime
        if: steps.runtime-source.outputs.published == 'true'
        uses: ./.github/actions/setup-velnor-workflow
        with:
          rev: e1c589eb5012a705aa735cb553a5230ff9fec490
      - name: Set trusted workflow policy revision
        run: |
          echo "VELNOR_WORKFLOW_POLICY_REVISION=e1c589eb5012a705aa735cb553a5230ff9fec490" >> "$GITHUB_ENV"
          echo "VELNOR_WORKFLOW_RUNTIME_CLOSURE=${{ steps.runtime.outputs.closure }}" >> "$GITHUB_ENV"
      - name: Prepare clean pinned renderer checkout
        if: steps.runtime-source.outputs.published != 'true'
        shell: bash
        working-directory: .
        env:
          RENDERER_REVISION: e1c589eb5012a705aa735cb553a5230ff9fec490
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: |
          set -euo pipefail
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          source="$RUNNER_TEMP/renderer-source"
          git worktree add --detach "$source" "$RENDERER_REVISION"
          test -z "$(git -C "$source" status --porcelain --untracked-files=all)"
          cd "$source"
      - name: Check renderer formatting
        if: steps.runtime-source.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/renderer-source
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: env -i PATH="$PATH" HOME="$HOME" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="$RUNNER_TEMP/renderer-cargo-home" CARGO_TARGET_DIR="$RUNNER_TEMP/renderer-target" cargo fmt --all -- --check
      - name: Check renderer Clippy
        if: steps.runtime-source.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/renderer-source
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
        run: env -i PATH="$PATH" HOME="$HOME" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="$RUNNER_TEMP/renderer-cargo-home" CARGO_TARGET_DIR="$RUNNER_TEMP/renderer-target" cargo clippy --locked --package velnor-workflow --all-targets --no-default-features --features tui -- -D warnings
      - name: Build exact renderer source
        if: steps.runtime-source.outputs.published != 'true'
        working-directory: ${{ runner.temp }}/renderer-source
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          RUSTC_WRAPPER: ""
          RUSTC_WORKSPACE_WRAPPER: ""
          RUSTFLAGS: ""

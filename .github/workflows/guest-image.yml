# Reproducible Firecracker guest kernel + rootfs. Not the generated estate CI template.
name: Guest image

on:
  pull_request:
    paths:
      - "microvm/**"
      - "crates/velnor-runner/src/execution/guest.rs"
      - "crates/velnor-runner/src/execution/guest_image.rs"
      - "crates/velnor-runner/src/bin/velnor-guest-image.rs"
      - ".github/workflows/guest-image.yml"
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: guest-image-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane-admission:
    name: Resolve guest-image lanes
    timeout-minutes: 5
    runs-on: ${{ 'ubuntu-26.04' }}
    permissions:
      contents: read
    env:
      VELNOR_IMPLEMENTATION_REQUIREMENT: "guest-image-build.user-namespace"
      VELNOR_MISSING_CAPABILITY: "unprivileged user namespaces or CAP_SYS_ADMIN"
    steps:
      - name: Validate requested lanes and required capabilities
        env:
          REQUESTED_LANES: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || github.event_name == 'pull_request' && 'github' || 'velnor' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_LANES" in
            github)
              ;;
            velnor|both)
              echo "::error::guest-image lanes '$REQUESTED_LANES' fail capability check '$VELNOR_MISSING_CAPABILITY'; Velnor implementation requirement '$VELNOR_IMPLEMENTATION_REQUIREMENT' remains open; refusing GitHub substitution" >&2
              exit 1
              ;;
            *)
              echo "::error::invalid guest-image lanes '$REQUESTED_LANES'; expected velnor, github, or both" >&2
              exit 1
              ;;
          esac

  guest-image:
    needs: lane-admission
    name: Guest kernel/rootfs ${{ matrix.arch }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb: amd64
          - arch: aarch64
            deb: arm64
    # lane-admission permits this implementation only for trusted PR code or an
    # explicit github dispatch. Velnor/both fail instead of substituting GitHub.
    runs-on: ${{ matrix.deb == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    env:
      CACHE_LANE: GitHub
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.arch }}
          restore-keys: |
            cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.arch }}
            cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
            cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-

      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-target-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ github.job }}-${{ matrix.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', '**/Cargo.lock') }}-

      - name: Install kernel and rootfs build packages
        run: |
          set -euo pipefail
          # velnor-sudo-exception: GitHub-hosted guest-image build installs required OS packages.
          sudo apt-get update
          # velnor-sudo-exception: GitHub-hosted guest-image build installs required OS packages.
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libelf-dev xz-utils e2fsprogs \
            mmdebstrap debootstrap qemu-user-binfmt binfmt-support gnupg arch-test \
            gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu

      - name: Download pinned kernel tarball
        run: |
          set -euo pipefail
          url="$(jq -er '.kernel_tarball' microvm/pins.json)"
          sha="$(jq -er '.kernel_tarball_sha256' microvm/pins.json)"
          curl --fail --show-error --silent --location \
            --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 \
            --connect-timeout 30 --max-time 900 \
            -o linux.tar.xz "$url"
          echo "$sha  linux.tar.xz" | sha256sum -c -

      - name: Build guest vmlinux and rootfs.ext4
        run: |
          set -euo pipefail
          mkdir -p dist/microvm
          cargo run -p velnor-runner --bin velnor-guest-image --locked -- \
            build --arch "${{ matrix.arch }}" --out dist/microvm --tarball linux.tar.xz
          test -s dist/microvm/vmlinux
          test -s dist/microvm/rootfs.ext4
          (
            cd dist/microvm
            sha256sum vmlinux rootfs.ext4 | tee SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guest-image-${{ matrix.arch }}
          compression-level: 1
          path: |
            dist/microvm/vmlinux
            dist/microvm/rootfs.ext4
            dist/microvm/SHA256SUMS

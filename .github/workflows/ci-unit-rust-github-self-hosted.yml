# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Rust
on:
  workflow_call:
    inputs:
      unit:
        required: true
        type: string
      selected_units:
        required: true
        type: string
      selected_unit_ids:
        required: true
        type: string
      scope:
        required: true
        type: string
      full_units:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      provider:
        required: true
        type: string
    outputs:
      result_identity:
        description: Identity of the provider result that ran for the caller
        value: ${{ jobs.verify-github-self-hosted.outputs.result_identity }}
      mise_tools:
        required: false
        type: string
        default: ""
      mise_runner:
        required: false
        type: boolean
        default: false
      mbx_compat:
        required: false
        type: string
        default: ""
      mbx_dependency_files:
        required: false
        type: string
        default: ""
      mbx_freshness_files:
        required: false
        type: string
        default: ""
      cargo_bin_tools:
        required: false
        type: string
        default: ""
      tool_version:
        required: false
        type: string
        default: ""
      node_cache_dependency_path:
        required: false
        type: string
        default: ""
      cache_paths:
        required: false
        type: string
        default: ""
      cache_key_files:
        required: false
        type: string
        default: ""
      seed_compat:
        required: false
        type: string
        default: ""
      seed_dependency_files:
        required: false
        type: string
        default: ""
      seed_freshness_files:
        required: false
        type: string
        default: ""
      cargo_root:
        required: false
        type: string
        default: ""
      cargo_fetch_skip_when_warm:
        required: false
        type: boolean
        default: false
      cargo_net_offline:
        required: false
        type: boolean
        default: false
      host_warm_layers:
        required: false
        type: string
        default: ""
      policy_runtime:
        required: false
        type: boolean
        default: false
      candidate_publish:
        required: false
        type: boolean
        default: false
      unit_platform:
        required: false
        type: string
        default: ""
      unit_trust:
        required: false
        type: string
        default: ""
      unit_dependencies:
        required: false
        type: string
        default: ""
      unit_admission:
        required: false
        type: string
        default: ""

jobs:
  verify-github-self-hosted:
    name: github-self-hosted
    if: ${{ inputs.provider == 'github-self-hosted' && contains(inputs.selected_units, format('"unit_id":"{0}"', inputs.unit)) && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-self-hosted,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    runs-on: bastion-scale-set
    timeout-minutes: 45
    outputs:
      result_identity: ${{ steps.result-identity.outputs.value }}
    steps:
      - name: Mark CI job start
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/JOB_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - name: Record unit dependencies
        env:
          UNIT_ID: ${{ inputs.unit }}
          UNIT_DEPENDENCIES: ${{ inputs.unit_dependencies }}
          UNIT_ADMISSION: ${{ inputs.unit_admission }}
          UNIT_PROVIDER: ${{ inputs.provider }}
        run: |
          {
            echo '## Unit dependencies'
            echo
            echo "- Unit: $UNIT_ID"
            echo "- Provider: $UNIT_PROVIDER"
            echo "- Admission: $UNIT_ADMISSION"
            if [[ -z "$UNIT_DEPENDENCIES" ]]; then
              echo '- Dependencies: none'
            else
              echo "- Dependencies: $UNIT_DEPENDENCIES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mark runner setup end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/RUNNER_SETUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Materialize Velnor CI selection
        shell: bash
        env:
          SELECTION_BASE_SHA: ${{ inputs.base_sha }}
          SELECTION_HEAD_SHA: ${{ inputs.head_sha }}
          SELECTION_SCOPE: ${{ inputs.scope }}
          SELECTION_UNITS: ${{ inputs.selected_unit_ids }}
          SELECTION_FULL_UNITS: ${{ inputs.full_units }}
          SELECTION_PLAN_DIGEST: ${{ inputs.plan_digest }}
        run: |
          set -euo pipefail
          mkdir -p .velnor-ci-selection
          {
            printf 'version=2\n'
            printf 'base_sha=%s\n' "$SELECTION_BASE_SHA"
            printf 'head_sha=%s\n' "$SELECTION_HEAD_SHA"
            printf 'scope=%s\n' "$SELECTION_SCOPE"
            printf 'units=%s\n' "$SELECTION_UNITS"
            printf 'full_units=%s\n' "$SELECTION_FULL_UNITS"
            printf 'plan_digest=%s\n' "$SELECTION_PLAN_DIGEST"
          } > .velnor-ci-selection/velnor-ci-selection
      - name: Mark selection transport end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/SELECTION_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Provision pinned workflow policy runtime
        if: ${{ inputs.policy_runtime }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_PATH: ${{ github.workspace }}
          PRODUCT_REPOSITORY: tailrocks/velnor
          DEFAULT_BRANCH: main
        run: |
          set -euo pipefail
          [[ "$PRODUCT_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::invalid generator repository $PRODUCT_REPOSITORY" >&2; exit 1; }
          PINNED_REVISION="$(sed -n -E 's/^[[:space:]]*revision[[:space:]]*=[[:space:]]*\"([0-9a-f]{40})\".*/\1/p' "$CHECKOUT_PATH/.github-gen/velnor-workflow.toml" | head -n 1)"
          [[ "$PINNED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::D19 pin missing from .github-gen/velnor-workflow.toml" >&2; exit 1; }
          listing=""
          if git -C "$CHECKOUT_PATH" cat-file -e "$PINNED_REVISION^{commit}" 2>/dev/null; then
            listing="$(git -C "$CHECKOUT_PATH" ls-tree -r "$PINNED_REVISION" -- crates/velnor-workflow Cargo.toml Cargo.lock rust-toolchain.toml rust-toolchain .cargo)"
          else
            tree="$(gh api "repos/$PRODUCT_REPOSITORY/git/trees/$PINNED_REVISION?recursive=1")" || { echo "::error::unknown generator revision $PINNED_REVISION in $PRODUCT_REPOSITORY" >&2; exit 1; }
            [[ "$(jq -r '.truncated // false' <<<"$tree")" != "true" ]] || { echo "::error::tree API response is truncated; the source closure cannot be proven" >&2; exit 1; }
            listing="$(jq -er '[.tree[] | select(.type != "tree") | select(.path == "Cargo.toml" or .path == "Cargo.lock" or .path == "rust-toolchain.toml" or .path == "rust-toolchain" or (.path | startswith("crates/velnor-workflow/")) or (.path | startswith(".cargo/"))) | "\(.mode) \(.type) \(.sha)\t\(.path)"] | sort | join("\n")' <<<"$tree")"
          fi
          [[ -n "$listing" ]] || { echo "::error::revision $PINNED_REVISION has no closure inputs" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            closure="$(printf '%s\nclosure-version:1\nfeatures:\nprofile:release\n' "$(LC_ALL=C sort <<<"$listing")" | sha256sum | awk '{print $1}')"
          else
            closure="$(printf '%s\nclosure-version:1\nfeatures:\nprofile:release\n' "$(LC_ALL=C sort <<<"$listing")" | shasum -a 256 | awk '{print $1}')"
          fi
          binary="${CARGO_HOME:-$HOME/.cargo}/bin/velnor-workflow-policy"
          tag="velnor-workflow-runtime-v1-${closure:0:16}"
          asset="velnor-workflow-${RUNNER_OS}-${RUNNER_ARCH}"
          product_owner="${PRODUCT_REPOSITORY%%/*}"
          source_ref="refs/heads/$DEFAULT_BRANCH"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          if ! gh release download "$tag" --repo "$PRODUCT_REPOSITORY" --pattern manifest.json --dir "$temporary"; then
            echo "::error::no policy runtime product for revision $PINNED_REVISION (closure ${closure:0:16}); the mainline runtime-product publisher builds it after merge" >&2
            exit 1
          fi
          gh attestation verify "$temporary/manifest.json" --owner "$product_owner" --signer-workflow "$PRODUCT_REPOSITORY/.github/workflows/ci-runtime-products.yml" --source-ref "$source_ref"
          jq -e --arg closure "$closure" --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" --arg asset "$asset" '.closure == $closure and (.revision | test("^[0-9a-f]{40}$")) and .profile == "release" and .features == "" and (.products[$platform].binary | test("^[0-9a-f]{64}$")) and .products[$platform].asset == $asset' "$temporary/manifest.json" >/dev/null
          manifest_revision="$(jq -er '.revision' "$temporary/manifest.json")"
          expected="$(jq -er --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" '.products[$platform].binary' "$temporary/manifest.json")"
          existing=""
          if [[ -x "$binary" ]]; then
            if command -v sha256sum >/dev/null 2>&1; then
              existing="$(sha256sum "$binary" | awk '{print $1}')"
            else
              existing="$(shasum -a 256 "$binary" | awk '{print $1}')"
            fi
          fi
          source_binary="$binary"
          if [[ "$existing" != "$expected" ]]; then
            gh release download "$tag" --repo "$PRODUCT_REPOSITORY" --pattern "$asset" --dir "$temporary"
            gh attestation verify "$temporary/$asset" --owner "$product_owner" --signer-workflow "$PRODUCT_REPOSITORY/.github/workflows/ci-runtime-products.yml" --source-ref "$source_ref"
            if command -v sha256sum >/dev/null 2>&1; then
              actual="$(sha256sum "$temporary/$asset" | awk '{print $1}')"
            else
              actual="$(shasum -a 256 "$temporary/$asset" | awk '{print $1}')"
            fi
            [[ "$actual" == "$expected" ]] || { echo "::error::policy runtime digest mismatch" >&2; exit 1; }
            install -Dm0755 "$temporary/$asset" "$binary"
            source_binary="$temporary/$asset"
          fi
          job_directory="$RUNNER_TEMP/velnor-workflow-policy/${GITHUB_RUN_ID:-local}/${GITHUB_JOB:-policy}/${GITHUB_RUN_ATTEMPT:-1}/$expected"
          mkdir -p "$job_directory"
          chmod 0700 "$job_directory"
          job_binary="$job_directory/velnor-workflow-policy"
          install -Dm0755 "$source_binary" "$job_binary"
          chmod 0555 "$job_binary"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$job_binary" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$job_binary" | awk '{print $1}')"
          fi
          [[ "$actual" == "$expected" ]] || { echo "::error::content-addressed policy runtime digest mismatch" >&2; exit 1; }
          reported_revision="$("$job_binary" --revision)"
          [[ "$reported_revision" == "$manifest_revision" ]] || { echo "::error::policy runtime reports revision $reported_revision, manifest names $manifest_revision" >&2; exit 1; }
          reported_closure="$("$job_binary" --closure)"
          [[ "$reported_closure" == "$closure" ]] || { echo "::error::pinned workflow policy runtime reports closure $reported_closure, expected $closure" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$job_binary" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$job_binary" | awk '{print $1}')"
          fi
          [[ "$actual" == "$expected" ]] || { echo "::error::content-addressed policy runtime changed during verification" >&2; exit 1; }
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$job_binary" >> "$GITHUB_ENV"
          echo "VELNOR_WORKFLOW_PINNED_BINARY_SHA256=$expected" >> "$GITHUB_ENV"
          echo "VELNOR_WORKFLOW_PINNED_BINARY_REVISION=$manifest_revision" >> "$GITHUB_ENV"
          echo "VELNOR_WORKFLOW_PINNED_BINARY_CLOSURE=$closure" >> "$GITHUB_ENV"
      - name: Install declared Mise tools
        if: ${{ inputs.mise_tools != '' }}
        env:
          MISE_TOOLS: ${{ inputs.mise_tools }}
        run: |
          set -euo pipefail
          read -ra tools <<<"$MISE_TOOLS"
          mise --yes install "${tools[@]}"
      - name: Set up Mr. Boxington
        id: mbx-cache
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
      - name: Mark tool bootstrap end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/TOOL_BOOTSTRAP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Mark cache prep end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CACHE_PREP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Mark cargo fetch end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CARGO_FETCH_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Run unit checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: ${{ inputs.unit }}
          CI_PROVIDER: ${{ inputs.provider }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          VELNOR_SELECTION_FILE: .velnor-ci-selection/velnor-ci-selection
          CARGO_NET_OFFLINE: ${{ inputs.cargo_net_offline }}
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -o pipefail
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          rc=0
          velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit "$CI_UNIT_ID" --provider "$CI_PROVIDER" 2>&1 | tee "$RUNNER_TEMP/velnor-unit-log.txt" || rc=$?
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          exit $rc
      - name: Mark cleanup end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CLEANUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Report phase timings and cache outcomes
        if: always()
        uses: ./.github/actions/report-velnor-ci-outcomes
        with:
          job_label: ${{ inputs.unit }}
          ci_lane: github
          cache_mold_primary: ${{ steps.mold-cache.outputs.cache-primary-key }}
          cache_mold_matched: ${{ steps.mold-cache.outputs.cache-matched-key }}
          cache_mbx_hit: ${{ steps.mbx-cache.outputs.cache-hit }}
          cache_mbx_primary: ${{ steps.mbx-cache.outputs.cache-primary-key }}
      - name: Record provider result identity
        id: result-identity
        if: always()
        shell: bash
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          SOURCE_SHA: ${{ inputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          UNIT_ID: ${{ inputs.unit }}
          PROVIDER: ${{ inputs.provider }}
          SELECTED_UNITS: ${{ inputs.selected_units }}
          OBSERVED_RUNNER_OS: ${{ runner.os }}
          OBSERVED_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          planned_unit="$(jq -cer --arg unit "$UNIT_ID" --arg provider "$PROVIDER" '[.[] | select(.unit_id == $unit and (.providers | index($provider) != null))] | if length == 1 then .[0] else error("plan must contain exactly one unit/provider result") end' <<<"$SELECTED_UNITS")"
          case "$OBSERVED_RUNNER_OS/$OBSERVED_RUNNER_ARCH" in
            Linux/X64) platform=linux-x64 ;;
            Linux/ARM64) platform=linux-arm64 ;;
            macOS/ARM64) platform=macos-arm64 ;;
            *) echo "::error::unsupported provider runner platform $OBSERVED_RUNNER_OS/$OBSERVED_RUNNER_ARCH" >&2; exit 1 ;;
          esac
          command_digest="$(jq -er '.command_digest // empty' <<<"$planned_unit")"
          identity="$(jq -cn --arg repository_id "$REPOSITORY_ID" --arg source_sha "$SOURCE_SHA" --arg run_id "$RUN_ID" --arg run_attempt "$RUN_ATTEMPT" --arg plan_digest "$PLAN_DIGEST" --arg unit_id "$UNIT_ID" --arg provider "$PROVIDER" --arg platform "$platform" --arg command_digest "$command_digest" '{repository_id:$repository_id,source_sha:$source_sha,run_id:$run_id,run_attempt:$run_attempt,plan_digest:$plan_digest,unit_id:$unit_id,provider:$provider,platform:$platform,command_digest:$command_digest}')"
          printf 'value=%s\n' "$identity" >> "$GITHUB_OUTPUT"


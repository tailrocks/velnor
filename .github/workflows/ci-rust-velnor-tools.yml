          key: ci-${{ runner.os }}-rust-velnor-tools-${{ hashFiles('.cargo/**', 'Cargo.toml', 'crates/velnor-tools/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain') }}

# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Nightly
run-name: Nightly · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force the red-to-signal test path
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:

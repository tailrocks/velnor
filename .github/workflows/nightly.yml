            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI unit opentofu failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          if [[ "$selected" == *",rust-policy,"* ]]; then
            result="$(result_for_job group-rust)"
            case "$result" in

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@6e59b98d5d1a6d42017465b045554a18d97d7e68
        with:
          rev: 6e59b98d5d1a6d42017465b045554a18d97d7e68
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_SELECTION_FILE: ${{ runner.temp }}/velnor-ci-selection
        run: velnor-workflow plan --config .github/ci/project.toml

      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-6e59b98d5d1a6d42017465b045554a18d97d7e68
          path: ~/.cargo/bin/velnor-workflow
          if-no-files-found: error
          retention-days: 7
      - name: Publish Velnor CI selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-ci-selection
          path: ${{ runner.temp }}/velnor-ci-selection
          if-no-files-found: error
          retention-days: 1

  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Planning
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@2915303ede0bc89dc4746b833ba5d1e6e6f908da
        with:
          rev: 2915303ede0bc89dc4746b833ba5d1e6e6f908da
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: velnor-workflow plan --config .github/ci/project.toml

      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime
          path: ~/.cargo/bin/velnor-workflow
          if-no-files-found: error
          retention-days: 1

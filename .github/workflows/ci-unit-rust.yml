          mkdir -p "$timing_dir"
          marker="$timing_dir/CLEANUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Report phase timings and cache outcomes
        if: always()
        uses: ./.github/actions/report-velnor-ci-outcomes
        with:
          job_label: rust-production-topology

  velnor-rust-production-topology:
    name: rust-production-topology
    if: ${{ inputs.lane == 'velnor' && contains(format(',{0},', inputs.selected_units), ',rust-production-topology,') && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'merge_group' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'velnor' || github.event.inputs.runner == 'both' || github.event.inputs.runner == '')))) }}
    runs-on: [self-hosted, velnor-target-mvp]
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    timeout-minutes: 45
    steps:
      - name: Mark CI job start
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/JOB_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - name: Velnor runner identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Velnor runner identity'
            echo
            echo "- Host: ${VELNOR_HOST:-unset}"
            echo "- Instance: ${VELNOR_INSTANCE:-unset}"
            echo "- Slot: ${VELNOR_SLOT:-unset}"
            echo "- GitHub runner: ${RUNNER_NAME:-unset}"
            echo "- OS/arch: ${RUNNER_OS:-unset}/${RUNNER_ARCH:-unset}"
            echo "- Execution backend: ${VELNOR_EXECUTION_BACKEND:-unset}"
            echo "- Velnor version: ${VELNOR_MANIFEST_VERSION:-${VELNOR_SOURCE_SHA:-unset}}"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Mark runner setup end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/RUNNER_SETUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Materialize Velnor CI selection
        shell: bash
        env:
          SELECTION_BASE_SHA: ${{ inputs.base_sha }}
          SELECTION_HEAD_SHA: ${{ inputs.head_sha }}
          SELECTION_SCOPE: ${{ inputs.scope }}
          SELECTION_UNITS: ${{ inputs.selected_units }}
          SELECTION_FULL_UNITS: ${{ inputs.full_units }}
        run: |
          set -euo pipefail
          mkdir -p .velnor-ci-selection
          {
            printf 'version=1\n'
            printf 'base_sha=%s\n' "$SELECTION_BASE_SHA"
            printf 'head_sha=%s\n' "$SELECTION_HEAD_SHA"
            printf 'scope=%s\n' "$SELECTION_SCOPE"
            printf 'units=%s\n' "$SELECTION_UNITS"
            printf 'full_units=%s\n' "$SELECTION_FULL_UNITS"
          } > .velnor-ci-selection/velnor-ci-selection
      - name: Mark selection transport end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/SELECTION_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
      - name: Mark tool bootstrap end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/TOOL_BOOTSTRAP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then

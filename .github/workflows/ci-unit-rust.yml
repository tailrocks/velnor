          VELNOR_LANE_NAME: Velnor
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/velnor-unit-log.txt"

concurrency:
  group: preview-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  guest-payload:
    name: Guest payload ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install guest image build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc libssl-dev libelf-dev xz-utils e2fsprogs mmdebstrap debootstrap arch-test gcc-aarch64-linux-gnu
      - name: Restore guest seed
        id: guest-seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .guest-seed/${{ matrix.arch }}
          key: guest-seed-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'crates/velnor-bench/**', 'crates/velnor-client/**', 'crates/velnor-control/**', 'crates/velnor-model/**', 'crates/velnor-render/**', 'crates/velnor-runner/**', 'crates/velnor-runner/Cargo.toml', 'crates/velnor-runner/build.rs', 'crates/velnor-runner/src/**', 'crates/velnor-tools/**', 'crates/velnor-workflow-contract/**', 'crates/velnor-workflow/**', 'crates/velnorctl/**', 'microvm/**', 'rust-toolchain.toml') }}
      - name: Build guest agent for rootfs
        run: |
          set -euo pipefail
          rustup target add "$TARGET"
          agent="target/$TARGET/release/velnor-guest-agent"
          cargo build --locked --release --package velnor-runner --bin velnor-guest-agent --target "$TARGET"
          test -x "$agent"
      - name: Reuse verified guest seed
        id: guest-seed-reuse
        run: |
          set -euo pipefail
          seed=".guest-seed/${{ matrix.arch }}"
          if [ ! -s "$seed/vmlinux" ] || [ ! -s "$seed/vmlinux.sha256" ] || [ ! -s "$seed/rootfs.ext4" ] || [ ! -s "$seed/rootfs.sha256" ]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! (cd "$seed" && sha256sum --check --strict vmlinux.sha256) \
            || ! (cd "$seed" && sha256sum --check --strict rootfs.sha256); then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p release/microvm
          cp "$seed/vmlinux" "$seed/rootfs.ext4" "$seed/rootfs.sha256" release/microvm/
          cp "target/$TARGET/release/velnor-guest-agent" release/microvm/velnor-guest-agent
          echo "restored=true" >> "$GITHUB_OUTPUT"
      - name: Download pinned kernel tarball
        if: steps.guest-seed-reuse.outputs.restored != 'true'
        run: |
          set -euo pipefail
          url="$(jq -er '.kernel_tarball' microvm/pins.json)"
          sha="$(jq -er '.kernel_tarball_sha256' microvm/pins.json)"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 900 -o linux.tar.xz "$url"
          echo "$sha  linux.tar.xz" | sha256sum --check --strict
      - name: Build guest vmlinux and rootfs.ext4
        if: steps.guest-seed-reuse.outputs.restored != 'true'
        run: |
          set -euo pipefail
          mkdir -p release/microvm
          agent="target/$TARGET/release/velnor-guest-agent"
          cargo run --locked --release --package velnor-runner --bin velnor-guest-image -- \
            build --arch "${{ matrix.arch }}" --out release/microvm \
            --tarball linux.tar.xz --guest-agent "$agent"
          test -s release/microvm/vmlinux
          test -s release/microvm/rootfs.ext4
          cp "$agent" release/microvm/velnor-guest-agent
          (cd release/microvm && sha256sum rootfs.ext4 > rootfs.sha256)
      - name: Collect verified guest seed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guest-seed.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          seed=".guest-seed/${{ matrix.arch }}"
          mkdir -p "$seed"
          cp release/microvm/vmlinux release/microvm/rootfs.ext4 release/microvm/rootfs.sha256 "$seed/"
          (cd "$seed" && sha256sum vmlinux > vmlinux.sha256)
          (cd "$seed" && sha256sum --check --strict vmlinux.sha256)
          (cd "$seed" && sha256sum --check --strict rootfs.sha256)
      - name: Save guest seed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.guest-seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .guest-seed/${{ matrix.arch }}
          key: guest-seed-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'crates/velnor-bench/**', 'crates/velnor-client/**', 'crates/velnor-control/**', 'crates/velnor-model/**', 'crates/velnor-render/**', 'crates/velnor-runner/**', 'crates/velnor-runner/Cargo.toml', 'crates/velnor-runner/build.rs', 'crates/velnor-runner/src/**', 'crates/velnor-tools/**', 'crates/velnor-workflow-contract/**', 'crates/velnor-workflow/**', 'crates/velnorctl/**', 'microvm/**', 'rust-toolchain.toml') }}
      - name: Upload guest payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-payload-${{ matrix.arch }}
          path: release/microvm
          if-no-files-found: error
          retention-days: 2

  build:
    name: Preview / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    if: ${{ (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-gnu
            lane: velnor
            runner: { group: velnor-trusted, labels: [self-hosted, velnor-target-mvp] }
          - target: aarch64-unknown-linux-gnu
            lane: github
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-gnu
            lane: velnor
            runner: { group: velnor-trusted, labels: [self-hosted, velnor-target-mvp] }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@172845cf0307d99b2af1e29f58d4880519c6fb31
        with:
          rev: 172845cf0307d99b2af1e29f58d4880519c6fb31
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=172845cf0307d99b2af1e29f58d4880519c6fb31" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: velnor-workflow policy --workflow-root "$GITHUB_WORKSPACE"
      - name: Restore Rust toolchain
        id: rustup-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Provision Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add 'aarch64-apple-darwin' 'aarch64-unknown-linux-gnu' 'x86_64-apple-darwin' 'x86_64-unknown-linux-gnu' 'x86_64-unknown-linux-musl'
      - name: Save Rust toolchain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rustup-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build preview binary
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: mbx build --locked --release --package velnor-runner --bin velnor-runner --target "${{ matrix.target }}"
      - name: Package preview binary
        run: velnor-workflow release package-binary --target "${{ matrix.target }}" --version preview --package velnor-runner --binary velnor-runner
      - name: Attest preview artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish rolling preview
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-preview
    permissions:
      contents: write
    steps:
      - name: Download preview artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: github-*
          merge-multiple: true
      - name: Verify preview provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Replace rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title "Rolling preview"
          gh release edit preview --target "${{ github.sha }}" --prerelease
          gh release upload preview dist/* --clobber

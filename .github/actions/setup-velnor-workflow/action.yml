        gh api "repos/$PRODUCT_REPOSITORY/git/blobs/$workspace_blob" | jq -er '.content' | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$manifests/workspace.toml"
        else

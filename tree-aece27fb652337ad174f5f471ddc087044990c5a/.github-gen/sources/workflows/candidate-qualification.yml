# Generated by velnor-workflow. DO NOT EDIT.
# Source: .github-gen/sources/workflows/candidate-qualification.yml
#
# Unprivileged candidate renderer qualification. This workflow is deliberately
# outside the generated workflow graph: changing it never makes candidate
# output an active-tree authority.
name: Candidate renderer qualification

on:
  pull_request:
    paths:
      - 'crates/velnor-workflow/**'
      - '.github-gen/**'
      - '.github-gen/sources/workflows/candidate-qualification.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.cargo/**'

# Candidate qualification is commit-specific, but only the newest commit on a
# pull request can satisfy its current required check. Cancel obsolete builds
# within that PR while keeping independent pull requests isolated.
concurrency:
  group: candidate-qualification-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render candidate twice
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build untrusted candidate
        env:
          CARGO_NET_OFFLINE: 'false'
        run: cargo build --locked -p velnor-workflow
      - name: Render candidate into disposable trees
        env:
          CANDIDATE: ${{ github.workspace }}/target/debug/velnor-workflow
        run: |
          set -euo pipefail
          candidate_root="$(mktemp -d)"
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN "$CANDIDATE" --plain --force --output "$candidate_root/one" .
          env -u GITHUB_TOKEN -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN "$CANDIDATE" --plain --force --output "$candidate_root/two" .
          diff -ru "$candidate_root/one" "$candidate_root/two"

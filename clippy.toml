msrv = "1.98.0"
check-incompatible-msrv-in-tests = true
avoid-breaking-exported-api = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
too-many-lines-threshold = 150
cognitive-complexity-threshold = 58
excessive-nesting-threshold = 5
too-many-arguments-threshold = 7
disallowed-methods = [
    { path = "std::process::Command::output", reason = "blocking subprocess output must not run on runtime threads" },
    { path = "std::thread::sleep", reason = "blocking sleep must use async sleep or an owned OS thread" },
    { path = "std::fs::File::open", reason = "blocking filesystem opens must use async file work or spawn_blocking" },
    { path = "std::fs::OpenOptions::open", reason = "blocking filesystem opens must use async file work or spawn_blocking" },
]

        if: steps.guest-seed-reuse.outputs.restored != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist/microvm
          agent="target/$TARGET/release/velnor-guest-agent"
          mbx run --locked --release --package velnor-runner --bin velnor-guest-image -- \
            build --arch "${{ matrix.arch }}" --out dist/microvm --tarball linux.tar.xz \

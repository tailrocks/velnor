          else
            sudo tar --directory /usr/local --strip-components=1 --no-overwrite-dir -xzf "$archive"
            sudo ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld 2>/dev/null || printf /usr/bin/ld)"
          fi
          mold --version | grep -F "$MOLD_VERSION"
      - name: Add Rust target
        run: rustup target add "$TARGET"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install cargo-deb
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          cargo install cargo-deb --version 3.7.0 --locked
          cargo-deb --version
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-metadata
          path: metadata
      - name: Build release runner binary
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          mbx build --locked --release --package velnor-runner --bin velnor-runner --features release-build --target "$TARGET"
      - name: Build sibling binaries for the deb
        env:
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: sccache
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          while IFS= read -r sibling; do
            [ -n "$sibling" ] || continue
            if jq -e --arg p "$sibling" '.packages[] | select(.name == $p) | .features | has("release-build")' <<<"$metadata" >/dev/null; then
              features="--features release-build"
            else
              features=""
            fi
            # shellcheck disable=SC2086
            mbx build --locked --release --package "$sibling" $features --target "$TARGET"
          done < <(jq -r --arg release 'velnor-runner' '.packages[] | select(.name != $release) | select(.targets | map(.kind[]) | flatten | any(. == "bin")) | .name' <<<"$metadata" | sort -u)
      - name: Stage acyclic identity files packaged into the deb
        run: |
          set -euo pipefail
          test -s metadata/build-identity.json || { echo "::error::release metadata missing build-identity.json" >&2; exit 1; }
          test -s metadata/manifest.json || { echo "::error::release metadata missing manifest.json" >&2; exit 1; }
          jq -e '.source_sha and .crate_version' metadata/build-identity.json >/dev/null
          jq -e 'type == "object"' metadata/manifest.json >/dev/null
          jq -e --arg sha "$SOURCE_COMMIT" '.source_sha == $sha' metadata/build-identity.json >/dev/null \
            || { echo "::error::build identity source_sha != preview source commit $SOURCE_COMMIT" >&2; exit 1; }

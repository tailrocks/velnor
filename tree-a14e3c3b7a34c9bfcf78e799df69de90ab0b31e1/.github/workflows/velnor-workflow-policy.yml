name: Velnor workflow policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  policy:
    name: Enforce workflow policy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Velnor workflow runtime
        env:
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev 31e8e026f655d816a04e7010302004a2bbfd225a \
            --root "$VELNOR_WORKFLOW_ROOT" \
            --bin velnor-workflow
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"

      - name: Enforce workflow policy
        run: velnor-workflow policy --workflow-root "$GITHUB_WORKSPACE"

# Reproducible Firecracker guest. Built on Linux CI; checksummed into
# manifest.json. macOS cannot produce the kernel/rootfs bytes.

kernel_version = "6.1.102"
kernel_tarball_sha256 = "1ba5f93b411ead7587fe48b2eec6c656f6796d31f5e406d236913c77512497ec"
# Firecracker-tested LTS class. Exact source:
# https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.102.tar.xz
# Ubuntu packages come from this immutable snapshot, not moving noble.
ubuntu_snapshot = "https://snapshot.ubuntu.com/ubuntu/20260826T000000Z"

[kconfig]
required = [
  "CONFIG_VIRTIO=y",
  "CONFIG_VIRTIO_BLK=y",
  "CONFIG_VIRTIO_NET=y",
  "CONFIG_VIRTIO_VSOCKETS=y",
  "CONFIG_VIRTIO_MMIO=y",
  "CONFIG_OVERLAY_FS=y",
  "CONFIG_KVM_GUEST=y",
  "CONFIG_BINFMT_MISC=y",
  "CONFIG_NETFILTER=y",
  "CONFIG_NF_TABLES=y",
]
forbidden = [
  "CONFIG_VIRTIO_FS=y",
  "CONFIG_FUSE_FS=y",
  "CONFIG_PCI=y",
  "CONFIG_USB=y",
]

[rootfs]
packages = [
  "containerd",
  "runc",
  "docker-engine",
  "buildkit",
  "iptables",
  "nftables",
  "ca-certificates",
  "iproute2",
]
forbidden_packages = [
  "openssh-server",
  "openssh-sftp-server",
]
no_sshd = true
no_host_docker_socket = true
job_image = "velnor/job-ubuntu:26.04"

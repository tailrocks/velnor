[package]
name = "velnor-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Static GitHub Actions workflow generator and CI execution client"

[lib]
name = "velnor_workflow"
path = "src/lib.rs"

[[bin]]
name = "velnor-workflow"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
crossterm = "0.29.0"
globset = { workspace = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
termrock = { git = "https://github.com/tailrocks/termrock.git", rev = "5283c2acf9154d0cfcd37b1ffe821c00faf90ea2", features = ["crossterm"] }
toml = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

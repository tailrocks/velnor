[package]
name = "velnor-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Static GitHub Actions workflow generator and CI execution client"

[lib]
name = "velnor_workflow"
path = "src/lib.rs"

[[bin]]
name = "velnor-workflow"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
crossterm = { version = "0.29.0", optional = true }
globset = { workspace = true }
libc = { workspace = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"], optional = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true }
tar = { workspace = true }
termrock = { git = "https://github.com/tailrocks/termrock.git", rev = "5283c2acf9154d0cfcd37b1ffe821c00faf90ea2", features = ["crossterm"], optional = true }
toml = { workspace = true }
uuid = { workspace = true }

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:ratatui", "dep:termrock"]

[build-dependencies]
sha2 = { workspace = true }

# Contract tests prove emitted `install_args` pass the runner's own lock gate.
# Dev-only: the shipped generator never links the runner.
[dev-dependencies]
velnor-runner = { path = "../velnor-runner" }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

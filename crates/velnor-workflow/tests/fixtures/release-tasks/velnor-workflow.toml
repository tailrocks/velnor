schema = 2

[generator]
repository = "example/synthetic-release"

[workflow]
providers = ["github-hosted", "velnor"]
automatic_providers = ["github-hosted", "velnor"]
default_dispatch_providers = ["github-hosted", "velnor"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[workflow.selectors.velnor]
runs_on = ["self-hosted", "example-lane"]

[release]
enabled = true
kind = "tasks"
tag_pattern = "v[0-9]*"

[[release.job]]
id = "build"
tasks = ["build-release", "verify-release"]
modes = ["validate", "publish"]

[[release.job]]
id = "sign"
name = "Sign release"
tasks = ["sign-release"]
needs = ["build"]
runner = "macos"
modes = ["publish"]
timeout_minutes = 45
environment = "example-signing"
attest_subjects = ["dist/example-app.zip"]

[release.job.permissions]
id-token = "write"
attestations = "write"

[release.job.env]
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"
SIGNING_KEY_ID = "${{ secrets.EXAMPLE_SIGNING_KEY_ID }}"

[[release.job]]
id = "manual-review"
tasks = ["review-release"]
modes = ["validate"]

[[declare]]
primitive = "release"
file = "release.yml"

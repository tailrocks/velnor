schema = 2

[generator]
repository = "example/swift-ffi"

[workflow]
providers = ["github-hosted", "github-self-hosted", "velnor"]
automatic_providers = ["github-hosted", "github-self-hosted", "velnor"]
default_dispatch_providers = ["github-hosted", "github-self-hosted", "velnor"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[workflow.selectors.github-self-hosted]
runs_on = ["bastion-scale-set"]

[workflow.selectors.velnor]
runs_on = ["self-hosted", "example-lane"]

[[declare]]
primitive = "renovate"
file = "renovate.yml"

[[declare]]
primitive = "renovate-validate"
file = "renovate-validate.yml"

[renovate]
enabled = true
reason = "fixture exercises an explicit Velnor writer selector"
schedule = "0 6 * * *"
token = "GH_RENOVATE_TOKEN"
config = "renovate.json"
validate = true

# The Swift client consumes the Rust FFI crate's output; an FFI change must
# select the Swift unit even though no Swift file changed.
[[units]]
id = "swift-package-clients-apple"
kind = "swift"
root = "clients/apple"
platform = "macos-arm64"
depends_on = ["rust-engine-ffi"]

schema = 2

[generator]
repository = "example/swift-ffi"

[workflow]
providers = ["github-hosted", "velnor"]

[workflow.selectors.velnor]
runs_on = ["self-hosted", "example-lane"]

[[declare]]
primitive = "renovate"
file = "renovate.yml"

[[declare]]
primitive = "renovate-validate"
file = "renovate-validate.yml"

[renovate]
enabled = true
reason = "fixture exercises the writer surface"
schedule = "0 6 * * *"
token = "GH_RENOVATE_TOKEN"
config = "renovate.json"
validate = true

# The Swift client consumes the Rust FFI crate's output; an FFI change must
# select the Swift unit even though no Swift file changed.
[[units]]
id = "swift-package-clients-apple"
depends_on = ["rust-engine-ffi"]

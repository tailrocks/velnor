schema = 1

[generator]
repository = "example/check-profiles-fixture"

[workflow]
runners = "both"
velnor_labels = ["self-hosted", "example-lane"]

[[check_profile]]
id = "smoke"
name = "Smoke probe"
schedule = "23 2 * * *"
tasks = ["check-smoke"]
timeout_minutes = 30

[[check_profile]]
id = "load"
name = "Load probe"
schedule = "23 2 * * *"
tasks = ["check-load", "check-load-report"]
needs = ["smoke"]
timeout_minutes = 90
artifacts = ["load-results/"]
status = "advisory"
env = { MAX_SECONDS = "300" }

[[check_profile]]
id = "fleet"
name = "Fleet probe"
schedule = "23 2 * * *"
runner = "velnor"
tasks = ["check-fleet"]
timeout_minutes = 45

[[check_profile]]
id = "compat"
name = "Compat probe"
schedule = "41 4 * * 1"
runner = "macos"
tools = ["ripgrep"]
tasks = ["check-compat"]
timeout_minutes = 60
status = "advisory"

[[declare]]
primitive = "scheduled-checks"
file = "scheduled-daily.yml"

[declare.args]
profiles = ["smoke", "load", "fleet"]

[[declare]]
primitive = "scheduled-checks"
file = "scheduled-weekly.yml"

[declare.args]
profiles = ["compat"]

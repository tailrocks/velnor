# Neutral schema-2 release contract fixture for `synthetic_surface.rs`.
# The publisher and preview rows render this typed contract without copying
# generation-only bindings into `.github/ci/project.toml`.
schema = 2

[generator]
repository = "example/synthetic-release"

[workflow]
providers = ["github-hosted", "velnor"]
automatic_providers = ["github-hosted", "velnor"]
default_dispatch_providers = ["github-hosted", "velnor"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-24.04"]

[workflow.selectors.velnor]
runs_on = ["self-hosted", "example-lane"]

[release]
enabled = true
kind = "rust-binary"
package = "app"
binary = "app"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
manifest_schema = "example.test/consumer-manifest-v1"
producer_workflow = "CI"
producer_conclusion = "success"
modes = ["validate", "build", "rehearse"]
archive_members = ["app-role"]
archive_checksum = "sha256"
archive_retention_days = 14

[[release.credential]]
name = "store"
setup = "mount-example-store"
teardown = "unmount-example-store"

[[declare]]
primitive = "release"
file = "release.yml"

[[declare]]
primitive = "preview"
file = "preview.yml"

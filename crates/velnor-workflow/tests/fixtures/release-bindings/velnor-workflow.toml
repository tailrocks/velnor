# Neutral example: release and preview event bindings, drill modes, archive
# contents, and credential teardown for a Rust binary publisher.
#
# This file is a test fixture (see `declared_release_bindings_render`): the
# generator must accept it and render every binding below. All names are
# fixture-local; no consumer repository is named.
#
# The contract lives in `[release]`; the bare `[[declare]]` rows below
# render every provider from it with no per-row arguments. The stable
# publisher takes the drill modes, archive contract, and credential
# pairing, while the rolling preview additionally binds the trusted producer.
# Publication stays tag-triggered (stable) or admitted-producer-triggered
# (rolling); `publish` is never a dispatch mode.
schema = 2

[generator]
repository = "example/synthetic-release"

[workflow]

[workflow.selectors.velnor]
runs_on = ["self-hosted", "example-lane"]

[release]
enabled = true
kind = "rust-binary"
package = "app"
binary = "app"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
manifest_schema = "example.test/consumer-manifest-v1"
producer_workflow = "CI"
producer_conclusion = "success"
modes = ["validate", "build", "rehearse"]
archive_members = ["app-role"]
archive_checksum = "sha256"
archive_retention_days = 14

[[release.credential]]
name = "store"
setup = "mount-example-store"
teardown = "unmount-example-store"

[[declare]]
primitive = "release"
file = "release.yml"

[[declare]]
primitive = "preview"
file = "preview.yml"

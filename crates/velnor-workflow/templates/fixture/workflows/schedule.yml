name: schedule

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      lanes:
        description: "velnor | github | both (default: both)"
        type: choice
        default: both
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: schedule-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

defaults:
  run:
    shell: bash

jobs:
  scheduled-check:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'both')) && ('[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]') || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && ('[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]') || '[{"lane":"Velnor","runner":{"group":"velnor-trusted","labels":"velnor-target-mvp"},"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    env:
      EVENT_NAME: ${{ github.event_name }}
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-static-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain', 'mise.toml', 'mise.lock', '**/Cargo.toml') }}
          restore-keys: |
            velnor-static-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-
          save-on-workflow-dispatch: true
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fixture-schedule-${{ matrix.config.lane }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fixture-schedule-${{ matrix.config.lane }}-${{ runner.os }}-
      - name: Cache Cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: fixture-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: fixture-target-${{ matrix.config.lane }}-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mise.toml', '**/Cargo.toml', 'Cargo.lock') }}-
      - run: mbx check --workspace --locked
      - name: Run fixture-harness tests and emit evidence
        id: tests
        env:
          LANE: ${{ matrix.config.lane }}
        run: |
          set -euo pipefail
          mbx nextest run --locked -p fixture-harness --all-targets
          mbx run --quiet --locked -p fixture-harness --example command_files
          tmp_dir="$(mktemp -d)"
          mkdir -p "${tmp_dir}/tree/nested"
          printf '%s\n' alpha > "${tmp_dir}/tree/nested/a.txt"
          mbx run --quiet --locked -p fixture-harness --example artifact_tree -- "${tmp_dir}/tree" > "${tmp_dir}/tree.txt"
          test -s "${tmp_dir}/tree.txt"
          mbx run --quiet --locked -p fixture-harness --example cache_payload -- schedule "${LANE,,}" > "${tmp_dir}/cache.txt"
          grep -q '^velnor.fixture.cache.v1$' "${tmp_dir}/cache.txt"
          printf '%s\n' release > "${tmp_dir}/fixture.tar.gz"
          mbx run --quiet --locked -p fixture-harness --example release_subject -- 0000000000000000000000000000000000000000 "${tmp_dir}/fixture.tar.gz" > "${tmp_dir}/subject.json"
          grep -q 'velnor.fixture.release-subject.v1' "${tmp_dir}/subject.json"
          cp "${tmp_dir}/tree.txt" "${tmp_dir}/cache.txt" "${tmp_dir}/subject.json" .
      # `steps` is computed by the runner, not written by this workflow, so the
      # outcome and conclusion of every step above are the behavioural signal
      # no workflow author can fabricate.
      - name: Dump runner-computed step outcomes
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > "${RUNNER_TEMP}/steps.json" <<'STEPS'
          ${{ toJSON(steps) }}
          STEPS
      - name: Collect observed lane evidence
        uses: ./.github/actions/collect-evidence
        with:
          scenario: schedule
          evidence-id: harness
          lane: ${{ matrix.config.lane == 'GitHub' && 'github' || 'velnor' }}
          output: evidence/schedule-${{ matrix.config.lane }}.json
          observations: |
            --observe-command command-files=mbx run --quiet --locked -p fixture-harness --example command_files
            --observe-file artifact-tree=tree.txt
            --observe-file cache-payload=cache.txt
            --observe-file release-subject=subject.json
            --observe-steps steps=${{ runner.temp }}/steps.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schedule-evidence-${{ matrix.config.lane }}
          path: evidence/schedule-${{ matrix.config.lane }}.json
          if-no-files-found: error
      - run: |
          {
            echo "### scheduled-check (${{ matrix.config.lane }})"
            echo "- event: ${EVENT_NAME}"
            echo "- ref: ${{ github.ref }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  compare:
    name: compare scheduled lanes
    needs: [scheduled-check]
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'both')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require both scheduled lanes to pass
        env:
          LANES_RESULT: ${{ needs.scheduled-check.result }}
        run: test "${LANES_RESULT}" = success
      # Checkout first: it cleans the workspace, which would delete the
      # downloaded lane artifacts if it ran after them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schedule-evidence-GitHub
          path: artifacts/github
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schedule-evidence-Velnor
          path: artifacts/velnor
      - uses: ./.github/actions/compare-evidence
        with:
          scenario: schedule
          directory: artifacts

  schedule-required:
    if: always()
    needs: [scheduled-check, compare]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/aggregate-needs
        with:
          needs-json: ${{ toJSON(needs) }}
          workflow-label: schedule

name: _actions-suite

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: github | velnor | both
        type: choice
        default: both
        options: [github, velnor, both]
  workflow_call:
    inputs:
      lane: {type: string, required: false, default: both}

permissions:
  actions: read
  contents: read

concurrency:
  group: actions-suite-${{ github.ref }}-${{ inputs.lanes || inputs.lane }}
  cancel-in-progress: false

jobs:
  probes:
    name: admitted actions (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON((inputs.lanes || inputs.lane) == 'both' && '["github","velnor"]' || format('["{0}"]', inputs.lanes || inputs.lane)) }}
    runs-on: ${{ matrix.lane == 'github' && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 25
    env:
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-static-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain', 'mise.toml', 'mise.lock', '**/Cargo.toml') }}
          restore-keys: |
            velnor-static-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ github.job }}-
          save-on-workflow-dispatch: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: fixture-${{ matrix.lane }}
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          cache-on-failure: true
      # These are direct GitHub-hosted probes. Velnor's microVM contract
      # excludes them, so the Velnor branch records expected unsupported state.
      - if: matrix.lane == 'github'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - if: matrix.lane == 'github'
        run: just --version
      - if: matrix.lane == 'velnor'
        name: Expected unsupported setup-just on Velnor microVM
        run: echo 'EXPECTED_UNSUPPORTED adapter=extractions/setup-just backend=microvm'
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3
        if: matrix.lane == 'github'
        with:
          dockerfile: Dockerfile.fixture
          no-fail: false
      - if: matrix.lane == 'velnor'
        name: Expected unsupported Hadolint on Velnor microVM
        run: echo 'EXPECTED_UNSUPPORTED adapter=hadolint/hadolint-action backend=microvm'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: matrix.lane == 'github'
        with:
          enablement: false
      - if: matrix.lane == 'velnor'
        name: Expected unsupported configure-pages on Velnor microVM
        run: echo 'EXPECTED_UNSUPPORTED adapter=actions/configure-pages backend=microvm'
      - if: matrix.lane == 'velnor'
        name: Expected unsupported github-script on Velnor microVM
        run: echo 'EXPECTED_UNSUPPORTED adapter=actions/github-script backend=microvm'
      - name: Run fixture-harness tests and examples
        id: tests
        run: |
          set -euo pipefail
          mbx nextest run --color never --locked -p fixture-harness --all-targets 2>&1 | tee nextest.log
          count="$(sed -n 's/.*Summary \[[^]]*\] *\([0-9][0-9]*\) test.*/\1/p' nextest.log | tail -1)"
          test -n "${count}"
          echo "FIXTURE_TEST_COUNT=${count}" >> "${GITHUB_ENV}"
          mbx run --quiet --locked -p fixture-harness --example command_files
          tmp_dir="$(mktemp -d)"
          mkdir -p "${tmp_dir}/tree/nested"
          printf '%s\n' alpha > "${tmp_dir}/tree/nested/a.txt"
          mbx run --quiet --locked -p fixture-harness --example artifact_tree -- "${tmp_dir}/tree" > "${tmp_dir}/tree.txt"
          test -s "${tmp_dir}/tree.txt"
          mbx run --quiet --locked -p fixture-harness --example cache_payload -- actions "${LANE}" > "${tmp_dir}/cache.txt"
          grep -q '^velnor.fixture.cache.v1$' "${tmp_dir}/cache.txt"
          printf '%s\n' release > "${tmp_dir}/fixture.tar.gz"
          mbx run --quiet --locked -p fixture-harness --example release_subject -- 0000000000000000000000000000000000000000 "${tmp_dir}/fixture.tar.gz" > "${tmp_dir}/subject.json"
          grep -q 'velnor.fixture.release-subject.v1' "${tmp_dir}/subject.json"
          cp "${tmp_dir}/tree.txt" "${tmp_dir}/cache.txt" "${tmp_dir}/subject.json" .
      # `steps` is computed by the runner, not written by this workflow, so the
      # outcome and conclusion of every step above are the behavioural signal
      # no workflow author can fabricate.
      - name: Dump runner-computed step outcomes
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat > "${RUNNER_TEMP}/steps.json" <<'STEPS'
          ${{ toJSON(steps) }}
          STEPS
      - name: Collect observed lane evidence
        uses: ./.github/actions/collect-evidence
        with:
          scenario: actions
          evidence-id: probes
          lane: ${{ matrix.lane }}
          output: evidence/actions-${{ matrix.lane }}.json
          observations: |
            --observe-env tests=FIXTURE_TEST_COUNT
            --observe-command command-files=mbx run --quiet --locked -p fixture-harness --example command_files
            --observe-file artifact-tree=tree.txt
            --observe-file cache-payload=cache.txt
            --observe-file release-subject=subject.json
            --observe-steps steps=${{ runner.temp }}/steps.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-actions-${{ matrix.lane }}
          path: evidence/actions-${{ matrix.lane }}.json
          if-no-files-found: error

  github-script:
    name: hosted github-script probe
    if: (inputs.lanes || inputs.lane) != 'velnor'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: actions-suite-${{ github.run_id }}-github-script
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            return { fixture: "github-script-probe" };

  compare:
    name: compare admitted-action lanes
    if: (inputs.lanes || inputs.lane) == 'both'
    needs: [probes]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Checkout first: it cleans the workspace, which would delete the
      # downloaded lane artifacts if it ran after them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: suite-actions-*
          path: artifacts
      - uses: ./.github/actions/compare-evidence
        with:
          scenario: actions
          directory: artifacts

[package]
name = "velnor-action-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Actions action.yml metadata contract parser"

[dependencies]
noyalib.workspace = true
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

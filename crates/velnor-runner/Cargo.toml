[package]
name = "velnor-runner"
version = "0.1.218"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Velnor self-hosted GitHub Actions runner daemon"

# Two-binary estate: /usr/bin/velnor-runner is the daemon/service binary
# (systemd ExecStart + release/capability hooks); /usr/bin/velnorctl is the
# kubectl-style control panel and the ONLY operator-facing CLI.

[[bin]]
name = "velnor-runner"
path = "src/main.rs"

[[bin]]
name = "velnor-guest-agent"
path = "src/bin/velnor-guest-agent.rs"

[[bin]]
name = "velnor-guest-image"
path = "src/bin/velnor-guest-image.rs"

# Debian packaging (cargo-deb).
# The unified release.yml (on tag) handles:
#   cargo zigbuild --release --locked --target $TGT
#   cargo deb -p velnor-runner --target $TGT --no-build --deb-version "$VERSION"
# This produces target/<triple>/debian/velnor-runner_<ver>_<arch>.deb .
#
# NOTE: an explicit `assets` list REPLACES cargo-deb's implicit defaults in
# current cargo-deb, so every shipped file MUST be listed below. cargo-deb
# rewrites target/release/... to target/<triple>/release/... when --target is
# passed.
[package.metadata.deb]
maintainer = "Alexey Zhokhov <alexey@zhokhov.com>"
copyright = "2026, Tailrocks"
license-file = []
extended-description = """
Velnor is a self-hosted GitHub Actions runner daemon. This package installs the
velnor-runner daemon binary, the velnorctl operator CLI, systemd units
(velnor-daemon), and a config file at /etc/velnor/velnor.env. Set
GITHUB_TOKEN + VELNOR_URL there, then start the service to register JIT runners
and execute jobs through an explicit execution backend (docker or microvm)."""
section = "devel"
priority = "optional"
# Explicit depends instead of $auto: dpkg-shlibdeps cannot resolve shared-lib
# info for a cross-built (arm64) binary on an amd64 host. OpenSSL is vendored,
# so the runtime surface is just glibc + libgcc (>= 2.34 covers every "latest
# Debian/Ubuntu" this package targets).
depends = "libc6 (>= 2.34), libgcc-s1, git, curl, ca-certificates, util-linux (>= 2.37.2)"
recommends = "docker.io | docker-ce"
conf-files = ["/etc/velnor/velnor.env", "/etc/velnor/execution.toml"]
maintainer-scripts = "debian/"
assets = [
  # The daemon/service binary executed by systemd.
  ["target/release/velnor-runner", "usr/bin/velnor-runner", "755"],
  # The kubectl-style operator control panel.
  ["target/release/velnorctl", "usr/bin/velnorctl", "755"],
  ["target/release/velnor-guest-agent", "usr/bin/velnor-guest-agent", "755"],
  ["debian/velnor-daemon.service", "lib/systemd/system/velnor-daemon.service", "644"],
  ["debian/velnor-daemon@.service", "lib/systemd/system/velnor-daemon@.service", "644"],
  ["debian/velnor-guardian.service", "lib/systemd/system/velnor-guardian.service", "644"],
  ["debian/velnor-controller@.service", "lib/systemd/system/velnor-controller@.service", "644"],
  ["debian/velnor-slot@.service", "lib/systemd/system/velnor-slot@.service", "644"],
  ["debian/velnor-control.slice", "lib/systemd/system/velnor-control.slice", "644"],
  ["debian/velnor-jobs.slice", "lib/systemd/system/velnor-jobs.slice", "644"],
  ["debian/velnor-doctor.service", "lib/systemd/system/velnor-doctor.service", "644"],
  ["debian/velnor-doctor.timer", "lib/systemd/system/velnor-doctor.timer", "644"],
  ["debian/velnor-doctor@.service", "lib/systemd/system/velnor-doctor@.service", "644"],
  ["debian/velnor-doctor@.timer", "lib/systemd/system/velnor-doctor@.timer", "644"],
  ["debian/velnor.env", "etc/velnor/velnor.env", "640"],
  ["debian/execution.toml", "etc/velnor/execution.toml", "644"],
  ["../../microvm/guest.toml", "usr/share/velnor/microvm/guest.toml", "644"],
  ["../../microvm/kernel.config", "usr/share/velnor/microvm/kernel.config", "644"],
  ["../../microvm/pins.json", "usr/share/velnor/microvm/pins.json", "644"],
  ["release/microvm/manifest.json", "usr/share/velnor/microvm/manifest.json", "644"],
  ["release/microvm/firecracker", "usr/share/velnor/microvm/firecracker", "755"],
  ["release/microvm/jailer", "usr/share/velnor/microvm/jailer", "755"],
  ["release/microvm/velnor-guest-agent", "usr/share/velnor/microvm/velnor-guest-agent", "755"],
  ["release/microvm/vmlinux", "usr/share/velnor/microvm/vmlinux", "644"],
  ["release/microvm/rootfs.ext4", "usr/share/velnor/microvm/rootfs.ext4", "644"],
  # Plan 010: the release workflow writes these two acyclic-safe identity files
  # (they depend only on the source, NOT on the deb digest, so shipping them
  # inside the deb creates no cycle) into release/ before `cargo deb`. postinst
  # validates the installed binary against them, offline, before any activation.
  # The full release record is NOT shipped here — it records this deb's digest,
  # so packaging it would be circular; it is staged out-of-band by `release
  # activate` during deployment.
  ["release/build-identity.json", "usr/share/velnor/build-identity.json", "644"],
  ["release/manifest.json", "usr/share/velnor/manifest.json", "644"],
  ["../../docker/job-ubuntu.Dockerfile", "usr/share/velnor/job-ubuntu.Dockerfile", "644"],
  ["../../docker/job-mise.toml", "usr/share/velnor/job-mise.toml", "644"],
  ["../../docker/job-mise.lock", "usr/share/velnor/job-mise.lock", "644"],
  ["../../README.md", "usr/share/doc/velnor-runner/README.md", "644"],
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc = "0.2"
velnor-control = { path = "../velnor-control", version = "0.1.0" }
velnor-model = { path = "../velnor-model", version = "0.1.0" }
aho-corasick = "1.1.4"
base64.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
rayon.workspace = true
rustix = { version = "1.1.4", features = ["fs"] }
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
globset.workspace = true
sha2.workspace = true
tar.workspace = true
sigstore-sign.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
zip.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

http-body-util = { version = "0.1", default-features = false, features = ["channel"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service", "http1"] }

[dev-dependencies]
wiremock = "=0.6.5"

[features]
default = []
# Plan 010: embed the exact git source SHA + release tag at compile time and
# fail the build unless tag == crate version == Cargo.lock (see build.rs). OFF by
# default so the normal build/test path never touches git and never fails on an
# untagged tree; the release workflow turns it on for the shipped binary only.
release-build = []
# OTLP span export, activated at runtime only when VELNOR_OTLP_ENDPOINT is set.
otel = [
  "dep:tracing-opentelemetry",
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
]

[package]
name = "velnorctl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Velnor operator CLI"

[lib]
name = "velnorctl"
path = "src/lib.rs"

[[bin]]
name = "velnorctl"
path = "src/main.rs"

[dependencies]
axum.workspace = true
libc.workspace = true
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
anyhow.workspace = true
serde_json = { workspace = true }
serde.workspace = true
tokio = { workspace = true }
velnor-model = { path = "../velnor-model", version = "0.1.0" }
velnor-control = { path = "../velnor-control", version = "0.1.0" }
velnor-client = { path = "../velnor-client", version = "0.1.0" }
velnor-render = { path = "../velnor-render", version = "0.1.0" }
# Interim execution facade (Plan 064 dependency law): the operator CLI owns
# every command surface while the legacy runtime library executes the
# handlers. Removed together with the velnor-runner crate cutover in Plan 079.
velnor-runner = { path = "../velnor-runner" }

[features]
default = []
# Forward release identity embedding to the runtime library so
# `velnorctl capabilities export` (and service-binary release hooks)
# carry the same coherent build identity that deb packaging and postinst
# verify.
release-build = ["velnor-runner/release-build"]

[dev-dependencies]
sha2 = { workspace = true }
[lints]
workspace = true

# Generated by velnor-workflow. DO NOT EDIT.
# Source: .github-gen/sources/workflows/runtime-products-bootstrap.yml
#
# Trusted bootstrap publisher.
#
# This source is intentionally installed at the canonical runtime-product
# publisher path by the static_files declaration. It is the phase-1,
# explicit main-only publication bridge used while the active renderer pin
# still names the previous product. It has no pull-request event and never
# accepts a caller-selected source revision. Phase 2 removes this source and
# its static mapping atomically after the canonical renderer publishes the
# same readiness contract.

name: Velnor workflow runtime products
run-name: Runtime products bootstrap · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the immutable runtime products from protected main
        required: true
        default: false
        type: boolean

concurrency:
  group: runtime-products-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  closure:
    name: Resolve protected-main runtime closure
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.ref_protected == true && github.event.sender.type == 'User'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      closure: ${{ steps.closure.outputs.value }}
      tag: ${{ steps.closure.outputs.tag }}
      head-sha: ${{ steps.closure.outputs.head-sha }}
    steps:
      - name: Prove explicit protected-main dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == true ]] || { echo "::error::explicit confirmation is required" >&2; exit 1; }
          [[ "$DEFAULT_BRANCH" == main ]] || { echo "::error::default branch is not main" >&2; exit 1; }
          [[ "$REF" == refs/heads/main ]] || { echo "::error::bootstrap runs only from refs/heads/main, got $REF" >&2; exit 1; }
          [[ "$REF_PROTECTED" == true ]] || { echo "::error::main is not reported as protected" >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dispatch SHA is not a full lowercase commit SHA" >&2; exit 1; }
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$tip" == "$SHA" ]] || {
            echo "::error::protected main advanced from dispatch SHA $SHA to $tip; restart bootstrap" >&2
            exit 1
          }
      - name: Checkout protected main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve source closure
        id: closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo "::error::checkout is not the protected dispatch SHA" >&2
            exit 1
          }
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$tip" == "$GITHUB_SHA" ]] || {
            echo "::error::protected main advanced during checkout; restart bootstrap" >&2
            exit 1
          }
          command -v sha256sum >/dev/null 2>&1 || { echo "::error::sha256sum is required on the closure runner" >&2; exit 1; }
          listing="$(git ls-tree -r HEAD -- crates/velnor-workflow Cargo.toml Cargo.lock rust-toolchain.toml rust-toolchain .cargo)"
          test "$listing" != '' || { echo "::error::HEAD has no closure inputs" >&2; exit 1; }
          closure="$(printf '%s\nclosure-version:1\nfeatures:\nprofile:release\n' "$(LC_ALL=C sort <<<"$listing")" | sha256sum | awk '{print $1}')"
          [[ "$closure" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::closure resolution failed" >&2; exit 1; }
          tag="velnor-workflow-runtime-v1-${closure:0:16}"
          {
            echo "value=$closure"
            echo "tag=$tag"
            echo "head-sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build runtime (${{ matrix.os }}-${{ matrix.arch }})
    needs: closure
    if: needs.closure.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            arch: X64
            runner: ubuntu-24.04
          - os: Linux
            arch: ARM64
            runner: ubuntu-24.04-arm
          - os: macOS
            arch: ARM64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout protected main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.closure.outputs.head-sha }}
          persist-credentials: false
      - name: Prove the build revision
        env:
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]] || {
            echo "::error::build checkout does not match protected main SHA" >&2
            exit 1
          }
      - name: Restore Rust toolchain
        id: rustup-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Verify Rust toolchain cache
        id: rustup-toolchain-verify
        if: steps.rustup-toolchain.outputs.cache-hit == 'true'
        shell: bash
        run: |
          valid=true
          if ! command -v rustup >/dev/null 2>&1; then
            valid=false
          else
            expected_channel='1.98.1'
            installed="$(rustup toolchain list 2>/dev/null | awk -v expected="$expected_channel" '$1 == expected || index($1, expected "-") == 1 { print $1; exit }')" || installed=""
            if [[ -z "$installed" ]]; then
              valid=false
            else
              if ! rustup component list --installed --toolchain "$installed" 2>/dev/null | awk -v wanted='rustfmt' '$1 == wanted || index($1, wanted "-") == 1 { found=1 } END { exit found ? 0 : 1 }'; then
                valid=false
              fi
              if ! rustup component list --installed --toolchain "$installed" 2>/dev/null | awk -v wanted='clippy' '$1 == wanted || index($1, wanted "-") == 1 { found=1 } END { exit found ? 0 : 1 }'; then
                valid=false
              fi
              if ! rustup target list --installed --toolchain "$installed" 2>/dev/null | awk -v wanted='aarch64-apple-darwin' '$1 == wanted { found=1 } END { exit found ? 0 : 1 }'; then
                valid=false
              fi
              if ! rustup target list --installed --toolchain "$installed" 2>/dev/null | awk -v wanted='aarch64-unknown-linux-gnu' '$1 == wanted { found=1 } END { exit found ? 0 : 1 }'; then
                valid=false
              fi
              if ! rustup target list --installed --toolchain "$installed" 2>/dev/null | awk -v wanted='x86_64-apple-darwin' '$1 == wanted { found=1 } END { exit found ? 0 : 1 }'; then
                valid=false
              fi
              if ! rustup target list --installed --toolchain "$installed" 2>/dev/null | awk -v wanted='x86_64-unknown-linux-gnu' '$1 == wanted { found=1 } END { exit found ? 0 : 1 }'; then
                valid=false
              fi
              if ! rustup target list --installed --toolchain "$installed" 2>/dev/null | awk -v wanted='x86_64-unknown-linux-musl' '$1 == wanted { found=1 } END { exit found ? 0 : 1 }'; then
                valid=false
              fi
            fi
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
      - name: Provision Rust toolchain
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-bootstrap-cargo-home
        if: steps.rustup-toolchain.outputs.cache-hit != 'true' || steps.rustup-toolchain-verify.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add 'aarch64-apple-darwin' 'aarch64-unknown-linux-gnu' 'x86_64-apple-darwin' 'x86_64-unknown-linux-gnu' 'x86_64-unknown-linux-musl'
      - name: Prove a hermetic build environment
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-bootstrap-cargo-home
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || { echo "::error::the bootstrap checkout is not clean" >&2; exit 1; }
          test -z "${RUSTFLAGS:-}" || { echo "::error::RUSTFLAGS is set: ${RUSTFLAGS}" >&2; exit 1; }
          test -z "${CARGO_ENCODED_RUSTFLAGS:-}" || { echo "::error::CARGO_ENCODED_RUSTFLAGS is set" >&2; exit 1; }
          test -z "${RUSTC_WRAPPER:-}" || { echo "::error::RUSTC_WRAPPER is set: ${RUSTC_WRAPPER}" >&2; exit 1; }
          [[ "${CARGO_HOME:-}" == "${RUNNER_TEMP:?}/"* ]] || { echo "::error::CARGO_HOME is not isolated: ${CARGO_HOME:-<unset>}" >&2; exit 1; }
      - name: Build release runtime
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-bootstrap-cargo-home
        run: cargo build --locked --no-default-features --release --package velnor-workflow --bin velnor-workflow
      - name: Prove and package typed runtime product
        id: prove
        shell: bash
        env:
          CLOSURE: ${{ needs.closure.outputs.closure }}
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
          CARGO_HOME: ${{ runner.temp }}/velnor-bootstrap-cargo-home
        run: |
          set -euo pipefail
          binary=target/release/velnor-workflow
          test -x "$binary" || { echo "::error::no release binary at $binary" >&2; exit 1; }
          reported="$($binary --closure)"
          [[ "$reported" == "$CLOSURE" ]] || { echo "::error::built binary reports closure $reported, expected $CLOSURE" >&2; exit 1; }
          reported_revision="$($binary --revision)"
          [[ "$reported_revision" == "$HEAD_SHA" ]] || { echo "::error::built binary reports revision $reported_revision, expected $HEAD_SHA" >&2; exit 1; }
          build_identity="$($binary --build-identity)"
          jq -e --arg schema "velnor-workflow.runtime-build-identity.v1" \
            --arg source "$HEAD_SHA" --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" \
            '.schema == $schema and .source_revision == $source and .platform == $platform and .toolchain != "" and .rustc != "" and .target != "" and .host != "" and .profile == "release" and .features == "" and (.rustflags | type == "string") and (.cargo_encoded_rustflags | type == "string") and (.linker | type == "string") and (.cc | type == "string") and (.cflags | type == "string")' \
            <<<"$build_identity" >/dev/null
          asset="velnor-workflow-${RUNNER_OS}-${RUNNER_ARCH}"
          printf '%s\n' "$build_identity" > "$asset.build.json"
          cp "$binary" "$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$asset" | awk '{print $1}')"
          else
            digest="$(shasum -a 256 "$asset" | awk '{print $1}')"
          fi
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::digest computation failed" >&2; exit 1; }
          printf '%s' "$digest" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Attest runtime asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prove.outputs.asset }}
      - name: Upload runtime asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.prove.outputs.asset }}
            ${{ steps.prove.outputs.asset }}.sha256
            ${{ steps.prove.outputs.asset }}.build.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish trusted runtime products
    needs: [closure, build]
    if: needs.closure.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out protected main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.closure.outputs.head-sha }}
          persist-credentials: false
      - name: Prove protected tip is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          TAG: ${{ needs.closure.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" == main && "$REF" == refs/heads/main && "$REF_PROTECTED" == true ]] || {
            echo "::error::bootstrap publication is not running on protected main" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]] || {
            echo "::error::publish checkout does not match the build revision" >&2
            exit 1
          }
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$tip" == "$HEAD_SHA" ]] || {
            echo "::error::protected main advanced from build revision $HEAD_SHA to $tip; refusing publication" >&2
            exit 1
          }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; refusing to rebind an immutable product" >&2
            exit 1
          fi
      - name: Download runtime assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Assemble and verify typed release
        env:
          CLOSURE: ${{ needs.closure.outputs.closure }}
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in Linux-X64 Linux-ARM64 macOS-ARM64; do
            asset="velnor-workflow-$platform"
            test -s "dist/$asset" || { echo "::error::missing product asset $asset" >&2; exit 1; }
            test -s "dist/$asset.sha256" || { echo "::error::missing digest for $asset" >&2; exit 1; }
            test -s "dist/$asset.build.json" || { echo "::error::missing build identity for $asset" >&2; exit 1; }
            expected="$(cat "dist/$asset.sha256")"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::malformed digest for $asset" >&2; exit 1; }
            actual="$(sha256sum "dist/$asset" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "::error::transport digest mismatch for $asset" >&2; exit 1; }
            chmod 0755 "dist/$asset"
          done
          reported="$(./dist/velnor-workflow-Linux-X64 --closure)"
          [[ "$reported" == "$CLOSURE" ]] || { echo "::error::published binary reports closure $reported, expected $CLOSURE" >&2; exit 1; }
          reported_revision="$(./dist/velnor-workflow-Linux-X64 --revision)"
          [[ "$reported_revision" == "$HEAD_SHA" ]] || { echo "::error::published binary reports revision $reported_revision, expected $HEAD_SHA" >&2; exit 1; }
          jq -n \
            --arg closure "$CLOSURE" \
            --arg revision "$HEAD_SHA" \
            --arg linux_x64 "$(cat dist/velnor-workflow-Linux-X64.sha256)" \
            --argjson linux_x64_build "$(cat dist/velnor-workflow-Linux-X64.build.json)" \
            --arg linux_arm64 "$(cat dist/velnor-workflow-Linux-ARM64.sha256)" \
            --argjson linux_arm64_build "$(cat dist/velnor-workflow-Linux-ARM64.build.json)" \
            --arg macos_arm64 "$(cat dist/velnor-workflow-macOS-ARM64.sha256)" \
            --argjson macos_arm64_build "$(cat dist/velnor-workflow-macOS-ARM64.build.json)" \
            '{closure: $closure, revision: $revision, profile: "release", features: "", products: {"Linux-X64": {binary: $linux_x64, asset: "velnor-workflow-Linux-X64", build: $linux_x64_build}, "Linux-ARM64": {binary: $linux_arm64, asset: "velnor-workflow-Linux-ARM64", build: $linux_arm64_build}, "macOS-ARM64": {binary: $macos_arm64, asset: "velnor-workflow-macOS-ARM64", build: $macos_arm64_build}}}' \
            > dist/manifest.json
          jq -e --arg closure "$CLOSURE" --arg revision "$HEAD_SHA" --arg platform "Linux-X64" --arg asset "velnor-workflow-Linux-X64" \
            '.closure == $closure and .revision == $revision and .profile == "release" and .features == "" and (.products[$platform].binary | test("^[0-9a-f]{64}$")) and .products[$platform].asset == $asset and (.products[$platform].build | .schema == "velnor-workflow.runtime-build-identity.v1" and .source_revision == $revision and .platform == $platform and .toolchain != "" and .rustc != "" and .target != "" and .host != "" and .profile == "release" and .features == "" and (.rustflags | type == "string") and (.cargo_encoded_rustflags | type == "string") and (.linker | type == "string") and (.cc | type == "string") and (.cflags | type == "string"))' dist/manifest.json >/dev/null
          for platform in Linux-ARM64 macOS-ARM64; do
            jq -e --arg closure "$CLOSURE" --arg revision "$HEAD_SHA" --arg platform "$platform" --arg asset "velnor-workflow-$platform" \
              '.closure == $closure and .revision == $revision and .profile == "release" and .features == "" and (.products[$platform].binary | test("^[0-9a-f]{64}$")) and .products[$platform].asset == $asset and (.products[$platform].build | .schema == "velnor-workflow.runtime-build-identity.v1" and .source_revision == $revision and .platform == $platform and .toolchain != "" and .rustc != "" and .target != "" and .host != "" and .profile == "release" and .features == "" and (.rustflags | type == "string") and (.cargo_encoded_rustflags | type == "string") and (.linker | type == "string") and (.cc | type == "string") and (.cflags | type == "string"))' dist/manifest.json >/dev/null
          done
          [[ "$(jq -er '.revision' dist/manifest.json)" == "$HEAD_SHA" ]] || { echo "::error::manifest revision mismatch" >&2; exit 1; }
      - name: Attest release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/manifest.json
      - name: Verify attestations and consumer contract
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE: ${{ needs.closure.outputs.closure }}
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
        shell: bash
        run: |
          set -euo pipefail
          signer='tailrocks/velnor/.github/workflows/ci-runtime-products.yml'
          gh attestation verify dist/manifest.json --owner tailrocks --signer-workflow "$signer" --source-ref refs/heads/main --source-digest "$HEAD_SHA"
          for platform in Linux-X64 Linux-ARM64 macOS-ARM64; do
            asset="velnor-workflow-$platform"
            gh attestation verify "dist/$asset" --owner tailrocks --signer-workflow "$signer" --source-ref refs/heads/main --source-digest "$HEAD_SHA"
            expected="$(jq -er --arg platform "$platform" '.products[$platform].binary' dist/manifest.json)"
            actual="$(sha256sum "dist/$asset" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "::error::attested $platform digest mismatch" >&2; exit 1; }
          done
          runtime="$(mktemp -d)"
          trap 'rm -rf "$runtime"' EXIT
          cp dist/velnor-workflow-Linux-X64 "$runtime/velnor-workflow"
          chmod 0755 "$runtime/velnor-workflow"
          reported="$("$runtime/velnor-workflow" --closure)"
          [[ "$reported" == "$CLOSURE" ]] || { echo "::error::consumer closure mismatch" >&2; exit 1; }
          [[ "$("$runtime/velnor-workflow" --revision)" == "$HEAD_SHA" ]] || { echo "::error::consumer revision mismatch" >&2; exit 1; }
      - name: Derive canonical publication readiness v2
        id: readiness
        env:
          CLOSURE: ${{ needs.closure.outputs.closure }}
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == tailrocks/velnor ]] || { echo "::error::unexpected publisher repository $REPOSITORY" >&2; exit 1; }
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::publisher run identity is malformed" >&2
            exit 1
          }
          expiry="$(( $(date -u +%s) + 86400 ))"
          workflow="$REPOSITORY/.github/workflows/ci-runtime-products.yml"
          linux_x64="$(jq -er '.products["Linux-X64"].binary' dist/manifest.json)"
          linux_arm64="$(jq -er '.products["Linux-ARM64"].binary' dist/manifest.json)"
          macos_arm64="$(jq -er '.products["macOS-ARM64"].binary' dist/manifest.json)"
          jq -cn \
            --arg schema 'velnor-workflow.publication-readiness.v2' \
            --arg activation_revision "$HEAD_SHA" \
            --arg workflow "$workflow" \
            --arg repository "$REPOSITORY" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg closure "$CLOSURE" \
            --arg revision "$HEAD_SHA" \
            --arg linux_x64 "$linux_x64" \
            --arg linux_arm64 "$linux_arm64" \
            --arg macos_arm64 "$macos_arm64" \
            --arg expiry "$expiry" \
            '{schema: $schema, activation_revision: $activation_revision, publisher: {workflow: $workflow, repository: $repository, run_id: $run_id, run_attempt: $run_attempt}, product: {closure: $closure, revision: $revision}, products: [{platform: "Linux-X64", digest: $linux_x64, revoked: false, expires_at: ($expiry | tonumber)}, {platform: "Linux-ARM64", digest: $linux_arm64, revoked: false, expires_at: ($expiry | tonumber)}, {platform: "macOS-ARM64", digest: $macos_arm64, revoked: false, expires_at: ($expiry | tonumber)}]}' \
            | tr -d '\n' > "$RUNNER_TEMP/publication-readiness-canonical.json"
          manifest_digest="$(sha256sum "$RUNNER_TEMP/publication-readiness-canonical.json" | awk '{print $1}')"
          jq --arg manifest_digest "$manifest_digest" '. + {manifest_digest: $manifest_digest}' \
            "$RUNNER_TEMP/publication-readiness-canonical.json" > "$RUNNER_TEMP/publication-readiness.json"
          jq -e --arg digest "$manifest_digest" --arg schema 'velnor-workflow.publication-readiness.v2' \
            '.schema == $schema and .manifest_digest == $digest and .publisher.run_id > 0 and .publisher.run_attempt > 0 and (.products | length == 3)' \
            "$RUNNER_TEMP/publication-readiness.json" >/dev/null
          cp "$RUNNER_TEMP/publication-readiness.json" dist/publication-readiness.json
          echo "manifest-digest=$manifest_digest" >> "$GITHUB_OUTPUT"
      - name: Prove protected tip immediately before release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
          TAG: ${{ needs.closure.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$tip" == "$HEAD_SHA" ]] || {
            echo "::error::protected main advanced before release from $HEAD_SHA to $tip" >&2
            exit 1
          }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG appeared concurrently; refusing publication" >&2
            exit 1
          fi
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSURE: ${{ needs.closure.outputs.closure }}
          HEAD_SHA: ${{ needs.closure.outputs.head-sha }}
          TAG: ${{ needs.closure.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "$TAG" \
            --notes "Trusted bootstrap runtime product for protected main $HEAD_SHA (closure $CLOSURE)." \
            dist/velnor-workflow-Linux-X64 dist/velnor-workflow-Linux-ARM64 dist/velnor-workflow-macOS-ARM64 dist/manifest.json dist/publication-readiness.json
      - name: Upload publication readiness

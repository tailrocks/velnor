            git switch --create "$branch" --track "origin/$branch"
          else
            git switch --create "$branch"
          fi
          git config user.name "velnor-workflow activation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          velnor-workflow promote --rev "$REVISION" --publication-readiness "$RUNNER_TEMP/publication-readiness.json" --retire-runtime-bootstrap --repo "$GITHUB_WORKSPACE" --generator-repo "$GITHUB_WORKSPACE"
          bootstrap_source=".github-gen/sources/workflows/runtime-products-bootstrap.yml"
          [[ ! -e "$bootstrap_source" ]] || {
            echo "::error::activation branch still contains the retired runtime bootstrap source $bootstrap_source" >&2
            exit 1
          }
          if grep -Fq "$bootstrap_source" .github-gen/velnor-workflow.toml; then
            echo "::error::activation branch still contains the retired runtime bootstrap static mapping" >&2
            exit 1
          fi
          test -s "$state" || { echo "::error::promotion did not leave generated ownership state" >&2; exit 1; }
          unexpected=""
          while IFS= read -r path; do
            case "$path" in
              .github-gen/velnor-workflow.toml|.github/ci/.github-actions-generator-state)
                ;;
              *)
                grep -Fq "^$path	" "$state" || grep -Fq "^$path	" "$base_state" || unexpected+="$path\n"
                ;;
            esac
          done < <(git diff --name-only "$MAIN_SHA" HEAD)
          if [[ -n "$unexpected" ]]; then
            printf '::error::activation branch contains changes outside the promoted generated surface:\n%b' "$unexpected" >&2
            exit 1
          fi
          gh auth setup-git
          git push --set-upstream origin "$branch"
          if [[ "$(gh pr list --head "$branch" --base "$DEFAULT_BRANCH" --state open --json number --jq 'length')" == 0 ]]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "chore(ci): activate renderer ${REVISION:0:12}" --body "Trusted activation: immutable runtime release, manifest, and all supported platform assets were attestation- and digest-verified before atomic pin/tree promotion."
          fi

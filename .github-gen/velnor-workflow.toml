schema = 1

[generator]
repository = "tailrocks/velnor"

[scan]
exclude = ["migrations/**"]

# Runner placement: `runners` is the available backends. `automatic` is the
# lanes that run on PR/push/schedule without a dispatch choice.
# This recovery branch runs CI on its repository-scoped Velnor host.
[workflow]
runners = "velnor"
automatic = "velnor"
default_branch = "main"
github_runner = "ubuntu-24.04"
profile = "rust-workspace-release"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
default_dispatch_runner = "velnor"
# Trust-gated routing: units with `requires_trusted` append this label to
# their Velnor `runs-on`, so only trusted runners (which mount the Docker
# lease socket) receive them. Untrusted hosts must never claim it.
# Deliberately distinct from org pool velnor-trusted: a label, not a group.
velnor_trusted_label = "velnor-host-docker"
# Recovery: omit velnor_runner_group so repository-scoped macOS/Linux hosts
# can claim Velnor-lane jobs without joining org pool velnor-trusted.
# Restore velnor-trusted after Sentry org fleet is healthy.
pull_request_on_velnor = true
velnor_rust_needs = "dependency-closure"
version_bump_units = ["docker", "rust-velnor-bench", "rust-velnor-runner", "rust-velnorctl"]

# Release contract: typed native publisher + rolling preview. Guest-seed
# restore/save is derived from the microvm recipe, not a pasted workflow body.

[release]
enabled = true
reason = "Release contract is explicitly cataloged; review credentials, environments, and tag protection before cutover."
kind = "native"
package = "velnor-runner"
packages = []
binary = "velnor-runner"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
image = "ghcr.io/tailrocks/velnor-job-ubuntu"
source_repository = "tailrocks/velnor"
consumer_repository = "tailrocks/velnor-apt"
description = "Native high-performance GitHub Actions runner"
manifest_schema = "velnor.package-release.v1"

# Verification pipelines: one reusable workflow per unit, one row per unit, in
# scan order. The aggregate workflows compose exactly these units, in this
# order.

[[declare]]
primitive = "bun-package-pipeline"
units = ["bun-velnor"]

[[declare]]
primitive = "docker-image-pipeline"
units = ["docker"]

[[declare]]
primitive = "docs-lint-pipeline"
units = ["docs"]

[[declare]]
primitive = "opentofu-pipeline"
units = ["opentofu"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-policy"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-unit-collector"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-bench"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-client"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-control"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-model"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-render"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-runner"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-tools"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-workflow"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnorctl"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-production-topology"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-workflow-contract"]

# Lanes and cache: the default matrix (GitHub-hosted plus the trust-gated
# self-hosted lane) and the detected cache contract, stated explicitly so the
# repository owns the decision.

[[declare]]
primitive = "lane-matrix"

[[declare]]
primitive = "cache-contract"

# Affected selection: the plan job every aggregate starts from.

[[declare]]
primitive = "affected-plan"

# Aggregate workflows, one row per generated entry point.

[[declare]]
primitive = "unit-aggregation"
file = "ci-pr.yml"

[[declare]]
primitive = "unit-aggregation"
file = "ci-main.yml"

[[declare]]
primitive = "unit-aggregation"
file = "nightly.yml"

# Watch graph: derived from unit kinds and the Docker dependency closure, plus
# the paths this repository adds on top.

[[declare]]
primitive = "watch-graph"

[declare.args]
runtime_inputs = ["crates/velnor-workflow/src/runtime.rs"]
docker_closure = [
  "rust-velnor-runner",
  "rust-velnorctl",
  "rust-velnor-tools",
  "rust-velnor-workflow",
]

[declare.args.watch]
"rust-velnor-workflow" = [
  "Dockerfile",
  "docker/build-mise.*",
  "crates/velnor-workflow/README.md",
  "crates/velnor-workflow/templates/**",
]
"rust-velnor-runner" = [
  ".github-gen/velnor-workflow.toml",
  "microvm/**",
  "tools/unit-collector/**",
  "fleet/**",
]
"rust-velnorctl" = ["microvm/**"]
"rust-velnor-tools" = ["fleet/**"]
"rust-velnor-model" = ["schemas/**"]

# Regeneration gate: the workflow crate owns the generated surface, so its
# verification starts by checking that the checked-in output is current.

[[declare]]
primitive = "regen-gate"
units = ["rust-velnor-workflow"]

[declare.args]
command = "cd -- 'crates/velnor-workflow' && mbx run --locked --manifest-path 'Cargo.toml' -- --plain --check ../.."

# Release-side surface: typed native release, rolling preview, and signer.


[[declare]]
primitive = "release-signer"
file = "ci-release-package-signer.yml"


# The cache-hygiene workflow is the generic maintenance family, stated
# explicitly so the repository owns the decision.

[[declare]]
primitive = "maintenance"
file = "maintenance.yml"
# The workspace-wide release-topology unit: the scan sees a workspace root; the
# repository declares the verification contract the unit carries.

[[units]]
id = "rust-production-topology"
label = "Rust production topology"
kind = "rust"
root = "."
watch = [".cargo/**", "Cargo.lock", "Cargo.toml", "crates/velnor-runner/**", "crates/velnor-workflow/src/runtime.rs", "docker/**", "microvm/**", "mise.lock", "mise.toml", "rust-toolchain", "rust-toolchain.toml", "scripts/check-release-feature-boundary.sh", "scripts/test-check-release-feature-boundary.sh"]
workspace_check = true
ci_tasks = ["test-release-feature-boundary", "test-release-boundary-script"]
pinned_lockfile = true

[units.cache]
key_files = ["Cargo.toml", "Cargo.lock"]
paths = ["~/.cargo/registry", "~/.cargo/git"]

# The Docker image build: the repository declares its buildx contract on top
# of the detected unit. The hosted full build injects the restored mutable
# mount seed through the image's `velnor-cache-seed` stage, exports the layer
# cache without `ignore-error` (a failed export must be visible, not a silent
# cold builder next run), and a trusted build extracts the updated cache
# mounts back out of the `velnor-cache-export` target. The self-hosted lane
# keeps its own retained builder and needs no seed transport.

[[units]]
id = "docker"
# The image build needs the host Docker lease socket, which only trusted
# runners mount. Gate its Velnor jobs onto runners claiming the label.
requires_trusted = true

# The mutable mount seed: the compatibility identity of the state the image's
# cache mounts hold (Cargo sources, the locked mise toolset, the build recipe)
# and the workspace directory the generator restores it into before the build
# and collects the export into afterwards. One namespace, owned by the image
# build alone.

[units.cache]
key_files = ["Cargo.lock", "Dockerfile", "docker/build-mise.lock", "docker/build-mise.toml", "rust-toolchain.toml"]
paths = [".velnor-docker-cache"]
mutable_mount_seed = true

# The composite action the generated workflows bootstrap through: the
# repository owns the bytes under .github-gen/sources, the generator owns the
# write into .github/actions.

[[static_files]]
file = ".github/actions/setup-velnor-workflow/action.yml"
source = ".github-gen/sources/actions/setup-velnor-workflow/action.yml"

[[static_files]]
file = ".github/workflows/AGENTS.md"
source = ".github-gen/sources/workflows-AGENTS.md"

[[declare]]
primitive = "release"
file = "release.yml"

[[declare]]
primitive = "preview"
file = "preview.yml"

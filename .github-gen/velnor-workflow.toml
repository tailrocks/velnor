schema = 1

[generator]
repository = "tailrocks/velnor"

# Runner placement: the hosted image the GitHub lane pins, and the self-hosted
# labels the trust-gated Velnor lane selects by.
[workflow]
github_runner = "ubuntu-24.04"
profile = "rust-workspace-release"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
version_bump_units = ["docker", "rust-velnor-bench", "rust-velnor-runner", "rust-velnorctl"]

# Release contract: the reviewed publisher renders `release.yml` verbatim
# (see the static-workflow row below); the record fields stay declared here so
# the generated project config carries the same contract.

[release]
enabled = true
reason = "Release contract is explicitly cataloged; review credentials, environments, and tag protection before cutover."
kind = "velnor-native"
package = "velnor-runner"
packages = []
binary = "velnor-runner"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
image = "ghcr.io/tailrocks/velnor-job-ubuntu"
source_repository = "tailrocks/velnor"
consumer_repository = "tailrocks/velnor-apt"
description = "Native high-performance GitHub Actions runner"

# Verification pipelines: one reusable workflow per unit, one row per unit, in
# scan order. The aggregate workflows compose exactly these units, in this
# order.

[[declare]]
primitive = "bun-package-pipeline"
units = ["bun-velnor"]

[[declare]]
primitive = "docker-image-pipeline"
units = ["docker"]

[[declare]]
primitive = "docs-lint-pipeline"
units = ["docs"]

[[declare]]
primitive = "opentofu-pipeline"
units = ["opentofu"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-policy"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-unit-collector"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-bench"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-client"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-control"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-model"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-render"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-runner"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-tools"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnor-workflow"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-velnorctl"]

[[declare]]
primitive = "rust-crate-pipeline"
units = ["rust-production-topology"]

# Lanes and cache: the default matrix (GitHub-hosted plus the trust-gated
# self-hosted lane) and the detected cache contract, stated explicitly so the
# repository owns the decision.

[[declare]]
primitive = "lane-matrix"

[[declare]]
primitive = "cache-contract"

# Affected selection: the plan job every aggregate starts from.

[[declare]]
primitive = "affected-plan"

# Aggregate workflows, one row per generated entry point.

[[declare]]
primitive = "unit-aggregation"
file = "ci-pr.yml"

[[declare]]
primitive = "unit-aggregation"
file = "ci-main.yml"

[[declare]]
primitive = "unit-aggregation"
file = "nightly.yml"

# Watch graph: derived from unit kinds and the Docker dependency closure, plus
# the paths this repository adds on top.

[[declare]]
primitive = "watch-graph"

[declare.args]
runtime_inputs = ["crates/velnor-workflow/src/runtime.rs"]
docker_closure = [
  "rust-velnor-runner",
  "rust-velnorctl",
  "rust-velnor-tools",
  "rust-velnor-workflow",
]

[declare.args.watch]
"rust-velnor-workflow" = [
  "Dockerfile",
  "docker/build-mise.*",
    "crates/velnor-workflow/README.md",
]
"rust-velnor-runner" = [
  "crates/velnor-workflow/templates/velnor-release.yml",
  "microvm/**",
  "tools/unit-collector/**",
  "fleet/**",
]
"rust-velnorctl" = ["microvm/**"]
"rust-velnor-tools" = ["fleet/**"]
"rust-velnor-model" = ["schemas/**"]

# Regeneration gate: the workflow crate owns the generated surface, so its
# verification starts by checking that the checked-in output is current.

[[declare]]
primitive = "regen-gate"
units = ["rust-velnor-workflow"]

[declare.args]
command = "cd -- 'crates/velnor-workflow' && mbx run --locked --manifest-path 'Cargo.toml' -- --plain --check ../.."

# Release-side surface: the reviewed publisher, rolling preview, signer, and
# policy provider are declared verbatim; the generator refreshes their pins.
[[declare]]
primitive = "static-workflow"
file = "release.yml"

[declare.args]
template = '''
name: Release

# Plan 010 — the SOLE release coordinator for tailrocks/velnor.
#
# release-deb.yml is deleted; its deb sanity guards (binary present, canonical
# Dockerfile present, size > 1MB, arch/version match — the "empty-deb incident"
# guard) are folded in below. One tagged commit produces one coherent, acyclic
# release record binding: source SHA -> crate version -> per-arch binary/deb
# GitHub is the only admitted release lane until Velnor proves the isolated
# user-namespace capability required by the guest-image build. Explicit Velnor
# requests fail closed; they never silently substitute GitHub.
# digests -> OCI image digest -> compiled-manifest hash -> APT coordinate.
#
# This workflow holds NO APT credential and performs NO consumer write/dispatch
# (N6): tailrocks/velnor-apt pulls the published record itself and verifies it
# before reprepro. Assets and versioned OCI tags are never clobbered — an
# existing tag/asset is reused only after an exact digest match, otherwise the
# run fails. New image bytes use commit-scoped staging tags.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      lanes:
        description: github (the only admitted release lane)
        type: choice
        default: github
        options: [github]
      tag:
        description: Existing release tag to (re)build coherently (e.g. v0.1.121).
        type: string
        required: true
      existing-image-digest:
        description: Exact OCI index digest for an explicitly verified failed-run recovery.
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/tailrocks/velnor-job-ubuntu
  SOURCE_URL: https://github.com/tailrocks/velnor

jobs:
  lane-admission:
    name: Resolve release lanes
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VELNOR_IMPLEMENTATION_REQUIREMENT: "guest-image-build.user-namespace"
      VELNOR_MISSING_CAPABILITY: "unprivileged user namespaces or CAP_SYS_ADMIN"
    outputs:
      lanes: ${{ steps.route.outputs.lanes }}
    steps:
      - name: Validate requested lanes and required capabilities
        id: route
        env:
          REQUESTED_LANES: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || vars.VELNOR_AUTOMATIC_LANES || 'github' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_LANES" in
            github)
              echo "lanes=github" >> "$GITHUB_OUTPUT"
              ;;
            velnor|both)
              echo "::error::release lane '$REQUESTED_LANES' fails capability check '$VELNOR_MISSING_CAPABILITY'; Velnor implementation requirement '$VELNOR_IMPLEMENTATION_REQUIREMENT' remains open; refusing GitHub substitution" >&2
              exit 1
              ;;
            *)
              echo "::error::invalid release lane '$REQUESTED_LANES'; expected github" >&2
              exit 1
              ;;
          esac

  identity:
    needs: lane-admission
    name: Resolve + gate release identity
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    outputs:
      lane: ${{ needs.lane-admission.outputs.lanes }}
      version: ${{ steps.gate.outputs.version }}
      tag_ref: ${{ steps.gate.outputs.tag_ref }}
      # Downstream provenance is bound to the exact default-branch snapshot
      # accepted below, not to an independently re-resolved tag ref.
      commit: ${{ steps.gate.outputs.default_branch_commit }}
      default_branch_commit: ${{ steps.gate.outputs.default_branch_commit }}
      tag_commit: ${{ steps.gate.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Fetch the requested ref first plus tags. This remains compatible with
          # runners predating the full-history FETCH_HEAD ordering fix.
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Peel the tag to one commit and reject drift
        id: gate
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WORKFLOW_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::manual release dispatch must use the default-branch workflow definition" >&2
            exit 1
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::tag $TAG must match v[0-9]*" >&2; exit 1 ;;
          esac
          tag_ref="refs/tags/$TAG"
          git show-ref --verify --quiet "$tag_ref" || {
            echo "::error::tag ref $tag_ref does not exist" >&2
            exit 1
          }
          version="${TAG#v}"
          case "$version" in
            ''|.|..|*\\*|*[![:print:]])
              echo "::error::release version is not a safe artifact path component" >&2
              exit 1
              ;;
          esac

          # Peel annotated OR lightweight tags to exactly one commit object.
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          case "$tag_commit" in
            *[!0-9a-f]*|'') echo "::error::tag $TAG did not peel to lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#tag_commit}" -eq 40 ] || { echo "::error::tag $TAG did not peel to a 40-hex commit" >&2; exit 1; }

          # Older native checkout adapters fetch the requested tag but may leave
          # workflow_dispatch on the caller SHA. Move to the already-resolved
          # immutable commit before validating the checkout identity.
          git checkout --detach "$tag_commit"

          # The checkout must sit exactly on that commit (non-HEAD checkout is a
          # coherence failure).
          head="$(git rev-parse HEAD)"
          [ "$head" = "$tag_commit" ] || { echo "::error::HEAD $head != tag commit $tag_commit" >&2; exit 1; }

          # A release tag is valid only when it names the current default-branch
          # tip. This closes the human tag/version race before any build,
          # artifact upload, image push, or publication job can start.
          remote_default_branch="$(git ls-remote --exit-code --heads origin "refs/heads/$DEFAULT_BRANCH")"
          default_branch_commit="$(printf '%s\n' "$remote_default_branch" | awk 'NF == 2 { print $1 }')"
          case "$default_branch_commit" in
            *[!0-9a-f]*|'') echo "::error::could not resolve current default branch $DEFAULT_BRANCH to one lowercase-hex commit" >&2; exit 1 ;;
          esac
          [ "${#default_branch_commit}" -eq 40 ] || { echo "::error::default branch $DEFAULT_BRANCH did not resolve to a 40-hex commit" >&2; exit 1; }
          [ "$default_branch_commit" = "$tag_commit" ] || {
            echo "::error::tag $TAG resolves to $tag_commit, but default branch $DEFAULT_BRANCH is $default_branch_commit; release tags must point at the current default-branch tip" >&2
            exit 1
          }

          # Exactly one v* tag may point at this commit (reused/ambiguous lineage
          # fails closed).
          tags_here="$(git tag --points-at "$tag_commit" | grep -c '^v' || true)"
          [ "$tags_here" = "1" ] || { echo "::error::expected exactly one v* tag at $tag_commit, found $tags_here" >&2; exit 1; }

          # Clean tree.
          [ -z "$(git status --porcelain)" ] || { echo "::error::dirty tree" >&2; exit 1; }

          # tag == crate version == Cargo.lock (the build.rs gate re-checks this,
          # but fail fast here with a readable message).
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/velnor-runner/Cargo.toml | head -n1)"
          [ "$crate" = "$version" ] || { echo "::error::crate version $crate != tag version $version — bump crate + Cargo.lock before tagging" >&2; exit 1; }

          {
            echo "version=$version"
            echo "tag_ref=$tag_ref"
            echo "tag_commit=$tag_commit"
            echo "default_branch_commit=$default_branch_commit"
          } >> "$GITHUB_OUTPUT"

  # This is the final pre-publication default-branch read. All downstream jobs
  # consume its immutable output; later default-branch movement cannot change
  # the already-bound source snapshot or provenance.
  release_gate:
    needs: identity
    name: Final pre-publication default-branch gate
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      default_branch_commit: ${{ steps.gate.outputs.default_branch_commit }}
      tag_ref: ${{ steps.gate.outputs.tag_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-read default branch and fail closed on movement
        id: gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_DEFAULT_BRANCH_COMMIT: ${{ needs.identity.outputs.default_branch_commit }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
          EXPECTED_TAG_COMMIT: ${{ needs.identity.outputs.tag_commit }}
          EXPECTED_TAG_REF: ${{ needs.identity.outputs.tag_ref }}
        run: |
          set -euo pipefail
          if ! remote_tag_refs="$(git ls-remote --exit-code origin 'refs/tags/v*')"; then
            echo "::error::could not resolve remote v* tags" >&2
            exit 1
          fi
          remote_tag_commit="$(printf '%s\n' "$remote_tag_refs" | awk -v expected="$EXPECTED_TAG_REF" '
            $2 == expected "^{}" { peeled=$1; found_peeled=1; next }
            $2 == expected && !found_peeled { raw=$1 }
            END {
              if (found_peeled) print peeled
              else if (raw != "") print raw
            }
          ')"
          case "$remote_tag_commit" in
            *[!0-9a-f]*|'') echo "::error::remote tag $EXPECTED_TAG_REF did not resolve to lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#remote_tag_commit}" -eq 40 ] || { echo "::error::remote tag $EXPECTED_TAG_REF did not resolve to a 40-hex commit" >&2; exit 1; }
          [ "$remote_tag_commit" = "$EXPECTED_TAG_COMMIT" ] || {
            echo "::error::remote tag $EXPECTED_TAG_REF moved to $remote_tag_commit; expected $EXPECTED_TAG_COMMIT" >&2
            exit 1
          }
          tags_here="$(printf '%s\n' "$remote_tag_refs" | awk -v target="$remote_tag_commit" '
            {
              ref=$2
              if (ref ~ /\^\{\}$/) {
                sub(/\^\{\}$/, "", ref)
                peeled[ref]=$1
              } else {
                raw[ref]=$1
              }
              seen[ref]=1
            }
            END {
              count=0
              for (ref in seen) {
                if (ref ~ /^refs\/tags\/v[0-9]/) {
                  commit=(ref in peeled) ? peeled[ref] : raw[ref]
                  if (commit == target) count++
                }
              }
              print count
            }
          ')"
          [ "$tags_here" = "1" ] || { echo "::error::expected exactly one v[0-9]* tag at $remote_tag_commit, found $tags_here" >&2; exit 1; }

          remote_default_branch="$(git ls-remote --exit-code --heads origin "refs/heads/$DEFAULT_BRANCH")"
          default_branch_commit="$(printf '%s\n' "$remote_default_branch" | awk 'NF == 2 { print $1 }')"
          case "$default_branch_commit" in
            *[!0-9a-f]*|'') echo "::error::could not resolve current default branch $DEFAULT_BRANCH to one lowercase-hex commit" >&2; exit 1 ;;
          esac
          [ "${#default_branch_commit}" -eq 40 ] || { echo "::error::default branch $DEFAULT_BRANCH did not resolve to a 40-hex commit" >&2; exit 1; }
          [ "$default_branch_commit" = "$EXPECTED_DEFAULT_BRANCH_COMMIT" ] || {
            echo "::error::default branch $DEFAULT_BRANCH moved from $EXPECTED_DEFAULT_BRANCH_COMMIT to $default_branch_commit after identity; refusing release work" >&2
            exit 1
          }
          [ "$default_branch_commit" = "$EXPECTED_RELEASE_COMMIT" ] || {
            echo "::error::release provenance commit $EXPECTED_RELEASE_COMMIT is not the default-branch snapshot $default_branch_commit" >&2
            exit 1
          }
          [ "$default_branch_commit" = "$EXPECTED_TAG_COMMIT" ] || {
            echo "::error::tag commit $EXPECTED_TAG_COMMIT is not the default-branch snapshot $default_branch_commit" >&2
            exit 1
          }
          echo "default_branch_commit=$default_branch_commit" >> "$GITHUB_OUTPUT"
          echo "tag_ref=$EXPECTED_TAG_REF" >> "$GITHUB_OUTPUT"

  metadata:
    needs: [identity, release_gate]
    name: Compile release metadata once
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    outputs:
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      CACHE_LANE: ${{ needs.identity.outputs.lane == 'github' && 'GitHub' || 'Velnor' }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      VELNOR_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Export metadata from one release-build binary
        id: export
        run: |
          set -euo pipefail
          mbx build -q -p velnor-runner --release --locked --features release-build
          runner=target/release/velnor-runner
          "$runner" release export > build-identity.json
          "$runner" capabilities export > manifest.json
          sha256="$(sha256sum manifest.json | awk '{print $1}')"
          echo "manifest_sha256=$sha256" >> "$GITHUB_OUTPUT"
          cp "$runner" velnor-release-tool

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: |
            build-identity.json
            manifest.json
            velnor-release-tool

  workflow:
    needs: [identity, release_gate]
    name: Build ${{ matrix.arch }} workflow binary
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    env:
      CACHE_LANE: ${{ needs.identity.outputs.lane == 'github' && 'GitHub' || 'Velnor' }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust zig cargo-binstall cargo:cargo-zigbuild"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build workflow binary
        run: mbx zigbuild -p velnor-workflow --release --locked --target "${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/velnor-workflow
          if-no-files-found: error

  image-admission:
    needs: [identity, release_gate]
    name: Admit immutable image tag
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      existing: ${{ steps.inspect.outputs.existing }}
      index_digest: ${{ steps.inspect.outputs.index_digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect version tag without mutation
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_IMAGE: ghcr.io/tailrocks/velnor-job-ubuntu
          VERSION: ${{ needs.identity.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          RECOVERY_INDEX_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.existing-image-digest || '' }}
        run: |
          set -euo pipefail
          ref="${GHCR_IMAGE}:${VERSION}"
          error_file="$(mktemp)"
          if docker buildx imagetools inspect "$ref" --format '{{json .}}' > image.json 2>"$error_file"; then
            index_digest="$(jq -er '.manifest.digest' image.json)"
            case "$index_digest" in
              sha256:[0-9a-fA-F]*) ;;
              *) echo "::error::existing image tag $ref returned an invalid index digest" >&2; exit 1 ;;
            esac
            if ! gh release view "v${VERSION}" --repo "$REPOSITORY" >/dev/null 2>&1; then
              if [ -z "$RECOVERY_INDEX_DIGEST" ] || [ "$index_digest" != "$RECOVERY_INDEX_DIGEST" ]; then
                echo "::error::OCI tag $ref already exists without a matching GitHub release; refusing to adopt unknown bytes" >&2
                exit 1
              fi
              echo "adopting explicitly supplied recovery index $index_digest"
            fi
            {
              echo "existing=true"
              echo "index_digest=$index_digest"
            } >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|no such manifest|not found|name unknown' "$error_file"; then
            {
              echo "existing=false"
              echo "index_digest="
            } >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            echo "::error::could not determine whether OCI tag $ref exists; refusing a fail-open publish" >&2
            exit 1
          fi

  image-platform:
    needs: [identity, release_gate, metadata, workflow, image-admission]
    if: ${{ needs.image-admission.outputs.existing != 'true' }}
    name: Build ${{ matrix.arch }} GHCR image
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      CACHE_LANE: ${{ needs.identity.outputs.lane == 'github' && 'GitHub' || 'Velnor' }}
      VERSION: ${{ needs.identity.outputs.version }}
      COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workflow-${{ matrix.arch }}
          path: release-binaries/${{ matrix.arch }}

      - name: Normalize workflow binary mode after artifact download
        run: |
          set -euo pipefail
          # Artifact archives preserve bytes but do not reliably preserve the
          # executable bit. Restore it at the artifact-to-build-context
          # boundary before Docker validates and copies the release binary.
          binary="release-binaries/${{ matrix.arch }}/velnor-workflow"
          test -f "$binary"
          chmod 0755 "$binary"
          test -x "$binary"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cleanup: false
          keep-state: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push platform image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/job-ubuntu.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          # Each native builder owns a disjoint cache ref. Sharing one cache
          # ref between concurrent amd64/arm64 exports races the cache index.
          cache-from: |
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }}
            type=gha,scope=velnor-job-ubuntu-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
            type=gha,scope=velnor-job-ubuntu-${{ matrix.arch }},mode=max,ignore-error=true
          secrets: |
            mise_github_token=${{ github.token }}
          build-args: |
            VELNOR_IMAGE_VERSION=${{ needs.identity.outputs.version }}
          # Version tags are admitted and promoted only by the image job below.
          # These commit-scoped tags are disposable staging references and can
          # never overwrite a consumer-facing version tag.
          tags: ${{ env.GHCR_IMAGE }}:release-${{ env.COMMIT }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.identity.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release_gate.outputs.default_branch_commit }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.velnor.manifest-sha256=${{ needs.metadata.outputs.manifest_sha256 }}

      - name: Record platform digest
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${GHCR_IMAGE}:release-${COMMIT}-${ARCH}" \
            --format '{{json .}}' > image-inspect.json
          PLATFORM_DIGEST="$(jq -er --arg arch "$ARCH" '
            [.manifest.manifests[]
             | select(.platform.architecture == $arch and .platform.os == "linux")
             | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
             | .digest]
            | if length == 1 then .[0] else error("expected one image manifest for architecture") end
          ' image-inspect.json)"
          case "$PLATFORM_DIGEST" in
            sha256:[0-9a-fA-F]*) ;;
            *) echo "::error::staging image inspection did not return a platform digest" >&2; exit 1 ;;
          esac
          printf '%s\n' "$PLATFORM_DIGEST" > "image-${{ matrix.arch }}.digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-platform-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.digest

  image:
    if: ${{ always() && needs.identity.result == 'success' && needs.release_gate.result == 'success' && needs.metadata.result == 'success' && needs.image-admission.result == 'success' && (needs.image-platform.result == 'success' || needs.image-platform.result == 'skipped') }}
    needs: [identity, release_gate, metadata, image-platform, image-admission]
    name: Assemble one multi-platform GHCR image
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      index_digest: ${{ steps.push.outputs.index_digest }}
      manifest_sha256: ${{ needs.metadata.outputs.manifest_sha256 }}
    env:
      GHCR_IMAGE: ghcr.io/tailrocks/velnor-job-ubuntu
      SOURCE_URL: https://github.com/tailrocks/velnor
      VERSION: ${{ needs.identity.outputs.version }}
      COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: ${{ needs.image-admission.outputs.existing != 'true' }}
        with:
          pattern: image-platform-*
          path: image-artifacts
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cleanup: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and inspect immutable image index
        id: push
        env:
          AMD64_DIGEST_FILE: image-artifacts/image-amd64.digest
          ARM64_DIGEST_FILE: image-artifacts/image-arm64.digest
          IMAGE_ALREADY_EXISTS: ${{ needs.image-admission.outputs.existing }}
          EXPECTED_EXISTING_INDEX_DIGEST: ${{ needs.image-admission.outputs.index_digest }}
        run: |
          set -euo pipefail
          if [ "$IMAGE_ALREADY_EXISTS" = true ]; then
            docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
            index_digest="$(jq -er '.manifest.digest' image-digests.json)"
            [ "$index_digest" = "$EXPECTED_EXISTING_INDEX_DIGEST" ] || {
              echo "::error::version tag moved from $EXPECTED_EXISTING_INDEX_DIGEST to $index_digest during admission" >&2
              exit 1
            }
          else
            for path in "$AMD64_DIGEST_FILE" "$ARM64_DIGEST_FILE"; do
              test -s "$path"
              digest="$(tr -d '[:space:]' < "$path")"
              case "$digest" in
                sha256:[0-9a-fA-F]*) ;;
                *) echo "::error::invalid platform digest in $path" >&2; exit 1 ;;
              esac
            done
            amd64_digest="$(tr -d '[:space:]' < "$AMD64_DIGEST_FILE")"
            arm64_digest="$(tr -d '[:space:]' < "$ARM64_DIGEST_FILE")"
            docker buildx imagetools create \
              --tag "${GHCR_IMAGE}:${VERSION}" \
              "${GHCR_IMAGE}:release-${COMMIT}-amd64" \
              "${GHCR_IMAGE}:release-${COMMIT}-arm64"
            docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
            jq -e --arg amd "$amd64_digest" --arg arm "$arm64_digest" '
              any(.manifest.manifests[]; .digest == $amd and .platform.architecture == "amd64") and
              any(.manifest.manifests[]; .digest == $arm and .platform.architecture == "arm64")
            ' image-digests.json >/dev/null || {
              echo "::error::version tag does not reference both newly built platform digests" >&2
              exit 1
            }
          fi
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > image-digests.json
          index_digest="$(jq -er '.manifest.digest' image-digests.json)"
          case "$index_digest" in
            sha256:[0-9a-fA-F]*) ;;
            *) echo "::error::manifest inspection did not return an index digest" >&2; exit 1 ;;
          esac
          printf 'index_digest=%s\n' "$index_digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$index_digest" > image-index.digest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digests
          path: |
            image-digests.json
            image-index.digest

  guest-image:
    needs: [identity, release_gate]
    name: Guest kernel/rootfs ${{ matrix.arch }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            deb: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    # lane-admission permits this GitHub-hosted implementation only for the
    # explicit github lane. Velnor/both fail before release side effects until
    # Velnor provides the required isolated user-namespace capability.
    runs-on: ${{ matrix.runner }}
    env:
      CACHE_LANE: GitHub
      CARGO_INCREMENTAL: "0"
      GUEST_ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3

      - name: Add guest-agent target
        run: rustup target add "$TARGET"

      - name: Install kernel and rootfs build packages
        run: |
          set -euo pipefail
          # velnor-sudo-exception: GitHub-hosted release build installs required OS packages.
          sudo apt-get update
          # velnor-sudo-exception: GitHub-hosted release build installs required OS packages.
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libelf-dev xz-utils e2fsprogs \
            mmdebstrap debootstrap arch-test
          if [ "$GUEST_ARCH" = "x86_64" ]; then
            sudo apt-get install -y --no-install-recommends \
              qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64
            test -x /usr/bin/qemu-aarch64-static
          else
            # Build the ARM kernel with the same cross-GCC identity on every
            # runner; native ARM GCC changes the pinned vmlinux bytes.
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu
          fi
          arch-test arm64

      - name: Download pinned kernel tarball
        run: |
          set -euo pipefail
          url="$(jq -er '.kernel_tarball' microvm/pins.json)"
          sha="$(jq -er '.kernel_tarball_sha256' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 \
            --connect-timeout 30 --max-time 900 \
            -o linux.tar.xz "$url"
          echo "$sha  linux.tar.xz" | sha256sum -c -

      - name: Build guest agent for rootfs
        run: |
          set -euo pipefail
          agent="target/$TARGET/release/velnor-guest-agent"
          mbx build -p velnor-runner --bin velnor-guest-agent \
            --locked --release --features release-build --target "$TARGET"
          test -x "$agent"
          case "$TARGET" in
            aarch64-unknown-linux-gnu)
              readelf -h "$agent" | grep -Eq 'Machine:[[:space:]]+AArch64'
              ;;
            x86_64-unknown-linux-gnu)
              readelf -h "$agent" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
              ;;
            *)
              echo "::error::unsupported guest-agent target $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Build guest vmlinux and rootfs.ext4
        run: |
          set -euo pipefail
          mkdir -p dist/microvm
          agent="target/$TARGET/release/velnor-guest-agent"
          mbx run -p velnor-runner --bin velnor-guest-image --locked --release -- \
            build --arch "${{ matrix.arch }}" --out dist/microvm --tarball linux.tar.xz \
            --guest-agent "$agent"
          test -s dist/microvm/vmlinux
          test -s dist/microvm/rootfs.ext4
          test -s "$agent"
          test -x "$agent"
          # shellcheck disable=SC2209
          stat_output="$(DEBUGFS_PAGER=cat debugfs -R 'stat /usr/bin/velnor-guest-agent' dist/microvm/rootfs.ext4 2>&1)"
          printf '%s\n' "$stat_output" | grep -Eq 'Type: regular[[:space:]]+Mode:[[:space:]]+0755([[:space:]]|$)' \
            || { echo "::error::rootfs guest agent must be a regular file with mode 0755" >&2; exit 1; }
          agent_dump="$(mktemp)"
          trap 'rm -f -- "$agent_dump"' EXIT
          # shellcheck disable=SC2209
          DEBUGFS_PAGER=cat debugfs -R "dump /usr/bin/velnor-guest-agent $agent_dump" dist/microvm/rootfs.ext4 >/dev/null
          cmp -- "$agent_dump" "$agent"
          sha256sum dist/microvm/rootfs.ext4 | awk '{print $1}' > dist/microvm/rootfs.sha256
          cp "$agent" dist/microvm/velnor-guest-agent
          sha256sum "$agent" | awk '{print $1}' > dist/microvm/guest-agent.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guest-image-${{ matrix.arch }}
          path: |
            dist/microvm/vmlinux
            dist/microvm/rootfs.ext4
            dist/microvm/rootfs.sha256
            dist/microvm/velnor-guest-agent
            dist/microvm/guest-agent.sha256

  build:
    needs: [identity, release_gate, metadata, guest-image, workflow]
    name: Build ${{ matrix.arch }} binary + deb (release-build)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    env:
      CACHE_LANE: ${{ needs.identity.outputs.lane == 'github' && 'GitHub' || 'Velnor' }}
      VERSION: ${{ needs.identity.outputs.version }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      VELNOR_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust zig cargo-binstall cargo:cargo-zigbuild"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-deb (verified prebuilt only)
        env:
          # cargo-binstall performs GitHub API discovery independently of mise.
          # Authenticate parallel release jobs so they do not share the tiny
          # anonymous rate limit and fail nondeterministically with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mise exec cargo-binstall -- cargo binstall cargo-deb@3.7.0 \
            --disable-strategies compile --no-confirm --force
          cargo-deb --version

      - name: Build release binaries (identity + every deb asset)
        run: |
          set -euo pipefail
          # release-build is a feature of velnor-runner and velnorctl only.
          # The deb also ships velnor-tools and velnor-workflow, so build those
          # packages explicitly without inventing a feature they do not own.
          # Keep the Rust builds inside Mr. Boxington while disabling only its
          # C/C++ build-script shim. The shim's cross-link overlay cannot
          # resolve the glibc ISO C23 symbols emitted by aws-lc-sys.
          MBX_CC=0 mbx zigbuild -p velnor-runner \
            --bin velnor-runner \
            --release --locked --features release-build --target "${{ matrix.target }}"
          MBX_CC=0 mbx zigbuild -p velnorctl \
            --release --locked --features release-build --target "${{ matrix.target }}"
          mbx zigbuild -p velnor-tools \
            --release --locked --target "${{ matrix.target }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: workflow-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release

      - name: Normalize workflow binary mode after artifact download
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/velnor-workflow"
          test -f "$binary"
          chmod 0755 "$binary"
          test -x "$binary"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: release-metadata

      - name: Package tar + independent hash
        run: |
          set -euo pipefail
          # Artifact NAMES keep the velnor-runner prefix until the Plan 079
          # package rename (downstream apt verify + evidence reference them);
          # the bound BINARY is the shipped product: /usr/bin/velnorctl.
          archive="velnor-runner-${VERSION}-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" velnor-runner
          sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
          # Independent digest of the raw binary (the record's per-arch binary id).
          sha256sum "target/${{ matrix.target }}/release/velnor-runner" | awk '{print $1}' > "velnor-runner-${{ matrix.arch }}.bin.sha256"

      - name: Stage acyclic identity files packaged into the deb
        run: |
          set -euo pipefail
          # These depend only on the source (not on the deb digest), so shipping
          # them inside the deb is acyclic. postinst validates the installed
          # binary against them offline.
          mkdir -p crates/velnor-runner/release
          cp release-metadata/build-identity.json crates/velnor-runner/release/build-identity.json
          cp release-metadata/manifest.json crates/velnor-runner/release/manifest.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: guest-image-${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
          path: guest-image

      - name: Stage pinned Firecracker, jailer, and guest agent
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$DEB_ARCH" in
            amd64) pin_arch=x86_64 ;;
            arm64) pin_arch=aarch64 ;;
            *) echo "::error::unsupported arch $DEB_ARCH" >&2; exit 1 ;;
          esac
          url="$(jq -er --arg a "$pin_arch" '.tarballs[$a].url' microvm/pins.json)"
          sha="$(jq -er --arg a "$pin_arch" '.tarballs[$a].sha256' microvm/pins.json)"
          fc_member="$(jq -er --arg a "$pin_arch" '.tarballs[$a].firecracker_member' microvm/pins.json)"
          jailer_member="$(jq -er --arg a "$pin_arch" '.tarballs[$a].jailer_member' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 \
            --connect-timeout 30 --max-time 900 \
            -o firecracker.tgz "$url"
          echo "$sha  firecracker.tgz" | sha256sum -c -
          mkdir -p extracted crates/velnor-runner/release/microvm
          tar -xzf firecracker.tgz -C extracted
          cp "extracted/${fc_member}" crates/velnor-runner/release/microvm/firecracker
          cp "extracted/${jailer_member}" crates/velnor-runner/release/microvm/jailer
          test -s guest-image/velnor-guest-agent || { echo "::error::guest-image missing guest-agent" >&2; exit 1; }
          test -s guest-image/guest-agent.sha256 || { echo "::error::guest-image missing guest-agent checksum" >&2; exit 1; }
          guest_agent_sha256="$(awk '{print $1}' guest-image/guest-agent.sha256)"
          [ "${#guest_agent_sha256}" -eq 64 ] || { echo "::error::guest-agent digest has invalid length" >&2; exit 1; }
          actual_guest_agent_sha256="$(sha256sum guest-image/velnor-guest-agent | awk '{print $1}')"
          [ "$actual_guest_agent_sha256" = "$guest_agent_sha256" ] || { echo "::error::downloaded guest-agent digest mismatch" >&2; exit 1; }
          install -Dm0755 guest-image/velnor-guest-agent "target/${TARGET}/release/velnor-guest-agent"
          cmp -- "target/${TARGET}/release/velnor-guest-agent" guest-image/velnor-guest-agent
          cp "target/${TARGET}/release/velnor-guest-agent" crates/velnor-runner/release/microvm/velnor-guest-agent
          test -s guest-image/vmlinux || { echo "::error::guest-image missing vmlinux" >&2; exit 1; }
          test -s guest-image/rootfs.ext4 || { echo "::error::guest-image missing rootfs.ext4" >&2; exit 1; }
          test -s guest-image/rootfs.sha256 || { echo "::error::guest-image missing rootfs.sha256" >&2; exit 1; }
          rootfs_sha256="$(awk '{print $1}' guest-image/rootfs.sha256)"
          [ "${#rootfs_sha256}" -eq 64 ] || { echo "::error::guest rootfs digest has invalid length" >&2; exit 1; }
          actual_rootfs_sha256="$(sha256sum guest-image/rootfs.ext4 | awk '{print $1}')"
          [ "$actual_rootfs_sha256" = "$rootfs_sha256" ] || { echo "::error::downloaded guest rootfs digest mismatch" >&2; exit 1; }
          cp guest-image/vmlinux crates/velnor-runner/release/microvm/vmlinux
          cp guest-image/rootfs.ext4 crates/velnor-runner/release/microvm/rootfs.ext4
          chmod 0755 \
            crates/velnor-runner/release/microvm/firecracker \
            crates/velnor-runner/release/microvm/jailer \
            crates/velnor-runner/release/microvm/velnor-guest-agent
          fc_sha="$(sha256sum crates/velnor-runner/release/microvm/firecracker | awk '{print $1}')"
          jailer_sha="$(sha256sum crates/velnor-runner/release/microvm/jailer | awk '{print $1}')"
          expected_fc="$(jq -er --arg a "$pin_arch" '.tarballs[$a].firecracker_sha256' microvm/pins.json)"
          expected_jailer="$(jq -er --arg a "$pin_arch" '.tarballs[$a].jailer_sha256' microvm/pins.json)"
          [ "$fc_sha" = "$expected_fc" ] || { echo "::error::firecracker sha $fc_sha != pin $expected_fc" >&2; exit 1; }
          [ "$jailer_sha" = "$expected_jailer" ] || { echo "::error::jailer sha $jailer_sha != pin $expected_jailer" >&2; exit 1; }
          mbx run -p velnor-runner --bin velnor-guest-image --locked --release -- \
            stage --root crates/velnor-runner/release/microvm --arch "$pin_arch" \
            --rootfs-sha256 "$rootfs_sha256" \
            --guest-agent-sha256 "$guest_agent_sha256"
          kernel="$(jq -er '.kernel' crates/velnor-runner/release/microvm/manifest.json)"
          rootfs="$(jq -er '.rootfs' crates/velnor-runner/release/microvm/manifest.json)"
          case "$kernel$rootfs" in
            *UNSET*) echo "::error::staged kernel/rootfs checksum is still UNSET" >&2; exit 1 ;;
          esac
          [ "${#kernel}" -eq 64 ] || { echo "::error::kernel sha256 length ${#kernel}" >&2; exit 1; }
          [ "${#rootfs}" -eq 64 ] || { echo "::error::rootfs sha256 length ${#rootfs}" >&2; exit 1; }

      - name: Build .deb (version pinned to the tag)
        run: |
          set -euo pipefail
          cargo deb -p velnor-runner --target ${{ matrix.target }} --no-build --no-strip --deb-version "$VERSION"

      - name: Stage .deb with the empty-deb-incident guards
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=("target/${{ matrix.target }}/debian/velnor-runner_${VERSION}_"*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected exactly one ${VERSION} deb, found ${#debs[@]}" >&2; exit 1; }
          src="${debs[0]}"
          case "${{ matrix.arch }}" in
            amd64) expected_arch=amd64 ;;
            arm64) expected_arch=arm64 ;;
            *) echo "::error::unsupported arch" >&2; exit 1 ;;
          esac
          [ "$(dpkg-deb -f "$src" Version)" = "$VERSION" ] || { echo "::error::deb version != tag" >&2; exit 1; }
          [ "$(dpkg-deb -f "$src" Architecture)" = "$expected_arch" ] || { echo "::error::deb arch != $expected_arch" >&2; exit 1; }
          manifest="$(mktemp)"
          dpkg-deb -c "$src" > "$manifest"
          awk '$NF == "./usr/bin/velnor-runner" { count++; if (substr($1, 1, 1) != "-") type_ok=0; else if (count == 1) type_ok=1 } END { exit !(count == 1 && type_ok == 1) }' "$manifest" \
            || { echo "::error::deb must contain exactly one regular usr/bin/velnor-runner" >&2; exit 1; }
          grep -q "usr/bin/velnor-runner" "$manifest" || { echo "::error::deb missing usr/bin/velnor-runner" >&2; exit 1; }
          grep -q "usr/bin/velnorctl" "$manifest" || { echo "::error::deb missing usr/bin/velnorctl" >&2; exit 1; }
          grep -q "usr/bin/velnor-tools" "$manifest" || { echo "::error::deb missing usr/bin/velnor-tools" >&2; exit 1; }
          grep -q "usr/bin/velnor-guest-agent" "$manifest" || { echo "::error::deb missing usr/bin/velnor-guest-agent" >&2; exit 1; }
          grep -q "lib/systemd/system/velnor-fleet-policy-audit.service" "$manifest" || { echo "::error::deb missing fleet-policy audit service" >&2; exit 1; }
          grep -q "lib/systemd/system/velnor-fleet-policy-audit.timer" "$manifest" || { echo "::error::deb missing fleet-policy audit timer" >&2; exit 1; }
          grep -q "usr/share/velnor/fleet/release-refs.toml" "$manifest" || { echo "::error::deb missing authoritative fleet release-ref ledger" >&2; exit 1; }
          grep -q "usr/lib/tmpfiles.d/velnor-runner.conf" "$manifest" || { echo "::error::deb missing tmpfiles.d transaction-lock path entry" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/firecracker" "$manifest" || { echo "::error::deb missing firecracker" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/jailer" "$manifest" || { echo "::error::deb missing jailer" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/velnor-guest-agent" "$manifest" || { echo "::error::deb missing packaged guest-agent" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/vmlinux" "$manifest" || { echo "::error::deb missing guest kernel" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/rootfs.ext4" "$manifest" || { echo "::error::deb missing guest rootfs" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/manifest.json" "$manifest" || { echo "::error::deb missing microvm manifest" >&2; exit 1; }
          grep -q "usr/share/velnor/job-ubuntu.Dockerfile" "$manifest" || { echo "::error::deb missing canonical Dockerfile" >&2; exit 1; }
          [ "$(stat -c%s "$src")" -gt 1000000 ] || { echo "::error::deb suspiciously small: $(stat -c%s "$src") bytes" >&2; exit 1; }
          build_binary="target/${{ matrix.target }}/release/velnor-runner"
          read_sha() {
            local path="$1" size token
            [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
            size="$(stat -c%s "$path")"
            [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
            token="$(awk '
              {
                for (field = 1; field <= NF; field++) {
                  token_count++
                  if (token_count == 1) token = $field
                }
              }
              END {
                if (token_count != 1) exit 1
                print token
              }
            ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
            [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
            case "$token" in
              *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
            esac
            printf '%s\n' "$token"
          }
          recorded_binary_sha="$(read_sha "velnor-runner-${{ matrix.arch }}.bin.sha256")"
          build_binary_sha="$(sha256sum "$build_binary" | awk '{print $1}')"
          [ "$build_binary_sha" = "$recorded_binary_sha" ] || { echo "::error::runner binary sidecar does not match target build" >&2; exit 1; }
          packaged_binary_sha="$(dpkg-deb --fsys-tarfile "$src" | tar -xOf - ./usr/bin/velnor-runner | sha256sum | awk '{print $1}')"
          [ "$packaged_binary_sha" = "$build_binary_sha" ] || { echo "::error::deb runner binary does not match target build" >&2; exit 1; }
          [ "$packaged_binary_sha" = "$recorded_binary_sha" ] || { echo "::error::deb runner binary does not match recorded binary sha256" >&2; exit 1; }
          dst="velnor-runner-${VERSION}-${{ matrix.arch }}.deb"
          cp "$src" "$dst"
          sha256sum "$dst" | awk '{print $1}' > "$dst.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            velnor-runner-*.tar.gz
            velnor-runner-*.tar.gz.sha256
            velnor-runner-*.deb
            velnor-runner-*.deb.sha256
            velnor-runner-*.bin.sha256

  release:
    needs: [identity, release_gate, metadata, image, build]
    name: Assemble, verify + publish one coherent release
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
      INDEX_DIGEST: ${{ needs.image.outputs.index_digest }}
      MANIFEST_SHA256: ${{ needs.image.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release_gate.outputs.default_branch_commit }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Normalize immutable release checkout
        env:
          SOURCE_COMMIT: ${{ needs.release_gate.outputs.default_branch_commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-digests
          path: artifacts
          merge-multiple: true

      - name: Assemble the release record from downloaded artifacts
        run: |
          set -euo pipefail
          read_sha() {
            local path="artifacts/$1" size token
            [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
            size="$(stat -c%s "$path")"
            [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
            token="$(awk '
              {
                for (field = 1; field <= NF; field++) {
                  token_count++
                  if (token_count == 1) token = $field
                }
              }
              END {
                if (token_count != 1) exit 1
                print token
              }
            ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
            [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
            case "$token" in
              *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
            esac
            printf '%s\n' "$token"
          }
          bin_amd64="$(read_sha "velnor-runner-amd64.bin.sha256")"
          bin_arm64="$(read_sha "velnor-runner-arm64.bin.sha256")"
          deb_amd64="$(read_sha "velnor-runner-${VERSION}-amd64.deb.sha256")"
          deb_arm64="$(read_sha "velnor-runner-${VERSION}-arm64.deb.sha256")"
          # Per-platform OCI digests from the image job.
          plat_amd64="$(jq -r '.manifest.manifests[] | select(.platform.architecture=="amd64") | .digest' artifacts/image-digests.json)"
          plat_arm64="$(jq -r '.manifest.manifests[] | select(.platform.architecture=="arm64") | .digest' artifacts/image-digests.json)"
          manifest_version="$(jq -er '.version | select(type == "number" and floor == . and . > 0)' artifacts/manifest.json)"

          jq -n \
            --arg schema "velnor.release-record/v1" \
            --arg repo "tailrocks/velnor" \
            --arg tag "v${VERSION}" \
            --arg commit "$COMMIT" \
            --arg version "$VERSION" \
            --argjson mv "$manifest_version" \
            --arg mhash "$MANIFEST_SHA256" \
            --arg bin_amd64 "$bin_amd64" --arg deb_amd64 "$deb_amd64" --arg plat_amd64 "$plat_amd64" \
            --arg bin_arm64 "$bin_arm64" --arg deb_arm64 "$deb_arm64" --arg plat_arm64 "$plat_arm64" \
            --arg index "$INDEX_DIGEST" \
            --arg ref "${GHCR_IMAGE}@${INDEX_DIGEST}" \
            --arg source "$SOURCE_URL" \
            '{
              schema: $schema,
              build: { repository: $repo, tag: $tag, commit: $commit, crate_version: $version,
                       debian_version: $version, manifest_version: $mv, manifest_sha256: $mhash },
              architectures: [
                { arch: "amd64", target: "x86_64-unknown-linux-gnu", binary_sha256: $bin_amd64, deb_sha256: $deb_amd64, oci_platform_digest: $plat_amd64 },
                { arch: "arm64", target: "aarch64-unknown-linux-gnu", binary_sha256: $bin_arm64, deb_sha256: $deb_arm64, oci_platform_digest: $plat_arm64 }
              ],
              oci_index_digest: $index,
              oci_image_ref: $ref,
              oci_labels: { version: $version, revision: $commit, source: $source, manifest_sha256: $mhash },
              apt: { origin: "Velnor", suite: "stable", component: "main" }
            }' > record.candidate.json

      - name: Re-verify the record + emit canonical bytes + checksum
        run: |
          set -euo pipefail
          # Independent re-assembly + coherence check; writes canonical
          # release-record.json + release-record.json.sha256 (the digest lives in
          # the sidecar, never inside the record — acyclic).
          chmod +x artifacts/velnor-release-tool
          artifacts/velnor-release-tool release assemble \
            --record record.candidate.json \
            --artifacts artifacts \
            --out release-record.json
          cp release-record.json.sha256 SHA256SUMS.record
          # Publish the compiled manifest + its checksum too, so velnor-apt can
          # verify sha256(manifest.json) == record.build.manifest_sha256 and that
          # the manifest's embedded source_sha matches the record commit.
          cp artifacts/manifest.json manifest.json
          sha256sum manifest.json | awk '{print $1}' > manifest.json.sha256

      - name: Assemble consumer release manifest and independent checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          subjects=(artifacts/velnor-runner-*.tar.gz artifacts/velnor-runner-*.deb)
          test "${#subjects[@]}" -eq 4
          : > SHA256SUMS
          : > assets.jsonl
          for subject in "${subjects[@]}"; do
            name=$(basename "$subject")
            digest=$(sha256sum "$subject" | awk '{print $1}')
            printf '%s  %s\n' "$digest" "$name" >> SHA256SUMS
            jq -cn --arg name "$name" --arg sha256 "$digest" '{name:$name,sha256:$sha256}' >> assets.jsonl
          done
          jq -S -n \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_ref "refs/tags/v$VERSION" \
            --arg source_commit "$COMMIT" \
            --arg version "$VERSION" \
            --slurpfile assets assets.jsonl \
            '{schema:"velnor.package-release.v1",source_repository:$source_repository,source_ref:$source_ref,source_commit:$source_commit,version:$version,assets:$assets}' \
            > release-manifest.json
          # SHA256SUMS binds artifact basenames. Verify from the downloaded
          # artifact corpus before copying those exact bytes to signer-input.
          (cd artifacts && sha256sum --check --strict ../SHA256SUMS)

      - name: Stage package subjects for hosted signer
        run: |
          set -euo pipefail
          mkdir signer-input
          cp artifacts/velnor-runner-*.tar.gz artifacts/velnor-runner-*.deb signer-input/

      - name: Verify packaged runner identity before release creation
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            deb="artifacts/velnor-runner-${VERSION}-${arch}.deb"
            record_bin="$(jq -er --arg arch "$arch" '
              [.architectures[] | select(.arch == $arch)]
              | if length == 1 then .[0].binary_sha256 else error("record must contain exactly one architecture") end
            ' release-record.json)"
            case "$record_bin" in
              *[!0-9a-f]*|'') echo "::error::record has invalid runner binary sha256 ($arch)" >&2; exit 1 ;;
            esac
            [ "${#record_bin}" -eq 64 ] || { echo "::error::record has invalid runner binary sha256 ($arch)" >&2; exit 1; }
            packaged_binary_sha="$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - ./usr/bin/velnor-runner | sha256sum | awk '{print $1}')"
            [ "$packaged_binary_sha" = "$record_bin" ] || {
              echo "::error::packaged /usr/bin/velnor-runner digest != release record ($arch)" >&2
              exit 1
            }
          done

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cleanup: false

      - name: Log in to GHCR for immutable image verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify OCI index stayed immutable before publication
        env:
          EXPECTED_INDEX_DIGEST: ${{ needs.image.outputs.index_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .}}' > published-image.json
          published_index="$(jq -er '.manifest.digest' published-image.json)"
          [ "$published_index" = "$EXPECTED_INDEX_DIGEST" ] || {
            echo "::error::OCI version tag moved from $EXPECTED_INDEX_DIGEST to $published_index before release publication" >&2
            exit 1
          }

      - name: Verify release tag stayed immutable before publication
        env:
          EXPECTED_TAG_REF: ${{ needs.release_gate.outputs.tag_ref }}
          EXPECTED_TAG_COMMIT: ${{ needs.identity.outputs.tag_commit }}
        run: |
          set -euo pipefail
          remote_tag_refs="$(git ls-remote --exit-code origin "$EXPECTED_TAG_REF" "$EXPECTED_TAG_REF^{}")"
          remote_tag_commit="$(printf '%s\n' "$remote_tag_refs" | awk -v expected="$EXPECTED_TAG_REF" '
            $2 == expected "^{}" { peeled=$1; found_peeled=1; next }
            $2 == expected && !found_peeled { raw=$1 }
            END {
              if (found_peeled) print peeled
              else if (raw != "") print raw
            }
          ')"
          case "$remote_tag_commit" in
            *[!0-9a-f]*|'') echo "::error::release tag $EXPECTED_TAG_REF did not resolve to lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#remote_tag_commit}" -eq 40 ] || { echo "::error::release tag $EXPECTED_TAG_REF did not resolve to one commit" >&2; exit 1; }
          [ "$remote_tag_commit" = "$EXPECTED_TAG_COMMIT" ] || {
            echo "::error::release tag $EXPECTED_TAG_REF moved from $EXPECTED_TAG_COMMIT to $remote_tag_commit" >&2
            exit 1
          }

      - name: Create release once — no clobber, record-verified idempotency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Fail (never mint at main HEAD) if there is nothing to publish.
          [ -f release-record.json ] || { echo "::error::no assembled record" >&2; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            # Existing release: rebuilds are NOT bit-reproducible (tar/deb/OCI
            # payloads embed build metadata), so byte-equality against a fresh
            # build can never hold and re-runs would fail forever. Instead
            # verify the PUBLISHED release is coherent: its record names this
            # exact tag/commit/version/manifest and every published asset
            # matches the digests inside that record. Never clobber (N-immutable).
            tmp="$(mktemp -d)"
            for name in release-record.json release-record.json.sha256 \
                        release-manifest.json manifest.json manifest.json.sha256 SHA256SUMS \
                        "velnor-runner-${VERSION}-amd64.tar.gz" "velnor-runner-${VERSION}-amd64.tar.gz.sha256" \
                        "velnor-runner-${VERSION}-arm64.tar.gz" "velnor-runner-${VERSION}-arm64.tar.gz.sha256" \
                        "velnor-runner-${VERSION}-amd64.deb" "velnor-runner-${VERSION}-amd64.deb.sha256" \
                        "velnor-runner-${VERSION}-arm64.deb" "velnor-runner-${VERSION}-arm64.deb.sha256"; do
              gh release download "$tag" --pattern "$name" --dir "$tmp" --clobber >/dev/null 2>&1 \
                || { echo "::error::release $tag exists but is missing $name — refusing partial overwrite" >&2; exit 1; }
            done
            # Sidecar checksums must match their payloads.
            read_sha() {
              local path="$1" size token
              [ -f "$path" ] || { echo "::error::missing checksum sidecar: $path" >&2; return 1; }
              size="$(stat -c%s "$path")"
              [ "$size" -le 4096 ] || { echo "::error::checksum sidecar exceeds 4096 bytes: $path" >&2; return 1; }
              token="$(awk '
                {
                  for (field = 1; field <= NF; field++) {
                    token_count++
                    if (token_count == 1) token = $field
                  }
                }
                END {
                  if (token_count != 1) exit 1
                  print token
                }
              ' "$path")" || { echo "::error::checksum sidecar must contain one token: $path" >&2; return 1; }
              [ "${#token}" -eq 64 ] || { echo "::error::invalid checksum sidecar: $path" >&2; return 1; }
              case "$token" in
                *[!0-9a-f]*) echo "::error::invalid checksum sidecar: $path" >&2; return 1 ;;
              esac
              printf '%s\n' "$token"
            }
            [ "$(read_sha "$tmp/release-record.json.sha256")" = "$(sha256sum "$tmp/release-record.json" | awk '{print $1}')" ] \
              || { echo "::error::published release-record.json fails its sidecar checksum" >&2; exit 1; }
            [ "$(read_sha "$tmp/manifest.json.sha256")" = "$(sha256sum "$tmp/manifest.json" | awk '{print $1}')" ] \
              || { echo "::error::published manifest.json fails its sidecar checksum" >&2; exit 1; }
            # The record must name this exact tag, source commit, crate version
            # and the manifest this source tree compiles to (the compiled
            # manifest is byte-reproducible; binaries are not).
            [ "$(jq -r '.build.tag' "$tmp/release-record.json")" = "$tag" ] \
              || { echo "::error::published record tag mismatch — refusing to touch $tag" >&2; exit 1; }
            [ "$(jq -r '.build.commit' "$tmp/release-record.json")" = "$COMMIT" ] \
              || { echo "::error::published record commit mismatch — tag may have moved" >&2; exit 1; }
            [ "$(jq -r '.build.crate_version' "$tmp/release-record.json")" = "$VERSION" ] \
              || { echo "::error::published record version mismatch" >&2; exit 1; }
            [ "$(jq -r '.build.manifest_sha256' "$tmp/release-record.json")" = "$(sha256sum "$tmp/manifest.json" | awk '{print $1}')" ] \
              || { echo "::error::published record/manifest incoherent" >&2; exit 1; }
            [ "$(jq -r '.build.manifest_sha256' "$tmp/release-record.json")" = "$MANIFEST_SHA256" ] \
              || { echo "::error::published record manifest != manifest compiled from $COMMIT" >&2; exit 1; }
            expected_oci_index="$(jq -er '.oci_index_digest' "$tmp/release-record.json")"
            [ "$expected_oci_index" = "$INDEX_DIGEST" ] \
              || { echo "::error::published record OCI index != current release image" >&2; exit 1; }
            [ "$(jq -r '.oci_image_ref' "$tmp/release-record.json")" = "${GHCR_IMAGE}@${expected_oci_index}" ] \
              || { echo "::error::published record OCI reference is not digest-pinned" >&2; exit 1; }
            # Every published package asset must match the record's digests.
            (cd "$tmp" && sha256sum --check --strict SHA256SUMS)
            for arch in amd64 arm64; do
              tarball="velnor-runner-${VERSION}-${arch}.tar.gz"
              deb="velnor-runner-${VERSION}-${arch}.deb"
              record_deb="$(jq -r --arg arch "$arch" '.architectures[] | select(.arch == $arch) | .deb_sha256' "$tmp/release-record.json")"
              record_bin="$(jq -r --arg arch "$arch" '.architectures[] | select(.arch == $arch) | .binary_sha256' "$tmp/release-record.json")"
              [ "$(read_sha "$tmp/${tarball}.sha256")" = "$(sha256sum "$tmp/$tarball" | awk '{print $1}')" ] \
                || { echo "::error::published tarball fails its sidecar checksum ($arch)" >&2; exit 1; }
              [ "$(read_sha "$tmp/${deb}.sha256")" = "$(sha256sum "$tmp/$deb" | awk '{print $1}')" ] \
                || { echo "::error::published deb fails its sidecar checksum ($arch)" >&2; exit 1; }
              [ "$(sha256sum "$tmp/$deb" | awk '{print $1}')" = "$record_deb" ] \
                || { echo "::error::published deb digest != record ($arch)" >&2; exit 1; }
              mkdir -p "$tmp/extract-$arch"
              tar -xzf "$tmp/$tarball" -C "$tmp/extract-$arch"
              [ "$(sha256sum "$tmp/extract-$arch/velnor-runner" | awk '{print $1}')" = "$record_bin" ] \
                || { echo "::error::published binary digest != record ($arch)" >&2; exit 1; }
            done
            # Sign the published bytes, not the non-reproducible rebuild.
            rm -rf signer-input
            mkdir signer-input
            cp "$tmp"/velnor-runner-*.tar.gz "$tmp"/velnor-runner-*.deb signer-input/
            echo "Release $tag already published; record + assets verified coherent. Nothing to upload."
          else
            gh release create "$tag" --verify-tag --target "$COMMIT" --title "$tag" --generate-notes \
              release-record.json release-record.json.sha256 \
              manifest.json manifest.json.sha256 \
              release-manifest.json SHA256SUMS \
              artifacts/velnor-runner-*.tar.gz artifacts/velnor-runner-*.tar.gz.sha256 \
              artifacts/velnor-runner-*.deb artifacts/velnor-runner-*.deb.sha256
          fi
          # NOTE (N6): this workflow deliberately does NOT push to velnor-apt or
          # dispatch its publish. tailrocks/velnor-apt pulls this record itself
          # and verifies it before reprepro. No APT credential exists here.

      # Uploaded AFTER the create/verify step: on an already-published tag the
      # signer must attest the published bytes (staged above from the release),
      # not this run's non-bit-reproducible rebuild.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-subjects
          path: signer-input
          if-no-files-found: error

  sign-amd64-tar:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-amd64.tar.gz
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  sign-arm64-tar:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-arm64.tar.gz
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  sign-amd64-deb:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-amd64.deb
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  sign-arm64-deb:
    needs: [identity, release_gate, release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: package-subjects
      subject-path: velnor-runner-${{ needs.identity.outputs.version }}-arm64.deb
      source-ref: ${{ needs.release_gate.outputs.tag_ref }}

  # Homebrew: to be added modeled on holla's release.yml `homebrew` job once the
  # tailrocks/homebrew-velnor tap + push token exist.
'''

[[declare]]
primitive = "static-workflow"
file = "preview.yml"

[declare.args]
template = '''
name: Preview release

# Rolling preview lane for tailrocks/velnor: every push to main publishes one
# prerelease that always names the current main tip, so a consumer can install
# "what main builds right now" without waiting for a tag.
#
# Deliberately NOT the stable coherence chain. A preview run emits no OCI image,
# no release-record.json, and no release-record digest chain; its artifacts are
# admitted by identity (version + source commit) plus GitHub artifact
# attestation produced by the shared ci-release-package-signer callable with
# source-ref refs/heads/main. Consumer-side verification enforces the rest.
#
# Version contract: `<crate_version>~preview.<run_number>+<7-hex-short-sha>`
# (for example 0.1.274~preview.42+abc1234). `~` is required: dpkg sorts `~`
# before the release itself, so every preview of 0.1.274 is strictly older than
# the eventual 0.1.274 stable release and can never win an upgrade race.
#
# The rolling `preview` release is replaced atomically: delete-then-create under
# a serialized concurrency group, never edited in place, so a reader can never
# observe a half-replaced asset set.
#
# Every job re-checks the ref: `workflow_dispatch` carries no branch filter, so
# a dispatch from any other ref must never build, and the manifest it would
# publish hardcodes `source_ref: refs/heads/main` — the producer is not allowed
# to claim a ref it did not build from.
#
# The deb jobs cross-compile, so they never execute the binary they build: the
# packaged build-identity.json and capabilities manifest are exported once by the
# host-native `metadata` job and copied into the deb staging by both arches (the
# same contract the stable release lane uses).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  identity:
    name: Resolve preview identity
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      crate_version: ${{ steps.identity.outputs.crate_version }}
      name: ${{ steps.identity.outputs.name }}
      commit: ${{ steps.identity.outputs.commit }}
      short_commit: ${{ steps.identity.outputs.short_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the preview version from the crate manifest
        id: identity
        env:
          EVENT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # The preview binds exactly the commit that triggered this run; it is
          # never re-resolved from the moving branch tip.
          commit="$(git rev-parse HEAD)"
          case "$commit" in
            *[!0-9a-f]*|'') echo "::error::HEAD did not resolve to lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#commit}" -eq 40 ] || { echo "::error::HEAD is not a 40-hex commit" >&2; exit 1; }
          [ "$commit" = "$EVENT_SHA" ] || { echo "::error::checkout $commit != event commit $EVENT_SHA" >&2; exit 1; }
          case "$RUN_NUMBER" in
            ''|*[!0-9]*) echo "::error::invalid workflow run number $RUN_NUMBER" >&2; exit 1 ;;
          esac
          [ "$RUN_NUMBER" -gt 0 ] || { echo "::error::run number must be positive" >&2; exit 1; }
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/velnor-runner/Cargo.toml | head -n1)"
          case "$crate" in
            ''|*[!0-9.]*) echo "::error::crate version $crate is not an X.Y.Z version" >&2; exit 1 ;;
          esac
          [[ "$crate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::crate version $crate is not an X.Y.Z version" >&2; exit 1; }
          short_commit="${commit:0:7}"
          version="${crate}~preview.${RUN_NUMBER}+${short_commit}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+~preview\.[0-9]+\+[0-9a-f]{7}$ ]] \
            || { echo "::error::preview version $version violates the preview contract" >&2; exit 1; }
          {
            echo "version=$version"
            echo "crate_version=$crate"
            echo "name=Preview $version"
            echo "commit=$commit"
            echo "short_commit=$short_commit"
          } >> "$GITHUB_OUTPUT"

  guest-payload:
    needs: identity
    name: Build ${{ matrix.arch }} guest payload for the deb
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CACHE_LANE: Preview
      CARGO_INCREMENTAL: "0"
      GUEST_ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize immutable preview checkout
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3

      - name: Add guest-agent target
        run: rustup target add "$TARGET"

      - name: Install kernel and rootfs build packages
        run: |
          set -euo pipefail
          # velnor-sudo-exception: GitHub-hosted preview build installs required OS packages.
          sudo apt-get update
          # velnor-sudo-exception: GitHub-hosted preview build installs required OS packages.
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libelf-dev xz-utils e2fsprogs \
            mmdebstrap debootstrap arch-test
          if [ "$GUEST_ARCH" = "x86_64" ]; then
            sudo apt-get install -y --no-install-recommends \
              qemu-user-static binfmt-support
            sudo update-binfmts --enable qemu-aarch64
            test -x /usr/bin/qemu-aarch64-static
          else
            # Build the ARM kernel with the same cross-GCC identity on every
            # runner; native ARM GCC changes the pinned vmlinux bytes.
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu
          fi
          arch-test arm64

      - name: Download pinned kernel tarball
        run: |
          set -euo pipefail
          url="$(jq -er '.kernel_tarball' microvm/pins.json)"
          sha="$(jq -er '.kernel_tarball_sha256' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 \
            --connect-timeout 30 --max-time 900 \
            -o linux.tar.xz "$url"
          echo "$sha  linux.tar.xz" | sha256sum -c -

      - name: Build guest agent for rootfs
        run: |
          set -euo pipefail
          agent="target/$TARGET/release/velnor-guest-agent"
          mbx build -p velnor-runner --bin velnor-guest-agent \
            --locked --release --features release-build --target "$TARGET"
          test -x "$agent"
          case "$TARGET" in
            aarch64-unknown-linux-gnu)
              readelf -h "$agent" | grep -Eq 'Machine:[[:space:]]+AArch64'
              ;;
            x86_64-unknown-linux-gnu)
              readelf -h "$agent" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
              ;;
            *)
              echo "::error::unsupported guest-agent target $TARGET" >&2
              exit 1
              ;;
          esac

      - name: Build guest vmlinux and rootfs.ext4
        run: |
          set -euo pipefail
          mkdir -p dist/microvm
          agent="target/$TARGET/release/velnor-guest-agent"
          mbx run -p velnor-runner --bin velnor-guest-image --locked --release -- \
            build --arch "${{ matrix.arch }}" --out dist/microvm --tarball linux.tar.xz \
            --guest-agent "$agent"
          test -s dist/microvm/vmlinux
          test -s dist/microvm/rootfs.ext4
          test -s "$agent"
          test -x "$agent"
          # shellcheck disable=SC2209
          stat_output="$(DEBUGFS_PAGER=cat debugfs -R 'stat /usr/bin/velnor-guest-agent' dist/microvm/rootfs.ext4 2>&1)"
          printf '%s\n' "$stat_output" | grep -Eq 'Type: regular[[:space:]]+Mode:[[:space:]]+0755([[:space:]]|$)' \
            || { echo "::error::rootfs guest agent must be a regular file with mode 0755" >&2; exit 1; }
          agent_dump="$(mktemp)"
          trap 'rm -f -- "$agent_dump"' EXIT
          # shellcheck disable=SC2209
          DEBUGFS_PAGER=cat debugfs -R "dump /usr/bin/velnor-guest-agent $agent_dump" dist/microvm/rootfs.ext4 >/dev/null
          cmp -- "$agent_dump" "$agent"
          sha256sum dist/microvm/rootfs.ext4 | awk '{print $1}' > dist/microvm/rootfs.sha256
          cp "$agent" dist/microvm/velnor-guest-agent
          sha256sum "$agent" | awk '{print $1}' > dist/microvm/guest-agent.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guest-payload-${{ matrix.deb_arch }}
          path: |
            dist/microvm/vmlinux
            dist/microvm/rootfs.ext4
            dist/microvm/rootfs.sha256
            dist/microvm/velnor-guest-agent
            dist/microvm/guest-agent.sha256
          if-no-files-found: error

  metadata:
    needs: identity
    name: Compile preview metadata once
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      CACHE_LANE: Preview
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # The same preview source binding the deb jobs build with: the
      # release-build identity gate embeds this exact commit instead of
      # demanding a v* tag, which an untagged main commit cannot have.
      VELNOR_RELEASE_BUILD: "1"
      VELNOR_PREVIEW_SOURCE_SHA: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize immutable preview checkout
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Export metadata from one preview-build binary
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          # Host-native build: this job runs on the host arch, so the binary it
          # just built is executable here. The deb jobs cross-compile and can
          # never execute their target binary, so they copy these files instead
          # of exporting them (the release lane's identical contract). The
          # RUSTFLAGS above link through mold, so mold must be installed first.
          mbx build -q -p velnor-runner --release --locked --features release-build
          runner=target/release/velnor-runner
          "$runner" release export > build-identity.json
          "$runner" capabilities export > manifest.json
          jq -e '.source_sha and .crate_version' build-identity.json >/dev/null
          jq -e 'type == "object"' manifest.json >/dev/null
          jq -e --arg sha "$SOURCE_COMMIT" '.source_sha == $sha' build-identity.json >/dev/null \
            || { echo "::error::build identity source_sha != preview source commit $SOURCE_COMMIT" >&2; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-metadata
          path: |
            build-identity.json
            manifest.json
          if-no-files-found: error

  build:
    needs: [identity, metadata, guest-payload]
    name: Build ${{ matrix.arch }} preview deb
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    env:
      CACHE_LANE: Preview
      VERSION: ${{ needs.identity.outputs.version }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Stable release build environment plus the preview source binding: the
      # release-build identity gate embeds this exact commit instead of
      # demanding a v* tag, which an untagged main commit cannot have.
      VELNOR_RELEASE_BUILD: "1"
      VELNOR_PREVIEW_SOURCE_SHA: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Normalize immutable preview checkout
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          case "$SOURCE_COMMIT" in
            *[!0-9a-f]*|'') echo "::error::invalid source commit" >&2; exit 1 ;;
          esac
          [ "${#SOURCE_COMMIT}" -eq 40 ] || { echo "::error::source commit must be 40 hex" >&2; exit 1; }
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git checkout --detach "$SOURCE_COMMIT"
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ] || { echo "::error::checkout did not reach $SOURCE_COMMIT" >&2; exit 1; }

      - name: Install mold linker
        uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "rust zig cargo-binstall cargo:cargo-zigbuild"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
          version: 1.8.3

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ env.CACHE_LANE }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-deb (verified prebuilt only)
        env:
          # cargo-binstall performs GitHub API discovery independently of mise.
          # Authenticate parallel preview jobs so they do not share the tiny
          # anonymous rate limit and fail nondeterministically with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mise exec cargo-binstall -- cargo binstall cargo-deb@3.7.0 \
            --disable-strategies compile --no-confirm --force
          cargo-deb --version

      - name: Build preview binaries (runner + every deb asset)
        run: |
          set -euo pipefail
          # The stable release build verbatim: release-build identity is ON, and
          # build.rs binds VELNOR_PREVIEW_SOURCE_SHA (validated against the
          # checked-out HEAD) instead of demanding a v* tag, which an untagged
          # main commit cannot have. That same binding produces the identity
          # files the metadata job exports and this job ships, so postinst's
          # offline identity check holds.
          # Keep the Rust builds inside Mr. Boxington while disabling only its
          # C/C++ build-script shim. The shim's cross-link overlay cannot
          # resolve the glibc ISO C23 symbols emitted by aws-lc-sys.
          MBX_CC=0 mbx zigbuild -p velnor-runner \
            --bin velnor-runner \
            --release --locked --features release-build --target "${{ matrix.target }}"
          MBX_CC=0 mbx zigbuild -p velnorctl \
            --release --locked --features release-build --target "${{ matrix.target }}"
          mbx zigbuild -p velnor-tools \
            --release --locked --target "${{ matrix.target }}"
          mbx zigbuild -p velnor-workflow \
            --release --locked --target "${{ matrix.target }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-metadata
          path: preview-metadata

      - name: Stage acyclic identity files packaged into the deb
        env:
          SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          # The deb asset manifest requires both files, and postinst re-checks
          # them against the installed binary, so they must describe exactly the
          # source commit this job builds. They are source-derived (no deb
          # digest), so shipping them is acyclic. This job cross-compiles for
          # ${{ matrix.target }}, so it can never execute the binary it built to
          # export them: the host-native metadata job exports them once and both
          # deb arches copy the same artifact (the release lane's contract).
          test -s preview-metadata/build-identity.json || { echo "::error::preview metadata missing build-identity.json" >&2; exit 1; }
          test -s preview-metadata/manifest.json || { echo "::error::preview metadata missing manifest.json" >&2; exit 1; }
          jq -e '.source_sha and .crate_version' preview-metadata/build-identity.json >/dev/null
          jq -e 'type == "object"' preview-metadata/manifest.json >/dev/null
          jq -e --arg sha "$SOURCE_COMMIT" '.source_sha == $sha' preview-metadata/build-identity.json >/dev/null \
            || { echo "::error::build identity source_sha != preview source commit $SOURCE_COMMIT" >&2; exit 1; }
          mkdir -p crates/velnor-runner/release
          cp preview-metadata/build-identity.json crates/velnor-runner/release/build-identity.json
          cp preview-metadata/manifest.json crates/velnor-runner/release/manifest.json

      - name: Download guest payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: guest-payload-${{ matrix.arch }}
          path: guest-payload

      - name: Stage pinned Firecracker, jailer, and guest agent
        env:
          TARGET: ${{ matrix.target }}
          DEB_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$DEB_ARCH" in
            amd64) pin_arch=x86_64 ;;
            arm64) pin_arch=aarch64 ;;
            *) echo "::error::unsupported arch $DEB_ARCH" >&2; exit 1 ;;
          esac
          url="$(jq -er --arg a "$pin_arch" '.tarballs[$a].url' microvm/pins.json)"
          sha="$(jq -er --arg a "$pin_arch" '.tarballs[$a].sha256' microvm/pins.json)"
          fc_member="$(jq -er --arg a "$pin_arch" '.tarballs[$a].firecracker_member' microvm/pins.json)"
          jailer_member="$(jq -er --arg a "$pin_arch" '.tarballs[$a].jailer_member' microvm/pins.json)"
          curl --fail --show-error --silent --location --http1.1 \
            --continue-at - --retry 20 --retry-all-errors --retry-delay 5 \
            --retry-max-time 1800 \
            --connect-timeout 30 --max-time 900 \
            -o firecracker.tgz "$url"
          echo "$sha  firecracker.tgz" | sha256sum -c -
          mkdir -p extracted crates/velnor-runner/release/microvm
          tar -xzf firecracker.tgz -C extracted
          cp "extracted/${fc_member}" crates/velnor-runner/release/microvm/firecracker
          cp "extracted/${jailer_member}" crates/velnor-runner/release/microvm/jailer
          test -s guest-payload/velnor-guest-agent || { echo "::error::guest payload missing guest-agent" >&2; exit 1; }
          test -s guest-payload/guest-agent.sha256 || { echo "::error::guest payload missing guest-agent checksum" >&2; exit 1; }
          guest_agent_sha256="$(awk '{print $1}' guest-payload/guest-agent.sha256)"
          [ "${#guest_agent_sha256}" -eq 64 ] || { echo "::error::guest-agent digest has invalid length" >&2; exit 1; }
          actual_guest_agent_sha256="$(sha256sum guest-payload/velnor-guest-agent | awk '{print $1}')"
          [ "$actual_guest_agent_sha256" = "$guest_agent_sha256" ] || { echo "::error::downloaded guest-agent digest mismatch" >&2; exit 1; }
          install -Dm0755 guest-payload/velnor-guest-agent "target/${TARGET}/release/velnor-guest-agent"
          cmp -- "target/${TARGET}/release/velnor-guest-agent" guest-payload/velnor-guest-agent
          cp "target/${TARGET}/release/velnor-guest-agent" crates/velnor-runner/release/microvm/velnor-guest-agent
          test -s guest-payload/vmlinux || { echo "::error::guest payload missing vmlinux" >&2; exit 1; }
          test -s guest-payload/rootfs.ext4 || { echo "::error::guest payload missing rootfs.ext4" >&2; exit 1; }
          test -s guest-payload/rootfs.sha256 || { echo "::error::guest payload missing rootfs.sha256" >&2; exit 1; }
          rootfs_sha256="$(awk '{print $1}' guest-payload/rootfs.sha256)"
          [ "${#rootfs_sha256}" -eq 64 ] || { echo "::error::guest rootfs digest has invalid length" >&2; exit 1; }
          actual_rootfs_sha256="$(sha256sum guest-payload/rootfs.ext4 | awk '{print $1}')"
          [ "$actual_rootfs_sha256" = "$rootfs_sha256" ] || { echo "::error::downloaded guest rootfs digest mismatch" >&2; exit 1; }
          cp guest-payload/vmlinux crates/velnor-runner/release/microvm/vmlinux
          cp guest-payload/rootfs.ext4 crates/velnor-runner/release/microvm/rootfs.ext4
          chmod 0755 \
            crates/velnor-runner/release/microvm/firecracker \
            crates/velnor-runner/release/microvm/jailer \
            crates/velnor-runner/release/microvm/velnor-guest-agent
          fc_sha="$(sha256sum crates/velnor-runner/release/microvm/firecracker | awk '{print $1}')"
          jailer_sha="$(sha256sum crates/velnor-runner/release/microvm/jailer | awk '{print $1}')"
          expected_fc="$(jq -er --arg a "$pin_arch" '.tarballs[$a].firecracker_sha256' microvm/pins.json)"
          expected_jailer="$(jq -er --arg a "$pin_arch" '.tarballs[$a].jailer_sha256' microvm/pins.json)"
          [ "$fc_sha" = "$expected_fc" ] || { echo "::error::firecracker sha $fc_sha != pin $expected_fc" >&2; exit 1; }
          [ "$jailer_sha" = "$expected_jailer" ] || { echo "::error::jailer sha $jailer_sha != pin $expected_jailer" >&2; exit 1; }
          mbx run -p velnor-runner --bin velnor-guest-image --locked --release -- \
            stage --root crates/velnor-runner/release/microvm --arch "$pin_arch" \
            --rootfs-sha256 "$rootfs_sha256" \
            --guest-agent-sha256 "$guest_agent_sha256"
          kernel="$(jq -er '.kernel' crates/velnor-runner/release/microvm/manifest.json)"
          rootfs="$(jq -er '.rootfs' crates/velnor-runner/release/microvm/manifest.json)"
          case "$kernel$rootfs" in
            *UNSET*) echo "::error::staged kernel/rootfs checksum is still UNSET" >&2; exit 1 ;;
          esac
          [ "${#kernel}" -eq 64 ] || { echo "::error::kernel sha256 length ${#kernel}" >&2; exit 1; }
          [ "${#rootfs}" -eq 64 ] || { echo "::error::rootfs sha256 length ${#rootfs}" >&2; exit 1; }

      - name: Build .deb (version pinned to the preview identity)
        run: |
          set -euo pipefail
          mbx deb -p velnor-runner --target ${{ matrix.target }} --no-build --no-strip --deb-version "$VERSION"

      - name: Stage .deb with the empty-deb-incident guards
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=("target/${{ matrix.target }}/debian/velnor-runner_${VERSION}_"*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected exactly one ${VERSION} deb, found ${#debs[@]}" >&2; exit 1; }
          src="${debs[0]}"
          case "${{ matrix.arch }}" in
            amd64) expected_arch=amd64 ;;
            arm64) expected_arch=arm64 ;;
            *) echo "::error::unsupported arch" >&2; exit 1 ;;
          esac
          [ "$(dpkg-deb -f "$src" Version)" = "$VERSION" ] || { echo "::error::deb version != preview version" >&2; exit 1; }
          [ "$(dpkg-deb -f "$src" Architecture)" = "$expected_arch" ] || { echo "::error::deb arch != $expected_arch" >&2; exit 1; }
          manifest="$(mktemp)"
          dpkg-deb -c "$src" > "$manifest"
          awk '$NF == "./usr/bin/velnor-runner" { count++; if (substr($1, 1, 1) != "-") type_ok=0; else if (count == 1) type_ok=1 } END { exit !(count == 1 && type_ok == 1) }' "$manifest" \
            || { echo "::error::deb must contain exactly one regular usr/bin/velnor-runner" >&2; exit 1; }
          grep -q "usr/bin/velnor-runner" "$manifest" || { echo "::error::deb missing usr/bin/velnor-runner" >&2; exit 1; }
          grep -q "usr/bin/velnorctl" "$manifest" || { echo "::error::deb missing usr/bin/velnorctl" >&2; exit 1; }
          grep -q "usr/bin/velnor-tools" "$manifest" || { echo "::error::deb missing usr/bin/velnor-tools" >&2; exit 1; }
          grep -q "usr/bin/velnor-workflow" "$manifest" || { echo "::error::deb missing usr/bin/velnor-workflow" >&2; exit 1; }
          grep -q "usr/bin/velnor-guest-agent" "$manifest" || { echo "::error::deb missing usr/bin/velnor-guest-agent" >&2; exit 1; }
          grep -q "lib/systemd/system/velnor-fleet-policy-audit.service" "$manifest" || { echo "::error::deb missing fleet-policy audit service" >&2; exit 1; }
          grep -q "lib/systemd/system/velnor-fleet-policy-audit.timer" "$manifest" || { echo "::error::deb missing fleet-policy audit timer" >&2; exit 1; }
          grep -q "usr/share/velnor/fleet/release-refs.toml" "$manifest" || { echo "::error::deb missing authoritative fleet release-ref ledger" >&2; exit 1; }
          grep -q "usr/lib/tmpfiles.d/velnor-runner.conf" "$manifest" || { echo "::error::deb missing tmpfiles.d transaction-lock path entry" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/firecracker" "$manifest" || { echo "::error::deb missing firecracker" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/jailer" "$manifest" || { echo "::error::deb missing jailer" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/velnor-guest-agent" "$manifest" || { echo "::error::deb missing packaged guest-agent" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/vmlinux" "$manifest" || { echo "::error::deb missing guest kernel" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/rootfs.ext4" "$manifest" || { echo "::error::deb missing guest rootfs" >&2; exit 1; }
          grep -q "usr/share/velnor/microvm/manifest.json" "$manifest" || { echo "::error::deb missing microvm manifest" >&2; exit 1; }
          grep -q "usr/share/velnor/job-ubuntu.Dockerfile" "$manifest" || { echo "::error::deb missing canonical Dockerfile" >&2; exit 1; }
          grep -q "usr/share/velnor/build-identity.json" "$manifest" || { echo "::error::deb missing build identity" >&2; exit 1; }
          grep -q "usr/share/velnor/manifest.json" "$manifest" || { echo "::error::deb missing compiled manifest" >&2; exit 1; }
          [ "$(stat -c%s "$src")" -gt 1000000 ] || { echo "::error::deb suspiciously small: $(stat -c%s "$src") bytes" >&2; exit 1; }
          # dpkg sorts `~` before the release, so this deb can never satisfy an
          # upgrade to the future <crate_version> stable release.
          dpkg --compare-versions "$VERSION" lt "$(sed -n 's/^version = "\(.*\)"/\1/p' crates/velnor-runner/Cargo.toml | head -n1)" \
            || { echo "::error::preview version $VERSION must compare older than its crate version" >&2; exit 1; }
          dst="velnor-runner-preview-${VERSION}-${{ matrix.arch }}.deb"
          cp "$src" "$dst"
          sha256sum "$dst" | awk '{print $1}' > "$dst.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-deb-${{ matrix.arch }}
          path: |
            velnor-runner-preview-*.deb
            velnor-runner-preview-*.deb.sha256
          if-no-files-found: error

  attest:
    needs: [identity, build]
    name: Attest ${{ matrix.arch }} preview deb
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-release-package-signer.yml
    with:
      artifact-name: preview-deb-${{ matrix.arch }}
      subject-path: velnor-runner-preview-${{ needs.identity.outputs.version }}-${{ matrix.arch }}.deb
      source-ref: refs/heads/main

  publish:
    needs: [identity, build, attest]
    name: Replace the rolling preview release
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.identity.outputs.version }}
      NAME: ${{ needs.identity.outputs.name }}
      COMMIT: ${{ needs.identity.outputs.commit }}
      # This job checks out nothing: without GH_REPO every `gh` call tries to
      # infer the repository from a local git remote and fails.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: preview-deb-*
          path: artifacts
          merge-multiple: true

      - name: Assemble the consumer release manifest and independent checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          subjects=(artifacts/velnor-runner-preview-*.deb)
          test "${#subjects[@]}" -eq 2
          : > SHA256SUMS
          : > assets.jsonl
          for subject in "${subjects[@]}"; do
            name=$(basename "$subject")
            digest=$(sha256sum "$subject" | awk '{print $1}')
            sidecar="$(awk 'NF {print $1; exit}' "${subject}.sha256")"
            [[ "$digest" =~ ^[0-9a-f]{64}$ && "$sidecar" = "$digest" ]] \
              || { echo "::error::$name sidecar does not match its payload" >&2; exit 1; }
            printf '%s  %s\n' "$digest" "$name" >> SHA256SUMS
            jq -cn --arg name "$name" --arg sha256 "$digest" '{name:$name,sha256:$sha256}' >> assets.jsonl
          done
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq 2
          jq -S -n \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_ref "refs/heads/main" \
            --arg source_commit "$COMMIT" \
            --arg version "$VERSION" \
            --slurpfile assets assets.jsonl \
            '{schema:"velnor.package-release.v1",source_repository:$source_repository,source_ref:$source_ref,source_commit:$source_commit,version:$version,assets:$assets}' \
            > release-manifest.json
          # SHA256SUMS binds artifact basenames. Verify from the downloaded
          # artifact corpus before anything is published.
          (cd artifacts && sha256sum --check --strict ../SHA256SUMS)
          for arch in amd64 arm64; do
            deb="artifacts/velnor-runner-preview-${VERSION}-${arch}.deb"
            [ -f "$deb" ] || { echo "::error::missing preview deb for $arch" >&2; exit 1; }
            [ "$(dpkg-deb -f "$deb" Version)" = "$VERSION" ] \
              || { echo "::error::published deb version != preview identity ($arch)" >&2; exit 1; }
            [ "$(dpkg-deb -f "$deb" Architecture)" = "$arch" ] \
              || { echo "::error::published deb arch mismatch ($arch)" >&2; exit 1; }
          done

      - name: Replace the rolling preview release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Monotonicity guard: a re-run of a superseded publish job reuses its
          # original run number, so the version it would publish can be older
          # than the version the rolling release names right now. Deleting the
          # live release before that check would move the lane backward, so the
          # live version is compared first and a regression is refused: the
          # operator must re-run the LATEST preview run instead. Re-publishing
          # the identical version (same commit re-run) stays idempotent.
          #
          # The live release is read with its HTTP status: a 404 means no
          # rolling release exists yet (the first publish) and proceeds to
          # create, any other transport failure fails closed, and the error
          # body can never leak into the version comparison.
          live_response="$(mktemp)"
          trap 'rm -f -- "$live_response"' EXIT
          live_status=0
          gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/preview" > "$live_response" 2>/dev/null || live_status=$?
          live_http="$(awk 'NR == 1 {print $2; exit}' "$live_response")"
          if [ "$live_status" -ne 0 ]; then
            [ "$live_http" = "404" ] \
              || { echo "::error::could not read the live preview release (gh api exit $live_status, HTTP ${live_http:-unknown}); refusing to replace it" >&2; exit 1; }
          else
            # Strip the -i status line and headers before parsing the body.
            live_body="$(awk 'body {print; next} /^\r?$/ {body = 1}' "$live_response")"
            if ! live_name="$(jq -er '.name | strings' <<<"$live_body" 2>/dev/null)"; then
              echo "::error::live preview release response carries no name; refusing to replace it" >&2
              exit 1
            fi
            [ -n "$live_name" ] || { echo "::error::live preview release has an empty name; refusing to replace it" >&2; exit 1; }
            live_version="${live_name#Preview }"
            [[ "$live_name" = "Preview $live_version" && "$live_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+~preview\.[0-9]+\+[0-9a-f]{7}$ ]] \
              || { echo "::error::live preview release names '$live_name', which is not 'Preview <version>' under the preview contract; refusing to delete it" >&2; exit 1; }
            if dpkg --compare-versions "$live_version" eq "$VERSION"; then
              :
            elif dpkg --compare-versions "$live_version" gt "$VERSION"; then
              echo "::error::live preview $live_version is newer than candidate $VERSION; refusing to move the rolling preview backward — re-run the LATEST preview run instead" >&2
              exit 1
            fi
          fi
          # Serialized by the workflow concurrency group, so this delete can
          # never race another run's create and a reader never sees a torn
          # release. `preview` is a moving tag by contract: the only mutable
          # ref this repository publishes.
          gh release delete preview --cleanup-tag --yes || true
          # Exact asset paths: the Assemble step already verified these four
          # files, and a `preview-*-${VERSION}` glob can never match — the
          # version follows the `preview-` separator directly, so the glob
          # would demand a second dash. gh also re-globs asset arguments
          # itself, so an unmatched pattern dies here instead of at upload.
          gh release create preview --target "$COMMIT" --prerelease --title "$NAME" \
            SHA256SUMS release-manifest.json \
            "artifacts/velnor-runner-preview-${VERSION}-amd64.deb" \
            "artifacts/velnor-runner-preview-${VERSION}-amd64.deb.sha256" \
            "artifacts/velnor-runner-preview-${VERSION}-arm64.deb" \
            "artifacts/velnor-runner-preview-${VERSION}-arm64.deb.sha256"

      - name: Verify the published rolling preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/preview" > published.json
          # GitHub rewrites release asset names on upload: `~` becomes `.`.
          # The expected asset set is derived from the same normalization, so
          # the check compares what the platform actually serves.
          asset_version="${VERSION//'~'/.}"
          jq -e \
            --arg name "$NAME" --arg commit "$COMMIT" --arg asset_version "$asset_version" '
              (.draft | not) and .prerelease == true and
              .tag_name == "preview" and .name == $name and
              .target_commitish == $commit and
              ([.assets[].name] | sort) ==
              ([
                "SHA256SUMS",
                "release-manifest.json",
                ("velnor-runner-preview-" + $asset_version + "-amd64.deb"),
                ("velnor-runner-preview-" + $asset_version + "-amd64.deb.sha256"),
                ("velnor-runner-preview-" + $asset_version + "-arm64.deb"),
                ("velnor-runner-preview-" + $asset_version + "-arm64.deb.sha256")
              ] | sort)
            ' published.json >/dev/null
          jq -e --arg version "$VERSION" \
            '.version == $version and .source_ref == "refs/heads/main" and
             (.assets | length) == 2' release-manifest.json >/dev/null
'''

[[declare]]
primitive = "static-workflow"
file = "ci-release-package-signer.yml"

[declare.args]
template = '''
name: Velnor release package signer

# Callable-only by design: there is no push/schedule/dispatch trigger, so the
# admitted source refs below are reachable exclusively through an explicit
# `uses:` call from a workflow in this repository. A tag ref attests a stable
# release build; refs/heads/main attests a rolling preview build. Anything else
# is rejected before any artifact is downloaded or attested.
on:
  workflow_call:
    inputs:
      artifact-name:
        required: true
        type: string
      subject-path:
        required: true
        type: string
      source-ref:
        required: true
        type: string

permissions: {}

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Admit immutable source
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          SUBJECT_PATH: ${{ inputs.subject-path }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == refs/tags/v* || "$SOURCE_REF" == refs/heads/main ]]
          [[ "$ARTIFACT_NAME" != */* && "$ARTIFACT_NAME" != *..* && -n "$ARTIFACT_NAME" ]]
          [[ "$SUBJECT_PATH" != /* && "$SUBJECT_PATH" != *..* && -n "$SUBJECT_PATH" ]]

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: signer-input

      - name: Bind checksum before attestation
        env:
          SUBJECT_PATH: ${{ inputs.subject-path }}
        run: |
          set -euo pipefail
          ARTIFACT="signer-input/$SUBJECT_PATH"
          test -f "$ARTIFACT"
          sha256sum -- "$ARTIFACT" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: signer-input/${{ inputs.subject-path }}
'''

[[declare]]
primitive = "static-workflow"
file = "velnor-workflow-policy.yml"

[declare.args]
template = '''
name: Velnor workflow policy

on:
  workflow_call:
    inputs:
      policy-revision:
        description: Full SHA of this reusable policy workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: Enforce workflow policy
    runs-on: __VELNOR_GITHUB_RUNNER__
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          # Static policy validation only; fork head checkout is intentional.
          allow-unsafe-pr-checkout: true

      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-__VELNOR_WORKFLOW_SOURCE_REV__
          restore-keys: |
            velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned Velnor workflow runtime
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-workflow-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/velnor-workflow-cargo-target
          VELNOR_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/velnor-workflow-install
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          install -d -m 700 \
            "$CARGO_HOME" \
            "$CARGO_TARGET_DIR" \
            "$VELNOR_WORKFLOW_INSTALL_DIR"
          cd "$VELNOR_WORKFLOW_INSTALL_DIR"
          cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev __VELNOR_WORKFLOW_SOURCE_REV__ \
            --root "$VELNOR_WORKFLOW_ROOT" \
            velnor-workflow \
            --bin velnor-workflow
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"

      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          VELNOR_WORKFLOW_POLICY_REVISION: ${{ inputs.policy-revision }}
        run: velnor-workflow policy --workflow-root "$WORKFLOW_ROOT"
'''

# The cache-hygiene workflow is the generic maintenance family, stated
# explicitly so the repository owns the decision.

[[declare]]
primitive = "maintenance"
file = "maintenance.yml"
# The workspace-wide release-topology unit: the scan sees a workspace root; the
# repository declares the verification contract the unit carries.

# The Docker image build: the repository declares its buildx contract (gha
# cache scopes per lane) on top of the detected unit.

[[units]]
id = "docker"
github_pr_commands = ["docker buildx build --load --cache-from type=gha,scope=velnor-docker --target ci --file 'Dockerfile' --tag local-ci:dockerfile '.'"]
github_full_commands = ["docker buildx build --load --cache-from type=gha,scope=velnor-docker --cache-to type=gha,mode=max,scope=velnor-docker,ignore-error=true --file 'Dockerfile' --tag local-ci:dockerfile '.'"]
velnor_pr_commands = ["docker buildx build --load --target ci --file 'Dockerfile' --tag local-ci:dockerfile '.'"]
velnor_full_commands = ["docker buildx build --load --file 'Dockerfile' --tag local-ci:dockerfile '.'"]

[[units]]
id = "rust-production-topology"
label = "Rust production topology"
kind = "rust"
root = "."
watch = [".cargo/**", "Cargo.lock", "Cargo.toml", "crates/**", "crates/velnor-workflow/src/runtime.rs", "docker/**", "microvm/**", "mise.lock", "mise.toml", "rust-toolchain", "rust-toolchain.toml", "tools/**"]
github_pr_commands = ["mbx check --workspace --all-targets --locked", "mise run test-release-feature-boundary", "mise run test-release-boundary-script"]
github_full_commands = ["mbx check --workspace --all-targets --locked", "mise run test-release-feature-boundary", "mise run test-release-boundary-script"]
velnor_pr_commands = ["mbx check --workspace --all-targets --locked", "mise run test-release-feature-boundary", "mise run test-release-boundary-script"]
velnor_full_commands = ["mbx check --workspace --all-targets --locked", "mise run test-release-feature-boundary", "mise run test-release-boundary-script"]

[units.cache]
key_files = ["Cargo.toml", "Cargo.lock"]
paths = ["~/.cargo/registry", "~/.cargo/git"]

# The composite action the generated workflows bootstrap through: the
# repository owns the bytes under .github-gen/sources, the generator owns the
# write into .github/actions.

[[static_files]]
file = ".github/actions/setup-velnor-workflow/action.yml"
source = ".github-gen/sources/actions/setup-velnor-workflow/action.yml"

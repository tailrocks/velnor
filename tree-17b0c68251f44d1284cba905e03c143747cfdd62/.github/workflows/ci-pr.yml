              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job velnor-rust-production-topology ran outside its provider admission (PROVIDER_ADMITTED_VELNOR_TRUSTED=$PROVIDER_ADMITTED_VELNOR_TRUSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job velnor-rust-production-topology)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI job velnor-rust-production-topology succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI job velnor-rust-production-topology ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
  required:
    name: "Control / Required"
    if: ${{ always() }}
    needs: [ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mirror CI / Required
        if: ${{ needs.ci-required.result != 'success' }}

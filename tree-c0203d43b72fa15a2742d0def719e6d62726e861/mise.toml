[tools]
actionlint = "1.7.12"
cargo-binstall = "1.22.0"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-zigbuild" = "0.23.3"
"cargo:cargo-deb" = "3.7.0"
"npm:ajv-cli" = "5.0.0"
zig = "0.16.0"

[settings]
# Plan 008: mandatory committed lockfile. `mise` reads pinned URLs/checksums
# from mise.lock and (under MISE_LOCKED in CI/jobs) refuses unlocked artifacts.
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]
cargo.binstall_only = true
cargo.binstall_quickinstall = true

[tasks.fmt]
run = "cargo fmt --all --check"

# Apply formatting in place; `fmt` above stays the read-only gate.
[tasks.fmt-fix]
run = "cargo fmt --all"

[tasks.lint]
run = "cargo clippy --workspace --all-targets --locked --features velnor-runner/test-support -- -D warnings"

[tasks.test]
run = "cargo nextest run --workspace --locked --features velnor-runner/test-support --color=always"

[tasks.test-focused]
description = "Focused nextest run; pass filters after the task, e.g. rtk mise run test-focused -- -p velnor-tools"
run = "cargo nextest run --locked --color=always"

[tasks.test-focused-runner]
description = "Runner tests with loopback fixture support"
run = "cargo nextest run --locked --package velnor-runner --features test-support --color=always"

[tasks.test-production-topology]
description = "Compile all workspace targets with production default features"
run = "cargo check --workspace --all-targets --locked"

[tasks.test-release-feature-boundary]
description = "Prove release-profile builds reject the loopback-only test feature"
run = """
set -eu
if cargo check -p velnor-runner --release --locked --features test-support; then
  echo "test-support unexpectedly compiled in a release profile" >&2
  exit 1
fi
"""

[tasks."release:check"]
description = "Validate the tagged release unit and signed velnor-apt train"
run = """
set -eu
workflow=.github/workflows/release.yml
docs=docs/debian-apt-repo.md
test -f "$workflow"
test -f "$docs"
grep -q "^  push:" "$workflow"
grep -q "      - 'v\\[0-9\\]\\*'" "$workflow"
grep -q -- "--features release-build" "$workflow"
grep -q "tailrocks/velnor-actions/.github/workflows/package-signer.yml@" "$workflow"
grep -q "tailrocks/velnor-apt" "$docs"
"""

[tasks.actionlint]
run = "actionlint"

[tasks.deny]
run = "cargo deny check advisories"

# Plan 039 tooling-law closure: policy generation remains fully offline. The
# committed per-org desired-policy JSONs live in fleet/policies/ and are
# byte-reproducible via [tasks.fleet-generate]. Generation is a privileged
# publisher operation; audit-ci remains the unprivileged, read-only freshness
# check used by repository gates.
[tasks.fleet-generate]
description = "Regenerate policies through the provisioned root-owned publisher boundary"
run = "set -eu; out_dir=\"${VELNOR_FLEET_POLICY_OUT_DIR:-}\"; [ -n \"$out_dir\" ] || { echo 'fleet-generate: set VELNOR_FLEET_POLICY_OUT_DIR to an absolute root-owned publisher directory' >&2; exit 2; }; case \"$out_dir\" in /*) ;; *) echo 'fleet-generate: VELNOR_FLEET_POLICY_OUT_DIR must be absolute' >&2; exit 2 ;; esac; cargo run -p velnor-tools --locked --quiet -- fleet-policy generate --ledger fleet/release-refs.toml --out-dir \"$out_dir\""

[tasks.fleet-publisher-acceptance]
description = "Production acceptance: generate through the trusted root publisher boundary"
run = """
set -eu
out_dir="${VELNOR_FLEET_POLICY_OUT_DIR:-}"
if [ -z "$out_dir" ]; then
  echo "fleet-publisher-acceptance: VELNOR_FLEET_POLICY_OUT_DIR is required" >&2
  exit 2
fi
case "$out_dir" in
  /*) ;;
  *) echo "fleet-publisher-acceptance: VELNOR_FLEET_POLICY_OUT_DIR must be absolute" >&2; exit 2 ;;
esac
if [ "$out_dir" = "/" ]; then
  echo "fleet-publisher-acceptance: filesystem root is not an output directory" >&2
  exit 2
fi
if [ ! -d "$out_dir" ]; then
  echo "fleet-publisher-acceptance: provision the existing output directory first: $out_dir" >&2
  exit 2
fi
if [ "$(id -u)" -ne 0 ]; then
  echo "fleet-publisher-acceptance: must run as the dedicated root publisher" >&2
  exit 2
fi
echo "fleet-publisher-acceptance: checking euid=0, absolute namespace, root-owned/non-group-other-writable ancestors and entries, no-follow traversal, regular single-link policy files"
cargo run -p velnor-tools --locked --quiet -- fleet-policy generate --ledger fleet/release-refs.toml --out-dir "$out_dir"
echo "fleet-publisher-acceptance: passed production publisher path and publication checks for $out_dir"
"""

[tasks.audit-ci]
description = "Enforce the offline estate CI workflow contract"
run = "cargo run -p velnor-tools --locked --quiet -- audit-ci --offline --repository-name tailrocks/velnor"

[tasks.audit-ci-estate]
description = "Audit live default heads and prove generated caller SHA-256 equality within every canonical class"
run = "cargo run -p velnor-tools --locked --quiet -- audit-ci --estate config/estate-repositories.json --remote-defaults"

[tasks.fleet-plan]
description = "Read live desired/observed fleet state and print policy summary + sha256 digest per org (requires --ledger and GitHub credentials)"
run = """
set -eu
ledger=fleet/release-refs.toml
if [ ! -f "$ledger" ]; then
  echo "fleet plan: release-ref ledger '$ledger' not found" >&2
  exit 1
fi
found=0
for f in fleet/policies/*-desired-policy.json; do
  [ -f "$f" ] || continue
  found=1
  echo "== $f =="
  cargo run -p velnor-tools --locked --quiet -- fleet-policy plan --policy "$f" --ledger "$ledger"
done
if [ "$found" -ne 1 ]; then
  echo "fleet plan: no *-desired-policy.json under fleet/policies/" >&2
  echo "fleet plan: run on the provisioned publisher host with VELNOR_FLEET_POLICY_OUT_DIR set: rtk mise run fleet-generate" >&2
  exit 1
fi
"""

[tasks.fleet-digests]
description = "Emit one '<org> -> <digest>' line per desired policy after live read-only planning (requires --ledger and GitHub credentials)"
run = """
set -eu
ledger=fleet/release-refs.toml
if [ ! -f "$ledger" ]; then
  echo "fleet digests: release-ref ledger '$ledger' not found" >&2
  exit 1
fi
found=0
plan_output=$(mktemp)
digest_output=$(mktemp)
trap 'rm -f "$plan_output" "$digest_output"' EXIT
for f in fleet/policies/*-desired-policy.json; do
  [ -f "$f" ] || continue
  found=1
  cargo run -p velnor-tools --locked --quiet -- fleet-policy plan --policy "$f" --ledger "$ledger" >"$plan_output"
  digest=$(sed -n 's/^digest: //p' "$plan_output")
  printf '%s -> %s\n' "$(basename "$f" -desired-policy.json)" "$digest" >>"$digest_output"
done
if [ "$found" -ne 1 ]; then
  echo "fleet digests: no *-desired-policy.json under fleet/policies/" >&2
  echo "fleet digests: run on the provisioned publisher host with VELNOR_FLEET_POLICY_OUT_DIR set: rtk mise run fleet-generate" >&2
  exit 1
fi
cat "$digest_output"
"""

[tasks.check]
depends = ["fmt", "actionlint", "audit-ci", "deny", "lint", "test", "test-production-topology", "test-release-feature-boundary"]

[tasks.ci]
depends = ["actionlint", "audit-ci", "deny"]
# The generated CI workflow owns separate test, lint, and format gates. Keep
# this task build-only so those gates are not executed twice on every run.
run = "cargo check --workspace --all-targets --locked --features velnor-runner/test-support"

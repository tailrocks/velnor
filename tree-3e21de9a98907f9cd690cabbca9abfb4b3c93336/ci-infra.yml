        with:
          name: install
          command: mise install --locked
      - name: build gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: build
          command: mise run build
      - name: test gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: test
          command: mise run test
      - name: lint gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: lint
          command: mise run lint
      - name: format gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: format
          command: mise run fmt
      - name: Emit lane contract
        id: aggregate
        uses: tailrocks/velnor-actions/actions/aggregate@f8fb0b9b9b4203baf89539353cb2a622249c4277

  github-lane:
    name: github lane
    if: ${{ inputs.lane == 'github' || inputs.lane == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      contract: ${{ steps.aggregate.outputs.contract }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up mise toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - name: install gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: install
          command: mise install --locked
      - name: build gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: build
          command: mise run build
      - name: test gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: test
          command: mise run test
      - name: lint gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: lint
          command: mise run lint
      - name: format gate
        uses: tailrocks/velnor-actions/actions/run-gate@f8fb0b9b9b4203baf89539353cb2a622249c4277
        with:
          name: format
          command: mise run fmt
      - name: Emit lane contract
        id: aggregate
        uses: tailrocks/velnor-actions/actions/aggregate@f8fb0b9b9b4203baf89539353cb2a622249c4277

  contract:
    name: contract
    needs:
      - velnor-lane
      - github-lane
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contract: ${{ steps.verdict.outputs.contract }}
    steps:
      - name: Aggregate lane verdict
        id: verdict
        env:
          LANE: ${{ inputs.lane }}
          VELNOR_RESULT: ${{ needs.velnor-lane.result }}
          VELNOR_CONTRACT: ${{ needs.velnor-lane.outputs.contract }}
          GITHUB_RESULT: ${{ needs.github-lane.result }}
          GITHUB_CONTRACT: ${{ needs.github-lane.outputs.contract }}
        shell: bash
        run: |
          set -euo pipefail
          # Positive per-lane truth table: emit contract=success ONLY when every selected
          # lane succeeded with contract=success and every non-selected lane is skipped with
          # an empty output. A failed, unavailable, or skipped selected lane is never
          # credited, and one lane never substitutes for the other.
          case "${LANE}" in
            velnor)
              if [ "${VELNOR_RESULT}" != "success" ] || [ "${VELNOR_CONTRACT}" != "success" ]; then
                echo "contract: velnor lane did not pass (result '${VELNOR_RESULT}', contract '${VELNOR_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${GITHUB_RESULT}" != "skipped" ] || [ -n "${GITHUB_CONTRACT}" ]; then
                echo "contract: github lane must be skipped for lane=velnor (result '${GITHUB_RESULT}')" >&2
                exit 1
              fi
              ;;
            github)
              if [ "${GITHUB_RESULT}" != "success" ] || [ "${GITHUB_CONTRACT}" != "success" ]; then
                echo "contract: github lane did not pass (result '${GITHUB_RESULT}', contract '${GITHUB_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${VELNOR_RESULT}" != "skipped" ] || [ -n "${VELNOR_CONTRACT}" ]; then
                echo "contract: velnor lane must be skipped for lane=github (result '${VELNOR_RESULT}')" >&2
                exit 1
              fi
              ;;
            both)
              if [ "${VELNOR_RESULT}" != "success" ] || [ "${VELNOR_CONTRACT}" != "success" ]; then
                echo "contract: velnor lane did not pass (result '${VELNOR_RESULT}', contract '${VELNOR_CONTRACT}')" >&2
                exit 1
              fi
              if [ "${GITHUB_RESULT}" != "success" ] || [ "${GITHUB_CONTRACT}" != "success" ]; then
                echo "contract: github lane did not pass (result '${GITHUB_RESULT}', contract '${GITHUB_CONTRACT}')" >&2
                exit 1
              fi
              ;;
            *)
              echo "contract: unrecognized lane '${LANE}'" >&2
              exit 1
              ;;
          esac
          echo "contract=success" >> "${GITHUB_OUTPUT}"
          echo "contract: lane '${LANE}' passed"

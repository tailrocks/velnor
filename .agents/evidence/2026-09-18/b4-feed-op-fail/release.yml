# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Package feed
run-name: Package feed · apt · ${{ github.event_name }}

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: github
        type: choice
        options:
          - github
          - velnor
          - both
      channel:
        description: Package channel
        required: false
        default: stable
        type: choice
        options:
          - stable
          - preview
      version:
        description: Target version (empty discovers the channel head)
        required: false
        default: ''
        type: string
      commit:
        description: Target source commit (empty resolves it)
        required: false
        default: ''
        type: string

concurrency:
  group: package-feed-apt-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  admit-runner:
    name: Admit feed runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject Velnor-only feed mutation
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner == 'velnor' }}
        run: |
          echo 'apt feed mutation publishes from GitHub only' >&2
          exit 1
  verify:
    name: Verify apt feed
    needs: [admit-runner]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.feed.outputs.version }}
      commit: ${{ steps.feed.outputs.commit }}
      channel: ${{ steps.feed.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@fdeed261bd2247a38db6922a7726cd45d3d6f31e
        with:
          rev: fdeed261bd2247a38db6922a7726cd45d3d6f31e
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=fdeed261bd2247a38db6922a7726cd45d3d6f31e" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: velnor-workflow policy --workflow-root "$GITHUB_WORKSPACE"
      - name: Fetch and verify feed inputs
        id: feed
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_COMMIT: ${{ github.event.inputs.commit || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel="$CHANNEL"
          case "$channel" in stable|preview) ;; *) echo "::error::unknown channel $channel" >&2; exit 1 ;; esac
          version="$INPUT_VERSION"
          commit="$INPUT_COMMIT"
          if [ "$channel" = stable ]; then
            if [ -z "$version" ]; then
              version="$(gh release list --repo 'tailrocks/velnor' --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
            fi
            if [ -z "$commit" ]; then
              commit="$(velnor-workflow release apt-resolve-commit --source-repo 'tailrocks/velnor' --version "$version")"
            fi
          else
            rm -rf discover
            gh release download preview --repo 'tailrocks/velnor' --pattern 'release-manifest.json' --dir discover
            manifest_version="$(jq -er .version discover/release-manifest.json)"
            if [ -z "$version" ]; then
              version="$manifest_version"
            elif [ "$version" != "$manifest_version" ]; then
              echo "::error::requested $version disagrees with the rolling manifest $manifest_version" >&2
              exit 1
            fi
            if [ -z "$commit" ]; then
              commit="$(gh release view preview --repo 'tailrocks/velnor' --json targetCommitish --jq .targetCommitish)"
            fi
          fi
          rm -rf incoming
          velnor-workflow release apt-fetch --suite "$channel" --source-repo 'tailrocks/velnor' --package 'velnor-runner' --version "$version" --dir incoming
          if [ "$channel" = stable ]; then
            source_ref="refs/tags/$version"
          else
            source_ref="refs/heads/main"
          fi
          shopt -s nullglob
          attest_subjects=(incoming/*.deb)
          [ "${#attest_subjects[@]}" -gt 0 ] || { echo "::error::no fetched debs to attest" >&2; exit 1; }
          for subject in "${attest_subjects[@]}"; do
            gh attestation verify "$subject" --repo 'tailrocks/velnor' --signer-workflow "tailrocks/velnor/.github/workflows/ci-release-package-signer.yml" --source-ref "$source_ref" --source-digest "$commit"
          done
          live_fpr="$(gpg --show-keys --with-colons 'velnor.gpg' | awk -F: '/^fpr:/{print $10; exit}')"
          if [ "$channel" = stable ]; then
            velnor-workflow release apt-verify --suite "$channel" --source-repo 'tailrocks/velnor' --package 'velnor-runner' --binary 'velnor-runner' --identity-dir 'velnor' --manifest-schema 'velnor.package-release.v1' --version "$version" --incoming incoming --commit "$commit" --signer "$live_fpr" --expect-signer '7E66E3A53F9B3B5CA61D0F53261EDAC957DEB801' --verify-oci true
          else
            velnor-workflow release apt-verify --suite "$channel" --source-repo 'tailrocks/velnor' --package 'velnor-runner' --binary 'velnor-runner' --identity-dir 'velnor' --manifest-schema 'velnor.package-release.v1' --version "$version" --incoming incoming --commit "$commit" --signer "$live_fpr" --expect-signer '7E66E3A53F9B3B5CA61D0F53261EDAC957DEB801'
          fi
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
      - name: Upload verified feed inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt-incoming
          path: incoming
          if-no-files-found: error
          retention-days: 2
  publish:
    name: Publish apt feed
    needs: [admit-runner, verify]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.runner != 'velnor' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: package-feed
    permissions:
      contents: write
    outputs:
      version: ${{ needs.verify.outputs.version }}
      commit: ${{ needs.verify.outputs.commit }}
      channel: ${{ needs.verify.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@fdeed261bd2247a38db6922a7726cd45d3d6f31e
        with:
          rev: fdeed261bd2247a38db6922a7726cd45d3d6f31e
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=fdeed261bd2247a38db6922a7726cd45d3d6f31e" >> "$GITHUB_ENV"
      - name: Download verified feed inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt-incoming
          path: incoming
      - name: Recover the prior pair and derive the previous pointer
        id: prior
        env:
          CHANNEL: ${{ needs.verify.outputs.channel }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf prev
          mkdir -p prev
          feed='https://velnor-apt.tailrocks.com'
          echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          case "$CHANNEL" in
            stable)
              prev_tag="$(curl --fail --show-error --silent --location "$feed/last-publish")"
              prev_version="${prev_tag#v}"
              case "$prev_version" in ''|*[!0-9.]*) echo "::error::live last-publish is not a version: $prev_tag" >&2; exit 1 ;; esac
              for arch in amd64 arm64; do
                curl --fail --show-error --silent --location --retry 3 \
                  -o "prev/velnor-runner-$prev_version-$arch.deb" \
                  "$feed/pool/main/v/velnor-runner/velnor-runner_${prev_version}_${arch}.deb"
              done
              candidate_sha="$(awk '{print $1}' incoming/release-record.json.sha256)"
              curl --fail --show-error --silent --location -o published.json "$feed/publication-record.json"
              velnor-workflow release apt-previous-pointer --suite stable --published published.json --prior "$prev_tag" --candidate "$VERSION" --candidate-sha "$candidate_sha" > previous-pointer.json
              ;;
            preview)
              if curl --fail --show-error --silent --location --output /dev/null "$feed/dists/preview/InRelease"; then
                curl --fail --show-error --silent --location -o live-packages "$feed/dists/preview/main/binary-amd64/Packages"
                rollback="$(awk '$1=="Package:"{p=$2} p=="velnor-runner" && $1=="Version:"{print $2}' live-packages | sort -u | grep -Fxv "$VERSION")"
                [ -n "$rollback" ] || { echo "::error::no retained rollback in the live preview index" >&2; exit 1; }
                [ "$(printf '%s\n' "$rollback" | wc -l | tr -d ' ')" = 1 ] || { echo "::error::live preview index retains more than one rollback" >&2; exit 1; }
                case "$rollback" in ''|*[!0-9A-Za-z.+:~-]*) echo "::error::live preview rollback is not a pool version: $rollback" >&2; exit 1 ;; esac
                for arch in amd64 arm64; do
                  curl --fail --show-error --silent --location --retry 3 \
                    -o "prev/velnor-runner_${rollback}_${arch}.deb" \
                    "$feed/pool/preview/main/v/velnor-runner/velnor-runner_${rollback}_${arch}.deb"
                done
                velnor-workflow release apt-previous-pointer --suite preview > previous-pointer.json
              else
                velnor-workflow release apt-previous-pointer --suite preview --bootstrap true > previous-pointer.json
                echo "bootstrap=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac
      - name: Publish the staged suite
        env:
          CHANNEL: ${{ needs.verify.outputs.channel }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          args=(--suite "$CHANNEL" --source-repo 'tailrocks/velnor' --package 'velnor-runner' --binary 'velnor-runner' --consumer-repo 'tailrocks/velnor-apt' --manifest-schema 'velnor.package-release.v1' --identity-dir 'velnor' --keyring 'velnor.gpg' --origin 'Velnor' --description 'apt repository for the Velnor self-hosted GitHub Actions runner' --feed-url 'https://velnor-apt.tailrocks.com' --signer '7E66E3A53F9B3B5CA61D0F53261EDAC957DEB801' --passphrase-env APT_GPG_PASSPHRASE --key-env APT_GPG_PRIVATE_KEY --version "$VERSION" --incoming incoming --previous-pointer previous-pointer.json --staging public)
          if [ "${{ steps.prior.outputs.bootstrap }}" = true ]; then
            args+=(--bootstrap true)
          else
            args+=(--prev-dir prev)
          fi
          velnor-workflow release apt-publish "${args[@]}"
          if [ "$CHANNEL" = stable ]; then
            ref="refs/tags/$VERSION"
            manifest="incoming/manifest.json"
          else
            ref="refs/heads/main"
            manifest="incoming/release-manifest.json"
          fi
          velnor-workflow release apt-channel-update --suite "$CHANNEL" --source-repo 'tailrocks/velnor' --source-ref "$ref" --commit "$COMMIT" --version "$VERSION" --package 'velnor-runner' --manifest "$manifest" --staging public
      - name: Upload staged feed tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt-staging
          path: public
          if-no-files-found: error
          retention-days: 2
  deploy:
    name: Deploy apt feed
    needs: [admit-runner, publish]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.runner != 'velnor' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@fdeed261bd2247a38db6922a7726cd45d3d6f31e
        with:
          rev: fdeed261bd2247a38db6922a7726cd45d3d6f31e
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=fdeed261bd2247a38db6922a7726cd45d3d6f31e" >> "$GITHUB_ENV"
      - name: Download staged feed tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt-staging
          path: public
      - name: Guard against a rollback deploy
        env:
          CHANNEL: ${{ needs.publish.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = stable ]; then last="last-publish"; else last="last-publish-preview"; fi
          live="unknown"
          if curl --fail --show-error --silent --location -o live-last-publish 'https://velnor-apt.tailrocks.com'/$last; then
            live="$(cat live-last-publish)"
          fi
          velnor-workflow release apt-deploy-guard --suite "$CHANNEL" --staged public --live-version "$live"
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - name: Deploy Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  feed-result:
    name: Feed result
    needs: [admit-runner, verify, publish, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed unless the feed verified and published
        env:
          REF: ${{ github.ref }}
          VERIFY: ${{ needs.verify.result }}
          PUBLISH: ${{ needs.publish.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          [ "$VERIFY" = success ] || { echo "::error::feed verification did not succeed: $VERIFY" >&2; exit 1; }
          if [ "$REF" = "refs/heads/main" ]; then
            [ "$PUBLISH" = success ] || { echo "::error::feed publication did not succeed: $PUBLISH" >&2; exit 1; }
            [ "$DEPLOY" = success ] || { echo "::error::feed deployment did not succeed: $DEPLOY" >&2; exit 1; }
          else
            [ "$PUBLISH" = skipped ] || { echo "::error::unexpected publication state off the default branch: $PUBLISH" >&2; exit 1; }
            [ "$DEPLOY" = skipped ] || { echo "::error::unexpected deployment state off the default branch: $DEPLOY" >&2; exit 1; }
          fi

- name: Install Docker
  hosts: all
  become: yes
  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Add GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc

    - name: Add repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker
        update_cache: yes

    - name: Ensure docker-ce.list is absent
      file:
        path: /etc/apt/sources.list.d/docker-ce.list
        state: absent

    - name: Install packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Configure daemon
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-opts": {
              "max-size": "10m"
            },
            "default-address-pools": [
              {
                "base": "172.30.0.0/16",
                "size": 24
              }
            ]
          }
        mode: "0644"
      notify: restart docker

  handlers:
    - name: restart docker
      service:
        name: docker
        state: restarted

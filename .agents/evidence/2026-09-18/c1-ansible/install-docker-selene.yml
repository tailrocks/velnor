# Install Docker Engine on clickhouse-selene (Debian 13 trixie).
#
# Data-root: intentionally NOT migrated to /srv/observability/docker in this
# playbook. See docs/observability/selene/DECISIONS.md D6 — keep default
# /var/lib/docker on root FS for engine metadata and image layers; telemetry
# bind-mounts use /srv/observability/<backend>/ explicitly in Compose.
#
# Run after setup-selene-observability-storage.yml when mount guard is desired
# before Docker starts (drop-in applied only when the unit already exists).
- name: Install Docker on clickhouse-selene
  hosts: clickhouse-selene
  become: yes
  vars:
    ansible_python_interpreter: auto_silent
    selene_observability_mount_check_unit: selene-observability-mount-check.service

  tasks:
    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Add GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc

    - name: Add repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
        state: present
        filename: docker
        update_cache: yes

    - name: Ensure docker-ce.list is absent
      file:
        path: /etc/apt/sources.list.d/docker-ce.list
        state: absent

    - name: Install packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Configure daemon
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-opts": {
              "max-size": "10m"
            }
          }
        mode: "0644"
      notify: restart docker

    - name: Check if observability mount-check unit is installed
      stat:
        path: "/etc/systemd/system/{{ selene_observability_mount_check_unit }}"
      register: mount_check_unit_stat

    - name: Ensure Docker systemd drop-in directory exists
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: mount_check_unit_stat.stat.exists

    - name: Install Docker ordering drop-in for observability mount guard
      copy:
        dest: /etc/systemd/system/docker.service.d/selene-observability-storage.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          After={{ selene_observability_mount_check_unit }}
          Requires={{ selene_observability_mount_check_unit }}
      register: docker_ordering_dropin
      when: mount_check_unit_stat.stat.exists

    - name: Reload systemd after Docker ordering drop-in
      systemd:
        daemon_reload: yes
      when: mount_check_unit_stat.stat.exists and docker_ordering_dropin.changed

  handlers:
    - name: restart docker
      service:
        name: docker
        state: restarted

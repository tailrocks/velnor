schema = 1

[generator]
repository = "example/swift-ffi"

[workflow]
runners = "github"
github_runner = "ubuntu-24.04"
macos_runner = "macos-15"
velnor_labels = ["self-hosted", "example-lane"]
velnor_trusted_label = "example-trusted"
velnor_trusted_runner_available = true

[[declare]]
primitive = "renovate"
file = "renovate.yml"

[[declare]]
primitive = "renovate-validate"
file = "renovate-validate.yml"

[renovate]
enabled = true
reason = "fixture exercises writer lanes"
schedule = "0 6 * * *"
token = "GH_RENOVATE_TOKEN"
config = "renovate.json"
validate = true
lanes = "both"

# The Swift client consumes the Rust FFI crate's output; an FFI change must
# select the Swift unit even though no Swift file changed.
[[units]]
id = "swift-package-clients-apple"
depends_on = ["rust-engine-ffi"]

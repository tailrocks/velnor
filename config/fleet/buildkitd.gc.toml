# BuildKit GC policy for trusted docker hosts (Phase 6 §8).
# Install beside the daemon. Managed buildkitd-config-inline input is limited
# to Velnor's reviewed mirror-only stanza and cannot carry this GC policy.
#
# Reference: https://github.com/moby/buildkit/blob/master/docs/buildkitd.toml.md

[worker.oci]
  gc = true
  reservedSpace = "10GB"
  maxUsedSpace = "40GB"
  minFreeSpace = "5GB"
